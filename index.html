    else if (type === 'weapon')  pre  = buildEvoChainHTML(item) + weaponArcanaSectionHTML(item);
    else if (type === 'arcana')  pre  = arcanaAffectsSectionsHTML(item, 'overlay');
    else if (type === 'passive') post = `<div class="detail-passive-evo">${buildPassiveEvoHTML(item.name)}</div>`;

    const main = (pre + bannersHTML + post) || `<div class="detail-empty">No associations recorded.</div>`;

    const footer = `<button class="btn btn-confirm btn-add-build" data-action="detail-add-to-build"
      data-detail-type="${esc(type)}" data-detail-name="${esc(name)}">+ Add to build</button>`;
    return detailChrome(displayName, left, main, footer);
  }

  // Player page: character sprite on the left, and a cross-reference matrix of the build's
  // shared traits — rows = the player's equipped weapons/passives/arcana, columns = every trait
  // present (banners, sorted most-shared first), ● at each intersection, and a "Shared" totals
  // row. Row/column headers navigate to the object/trait detail pages.
  function detailPlayerPageHTML(playerIdx) {
    const player = state.players[playerIdx];
    if (!player) return detailChrome(`Player ${playerIdx + 1}`, '', `<div class="detail-empty">No player.</div>`, '');
    const char = player.character;
    const title = char ? char.name : `Player ${playerIdx + 1}`;
    const art = char ? charSpriteHTML(char, true) : `<div class="detail-icon char-sprite"><img src="${EMPTY_ICONS.char}"></div>`;
    const left = `<div class="detail-kicker">Player ${playerIdx + 1} · Trait Table</div>
      ${art}
      <div class="detail-name">${esc(title)}</div>`;

    // Equipped objects (weapons + passives are per-player; arcana are global). The CHARACTER
    // leads the chart as its own row. Deduped by name.
    const rows = [];
    const seen = new Set();
    const add = (obj, type) => {
      if (!obj || seen.has(type + '|' + obj.name)) return;
      seen.add(type + '|' + obj.name);
      // The character row uses its static sprite PNG (falls back to the square icon).
      const icon = type === 'character' ? (obj.sprite_static || obj.icon) : obj.icon;
      rows.push({ type, name: obj.name, icon, affSet: new Set(objectAffinities(type, obj.name).map(a => a.name)) });
    };
    if (char) add(char, 'character');
    player.weapons.filter(Boolean).forEach(w => add(w, 'weapon'));
    player.passives.filter(Boolean).forEach(p => add(p, 'passive'));
    state.arcana.filter(Boolean).forEach(a => add(a, 'arcana'));

    if (!rows.length) return detailChrome(title, left, `<div class="detail-empty">No character, weapons, passives, or arcana in this build yet.</div>`, '');

    // The character's PRIMARY traits (from the grouped affinity schema) bold their columns.
    const prioritySet = char ? affinityGroupNames(char, 'primary') : new Set();

    // Columns = traits present, sorted by how many objects share them (desc), then name.
    const colCount = new Map();
    rows.forEach(r => r.affSet.forEach(n => colCount.set(n, (colCount.get(n) || 0) + 1)));
    const cols = [...colCount.keys()].map(affinityByName).filter(Boolean)
      .sort((a, b) => (colCount.get(b.name) - colCount.get(a.name)) || a.name.localeCompare(b.name));
    if (!cols.length) return detailChrome(title, left, `<div class="detail-empty">These items share no traits.</div>`, '');

    const priCls = c => prioritySet.has(c.name) ? ' xref-priority' : '';
    const colHead = c => {
      const color = c.color || '#6a4010';
      return `<th class="xref-colhead${priCls(c)}"><div class="xref-col" style="--aff-color:${esc(color)};--aff-text:${affinityTextColor(color)}"
        data-action="nav-affinity" data-affinity="${esc(c.name)}" title="${esc(c.name)}">
        <img class="xref-col-icon" src="${esc(c.icon || '')}" onerror="this.style.visibility='hidden'">
        <span class="xref-col-name">${esc(c.name)}</span></div></th>`;
    };
    const rowHTML = r => `<tr class="${r.type === 'character' ? 'xref-char-row' : ''}">
      <th class="xref-rowhead" data-action="nav-object" data-detail-type="${r.type}" data-detail-name="${esc(r.name)}" title="${esc(r.name)}">
        <img src="${esc(r.icon || '')}" onerror="this.style.visibility='hidden'"><span>${esc(r.name)}</span>
      </th>
      ${cols.map(c => `<td class="${r.affSet.has(c.name) ? 'xref-on' : ''}${priCls(c)}">${r.affSet.has(c.name) ? '●' : ''}</td>`).join('')}
    </tr>`;
    const sharedRow = `<tr class="xref-shared">
      <th class="xref-rowhead">Shared</th>
      ${cols.map(c => { const n = colCount.get(c.name); return `<td class="${n >= 2 ? 'xref-sh' : ''}${priCls(c)}">${n}</td>`; }).join('')}
    </tr>`;

    const table = `<div class="xref-wrap"><table class="player-xref">
      <thead><tr><th class="xref-corner"></th>${cols.map(colHead).join('')}</tr></thead>
      <tbody>${rows.map(rowHTML).join('')}${sharedRow}</tbody>
    </table></div>`;
    return detailChrome(title, left, table, '');
  }

  // Affinity page: object-category sections (Arcana/Characters/Passives/Weapons), each with any
  // object blurbs then the full navigable icon grid. A parent affinity also lists its children.
  // Build the render entries for one affinity-page category. Characters are DEDUPED: a
  // collapsible base renders once (its representative variant), labeled with the clean base
  // name and drawn with the shared sprite; non-collapsible names render individually.
  function detailCatEntries(cat, names, affName) {
    if (cat.key === 'characters') {
      const vi = charVariantInfo();
      const seen = new Set(), out = [];
      for (const n of names) {
        const c = vi.byName.get(n);
        if (c && vi.collapsible.has(c.base_name)) {
          if (seen.has(c.base_name)) continue;
          seen.add(c.base_name);
          const rep = vi.byName.get(vi.repOf.get(c.base_name)) || c;
          out.push({ navName: rep.name, title: c.base_name, icon: charSpriteIcon(rep) });
        } else {
          out.push({ navName: n, title: n, icon: c ? charSpriteIcon(c) : cat.empty });
        }
      }
      return out;
    }
    return names.map(n => {
      const obj = cat.lookup(n);
      const icon = obj ? ((cat.iconOf ? cat.iconOf(obj) : obj.icon) || cat.empty) : cat.empty;
      return { navName: n, title: n, icon };
    });
  }

  // Trait page. Pass extra trait names in `also` to AND them with the primary: the page then
  // shows only objects associated with EVERY selected trait (per-category set intersection),
  // but keeps the normal single-trait layout. Title becomes "Might + Revival". The header ＋
  // combobox adds conditions; each trait chip in the left column removes one.
  function detailAffinityPageHTML(name, also = []) {
    const names = [name, ...also].filter((n, i, arr) => affinityByName(n) && arr.indexOf(n) === i);
    const affs = names.map(affinityByName);
    const primary = affs[0];
    if (!primary) return detailChrome(name, '', `<div class="detail-empty">Unknown.</div>`, '');
    const combo = affs.length > 1;
    const title = names.join(' + ');

    // Left: primary art + combined title. In combo mode, list each trait as a removable chip.
    const chips = combo ? `<div class="aff-combo-chips">${names.map(n => {
      const a = affinityByName(n); const color = a.color || '#6a4010';
      return `<span class="aff-combo-chip" style="--aff-color:${esc(color)};--aff-text:${affinityTextColor(color)}" title="${esc(a.name)}">
        <img src="${esc(a.icon || '')}" onerror="this.style.display='none'"><span>${esc(a.name)}</span>
        <button class="appendix-chip-x" data-action="affinity-remove" data-affinity="${esc(a.name)}" title="Remove this condition">✕</button></span>`;
    }).join('')}</div>` : '';
    const left = `<div class="detail-kicker">${combo ? 'Traits (shared)' : 'Trait'}</div>
      <div class="detail-icon"><img src="${esc(primary.icon || EMPTY_ICON)}" onerror="this.style.visibility='hidden'"></div>
      <div class="detail-name">${esc(title)}</div>
      ${!combo && primary.description ? `<div class="detail-desc">${esc(primary.description)}</div>` : ''}
      ${chips}`;

    let main = '';
    // Sub-traits + per-object blurbs are single-trait concepts; keep them only on a lone trait.
    if (!combo && primary.is_parent) {
      const kids = childAffinities(primary.name);
      if (kids.length) main += `<details class="detail-cat" open>
        <summary class="detail-cat-label">Sub-traits</summary>
        ${kids.map(k => affinityBanner(k, 'nav-affinity')).join('')}
      </details>`;
    }
    const infoEntries = combo ? [] : affinityInfoEntries(primary.name);
    const blurbsFor = t => {
      const cells = infoEntries.filter(e => resolveRef(e.objects[0])?.type === t).map(e => infoEntryHTML(e)).join('');
      return cells ? `<div class="detail-info-grid">${cells}</div>` : '';
    };
    for (const cat of DETAIL_CATS) {
      // Intersect this category's associated names across every selected trait.
      let catNames = null;
      for (const a of affs) {
        const set = new Set(a.related?.[cat.key] || []);
        catNames = catNames === null ? [...set] : catNames.filter(n => set.has(n));
      }
      catNames = catNames || [];
      const catBlurbs = blurbsFor(cat.type);
      if (!catNames.length && !catBlurbs) continue;
      const entries = detailCatEntries(cat, catNames, primary.name); // [{navName,title,icon}], deduped for chars
      const iconCell = e => `<span class="aff-nav-icon ${cat.cls}" data-action="nav-object" data-detail-type="${cat.type}"
          data-detail-name="${esc(e.navName)}" title="${esc(e.title)}"><img src="${esc(e.icon || cat.empty)}" onerror="this.src='${cat.empty}'"></span>`;
      main += `<details class="detail-cat" open>
        <summary class="detail-cat-label">${cat.label} <span style="color:var(--text-dim);font-size:.75rem">(${entries.length})</span></summary>
        ${catBlurbs}
        <div class="aff-icon-grid">${entries.map(iconCell).join('')}</div>
      </details>`;
    }
    if (!main) main = combo
      ? `<div class="detail-empty">No items share ${esc(title)}.</div>`
      : `<div class="detail-empty">No associations recorded.</div>`;

    // ＋ combobox: pick another trait to AND in. Lists every trait not already selected; the
    // input filters the list live (see the aff-add-search handler).
    const others = D.affinities.filter(a => !names.includes(a.name));
    const adorn = `<div class="aff-add">
      <button class="aff-add-btn" data-action="affinity-add-toggle" title="Add a trait condition">＋</button>
      <div class="aff-add-pop" hidden>
        <input type="text" class="aff-add-search" placeholder="Add a trait condition…" autocomplete="off">
        <div class="aff-add-list">${others.map(a => `<button class="aff-add-opt" data-action="affinity-add" data-affinity="${esc(a.name)}" data-q="${esc(a.name.toLowerCase())}">
          <img src="${esc(a.icon || '')}" onerror="this.style.visibility='hidden'"><span>${esc(a.name)}</span></button>`).join('')}</div>
      </div>
    </div>`;

    return detailChrome(title, left, main, '', adorn);
  }

  // ── Appendix (index) page ────────────────────────────────────────────────
  // Default lists everything a browsing index needs — affinities (parents with children
  // nested), arcana, passives — but NOT characters/weapons (those lists are huge). The search
  // spans ALL of them, so characters/weapons are reachable via search only. Cached flat index.
  let _appendixIndex = null;
  function appendixIndex() {
    if (_appendixIndex) return _appendixIndex;
    const out = [];
    for (const a of D.affinities)  out.push({ kind: 'affinity', name: a.name, icon: a.icon, tag: 'Trait' });
    for (const a of D.arcana)      out.push({ kind: 'object', type: 'arcana',    name: a.name, icon: a.icon, tag: 'Arcana' });
    for (const p of D.passives)    out.push({ kind: 'object', type: 'passive',   name: p.name, icon: p.icon, tag: 'Passive' });
    for (const c of D.characters)  out.push({ kind: 'object', type: 'character', name: c.name, icon: charSpriteIcon(c), sprite: true, tag: 'Character' });
    for (const w of D.weapons)     out.push({ kind: 'object', type: 'weapon',    name: w.name, icon: weaponSprite(w), tag: 'Weapon' });
    out.forEach(e => { e.q = e.name.toLowerCase(); });
    _appendixIndex = out;
    return out;
  }

  // One appendix row: icon + name + kind tag, navigable (affinity → its page, object → its page).
  // Appendix entry: affinities render as their colored banner (consistent with the rest of the
  // app); objects render as an icon row.
  function appendixEntryHTML(entry) {
    if (entry.kind === 'affinity') {
      const aff = affinityByName(entry.name);
      if (aff) return affinityBanner(aff, 'nav-affinity');
    }
    return appendixRow(entry);
  }

  function appendixRow(entry, extraCls) {
    const dataAttrs = entry.kind === 'affinity'
      ? `data-action="nav-affinity" data-affinity="${esc(entry.name)}"`
      : `data-action="nav-object" data-detail-type="${entry.type}" data-detail-name="${esc(entry.name)}"`;
    return `<div class="appendix-row ${extraCls || ''}" ${dataAttrs} title="${esc(entry.name)}">
      <span class="appendix-icon ${entry.sprite ? 'sprite' : ''}"><img src="${esc(entry.icon || '')}" loading="lazy" onerror="this.style.visibility='hidden'"></span>
      <span class="appendix-row-name">${esc(entry.name)}</span>
      <span class="appendix-row-kind">${esc(entry.tag)}</span>
    </div>`;
  }

  function detailAppendixPageHTML() {
    // Affinities: parents in data order, each followed by its children (offset). Any affinity
    // not caught (orphan child) is appended flat so nothing is silently dropped.
    const rendered = new Set();
    let affHTML = '';
    for (const a of D.affinities) {
      if (!a.is_parent || rendered.has(a.name)) continue;
      rendered.add(a.name);
      affHTML += affinityBanner(a, 'nav-affinity');
      for (const kid of childAffinities(a.name)) {
        rendered.add(kid.name);
        affHTML += affinityBanner(kid, 'nav-affinity', 'appendix-child');
      }
    }
    for (const a of D.affinities) {
      if (rendered.has(a.name)) continue;
      affHTML += affinityBanner(a, 'nav-affinity');
    }
    const arcanaHTML  = D.arcana.map(a => appendixRow({ kind: 'object', type: 'arcana', name: a.name, icon: a.icon, tag: 'Arcana' })).join('');
    const passiveHTML = D.passives.map(p => appendixRow({ kind: 'object', type: 'passive', name: p.name, icon: p.icon, tag: 'Passive' })).join('');

    const left = `<div class="detail-kicker">Appendix</div>
      <div class="detail-name">Appendix</div>
      <div class="detail-desc">Browse every trait, arcana, and passive. Search to also find characters and weapons.</div>
      <div class="detail-desc" style="margin-top:.5rem">Add two or more <b>traits</b> as filters (the ＋ on a trait) to narrow to items that share <i>all</i> of them.</div>`;

    const main = `<div class="appendix">
      <input type="text" class="appendix-search" placeholder="Search — or type a trait and ＋ it to filter…" autocomplete="off">
      <div class="appendix-trait-filter" style="display:none"></div>
      <div class="appendix-results" style="display:none"></div>
      <div class="appendix-default">
        <div class="appendix-section"><div class="appendix-section-label">Traits</div>${affHTML}</div>
        <div class="appendix-section"><div class="appendix-section-label">Arcana</div>${arcanaHTML}</div>
        <div class="appendix-section"><div class="appendix-section-label">Passives</div>${passiveHTML}</div>
      </div>
    </div>`;
    return detailChrome('Appendix', left, main, '');
  }

  // Live-filter the appendix: empty query → default sectioned lists; otherwise a flat list
  // across ALL types (incl. characters/weapons), capped so a broad query stays usable.
  const APPENDIX_MAX = 80;

  // The objects (as `type|name` keys) a single trait is associated with, across every category.
  function appendixTraitMembers(traitName) {
    const r = affinityByName(traitName)?.related || {};
    const set = new Set();
    (r.weapons    || []).forEach(n => set.add('weapon|'    + n));
    (r.passives   || []).forEach(n => set.add('passive|'   + n));
    (r.characters || []).forEach(n => set.add('character|' + n));
    (r.arcana     || []).forEach(n => set.add('arcana|'    + n));
    return set;
  }

  // Objects that share ALL of `traits` (set intersection of each trait's associations), returned
  // as appendix object entries. Empty `traits` → []. This is the multi-trait AND filter.
  function appendixTraitIntersection(traits) {
    let inter = null;
    for (const t of traits) {
      const m = appendixTraitMembers(t);
      inter = inter === null ? m : new Set([...inter].filter(x => m.has(x)));
    }
    const lookup = { weapon: weaponByName, passive: passiveByName, character: charByName, arcana: arcanaByName };
    const tagOf  = { weapon: 'Weapon', passive: 'Passive', character: 'Character', arcana: 'Arcana' };
    return [...(inter || [])].map(key => {
      const i = key.indexOf('|'); const type = key.slice(0, i), name = key.slice(i + 1);
      const obj = lookup[type]?.(name);
      const icon = type === 'character' ? (obj ? charSpriteIcon(obj) : '')
        : type === 'weapon' ? weaponSprite(obj)
        : (obj?.icon || '');
      return { kind: 'object', type, name, icon,
        sprite: type === 'character', tag: tagOf[type], q: name.toLowerCase() };
    });
  }

  // An active trait-filter chip (removable).
  function appendixChipHTML(name) {
    const aff = affinityByName(name); if (!aff) return '';
    const color = aff.color || '#6a4010';
    return `<span class="appendix-chip" style="--aff-color:${esc(color)};--aff-text:${affinityTextColor(color)}" title="${esc(aff.name)}">
      <img src="${esc(aff.icon || '')}" onerror="this.style.display='none'">
      <span class="appendix-chip-name">${esc(aff.name)}</span>
      <button class="appendix-chip-x" data-action="appendix-trait-remove" data-affinity="${esc(aff.name)}" title="Remove filter">✕</button>
    </span>`;
  }

  // A "＋ add this trait as a filter" suggestion row (banner still navigates to the trait page).
  function appendixTraitSuggestHTML(aff) {
    return `<div class="appendix-suggest">
      <button class="appendix-suggest-add" data-action="appendix-trait-add" data-affinity="${esc(aff.name)}" title="Add as filter">＋</button>
      ${affinityBanner(aff, 'nav-affinity')}
    </div>`;
  }

  // Live-filter the appendix. Two dimensions combine:
  //   • active trait filters (state.detail.appendixTraits) → objects sharing ALL of them (AND);
  //   • the text query → suggests traits to add (＋) and name-filters the object pool.
  // Empty query + no filters → the default sectioned lists.
  function applyAppendixSearch(input) {
    const q = input.value.trim().toLowerCase();
    state.detail.appendixQuery = input.value;
    const root = input.closest('.appendix');
    if (!root) return;
    const def = root.querySelector('.appendix-default');
    const res = root.querySelector('.appendix-results');
    const filterBar = root.querySelector('.appendix-trait-filter');
    const traits = state.detail.appendixTraits;

    // Active-filter chip bar.
    if (traits.length) {
      filterBar.style.display = '';
      filterBar.innerHTML = `<span class="appendix-filter-label">Sharing all of:</span>${traits.map(appendixChipHTML).join('')}`
        + `<button class="appendix-filter-clear" data-action="appendix-trait-clear">Clear</button>`;
    } else { filterBar.style.display = 'none'; filterBar.innerHTML = ''; }

    const hasFilter = traits.length > 0;
    if (!q && !hasFilter) { def.style.display = ''; res.style.display = 'none'; res.innerHTML = ''; return; }
    def.style.display = 'none';
    res.style.display = '';

    // Traits to suggest adding (while typing; exclude already-active).
    const suggest = q ? D.affinities.filter(a => a.name.toLowerCase().includes(q) && !traits.includes(a.name)) : [];

    // Object pool: the AND-intersection when filtering, else every object; then name-filtered.
    let pool = hasFilter ? appendixTraitIntersection(traits) : appendixIndex().filter(e => e.kind === 'object');
    if (q) pool = pool.filter(e => e.q.includes(q));
    pool.sort((a, b) => a.tag.localeCompare(b.tag) || a.name.localeCompare(b.name));

    let html = '';
    if (suggest.length) html += `<div class="appendix-suggest-head">Add a trait filter</div>`
      + suggest.slice(0, 12).map(appendixTraitSuggestHTML).join('');
    const head = hasFilter
      ? `Items sharing ${traits.length === 1 ? 'this trait' : `all ${traits.length} traits`} <span class="appendix-count">${pool.length}</span>`
      : (q ? `Results <span class="appendix-count">${pool.length}</span>` : '');
    if (head) html += `<div class="appendix-results-head">${head}</div>`;
    html += pool.length
      ? pool.slice(0, APPENDIX_MAX).map(appendixEntryHTML).join('')
        + (pool.length > APPENDIX_MAX ? `<div class="appendix-more">Showing first ${APPENDIX_MAX} of ${pool.length} — refine your search.</div>` : '')
      : (suggest.length ? '' : `<div class="detail-empty">No matches.</div>`);
    res.innerHTML = html || `<div class="detail-empty">No matches.</div>`;
  }

  // Shared by the planner sidebar (#app) and selector overlays (#overlay-root): open the object
  // or affinity detail page named on a clicked element's dataset. `defaultPlayer` is the
  // add-to-build target when the element carries no player.
  function openDetailFromEl(btn, defaultPlayer) {
    const action = btn.dataset.action;
    const player = Number.isInteger(defaultPlayer) ? defaultPlayer : 0;
    if (action === 'open-affinity-page' || action === 'nav-affinity') {
      openDetailPage({ kind: 'affinity', name: btn.dataset.affinity }, player);
    } else { // open-object-page | nav-object
      const t = btn.dataset.detailType === 'char' ? 'character' : btn.dataset.detailType;
      openDetailPage({ kind: 'object', type: t, name: btn.dataset.detailName }, player);
    }
  }

  // Add-to-build from a detail object page → reuse the SAME commit paths (and guards) as the
  // selectors: evoQuickAdd for weapon/passive/arcana; the character commit for characters.
  function detailAddToBuild(type, name) {
    const player = state.detail.player || 0;
    if (type === 'character') {
      const ch = D.characters.find(c => c.name === name);
      if (!ch) { showToast(`${name} not found`, 'err'); return; }
      // Drive the real character-commit path (collection gate, starter rebuild, auto-devolve,
      // Academy Badge) by fabricating the char overlay state and confirming it.
      const prev = state.players[player].character;
      state.overlay = { type: 'char', playerIdx: player, slotIdx: 0, slotType: 'char', fromEmpty: !prev, prevItem: prev };
      state.ovl.selected = ch;
      closeOverlay(true);
      return;
    }
    evoQuickAdd(name, player);
  }

  // Click handling for the detail overlay (bound once to #detail-overlay-root).
  function handleDetailClick(e) {
    // Evo-path nodes (reused from the info panel) carry data-evo-item, not data-action —
    // navigate to that object's detail page.
    const evoEl = e.target.closest('[data-evo-item]');
    if (evoEl) { openRef(resolveRef(evoEl.dataset.evoItem), state.detail.player); return; }
    const btn = e.target.closest('[data-action]');
    if (!btn) { if (e.target.id === 'detail-overlay-root') closeDetailOverlay(); return; }
    const action = btn.dataset.action;
    if (action === 'detail-close')   { closeDetailOverlay(); return; }
    if (action === 'detail-back')    { detailBack(); return; }
    if (action === 'detail-forward') { detailForward(); return; }
    if (action === 'nav-affinity' || action === 'nav-object') { openDetailFromEl(btn, state.detail.player); return; }
    if (action === 'detail-add-to-build') { detailAddToBuild(btn.dataset.detailType, btn.dataset.detailName); return; }
    if (action === 'appendix-trait-add') {
      const name = btn.dataset.affinity;
      if (name && !state.detail.appendixTraits.includes(name)) state.detail.appendixTraits.push(name);
      const inp = document.querySelector('#detail-overlay-root .appendix-search');
      // Clear the text so the freshly-narrowed intersection is fully visible; keep focus to add more.
      if (inp) { inp.value = ''; applyAppendixSearch(inp); inp.focus(); }
      return;
    }
    if (action === 'appendix-trait-remove') {
      state.detail.appendixTraits = state.detail.appendixTraits.filter(t => t !== btn.dataset.affinity);
      const inp = document.querySelector('#detail-overlay-root .appendix-search');
      if (inp) applyAppendixSearch(inp);
      return;
    }
    if (action === 'appendix-trait-clear') {
      state.detail.appendixTraits = [];
      const inp = document.querySelector('#detail-overlay-root .appendix-search');
      if (inp) applyAppendixSearch(inp);
      return;
    }
    // ── Combo trait page (＋ add / remove conditions) ──
    if (action === 'affinity-add-toggle') {
      const pop = btn.parentElement.querySelector('.aff-add-pop');
      if (pop) {
        pop.hidden = !pop.hidden;
        if (!pop.hidden) {
          const s = pop.querySelector('.aff-add-search');
          if (s) { s.value = ''; s.focus(); }
          pop.querySelectorAll('.aff-add-opt').forEach(o => o.style.display = '');
        }
      }
      return;
    }
    if (action === 'affinity-add') {
      const p = state.detail.stack[state.detail.idx];
      if (p && p.kind === 'affinity') {
        const nm = btn.dataset.affinity;
        p.also = p.also || [];
        if (nm && nm !== p.name && !p.also.includes(nm)) p.also.push(nm);
        renderDetailOverlay();
      }
      return;
    }
    if (action === 'affinity-remove') {
      const p = state.detail.stack[state.detail.idx];
      if (p && p.kind === 'affinity') {
        const rest = [p.name, ...(p.also || [])].filter(x => x !== btn.dataset.affinity);
        if (rest.length) { p.name = rest[0]; p.also = rest.slice(1); renderDetailOverlay(); }
      }
      return;
    }
  }

  function refreshOverlay() {
    const { type, playerIdx, slotIdx, slotType } = state.overlay;
    let inner = '';
    if (type === 'char')                             inner = charOverlayHTML(playerIdx);
    else if (type === 'item' && slotType === 'weapon')  inner = weaponOverlayHTML(playerIdx, slotIdx);
    else if (type === 'item' && slotType === 'passive') inner = passiveOverlayHTML(playerIdx, slotIdx);
    else if (type === 'arcana') inner = arcanaOverlayHTML(slotIdx);
    else if (type === 'stage')  inner = stageOverlayHTML();
    const panel = document.getElementById('overlay-root').querySelector('.overlay-panel');
    // Preserve scroll across the re-render for every independent scroll region — the grid
    // (.ovl-center-scroll), the mobile single info scroller (.ovl-info), and the desktop info
    // scrollers (.ovl-left stats + .ovl-right-body detail). Selecting an item must never fling any
    // of them back to the top.
    const SCROLLERS = ['.ovl-center-scroll', '.ovl-info', '.ovl-left', '.ovl-right-body'];
    const saved = SCROLLERS.map(sel => { const el = panel.querySelector(sel); return el ? el.scrollTop : 0; });
    panel.innerHTML = inner;
    SCROLLERS.forEach((sel, i) => { const el = panel.querySelector(sel); if (el) el.scrollTop = saved[i]; });
    markOverlaySelection();
    const searchInput = panel.querySelector('.ovl-search');
    if (searchInput && state.ovl.search) {
      searchInput.value = state.ovl.search;
      applyOverlaySearch(searchInput);
    }
  }

  function closeOverlay(confirmed) {
    const { type, playerIdx, slotIdx, slotType, fromEmpty, prevItem } = state.overlay;
    const sel = state.ovl.selected;

    // Collection gate: an unowned item can still be selected to VIEW its info, but it
    // cannot be committed to a tile. Block the commit (keep the overlay open) with a toast.
    if (sel && collectionEnabled() && (confirmed || (fromEmpty && sel))) {
      let ok = true;
      if (type === 'char')             ok = charAccessible(sel.name);
      else if (type === 'arcana')      ok = arcanaAccessibleByAny(sel.name);
      else if (slotType === 'weapon')  ok = weaponAccessible(sel.name);
      else if (slotType === 'passive') ok = passiveAccessible(sel.name);
      if (!ok) { showToast(`${sel.name} is not in your collection`, 'err'); return; }
    }

    if (confirmed || (fromEmpty && sel)) {
      // Apply selection
      const fp = state.overlay.freePick;
      if (fp) {
        // Free-pick pool selection: route the chosen pool member to its target — a normal
        // Candybox-like weapon slot, or a gift slot — with NO evo/chain handling.
        if (sel) {
          const player = state.players[playerIdx];
          if (fp.sourceName === 'Familiar Forge') {
            // Familiars live in the hidden/extra row, not a weapon slot. Add the pick there and
            // clear the Forge from its slot; a Forge STARTER slot is restored by
            // syncFamiliarStarter once no familiars remain.
            player.familiars = player.familiars || [];
            player.familiars.push(sel.name);
            if (typeof fp.target === 'number') player.weapons[fp.target] = null;
          } else {
            const pick = fp.kind === 'passive' ? passiveByName(sel.name) : weaponByName(sel.name);
            if (pick) {
              if (fp.target === 'giftWeapon') player.giftWeapon = pick;
              else if (fp.target === 'giftPassive') player.giftPassive = pick;
              else player.weapons[slotIdx] = pick;
            }
          }
        }
      } else if (type === 'char') {
        const oldChar = state.players[playerIdx].character;
        state.players[playerIdx].character = sel;
        if (sel) {
          const counts = SLOT_COUNTS[state.playerCount];
          const pw = state.players[playerIdx].weapons;
          const selNormalStarters = starterWeaponNames(sel).slice(0, counts.weapons);
          // Lineage (base + all forward evo forms) for each starter, in slot order.
          const lineages = selNormalStarters.map(wn => collectDescendants(wn));
          const allLineageNames = new Set();
          lineages.forEach(s => s.forEach(n => allLineageNames.add(n)));
          // Forms locked by the previous character — dropped, they belonged to the
          // replaced character's starter lineage.
          const oldStarterLineage = new Set();
          starterWeaponNames(oldChar)
            .forEach(wn => collectDescendants(wn).forEach(n => oldStarterLineage.add(n)));

          // For each starter slot, prefer an already-equipped weapon in that starter's
          // lineage (e.g. user pre-equipped Fuwalafuwaloo, which is in Whip's lineage →
          // lock Fuwalafuwaloo into the slot). Otherwise place the base starter weapon.
          const claimed = new Set(); // pw indices consumed as starter-slot occupants
          const rebuilt = new Array(counts.weapons).fill(null);
          selNormalStarters.forEach((wn, si) => {
            const lineage = lineages[si];
            let bestIdx = -1, bestSize = Infinity; // smaller descendant set = more evolved
            for (let i = 0; i < counts.weapons; i++) {
              const w = pw[i];
              if (!w || claimed.has(i) || !lineage.has(w.name)) continue;
              const size = collectDescendants(w.name).size;
              if (size < bestSize) { bestSize = size; bestIdx = i; }
            }
            if (bestIdx >= 0) { claimed.add(bestIdx); rebuilt[si] = pw[bestIdx]; }
            else rebuilt[si] = weaponByName(wn) || null;
          });

          // Preserve the user's other weapons: not claimed as a starter occupant, not part
          // of any new starter's lineage (already represented / would conflict), and not
          // part of the replaced character's starter lineage.
          const preserved = [];
          for (let i = 0; i < counts.weapons; i++) {
            if (claimed.has(i)) continue;
            const w = pw[i];
            if (!w || allLineageNames.has(w.name) || oldStarterLineage.has(w.name)) continue;
            preserved.push(w);
          }
          let fill = selNormalStarters.length;
          for (const w of preserved) { if (fill >= counts.weapons) break; rebuilt[fill++] = w; }
          state.players[playerIdx].weapons = rebuilt;

          // Starter passives (e.g. Empty Tome) lock into the front passive slots,
          // mirroring starter weapons. Passives have no evo lineage, so placement is
          // by name; the user's other passives are preserved after them, and the
          // replaced character's starter passives are dropped.
          const pp = state.players[playerIdx].passives;
          const selStarterPassives = starterPassiveNames(sel).slice(0, counts.passives);
          const oldStarterPassives = new Set(starterPassiveNames(oldChar));
          const rebuiltP = new Array(counts.passives).fill(null);
          const claimedP = new Set();
          selStarterPassives.forEach((pn, si) => {
            rebuiltP[si] = passiveByName(pn);
            const exist = pp.findIndex((p, i) => p && p.name === pn && !claimedP.has(i));
            if (exist >= 0) claimedP.add(exist);
          });
          const preservedP = [];
          for (let i = 0; i < counts.passives; i++) {
            if (claimedP.has(i)) continue;
            const p = pp[i];
            if (!p || selStarterPassives.includes(p.name) || oldStarterPassives.has(p.name)) continue;
            preservedP.push(p);
          }
          let fillP = selStarterPassives.length;
          for (const p of preservedP) { if (fillP >= counts.passives) break; rebuiltP[fillP++] = p; }
          state.players[playerIdx].passives = rebuiltP;
        }
        // If the new character's starting arcana already sits in a pool slot, clear
        // that slot — the extra now owns it and a pool copy would be a duplicate.
        const newArc = sel?.starting_arcana;
        if (newArc) {
          const dupIdx = state.arcana.findIndex(a => a?.name === newArc);
          if (dupIdx >= 0) state.arcana[dupIdx] = null;
        }
        // A chaos-morph final still equipped after the character no longer matches (e.g.
        // character removed, or a survivor of the rebuild) devolves back to its base.
        autoDevolveBrokenEvos();
        // Selecting a qualifying character already at Lv30 auto-earns Academy Badge.
        autoGrantAcademyBadge(state.players[playerIdx]);
      } else if (type === 'item') {
        if (sel) {
          const isWeapon = D.weapons.some(w => w.name === sel.name);
          const isPassive = D.passives.some(p => p.name === sel.name);
          if (slotType === 'weapon' && isWeapon && slotIdx >= 0) {
            const wDef = D.weapons.find(w => w.name === sel.name);
            const counts = SLOT_COUNTS[state.playerCount];
            const player = state.players[playerIdx];
            // Absorb-unions picked straight from the selector place the result in one slot
            // and move their hidden set (Clock Tower's 4 bases / Alucard Shield's 5 evos)
            // to the Hidden row — no chain-consume, no passive auto-add.
            if (isAbsorbUnion(wDef.name)) {
              // Alucard Shield can't exist without its 5-evolved condition. If it isn't met
              // at placement (e.g. nothing else slotted), drop in Alucard Swords (auto-
              // devolved) so the user forms the Shield once they meet the condition.
              if (wDef.name === 'Alucard Shield'
                  && absorbHiddenSet(player, 'Alucard Shield', slotIdx, counts).length < ALUCARD_ABSORB_COUNT) {
                player.weapons[slotIdx] = weaponByName('Alucard Swords');
                showToast('Alucard Shield needs 5 evolved weapons — added Alucard Swords', 'warn');
              } else {
                placeAbsorbUnion(player, wDef, slotIdx, counts);
              }
              syncExtraPassives(player);
              state.overlay = null;
              state.ovl = { selected: null, variantIdx: state.ovl.variantIdx, arcanaTab: 'arcana', autoAdd: null, search: '' };
              document.getElementById('overlay-root').classList.add('hidden');
              render();
              return;
            }
            // Chaos-morph final picked without its mapped character — drop in the base weapon
            // instead (mirrors Alucard Shield's unmet-condition fallback).
            const cInfo = chaosBlocked(wDef.name, player);
            if (cInfo) {
              player.weapons[slotIdx] = weaponByName(cInfo.base);
              showToast(`${wDef.name} needs ${cInfo.character} — added ${cInfo.base}`, 'warn');
              syncExtraPassives(player);
              state.overlay = null;
              state.ovl = { selected: null, variantIdx: state.ovl.variantIdx, arcanaTab: 'arcana', autoAdd: null, search: '' };
              document.getElementById('overlay-root').classList.add('hidden');
              render();
              return;
            }
            // Evolved weapon requiring a stage-exclusive passive not obtainable here (rings/
            // metaglios only on the right stage) — drop in the base instead (stage-gated evo,
            // mirrors the chaos-morph / Alucard Shield unmet-condition fallback).
            const sInfo = stageBlockedWeapon(wDef.name, player);
            if (sInfo) {
              player.weapons[slotIdx] = weaponByName(sInfo.base);
              showToast(`${wDef.name} needs ${sInfo.missing.join(' + ')} — not on this stage`, 'warn');
              syncExtraPassives(player);
              state.overlay = null;
              state.ovl = { selected: null, variantIdx: state.ovl.variantIdx, arcanaTab: 'arcana', autoAdd: null, search: '' };
              document.getElementById('overlay-root').classList.add('hidden');
              render();
              return;
            }
            // Free stage-pickup weapon → appended TRANSIENT slot (a free extra slot, fully
            // evolvable in place). No core chain-consume/targetSlot; still auto-adds the
            // weapon's required passives (each routed: stage item → transient, else core).
            if (itemProvidedFree(wDef.name, player) && !isFreePick(wDef.name)) {
              if (anyPlayerOwnsWeapon(wDef.name)) {
                showToast(`${wDef.name} already in build`, 'warn');
              } else {
                placeTransientItem(player, 'weapon', wDef);
                if (state.ovl.autoAdd ?? true) {
                  for (const pname of collectChainPassives(collectWeaponChain(wDef.name))) {
                    if (isExtraPassive(pname)) { if (extraCount(player, pname) < extraCap(player, pname)) player.extraPassives.push(pname); continue; }
                    addRequiredPassive(player, pname);
                  }
                }
                syncExtraPassives(player);
              }
              state.overlay = null;
              state.ovl = { selected: null, variantIdx: state.ovl.variantIdx, arcanaTab: 'arcana', autoAdd: null, search: '' };
              document.getElementById('overlay-root').classList.add('hidden');
              render();
              return;
            }
            // Free-pick choosers (Candybox-like) never evolve — no chain-consume, no passive
            // auto-add. Gift items (Turbo/Arma) take their own extra slot (one of EACH per
            // build); other free-pick items occupy the clicked normal slot as a chooser.
            if (isFreePick(wDef.name)) {
              if (wDef.name === TURBO) {
                if (turboConsumed()) showToast('Only one Candybox Turbo per build', 'warn');
                else player.giftWeapon = wDef;
              } else if (wDef.name === ARMA) {
                if (armaConsumed()) showToast('Only one Arma Dio per build', 'warn');
                else player.giftPassive = wDef;
              } else {
                player.weapons[slotIdx] = wDef;
              }
              state.overlay = null;
              state.ovl = { selected: null, variantIdx: state.ovl.variantIdx, arcanaTab: 'arcana', autoAdd: null, search: '' };
              document.getElementById('overlay-root').classList.add('hidden');
              render();
              return;
            }
            // Add all passives required by the full evo chain that aren't already equipped.
            // Each routes via addRequiredPassive: a stage-supplied passive (e.g. Silver/Gold
            // Ring for Infinite Corridor) takes a free transient slot; others take a core slot.
            const chain = collectWeaponChain(wDef.name);
            const skippedPassives = [];
            for (const pname of collectChainPassives(chain)) {
              if (isExtraPassive(pname)) continue; // extra-bar passive; backed after placement
              if (!addRequiredPassive(player, pname)) skippedPassives.push(pname);
            }
            if (skippedPassives.length) {
              showToast(`No passive slot for: ${skippedPassives.join(', ')}`, 'warn');
            }
            // Collapse target: if a chain member currently occupies a locked starter
            // slot, the result lands there (locked slots stay bound to their lineage —
            // e.g. selecting Million Cut from Valmanway's slot collapses onto the locked
            // Thousand Edge/Knife slot). Otherwise it lands in the slot selected from.
            const cHiddenSet = new Set(player.character?.hidden_items ?? []);
            const starterCount = player.character
              ? Math.min(player.character.starting_weapons.filter(w => !cHiddenSet.has(w)).length, counts.weapons)
              : 0;
            let targetSlot = slotIdx;
            for (let i = 0; i < starterCount; i++) {
              const w = player.weapons[i];
              if (w && chain.has(w.name)) { targetSlot = i; break; }
            }
            // Place weapon in the target slot
            player.weapons[targetSlot] = wDef;
            // Clear other chain members from this player's slots (consumed by this evo)
            for (let i = 0; i < counts.weapons; i++) {
              if (i === targetSlot) continue;
              const w = player.weapons[i];
              if (w && chain.has(w.name)) player.weapons[i] = null;
            }
            // Extra-passive auto-add: adding a weapon contributes one instance of each
            // extra-bar passive it requires (Weapon Power-Up, Outer Saboteur, Mini …) to
            // the extra bar, up to that passive's cap, when auto-add is on. Unbacked
            // evolved OG weapons are devolved by syncExtraPassives.
            const extraAutoAdd = state.ovl.autoAdd ?? true;
            if (extraAutoAdd) {
              for (const pname of collectChainPassives(chain)) {
                if (!isExtraPassive(pname)) continue;
                if (extraCount(player, pname) < extraCap(player, pname)) player.extraPassives.push(pname);
              }
            }
            syncExtraPassives(player);
          }
          if (slotType === 'passive' && isPassive && slotIdx >= 0) {
            const player = state.players[playerIdx];
            // Extra-bar passives never occupy a core slot — add an instance to the extra
            // bar (up to their cap) instead of the selected slot.
            if (isExtraPassive(sel.name)) {
              if (extraCount(player, sel.name) < extraCap(player, sel.name)) player.extraPassives.push(sel.name);
              syncExtraPassives(player);
            } else if (STAGE_EXCLUSIVE_PASSIVES.has(sel.name) || itemProvidedFree(sel.name, player)) {
              // Free stage pickup → appended transient slot (never a core slot). Gate-check
              // exclusives (one per build) and dedup against the whole build.
              if (STAGE_EXCLUSIVE_PASSIVES.has(sel.name) && !stageItemGateOpen(player, sel.name)) {
                showToast(`${sel.name} isn't available here`, 'warn');
              } else if (anyPlayerOwnsPassive(sel.name)) {
                showToast(`${sel.name} already in build`, 'warn');
              } else {
                placeTransientItem(player, 'passive', D.passives.find(p => p.name === sel.name));
              }
            } else {
              // Replacing a passive can remove one an equipped evo depends on — re-check.
              player.passives[slotIdx] = D.passives.find(p => p.name === sel.name);
              autoDevolveBrokenEvos();
            }
          }
        }
      } else if (type === 'arcana') {
        if (sel && (state.arcana.some((a, i) => a && i !== slotIdx && a.name === sel.name)
                    || extraArcanaNames().includes(sel.name))) {
          showToast(`${sel.name} already equipped`, 'warn');
        } else {
          state.arcana[slotIdx] = sel;
        }
      } else if (type === 'stage') {
        state.stage = sel;
        // Changing the stage can invalidate transient stage pickups (rings/metaglios/Academy
        // Badge/etc.); drop the now-unavailable ones, then cascade-devolve any weapon that
        // relied on one (e.g. Infinite Corridor without its Silver/Gold Ring → Clock Lancet).
        state.players.forEach(syncStageSlots);
        autoDevolveBrokenEvos();
      }
    }
    // else: cancel (no change)

    state.overlay = null;
    state.ovl = { selected: null, variantIdx: state.ovl.variantIdx, arcanaTab: 'arcana', autoAdd: null, search: '' };
    document.getElementById('overlay-root').classList.add('hidden');
    render();
  }

  // ═══════════════════════════════════════════════════════
  //  POWER-UP CALCULATIONS
  // ═══════════════════════════════════════════════════════

  function calcCharScalingBonus(charStatKey, char, level) {
    if (!char?.scaling?.length || !level || level < 1) return 0;
    let total = 0;
    for (const s of char.scaling) {
      if (s.key !== charStatKey) continue;
      let bonus;
      if (s.interval === 0) {
        bonus = s.value;
      } else if (s.interval === null || s.interval === 1) {
        // "per level" (no N, or N=1) — first increment lands at level 2, not level 1
        bonus = s.value * Math.max(0, level - 1);
      } else {
        // "per N level" — increments at N, 2N, 3N, …
        bonus = s.value * Math.floor(level / s.interval);
      }
      if (s.max !== null) {
        bonus = s.value > 0 ? Math.min(s.max, bonus) : Math.max(s.max, bonus);
      }
      total += bonus;
    }
    return total;
  }

  function calcPowerUpBonus(charStatKey) {
    let additive = 0;
    let multiplierSum = 0;
    D.stats.forEach(stat => {
      const level = state.powerUps[stat.name] ?? stat.max_level;
      for (let i = 0; i < level; i++) {
        const val = stat.levels[i]?.[charStatKey];
        if (val === undefined || val === null) continue;
        if (stat.stacking === 'multiplicative') multiplierSum += val;
        else additive += val;
      }
    });
    return { additive, multiplierSum, multiplier: 1 + multiplierSum };
  }

  function calcPassiveBonus(charStatKey, player) {
    let additive = 0;
    let multiplierSum = 0;
    if (!player) return { additive, multiplierSum };
    const isMultStat = D.stats.find(s => s.key === charStatKey)?.stacking === 'multiplicative';
    // Slotted passives + extra-passive instances (e.g. Weapon Power-Up) — the latter
    // may repeat, so each instance contributes the passive's real stats once.
    const contribute = name => {
      const passive = D.passives.find(d => d.name === name);
      if (!passive?.level_up_values?.length) return;
      passive.level_up_values.forEach(lvl => {
        const val = lvl[charStatKey];
        if (val === undefined || val === null) return;
        if (isMultStat) multiplierSum += val;
        else additive += val;
      });
    };
    player.passives.filter(Boolean).forEach(p => contribute(p.name));
    (player.extraPassives || []).forEach(contribute);
    return { additive, multiplierSum };
  }

  // ── Character grant instances (count engine for the later dupe-badge render) ──
  // Character `add_item` grants can add multiple copies over levels (Scorej-Oni gains
  // a hidden Lightning Ring every 8 levels). Instance COUNT logic; visuals come later.
  function grantInstanceCount(grant, player) {
    const level  = player?.charLevel ?? 1;
    const amount = grant.amount ?? 1;
    if (grant.interval) {
      return Math.max(0, Math.min(Math.floor(level / grant.interval), grant.max ?? Infinity)) * amount;
    }
    if (grant.at?.length) return grant.at.filter(l => level >= l).length * amount;
    return amount; // static
  }

  // ── Extra-bar passives (don't occupy a core slot; gated/capped by the weapons that
  //    require them). Three mechanics today:
  //    • Weapon Power-Up (OG weapons): `perWeapon` cap, one instance per OG weapon,
  //      bound 1:1 to each EVOLVED OG weapon (removing one devolves a weapon).
  //    • Outer Saboteur (AC weapons): `single` shared instance enables all AC evolutions.
  //    • Mini <X> (EM weapons): `consumable` — bound to its EM weapon AT BASE stage;
  //      consumed when the weapon evolves, restored when it devolves. (Hidden-weapon
  //      spawning is still deferred.)
  const WEAPON_POWER_UP = 'Weapon Power-Up';

  // ── Stage-exclusive passives ────────────────────────────────────────────────
  // Obtainable ONLY as stage-floor pickups (Silver/Gold Ring, Metaglio Left/Right) or —
  // for Academy Badge — ALSO by 3 specific characters at Lv30. Modeled as a `stage`
  // cap-mode extra-bar passive: they never occupy a core slot, satisfy evo requirements
  // from the transient bar, and are one-per-build (global). Availability is stage/character-
  // aware; when the gate closes (e.g. the stage is changed away) syncExtraPassives drops
  // them and autoDevolveBrokenEvos cascades any dependent evolution back down.
  const STAGE_EXCLUSIVE_PASSIVES = new Set([
    'Silver Ring', 'Gold Ring', 'Metaglio Left', 'Metaglio Right', 'Academy Badge',
  ]);
  const ACADEMY_BADGE = 'Academy Badge';
  const ACADEMY_CHARS = ['Eleanor Uziron', 'Maruto Cuts', 'Keitha Muort'];
  const ACADEMY_LEVEL = 30;
  const isAcademyChar = c => !!c && ACADEMY_CHARS.some(n => c.name.startsWith(n));
  // Does the currently selected stage yield this item (directly, or via an equipped
  // conditional-gating arcana like Boss Rash's Mad Groove)?
  function stageProvidesItem(name) {
    const st = state.stage;
    if (!st) return false;
    if ((st.items || []).includes(name)) return true;
    return (st.conditional || []).some(g =>
      (g.items || []).includes(name) && state.arcana.some(a => a && a.name === g.arcana));
  }
  // Is a stage-exclusive item obtainable for this player right now?
  function stageItemGateOpen(player, name) {
    if (stageProvidesItem(name)) return true;
    // Academy Badge is obtainable by its 3 characters at ANY level (so it's selectable during
    // level-1 planning); the Lv30 unlock only drives the AUTO-grant (autoGrantAcademyBadge),
    // not selectability/retention.
    if (name === ACADEMY_BADGE) return isAcademyChar(player?.character);
    return false;
  }
  // Guard rail: a qualifying character (Eleanor/Maruto/Keitha) automatically earns Academy
  // Badge at Lv30 in-game — drop it into a free transient slot so a forgetful user doesn't
  // miss it. One per build; no-op if already owned. Fired on the Lv30 threshold crossing and
  // on character change (below level 30 the user adds it manually if they want it).
  function autoGrantAcademyBadge(player) {
    if (!player || !isAcademyChar(player.character)) return;
    if ((player.charLevel || 1) < ACADEMY_LEVEL) return;
    if (anyPlayerOwnsPassive(ACADEMY_BADGE)) return;
    placeTransientItem(player, 'passive', passiveByName(ACADEMY_BADGE));
  }
  // ── Transient (stage) slots ─────────────────────────────────────────────────
  // Free stage pickups occupy APPENDED "real" slots at indices >= the core slot count of
  // player.weapons / player.passives (the Arma/Turbo gift-slot look, but full weapon/passive
  // behavior since they're ordinary array entries — the count-bounded PLACEMENT loops never
  // reach them, while the whole-array SCANS (consume/stats/requirements/devolve) all include
  // them). Routing, rendering, and drop-on-stage-change live in the helpers below.
  const ownsPassiveName = (player, name) => (player?.passives || []).some(p => p && p.name === name);
  const ownsWeaponName  = (player, name) => (player?.weapons || []).some(w => w && w.name === name);
  const anyPlayerOwnsPassive = name => state.players.some(p => ownsPassiveName(p, name));
  const anyPlayerOwnsWeapon  = name => state.players.some(p => ownsWeaponName(p, name));
  // Is this item a "free pickup" on the current stage (→ takes a transient slot)? Exclusives
  // are gated by stage/char; everything else is free iff the selected stage lists it.
  function itemProvidedFree(name, player) {
    if (STAGE_EXCLUSIVE_PASSIVES.has(name)) return stageItemGateOpen(player, name);
    return stageProvidesItem(name);
  }
  // A weapon whose REALIZED evo chain requires a stage-exclusive passive that neither any
  // player already holds nor this player can pick up here. Returns {base,missing} so callers
  // place the base weapon instead (mirrors chaosBlocked / Alucard Shield fallback). Only counts
  // requirements of chain weapons whose trans_result is ALSO in the chain — i.e. evolutions that
  // actually happened — so a plain base Clock Lancet is never blocked by its own forward req.
  function stageBlockedWeapon(wName, player) {
    const chain = collectWeaponChain(wName);
    const missing = [];
    for (const cn of chain) {
      const w = weaponByName(cn);
      if (!w || !chain.has(w.trans_result)) continue;
      for (const req of (w.requirements || [])) {
        if (!STAGE_EXCLUSIVE_PASSIVES.has(req) || missing.includes(req)) continue;
        if (!anyPlayerOwnsPassive(req) && !itemProvidedFree(req, player)) missing.push(req);
      }
    }
    return missing.length ? { base: ogBaseName(wName), missing } : null;
  }
  // Place a weapon/passive object in the next free APPENDED transient slot (index >= the core
  // count). kind: 'weapon' | 'passive'. Caller handles dedup / gate checks.
  function placeTransientItem(player, kind, obj) {
    const counts = SLOT_COUNTS[state.playerCount];
    const arr = kind === 'weapon' ? player.weapons : player.passives;
    let i = kind === 'weapon' ? counts.weapons : counts.passives;
    while (arr[i]) i++;
    arr[i] = obj;
    return i;
  }
  // Add one required passive, routing it to a transient slot when it's a free stage pickup,
  // else the first empty core slot. (Extra-bar passives are handled separately by callers.)
  // Returns false only when it needed a core slot and none was free.
  function addRequiredPassive(player, pname) {
    if (anyPlayerOwnsPassive(pname)) return true;
    if (itemProvidedFree(pname, player)) { placeTransientItem(player, 'passive', passiveByName(pname)); return true; }
    const counts = SLOT_COUNTS[state.playerCount];
    for (let i = 0; i < counts.passives; i++) if (!player.passives[i]) { player.passives[i] = passiveByName(pname); return true; }
    return false;
  }
  // Per-render sweep: drop transient (appended) items the current stage no longer supplies,
  // and compact the transient tail. A transient WEAPON survives while any weapon in its
  // backward chain is still a free pickup (so an evolved stage weapon isn't lost). Dedups
  // against core slots. autoDevolveBrokenEvos is invoked separately at mutation points so a
  // dropped requirement (e.g. a ring) cascades its dependent evolution back down.
  function syncStageSlots(player) {
    if (!player) return;
    const counts = SLOT_COUNTS[state.playerCount];
    for (const kind of ['weapons', 'passives']) {
      const arr  = player[kind];
      const base = kind === 'weapons' ? counts.weapons : counts.passives;
      if (!arr || arr.length <= base) continue;
      const tail = [];
      for (let i = base; i < arr.length; i++) if (arr[i]) tail.push(arr[i]);
      arr.length = base;
      const owned = new Set(arr.filter(Boolean).map(o => o.name));
      for (const obj of tail) {
        if (owned.has(obj.name)) continue;
        const valid = kind === 'weapons'
          ? [...collectWeaponChain(obj.name)].some(n => itemProvidedFree(n, player))
          : itemProvidedFree(obj.name, player);
        if (!valid) continue;
        let i = base; while (arr[i]) i++;
        arr[i] = obj;
        owned.add(obj.name);
      }
    }
  }

  function extraPassiveCapMode(name) {
    if (name === WEAPON_POWER_UP) return 'perWeapon';
    if (name === 'Outer Saboteur') return 'single';
    if (/^Mini /.test(name)) return 'consumable';
    return null; // not an extra-bar passive
  }
  const isExtraPassive = name => extraPassiveCapMode(name) !== null;
  const isConsumableExtra = name => extraPassiveCapMode(name) === 'consumable';

  // Ultimate base of a weapon's evo chain (follow trans_result backward). Guards against
  // cycles / self-references in the data so a bad trans_result can't infinite-loop.
  function ogBaseName(name) {
    let cur = name; const seen = new Set();
    while (!seen.has(cur)) {
      seen.add(cur);
      const b = D.weapons.find(w => w.trans_result === cur && w.name !== cur);
      if (!b) break;
      cur = b.name;
    }
    return cur;
  }
  // A weapon "requires" an extra passive if its ultimate base lists it as a requirement.
  function weaponRequiresExtra(weaponName, passiveName) {
    const base = weaponByName(ogBaseName(weaponName));
    return !!base && (base.requirements || []).includes(passiveName);
  }
  const isOperationGunsWeapon = name => weaponRequiresExtra(name, WEAPON_POWER_UP);
  // Equipped weapons that enable a given extra passive. Consumable passives (Mini) only
  // count their EM weapon while it's AT BASE — an evolved one has consumed its instance.
  function enablingWeaponCount(player, passiveName) {
    const baseOnly = isConsumableExtra(passiveName);
    return (player?.weapons || []).filter(w =>
      w && weaponRequiresExtra(w.name, passiveName) && (!baseOnly || w.name === ogBaseName(w.name))
    ).length;
  }
  // Max instances of an extra passive: perWeapon = one per enabling weapon; single/consumable = 1 if any.
  function extraCap(player, passiveName) {
    const mode = extraPassiveCapMode(passiveName);
    const n = enablingWeaponCount(player, passiveName);
    return mode === 'perWeapon' ? n : (n > 0 ? 1 : 0);
  }
  const extraCount = (player, passiveName) => (player?.extraPassives || []).filter(n => n === passiveName).length;
  // WPU convenience aliases (its 1:1 binding logic is Weapon-Power-Up-specific).
  const wpuCap   = player => extraCap(player, WEAPON_POWER_UP);
  const wpuCount = player => extraCount(player, WEAPON_POWER_UP);
  function evolvedOGCount(player) {
    return (player?.weapons || []).filter(w => w && isOperationGunsWeapon(w.name) && w.name !== ogBaseName(w.name)).length;
  }
  function lastEvolvedOGIndex(player) {
    const counts = SLOT_COUNTS[state.playerCount];
    for (let i = counts.weapons - 1; i >= 0; i--) {
      const w = player.weapons[i];
      if (w && isOperationGunsWeapon(w.name) && w.name !== ogBaseName(w.name)) return i;
    }
    return -1;
  }
  // Enforce extra-passive invariants after any weapon/instance change: clamp every extra
  // passive to its cap, then apply Weapon Power-Up's 1:1 binding — while there are fewer
  // instances than evolved OG weapons, devolve the last evolved OG weapon one stage.
  function syncExtraPassives(player) {
    if (!player) return;
    if (!player.extraPassives) player.extraPassives = [];
    // Clamp every extra passive to its cap (this also CONSUMES a Mini when its EM weapon
    // evolves: the evolved weapon no longer counts, so the cap drops to 0).
    for (const nm of new Set(player.extraPassives)) {
      for (let over = extraCount(player, nm) - extraCap(player, nm); over > 0; over--) {
        const i = player.extraPassives.lastIndexOf(nm);
        if (i < 0) break;
        player.extraPassives.splice(i, 1);
      }
    }
    // Consumable passives (Mini) are RESTORED to their base EM weapon — devolving back to
    // base raises the cap to 1, so a missing instance is re-added.
    const wantConsumable = new Set();
    (player.weapons || []).filter(Boolean).forEach(w => {
      const base = weaponByName(ogBaseName(w.name));
      (base?.requirements || []).forEach(r => { if (isConsumableExtra(r)) wantConsumable.add(r); });
    });
    for (const nm of wantConsumable) {
      while (extraCount(player, nm) < extraCap(player, nm)) player.extraPassives.push(nm);
    }
    let guard = 0;
    while (wpuCount(player) < evolvedOGCount(player) && guard++ < 30) {
      const idx = lastEvolvedOGIndex(player);
      if (idx < 0) break;
      const cur = player.weapons[idx];
      const prev = D.weapons.find(w => w.trans_result === cur.name);
      player.weapons[idx] = prev || weaponByName(ogBaseName(cur.name));
    }
  }

  function calcStatTotal(charStatKey, charStats, player, char, level) {
    const statDef  = D.stats.find(s => s.key === charStatKey);
    const isPct    = PCT_STATS.has(charStatKey);
    const inverted = INVERTED_STATS.has(charStatKey);
    const rawBase  = statDef ? statDef.base_value : (isPct ? 100 : 0);
    const rawCharBase = charStats ? (charStats[charStatKey] || 0) : 0;
    const scaling  = calcCharScalingBonus(charStatKey, char, level ?? 1);
    const rawChar  = rawCharBase + scaling;
    const { additive, multiplierSum, multiplier } = calcPowerUpBonus(charStatKey);
    const { additive: passiveAdd, multiplierSum: passiveMultSum } = calcPassiveBonus(charStatKey, player);
    const isMultStat = statDef?.stacking === 'multiplicative';

    // Base column: power-up-adjusted baseline (no char bonus)
    let adjBase;
    if (isMultStat) {
      adjBase = Math.round(rawBase * multiplier);
    } else if (isPct) {
      adjBase = Math.round(rawBase + additive * 100);
    } else {
      adjBase = Math.round(rawBase + additive);
    }

    // Total: PU and passive both contribute
    let total;
    if (isMultStat) {
      total = Math.round((rawBase + rawChar) * (1 + multiplierSum + passiveMultSum));
    } else if (isPct) {
      total = Math.round(rawBase + rawChar * 100 + additive * 100 + passiveAdd * 100);
    } else {
      total = Math.round(rawBase + rawChar + additive + passiveAdd);
    }

    // Cap
    let isCapped = false;
    if (statDef?.max_value != null) {
      const cap = statDef.max_value;
      if (inverted ? total <= cap : total >= cap) { total = cap; isCapped = true; }
    }

    // PU column display
    let dispPU;
    if (isMultStat && multiplierSum !== 0) {
      const factor = (1 + multiplierSum);
      dispPU = '×' + (Number.isInteger(factor) ? factor : parseFloat(factor.toFixed(2)));
    } else if (!isMultStat && additive !== 0) {
      const val = isPct ? Math.round(additive * 100) : Math.round(additive);
      dispPU = (val > 0 ? '+' : '') + val + (isPct ? '%' : '');
    } else {
      dispPU = null;
    }

    // Passive column display
    let dispPassive;
    if (isMultStat && passiveMultSum !== 0) {
      const factor = 1 + passiveMultSum;
      dispPassive = '×' + (Number.isInteger(factor) ? factor : parseFloat(factor.toFixed(2)));
    } else if (!isMultStat && passiveAdd !== 0) {
      const val = isPct ? Math.round(passiveAdd * 100) : parseFloat(passiveAdd.toFixed(1));
      dispPassive = (val > 0 ? '+' : '') + val + (isPct ? '%' : '');
    } else {
      dispPassive = null;
    }

    const dispBase = isPct ? rawBase + '%' : rawBase;
    const dispChar = isPct ? Math.round(rawChar * 100) : Math.round(rawChar);
    return { dispBase, dispChar, dispPU, dispPassive, total, isPct, isCapped };
  }

  // ═══════════════════════════════════════════════════════
  //  POWER-UP OVERLAY
  // ═══════════════════════════════════════════════════════

  function renderPowerUpOverlay() {
    const rows = D.stats.map(stat => {
      const level   = state.powerUps[stat.name] ?? stat.max_level;
      const hasLevels = stat.max_level > 0;
      const id      = 'pu-lv-' + stat.name.replace(/\W+/g, '_');
      return `<div class="pu-row${hasLevels ? '' : ' no-levels'}">
        <img class="pu-icon" src="${esc(stat.icon)}" alt="${esc(stat.name)}"
          onerror="this.src='assets/icons/stats/template_stats.png'">
        <span class="pu-name" title="${esc(stat.description)}">${esc(stat.name)}</span>
        ${hasLevels ? `<div class="pu-level-ctrl">
          <button data-action="pu-level" data-stat="${esc(stat.name)}" data-delta="-1"
            ${level <= 0 ? 'disabled' : ''}>−</button>
          <span class="pu-level-display" id="${id}">${level}/${stat.max_level}</span>
          <button data-action="pu-level" data-stat="${esc(stat.name)}" data-delta="1"
            ${level >= stat.max_level ? 'disabled' : ''}>+</button>
        </div>` : `<span class="pu-level-display" style="color:var(--text-muted)">—</span>`}
      </div>`;
    }).join('');

    const root = document.getElementById('overlay-root');
    root.innerHTML = `
      <div class="overlay-panel pu-panel">
        <div class="overlay-header">
          <h2>Power-Ups</h2>
          <div style="display:flex;gap:.4rem;align-items:center">
            <button class="btn btn-sm btn-confirm" data-action="pu-max-all">Max All</button>
            <button class="btn btn-sm btn-back" data-action="pu-disable-all">Disable All</button>
            <button class="btn btn-icon overlay-close" data-action="pu-close">✕</button>
          </div>
        </div>
        <div class="pu-list-wrap"><div class="pu-list">${rows}</div></div>
      </div>`;
    root.classList.remove('hidden');
    state.puActive = true;
  }

  function closePowerUpOverlay() {
    document.getElementById('overlay-root').classList.add('hidden');
    state.puActive = false;
    render(); // update stat totals in sidebar
  }

  // ═══════════════════════════════════════════════════════
  //  SEAL OVERLAY
  // ═══════════════════════════════════════════════════════

  function sealBuildItems() {
    const items = new Set();
    state.players.forEach(p => {
      p.weapons.forEach(w => w && items.add(w.name));
      p.passives.forEach(p => p && items.add(p.name));
    });
    return items;
  }

  // Items actually reachable on the selected stage: its always-present items plus any
  // arcana-gated groups whose gating arcana is currently equipped (e.g. Boss Rash's items
  // only count when Mad Groove (VIII) is in the build).
  function stageItemSet() {
    const stage = state.stage;
    if (!stage) return new Set();
    const set = new Set(stage.items ?? []);
    (stage.conditional ?? []).forEach(group => {
      if (state.arcana.some(a => a && a.name === group.arcana)) {
        group.items.forEach(i => set.add(i));
      }
    });
    return set;
  }

  // Items the seal advisor must NEVER recommend sealing, because they must be able to
  // drop for the build to come together. This is the acutal-consumed lineage, not the
  // abstract one: for each equipped weapon we take its full backward chain (the weapons
  // and passives consumed to reach it), then prune the parts a character's STARTER made
  // unnecessary. Minnah starts with Bloody Tear, so Whip (and its ingredient Hollow
  // Heart) were never pulled from the pool — they stay sealable. A weapon kept in an
  // early form (Bloody Tear, not Fuwalafuwaloo) does not protect its forward union
  // partner, so that partner (and the union result) can be sealed to lock the form.
  //
  // Returns { protectedSet, equippedWeapons } — equippedWeapons drives the recommend
  // logic that seals a union/evolution only when the build can actually form it.
  function sealProtectedItems() {
    const passiveNames    = new Set(D.passives.map(p => p.name));
    const protectedSet    = new Set();
    const equippedWeapons = new Set();

    state.players.forEach(p => p.weapons.forEach(w => w && equippedWeapons.add(w.name)));

    state.players.forEach(player => {
      const char    = player.character;
      const hidden  = new Set(char?.hidden_items ?? []);
      const starters = new Set((char?.starting_weapons ?? []).filter(sw => !hidden.has(sw)));

      // Equipped passives are part of the desired build — always protected.
      player.passives.forEach(p => p && protectedSet.add(p.name));

      player.weapons.forEach(w => {
        if (!w) return;
        const chain = collectWeaponChain(w.name); // w + every weapon consumed to reach it

        // Upstream bases a starter-provided evolved weapon skipped (never dropped).
        const skipped = new Set();
        starters.forEach(sw => {
          if (chain.has(sw) && D.weapons.some(b => b.trans_result === sw)) {
            collectWeaponChain(sw).forEach(anc => {
              if (anc !== sw && !equippedWeapons.has(anc)) skipped.add(anc);
            });
          }
        });

        // Protect every weapon that must still drop (chain minus starter-skipped bases).
        chain.forEach(n => { if (!skipped.has(n)) protectedSet.add(n); });

        // Protect passives consumed by transforms that actually occur: every chain weapon
        // except the equipped form itself (whose requirement points beyond the build) and
        // the starter-skipped bases (whose transform never happened).
        chain.forEach(n => {
          if (skipped.has(n) || n === w.name) return;
          const wo = D.weapons.find(x => x.name === n);
          if (!wo) return;
          (wo.requirements || []).forEach(req => {
            if (passiveNames.has(req)) protectedSet.add(req);
          });
        });
      });
    });

    return { protectedSet, equippedWeapons };
  }

  // ── Seal advisor strategy constants ──
  // Free-pick enabler weapons — never auto-seal. Candybox/Turbo grant a free weapon pick,
  // Arma Dio a free passive; sealing them throws those picks away. (Arma Dio is rarity 50,
  // so it would otherwise be caught by the default threshold.)
  const SEAL_FREE_PICKS = new Set(['Candybox', 'Super Candybox II Turbo', 'Arma Dio']);
  // Arcana that hand you passives outside the normal pool, making passive-sealing
  // counterproductive: Hail from the Future drops Arma Dios; Moonlight Bolero's chests hold
  // passives even with full slots. With either equipped, don't auto-seal passives at all.
  const SEAL_PASSIVE_BLOCKING_ARCANA = new Set(['Moonlight Bolero (VI)', 'Hail from the Future (X)']);
  // Keep weapons at/below this rarity unsealed so regular Candybox (and Hail's Candybox
  // drops) still have cheap picks — these barely surface as normal level-ups anyway.
  const SEAL_CANDYBOX_RESERVE_RARITY = 1;
  // Priority order for the one passive left unsealed for Arma Dio to grant (the routine
  // extra passive in single player). Reserve the highest-ranked one not already in the build.
  const SEAL_ARMA_PASSIVE_PRIORITY = [
    'Duplicator', 'Empty Tome', 'Spinach', 'Candelabrador', 'Spellbinder', 'Bracer',
    'Attractorb', 'Tirajisú', 'Clover', 'Crown', 'Pummarola', 'Hollow Heart', 'Armor',
    'Wings', 'Stone Mask', "Skull O'Maniac",
  ];

  function applySealRecommend() {
    const { protectedSet, equippedWeapons } = sealProtectedItems();
    const passiveNames = new Set(D.passives.map(p => p.name));
    const minRarity = state.seal.minRarity;

    // Arcana context can veto passive sealing entirely (see SEAL_PASSIVE_BLOCKING_ARCANA).
    const blockingArcana = state.arcana.find(a => a && SEAL_PASSIVE_BLOCKING_ARCANA.has(a.name));
    const sealPassives = state.seal.sealPassives && !blockingArcana;

    // Items reachable on the selected stage — usually not worth sealing (you can grab them
    // as a late 7th/8th slot). Never auto-recommend; the user can still seal manually.
    const stageItems = stageItemSet();

    // Reserve one high-value passive (not already in the build, and not free on this stage)
    // for Arma Dio to fill.
    const armaReserve = sealPassives
      ? SEAL_ARMA_PASSIVE_PRIORITY.find(pn =>
          passiveNames.has(pn) && !protectedSet.has(pn) && !stageItems.has(pn))
      : null;

    state.seal.selected.clear();

    D.banishLayout.forEach(name => {
      if (!name) return;
      if (protectedSet.has(name)) return;
      if (SEAL_FREE_PICKS.has(name)) return; // Candybox / Turbo / Arma Dio — keep the free picks
      if (stageItems.has(name)) return;      // free on the selected stage — leave for pickup
      // Never recommend sealing something the user doesn't own — it isn't in their pool.
      if (collectionEnabled() && (passiveNames.has(name) ? !passiveAccessible(name) : !weaponAccessible(name))) return;

      const isPassive = passiveNames.has(name);

      if (isPassive) {
        if (!sealPassives) return;
        if (name === armaReserve) return;    // leave one valuable passive for Arma Dio
        const passive = D.passives.find(p => p.name === name);
        if (passive && passive.rarity >= minRarity) state.seal.selected.add(name);
        return;
      }

      const weapon = D.weapons.find(w => w.name === name);
      if (!weapon) return;

      if (weapon.rarity > 0) {
        // Offerable weapon. Leave the cheapest tier unsealed for Candybox picks.
        if (weapon.rarity <= SEAL_CANDYBOX_RESERVE_RARITY) return;
        if (weapon.rarity >= minRarity) state.seal.selected.add(name);
      } else {
        // Evolutions/unions (rarity 0) never drop but auto-form from their parts. Seal one
        // only when the build holds a component that could form it — locks an equipped weapon
        // in its current stage (e.g. seal Vandalier to keep Peachone + Ebony Wings). We don't
        // blanket-seal evolutions: Turbo Candybox picks from the evolved pool, so keeping
        // them available matters.
        const parts = collectWeaponChain(name);
        let formable = false;
        parts.forEach(part => { if (part !== name && equippedWeapons.has(part)) formable = true; });
        if (formable) state.seal.selected.add(name);
      }
    });

    // Report whether the arcana veto suppressed passive sealing, so the UI can explain it.
    return { blockedByArcana: state.seal.sealPassives && blockingArcana ? blockingArcana.name : null };
  }

  function renderSealOverlay() {
    const passiveNames = new Set(D.passives.map(p => p.name));
    const weaponMap   = Object.fromEntries(D.weapons.map(w => [w.name, w]));
    const passiveMap  = Object.fromEntries(D.passives.map(p => [p.name, p]));
    const buildItems  = sealBuildItems();
    const { protectedSet } = sealProtectedItems();
    const stageItems  = stageItemSet();

    const rarityValues = [...new Set(
      D.weapons.map(w => w.rarity).filter(r => r > 0)
    )].sort((a, b) => a - b);

    const sliderMax = rarityValues.length - 1;
    const curIdx    = Math.max(0, rarityValues.indexOf(state.seal.minRarity));
    const dispVal   = rarityValues[curIdx] ?? state.seal.minRarity;

    const cells = D.banishLayout.map(name => {
      if (!name) return `<div class="seal-cell empty"></div>`;

      const isPassive = passiveNames.has(name);
      const inBuild   = buildItems.has(name);
      const sealed  = state.seal.selected.has(name);
      const passiveOff = isPassive && !state.seal.sealPassives;

      const item  = weaponMap[name] || passiveMap[name];
      const icon  = item ? item.icon : (isPassive ? EMPTY_ICONS.passive : EMPTY_ICONS.weapon);
      const fallback = isPassive ? EMPTY_ICONS.passive : EMPTY_ICONS.weapon;

      // Lineage component that must still drop to build an equipped weapon (e.g. Peachone
      // when Vandalier is equipped). Locked — sealing it would break the build.
      const needed = !inBuild && protectedSet.has(name);
      // Free on the selected stage — flagged but still sealable if the user insists.
      const stageItem = !inBuild && !needed && stageItems.has(name);
      // Unowned per the collection — not in the pool, so nothing to seal. Dim + lock it.
      const uncollected = collectionEnabled() && (isPassive ? !passiveAccessible(name) : !weaponAccessible(name));

      const classes = ['seal-cell',
        inBuild    ? 'in-build'     : '',
        needed     ? 'needed'       : '',
        stageItem  ? 'stage-item'   : '',
        sealed   ? 'sealed'     : '',
        passiveOff ? 'passive-off'  : '',
        uncollected ? 'uncollected' : '',
      ].filter(Boolean).join(' ');

      const lockToggle = inBuild || needed || passiveOff || uncollected;
      const actionAttr = lockToggle
        ? '' : `data-action="seal-toggle" data-name="${esc(name)}"`;

      const tip = esc(name)
        + (item ? ` — rarity ${item.rarity}` : '')
        + (inBuild ? ' (in build)' : '')
        + (needed ? ' (needed for lineage)' : '')
        + (stageItem ? ' (free on stage)' : '')
        + (uncollected ? ' (not in your collection)' : '');

      return `<div class="${classes}" ${actionAttr} title="${tip}">
        <img class="seal-icon" src="${esc(icon)}" alt="${esc(name)}" onerror="this.src='${fallback}'">
        <img class="seal-mark" src="assets/icons/ui/seal.png" alt="">
      </div>`;
    }).join('');

    const root = document.getElementById('overlay-root');
    root.innerHTML = `
      <div class="overlay-panel seal-panel">
        <div class="overlay-header">
          <h2>Seal Advisor</h2>
          <button class="btn btn-icon overlay-close" data-action="seal-close">✕</button>
        </div>
        <div class="seal-controls">
          <label>
            <input type="checkbox" id="seal-passives-chk" ${state.seal.sealPassives ? 'checked' : ''}>
            Seal Passives
          </label>
          <div class="seal-rarity-ctrl">
            <span>Min Rarity</span>
            <input type="range" id="seal-rarity-slider"
              min="0" max="${sliderMax}" value="${curIdx}"
              data-rarities="${rarityValues.join(',')}">
            <span class="seal-rarity-val" id="seal-rarity-val">${dispVal}</span>
          </div>
          <button class="btn btn-confirm btn-sm" data-action="seal-recommend">Recommend</button>
          <button class="btn btn-sm" data-action="seal-clear">Clear All</button>
        </div>
        <div class="seal-grid-wrap">
          <div class="seal-grid">${cells}</div>
        </div>
      </div>`;
    root.classList.remove('hidden');
    state.seal.active = true;
  }

  function closeSealOverlay() {
    document.getElementById('overlay-root').classList.add('hidden');
    state.seal.active = false;
  }

  // ── Manage Collection overlay ──────────────────────────────────────────────
  function collectionGridHTML() {
    const tab = state.collection.tab;
    const u   = state.collection.unowned;

    if (tab === 'characters') {
      const cells = charGroups().map(group => {
        const vi  = (state.ovl.variantIdx[group[0].base_name] ?? 0) % group.length;
        const cur = group[vi];
        const owned = !u.characters.has(cur.name);
        const searchVal = esc(group.map(c => c.name).join('|'));
        const nav = group.length > 1
          ? `<div class="stack-nav">
               <div class="stack-btn" data-action="cycle-char-variant" data-base="${esc(group[0].base_name)}" data-dir="-1">‹</div>
               <div class="stack-btn" data-action="cycle-char-variant" data-base="${esc(group[0].base_name)}" data-dir="1">›</div>
             </div>` : '';
        return `<div class="stack-wrapper" data-search="${searchVal}">
          <div class="char-card${group.length > 1 ? ' stacked' : ''}${owned ? '' : ' uncollected'}"
            data-action="collection-toggle" data-kind="characters" data-name="${esc(cur.name)}"
            title="${esc(cur.name)}${owned ? '' : ' — not in your collection'}">
