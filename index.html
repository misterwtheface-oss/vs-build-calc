<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Vampire Survivors Build Planner</title>
  <style>
    body {
      font-family: sans-serif;
      background: #1a1a2e;
      color: #eee;
      margin: 0;
      padding: 2rem;
      text-align: center;
    }
    h1 { color: #e94560; }
    p { color: #aaa; max-width: 480px; margin: 1rem auto; }
    .status {
      display: inline-block;
      margin-top: 2rem;
      padding: 1rem 2rem;
      border: 1px solid #e94560;
      border-radius: 6px;
      color: #e94560;
      font-size: 0.9rem;
      letter-spacing: 0.05em;
    }
  </style>
</head>
<body>
  <h1>Vampire Survivors Build Planner</h1>
  <p>
    Plan your run: pick a character, slot weapons and passives,
    and see which evolutions you can hit.
  </p>
  <div class="status">COMING SOON — DATA IMPORT IN PROGRESS</div>

  <!--
    TODO: Build planner engine

    Data sources (generated by tools/build-data.mjs from skill CSVs):
      data/characters.json  — character roster
      data/weapons.json     — all weapons
      data/passives.json    — all passives/accessories
      data/evolutions.json  — evolution + union map
      data/stages.json      — stage banners

    UI Components:
      1. Character picker (portrait grid → select one)
      2. Weapon slots (6 × card; character starting weapon auto-fills slot 1)
      3. Passive slots (6 × card)
      4. Evolution panel (lights up when base weapon + ingredient are both selected)
      5. Stage selector (shows banner bonuses)
      6. Save / share build (URL-encoded or saved to builds/*.json)
      7. Load build dropdown (reads builds/index.json)
  -->

  <script>
    // Engine will be wired up here once data/*.json files are populated.
    // See tools/build-data.mjs to generate them from the skill's CSV files.
  </script>
</body>
</html>
