      type, playerIdx, slotIdx: -1, hidden: true
    })).join('');
    return `<div class="slot-row slot-row-hidden">${slots}</div>`;
  }

  // Row of weapons hidden by absorb-unions. Alucard Shield's evolutions stay EDITABLE
  // (view-absorbed → info panel evolve/union/devolve on the absorbed array); Clock Tower's
  // clockwork bases are read-only (view-hidden).
  function absorbedSlotRow(player, playerIdx) {
    const cells = [];
    for (const [result, names] of Object.entries(player.absorbed || {})) {
      const editable = result === 'Alucard Shield';
      names.forEach((nm, idx) => {
        const item = weaponByName(nm);
        const icon = item ? (item.icon || EMPTY_ICONS.weapon) : EMPTY_ICONS.weapon;
        if (editable) {
          cells.push(`<div class="slot hidden-weapon slot-absorbed" data-action="view-absorbed" data-player="${playerIdx}" data-type="weapon" data-absorbed-result="${esc(result)}" data-absorbed-idx="${idx}" title="${item ? esc(item.name) + ' (hidden — evolvable)' : 'Empty'}">
            <img src="${esc(icon)}" alt="${item ? esc(item.name) : ''}" onerror="this.src='${EMPTY_ICONS.weapon}'">
          </div>`);
        } else {
          cells.push(slotHTML(item, { type: 'weapon', playerIdx, slotIdx: -1, hidden: true }));
        }
      });
    }
    if (!cells.length) return '';
    return `<div class="slot-row slot-row-hidden">${cells.join('')}</div>`;
  }

  // Evolve/Union/Devolve controls for an absorbed (hidden, editable) weapon. Advance is
  // gated the same way a real slot is (passive reqs, or union partners present in a normal
  // slot); the action operates on the absorbed array instead of player.weapons.
  function absorbedStageControls(wObj, player, playerIdx, result, idx) {
    const nextW = wObj.trans_result ? weaponByName(wObj.trans_result) : null;
    const bases = D.weapons.filter(b => b.trans_result === wObj.name);
    if (!nextW && !bases.length) return '';
    let inner = '';
    if (nextW && wObj.method) {
      const methodStr = wObj.method;
      let label = methodStr === 'Evolution' ? 'Evolve' : methodStr;
      const missing = absorbedAdvanceMissing(wObj, player);
      const ready = missing.length === 0;
      const missingText = missing.length ? `Missing: ${missing.map(esc).join(', ')}` : '';
      const labelColor = ready ? 'color:var(--can-evolve)' : '';
      inner += `<div class="req-row" style="align-items:center;gap:.5rem;margin-bottom:.3rem">
        <div class="req-icon" title="${esc(nextW.name)}"><img src="${esc(nextW.icon||EMPTY_ICONS.weapon)}" onerror="this.src='${EMPTY_ICONS.weapon}'"></div>
        <span style="font-size:.75rem;${labelColor}">${esc(nextW.name)}${ready ? ' — Ready' : ''}</span>
      </div>
      <button class="btn btn-sm btn-stage" ${ready ? '' : 'disabled'}
              data-action="perform-absorbed-advance"
              data-player="${playerIdx}"
              data-absorbed-result="${esc(result)}"
              data-absorbed-idx="${idx}"
              data-result="${esc(nextW.name)}">${esc(label)} →</button>
      ${missingText ? `<div class="stage-missing">${missingText}</div>` : ''}`;
    }
    if (bases.length > 0) {
      inner += `<button class="btn btn-sm btn-devolve"
              data-action="perform-absorbed-devolve"
              data-player="${playerIdx}"
              data-absorbed-result="${esc(result)}"
              data-absorbed-idx="${idx}">← Devolve</button>`;
    }
    return `<div class="detail-section"><span class="detail-section-label">Stage (hidden)</span>${inner}</div>`;
  }

  function statVal(key, val) {
    if (val === 0) return null;
    const pct = PCT_STATS.has(key);
    const num = pct ? Math.round(val * 100) : val;
    const sign = num > 0 ? '+' : '';
    const suffix = pct ? '%' : '';
    const isGood = INVERTED_STATS.has(key) ? num < 0 : num > 0;
    const cls = isGood ? 'pos' : 'neg';
    return `<span class="stat-val ${cls}">${sign}${num}${suffix}</span>`;
  }

  function statsHTML(char, player, level) {
    const showPassive = !!player;
    let rows = '';
    for (const [key, label] of Object.entries(STAT_LABELS)) {
      const { dispBase, dispChar, dispPU, dispPassive, total, isPct, isCapped } = calcStatTotal(key, char?.stats, player, char, level);
      const suffix = isPct ? '%' : '';
      const charIsZero = dispChar === 0;
      const charSign = dispChar > 0 ? '+' : '';
      const isGood = INVERTED_STATS.has(key) ? dispChar < 0 : dispChar > 0;
      const charCls = charIsZero ? '' : (isGood ? 'pos' : 'neg');
      const charDisplay = charIsZero
        ? '<span class="stat-char stat-val">—</span>'
        : `<span class="stat-char stat-val ${charCls}">${charSign}${dispChar}${suffix}</span>`;
      const puDisplay = dispPU
        ? `<span class="stat-pu">${dispPU}</span>`
        : '<span class="stat-pu" style="color:var(--text-muted)">—</span>';
      const passiveDisplay = showPassive
        ? (dispPassive
            ? `<span class="stat-passive">${dispPassive}</span>`
            : '<span class="stat-passive" style="color:var(--text-muted)">—</span>')
        : '';
      const changed = dispChar !== 0;
      const rowCls = ['stat-row', changed ? 'changed' : '', isCapped ? 'capped' : ''].filter(Boolean).join(' ');
      rows += `<div class="${rowCls}">
        <span class="stat-key">${label}</span>
        <span class="stat-base">${dispBase}</span>
        ${charDisplay}
        ${puDisplay}
        ${passiveDisplay}
        <span class="stat-total">${total}${suffix}</span>
      </div>`;
    }
    const header = showPassive
      ? `<div class="stat-header"><span>Stat</span><span>Base</span><span>Char</span><span>PU</span><span>Pass</span><span>Total</span></div>`
      : `<div class="stat-header"><span>Stat</span><span>Base</span><span>Char</span><span>PU</span><span>Total</span></div>`;
    return `<div class="stat-grid${showPassive ? ' with-pass' : ''}">${header}${rows}</div>`;
  }

  function renderLanding() {

    document.getElementById('app').innerHTML = `
      <div id="landing">

  // Character sprite thumbnail with a tiered fallback that steps through each candidate
  // on load error. animated=true → animated gif first, else static png sprite first;
  // both then fall back to the grid icon and finally the empty silhouette. The
  // char-sprite container uses object-fit: contain so no aspect ratio is ever clipped.
  function charSpriteHTML(item, animated = true) {
    const empty = EMPTY_ICONS.char;
    const order = animated
      ? [item.sprite_gif, item.sprite_static, item.icon, empty]
      : [item.sprite_static, item.sprite_gif, item.icon, empty];
    const chain = [...new Set(order.filter(Boolean))];
    const primary = esc(chain[0] || empty);
    const fbs = chain.slice(1).map(esc).join('|');
    return `<div class="detail-icon char-sprite"><img src="${primary}" data-fbs="${fbs}" onerror="var f=(this.dataset.fbs||'').split('|').filter(Boolean);if(f.length){this.src=f.shift();this.dataset.fbs=f.join('|');}else{this.onerror=null;}"></div>`;
  }

  // "Starting Loadout" section for a character: starting weapons AND passives
  // (passives live inside starting_weapons, e.g. Empty Tome), plus the character's
  // extra starting arcana. Shared by the char selector and the planner info panel.
  // `navigable` (character SELECTOR): make each loadout item open its detail page (routed via
  // handleOverlayClick → detail overlay). Planner sidebar keeps them static (default).
  function startingLoadoutHTML(char, navigable = false) {
    if (!char) return '';
    const items = char.starting_weapons ?? [];
    if (!items.length && !char.starting_arcana) return '';
    // Nav attributes + clickable class for a loadout item name (empty when it doesn't resolve).
    const nav = name => {
      const ref = navigable ? resolveRef(name) : null;
      if (!ref) return { attrs: '', cls: '' };
      const attrs = ref.kind === 'affinity'
        ? `data-action="nav-affinity" data-affinity="${esc(name)}"`
        : `data-action="nav-object" data-detail-type="${ref.type}" data-detail-name="${esc(name)}"`;
      return { attrs, cls: ' stage-nav' };
    };
    let row = '';
    for (const wn of items) {
      const obj = weaponByName(wn) || passiveByName(wn);
      const isHidden = char.hidden_items?.includes(wn);
      const isMax    = char.max_items?.includes(wn);
      const badge = isMax ? '<span class="sw-badge sw-max">MAX</span>'
                  : isHidden ? '<span class="sw-badge sw-hidden">HID</span>' : '';
      const suffix = isHidden ? ' (Hidden)' : isMax ? ' (Max)' : '';
      const { attrs, cls } = nav(wn);
      row += `<div class="req-icon${isHidden ? ' sw-is-hidden' : ''}${cls}" ${attrs} title="${esc(wn)}${suffix}">${
        obj ? `<img src="${esc(obj.icon||EMPTY_ICONS.weapon)}" onerror="this.src='${EMPTY_ICONS.weapon}'">${badge}`
            : `<span style="font-size:.55rem">${esc(wn.slice(0,6))}</span>`}</div>`;
    }
    if (char.starting_arcana) {
      const a = arcanaByName(char.starting_arcana);
      const { attrs, cls } = nav(char.starting_arcana);
      row += `<div class="req-icon sw-arcana-icon${cls}" ${attrs} title="${esc(char.starting_arcana)} (Starting Arcana — extra)">${
        a ? `<img src="${esc(a.icon||EMPTY_ICONS.arcana)}" onerror="this.src='${EMPTY_ICONS.arcana}'"><span class="sw-badge sw-arcana">ARC</span>`
          : `<span style="font-size:.55rem">${esc(char.starting_arcana.slice(0,6))}</span>`}</div>`;
    }
    return `<div class="detail-section"><span class="detail-section-label">Starting Loadout</span><div class="req-row">${row}</div></div>`;
  }

  // Escape text, then render Markdown-style **bold** as <strong> (the ** survive esc, and the
  // wrapped content is already escaped, so no injection).
  function mdBold(text) {
    return esc(text).replace(/\*\*(.+?)\*\*/g, '<strong>$1</strong>');
  }

  // Description block: official blurb, plus a character's `effect_clarifications` below it (one
  // blank line between, identical format). Non-characters have no clarifications → just the blurb.
  function descBlurbHTML(item) {
    const parts = [item.description, item.effect_clarifications].filter(Boolean).map(mdBold);
    if (!parts.length) return '';
    return `<div class="detail-desc">${parts.map(p => `<span class="blurb-p">${p}</span>`).join('')}</div>`;
  }

  function buildInfoSidebar(panel) {
    if (!panel) {
      return `<div class="info-sidebar">
        <div class="sidebar-body"><div class="info-sidebar-empty">Left-click a slot<br>to see details<br><br>Right-click to change</div></div>
      </div>`;
    }
    const { type, playerIdx, slotIdx, hiddenName, refName, absorbedResult, absorbedIdx, gift } = panel;
    const player = state.players[playerIdx];
    // An editable absorbed weapon (Alucard Shield's hidden evolutions) is addressed by its
    // container result + index into that result's absorbed list.
    const absorbedName = absorbedResult ? player?.absorbed?.[absorbedResult]?.[absorbedIdx] : null;

    let item = null;
    if (type === 'char')    item = player?.character;
    else if (type === 'weapon')  {
      item = gift === 'weapon' ? player?.giftWeapon
           : absorbedName ? weaponByName(absorbedName)
           : hiddenName ? weaponByName(hiddenName)
           : player?.weapons[slotIdx];
    }
    else if (type === 'passive') item = gift === 'passive' ? player?.giftPassive
           : refName ? passiveByName(refName) : player?.passives[slotIdx];
    else if (type === 'arcana')  item = refName ? arcanaByName(refName) : state.arcana[slotIdx];
    else if (type === 'stage')   item = state.stage;

    if (!item) return `<div class="info-sidebar"><div class="sidebar-body"><div class="info-sidebar-empty">Empty slot</div></div></div>`;

    const emptyIcon = EMPTY_ICONS[type] || EMPTY_ICONS.weapon;
    let top;
    if (type === 'char') {
      top = charSpriteHTML(item, true); // animated gif first
    } else if (type === 'stage') {
      // Landscape stage art — fit to its aspect instead of the square cover box (which clips).
      const icon = item.icon || emptyIcon;
      top = `<div class="stage-detail-img"><img src="${esc(icon)}" onerror="this.src='${emptyIcon}'"></div>`;
    } else {
      const icon = item.icon || emptyIcon;
      const iconClass = type === 'arcana' ? 'detail-icon arcana-card' : 'detail-icon';
      top = `<div class="${iconClass}"><img src="${esc(icon)}" onerror="this.src='${emptyIcon}'"></div>`;
    }
    top += `<div class="detail-name">${esc(item.name)}</div>`;
    top += descBlurbHTML(item);
    let html = '';

    if (type === 'char') {
      html += startingLoadoutHTML(item);
      const charLevel = player?.charLevel ?? 1;
      html += levelRowHTML(playerIdx, charLevel);
      html += statsHTML(item, player, charLevel);
    }

    if (type === 'weapon') {
      const wObj = D.weapons.find(w => w.name === item.name);
      if (wObj) html += buildEvoChainHTML(wObj);

      if (isFreePick(item.name)) {
        // Free-pick chooser (Candybox-like weapon, or the Turbo gift): a Choose button opens
        // the pool selector. These never evolve — no stage controls.
        const tgt = gift === 'weapon' ? 'giftWeapon' : String(slotIdx);
        html += `<div class="detail-section"><span class="detail-section-label">Choose</span>
          <button class="btn btn-sm btn-stage" data-action="open-freepick" data-player="${playerIdx}"
            data-slot="${slotIdx}" data-source="${esc(item.name)}" data-target="${tgt}">Choose ▸</button></div>`;
      } else if (gift === 'weapon') {
        // Converted Turbo gift weapon: removing it destroys the gift slot (does NOT devolve to
        // a base form) and frees the Turbo for reuse.
        html += `<div class="detail-section"><span class="detail-section-label">Stage</span>
          <button class="btn btn-sm btn-devolve" data-action="perform-devolve" data-player="${playerIdx}"
            data-slot="${slotIdx}" data-gift="weapon">← Remove gift</button></div>`;
      } else
      // Stage controls — only for real slots, not hidden weapon views
      if (wObj && slotIdx >= 0) {
        const player = state.players[playerIdx];
        const nextW  = wObj.trans_result ? weaponByName(wObj.trans_result) : null;
        // bases: weapons whose evo/union produces the current weapon (what we can devolve to)
        const bases  = D.weapons.filter(b => b.trans_result === wObj.name);

        if (nextW || bases.length > 0) {
          let stageInner = '';

          // ── Advance (Evolve / Union / Gift / …) ────────────
          if (nextW && wObj.method) {
            const methodStr = wObj.method;
            const counts = SLOT_COUNTS[state.playerCount];
            let label     = methodStr === 'Evolution' ? 'Evolve' : methodStr;
            let ready = false, missingText = '', dataAction, extraAttrs = '';

            if (isAbsorbUnion(nextW.name) && methodStr !== 'Union') {
              // Alucard Swords → Alucard Shield: consumes any 5 OTHER equipped non-base
              // (evolved) weapons, which then move to the Hidden row. placeAbsorbUnion
              // (via perform-union) computes the exact set from the current loadout.
              const available = absorbHiddenSet(player, nextW.name, slotIdx, counts).length;
              ready = available >= ALUCARD_ABSORB_COUNT;
              const need = ALUCARD_ABSORB_COUNT - available;
              missingText = ready ? '' : `Needs ${need} more evolved weapon${need === 1 ? '' : 's'}`;
              dataAction = 'perform-union';
              extraAttrs = `data-input-slots="${slotIdx}"`;
              label = 'Form Shield';
            } else if (methodStr === 'Union') {
              const allInputs  = D.weapons.filter(b => b.trans_result === wObj.trans_result && b.method === 'Union');
              const others     = allInputs.filter(u => u.name !== wObj.name);
              const otherPairs = others.map(u => ({
                name: u.name,
                slot: player.weapons.findIndex(w => w && w.name === u.name),
              }));
              const missingWeapons  = otherPairs.filter(p => p.slot < 0).map(p => p.name);
              // A union can ALSO require a passive (Phieraggi needs Tirajisú); enforce it.
              const missingPassives = missingPassiveReqs(wObj, player);
              const missing = [...missingWeapons, ...missingPassives];
              ready = missing.length === 0;
              missingText = missing.length ? `Missing: ${missing.map(esc).join(', ')}` : '';
              const inputSlots = [slotIdx, ...otherPairs.filter(p => p.slot >= 0).map(p => p.slot)];
              dataAction = 'perform-union';
              extraAttrs = `data-input-slots="${inputSlots.join(',')}"`;
            } else {
              const missing = missingPassiveReqs(wObj, player);
              // Chaos-morph finals also require the mapped character (e.g. Bone → Anima of
              // Mortaccio only as Mortaccio) — disable the arrow otherwise.
              const cInfo = chaosBlocked(nextW.name, player);
              ready = missing.length === 0 && !cInfo;
              missingText = cInfo ? `Requires ${esc(cInfo.character)}`
                : missing.length ? `Missing: ${missing.map(n => esc(n)).join(', ')}` : '';
              dataAction = 'perform-evolve';
            }

            // Collection gate: can't advance to a form whose result/ingredients aren't owned.
            if (ready && collectionEnabled() && !weaponAccessible(nextW.name)) {
              ready = false;
              missingText = 'Locked — not in your collection';
            }

            const labelColor = ready ? 'color:var(--can-evolve)' : '';
            stageInner += `<div class="req-row" style="align-items:center;gap:.5rem;margin-bottom:.3rem">
              <div class="req-icon" title="${esc(nextW.name)}"><img src="${esc(nextW.icon||EMPTY_ICONS.weapon)}" onerror="this.src='${EMPTY_ICONS.weapon}'"></div>
              <span style="font-size:.75rem;${labelColor}">${esc(nextW.name)}${ready ? ' — Ready' : ''}</span>
            </div>
            <button class="btn btn-sm btn-stage" ${ready ? '' : 'disabled'}
                    data-action="${dataAction}"
                    data-player="${playerIdx}"
                    data-slot="${slotIdx}"
                    data-result="${esc(nextW.name)}"
                    ${extraAttrs}>${esc(label)} →</button>
            ${missingText ? `<div class="stage-missing">${missingText}</div>` : ''}`;
          }

          // ── Devolve ─────────────────────────────────────────
          if (bases.length > 0) {
            const primaryBase = bases[0];
            const devolveLabel = bases.length === 1
              ? `← ${esc(primaryBase.name)}`
              : '← Devolve';
            stageInner += `<button class="btn btn-sm btn-devolve"
                    data-action="perform-devolve"
                    data-player="${playerIdx}"
                    data-slot="${slotIdx}">${devolveLabel}</button>`;
          }

          html += `<div class="detail-section">
            <span class="detail-section-label">Stage</span>
            ${stageInner}
          </div>`;
        }
      }

      // Stage controls for an editable absorbed weapon (Alucard Shield's hidden evolutions).
      if (wObj && absorbedName) {
        html += absorbedStageControls(wObj, player, playerIdx, absorbedResult, absorbedIdx);
      }
    }

    if (type === 'passive') {
      // Passives show their affinity banners ABOVE the evolution list (the one inverse case).
      const passiveAffSec = affinitySectionHTML('passive', item.name, 'open-affinity-page');
      if (gift === 'passive' && isFreePick(item.name)) {
        // Arma Dio gift chooser → Choose a passive from its pool.
        html += `<div class="detail-section"><span class="detail-section-label">Choose</span>
          <button class="btn btn-sm btn-stage" data-action="open-freepick" data-player="${playerIdx}"
            data-slot="${slotIdx}" data-source="${esc(item.name)}" data-target="giftPassive">Choose ▸</button></div>`;
      } else if (gift === 'passive') {
        // Converted Arma gift passive → removing it destroys the gift slot and frees Arma.
        html += `<div class="detail-section"><span class="detail-section-label">Stage</span>
          <button class="btn btn-sm btn-devolve" data-action="remove-slot" data-player="${playerIdx}"
            data-slot="${slotIdx}" data-type="passive" data-gift="passive">← Remove gift</button></div>`;
        html += passiveAffSec;
        html += buildPassiveEvoHTML(item.name, playerIdx);
      } else {
        html += passiveAffSec;
        html += buildPassiveEvoHTML(item.name, playerIdx);
      }
    }

    if (type === 'arcana') {
      const aObj = D.arcana.find(a => a.name === item.name);
      if (aObj) html += `<div class="hi-badge ${aObj.type === 'Arcana' ? 'arcana' : 'item'}" style="text-align:center;margin:.4rem 0">${esc(aObj.type)}</div>`;
    }

    if (type === 'stage') {
      // Planner sidebar: stage items are click-to-add (routed through evoQuickAdd). The stage
      // slot is global, so items add to player 0 (the panel's player).
      html += stageItemsHTML(item, t => `<span class="detail-section-label">${esc(t)}</span>`, playerIdx ?? 0);
    }

    // Affinity banners: appended below existing content for weapon/character/arcana. Passives
    // insert theirs ABOVE the evolution list (handled in the passive branch) — the inverse case.
    if (type === 'weapon' || type === 'char' || type === 'arcana') {
      html += affinitySectionHTML(type, item.name, 'open-affinity-page');
    }

    // Info-"i" (top-right of the panel) → open this object's detail page. Not for stages.
    const infoBtn = type === 'stage' ? '' : infoDetailButtonHTML(type, item.name);
    return `<div class="info-sidebar"><div class="sidebar-top">${infoBtn}${top}</div><div class="sidebar-body">${html}</div></div>`;
  }

  function renderPlanning() {
    const { playerCount, players, infoPanel } = state;
    const counts = SLOT_COUNTS[playerCount];
    // Normalize Weapon Power-Up invariants for every weapon-mutation path (remove,
    // devolve, union, character change) — idempotent, so a per-render sweep is safe.
    players.forEach(syncExtraPassives);
    // Drop stale absorb-union entries (result no longer equipped) before deriving hidden.
    players.forEach(syncAbsorbed);
    // Restore/clear a Familiar Forge starter slot based on whether a familiar is held.
    players.forEach(syncFamiliarStarter);
    // Drop appended transient stage-pickup slots the current stage no longer supplies.
    players.forEach(syncStageSlots);

    const playerCards = players.map((player, idx) => {
      const char = player.character;

      // ── Character slot
      const charSlot = slotHTML(char, { type:'char', playerIdx:idx, slotIdx:0, removable: !!char });

      // ── Weapon slots
      // Weapons listed in hidden_items start in hidden slots, not regular slots.
      // Passive-type starters (e.g. Empty Tome) are handled in the passive slots below.
      const hiddenItemSet = new Set(char?.hidden_items ?? []);
      const normalStarters = starterWeaponNames(char);
      const hiddenStarters = char
        ? char.starting_weapons.filter(wn => hiddenItemSet.has(wn) && !isPassiveName(wn))
        : [];
      const starterCount = char ? Math.min(normalStarters.length, counts.weapons) : 0;
      const starterLineages = normalStarters.slice(0, starterCount).map(wn => weaponLineage(wn));
      const wSlots = Array.from({length: counts.weapons}, (_, si) => {
        const base = player.weapons[si] || null;
        // Locked only if the weapon belongs to this slot's starter lineage (starter → evo → union result).
        // Empty slots and weapons from outside the lineage are not locked.
        const isLocked = si < starterCount && !!base && (starterLineages[si]?.has(base.name) ?? false);
        return slotHTML(base, { type:'weapon', playerIdx:idx, slotIdx:si, locked:isLocked });
      }).join('');

      // ── Hidden weapons (hidden starters + char overflow + counterparts unlocked by Gemini)
      const occupied = new Set(player.weapons.filter(Boolean).map(w => w.name));
      const charOverflow = char
        ? normalStarters.slice(counts.weapons).filter(wn => !occupied.has(wn))
        : [];
      const counterparts = getHiddenCounterparts(idx);
      // Hidden weapons spawned by equipped passives (slots + extra bar), e.g. each Mini
      // passive adds a hidden weapon. Derived from present passives, so removing the
      // passive (or consuming a Mini on evolve) removes its hidden weapon automatically.
      const passiveHidden = [];
      [...player.passives.filter(Boolean), ...(player.extraPassives || []).map(passiveByName).filter(Boolean)]
        .forEach(pv => (pv.grants || []).forEach(g => {
          if (g.op === 'add_hidden' && g.kind === 'weapon') {
            for (let i = 0; i < (g.amount || 1); i++) passiveHidden.push(g.name);
          }
        }));
      const allHidden = [...new Set([
        ...hiddenStarters.filter(wn => !occupied.has(wn)),
        ...charOverflow,
        ...counterparts,
        ...passiveHidden,
      ])];
      // Hidden/extra weapons get their own conditional row (between Weapons and
      // Passives) so they never push the Weapons row rightward / overflow. Familiars
      // (picked via Familiar Forge) share this row but are REMOVABLE (× → remove-familiar).
      const hiddenCells = allHidden.map(nm =>
        slotHTML(weaponByName(nm), { type:'weapon', playerIdx:idx, slotIdx:-1, hidden:true })).join('');
      const familiarCells = (player.familiars || []).map((nm, fi) => {
        const w = weaponByName(nm);
        const icon = w ? (w.icon || EMPTY_ICONS.weapon) : EMPTY_ICONS.weapon;
        return `<div class="slot hidden-weapon slot-familiar" data-action="view-hidden" data-player="${idx}" data-type="weapon" data-hidden-name="${esc(nm)}" title="${esc(nm)} (familiar)">
          <img src="${esc(icon)}" alt="${esc(nm)}" onerror="this.src='${EMPTY_ICONS.weapon}'">
          <button class="slot-remove" data-action="remove-familiar" data-player="${idx}" data-fam-idx="${fi}" title="Remove">×</button>
        </div>`;
      }).join('');
      const hiddenWeaponRow = (hiddenCells || familiarCells)
        ? `<div class="slot-row slot-row-hidden">${hiddenCells}${familiarCells}</div>` : '';
      // Weapons hidden by an equipped absorb-union (Clock Tower's 4 bases / Alucard
      // Shield's 5 evolutions) render their own row: Alucard's stay evolvable (editable),
      // Clock Tower's are read-only.
      const absorbedWeaponRow = absorbedSlotRow(player, idx);

      // ── Passive slots
      // Starter passives lock into the front slots, mirroring starter weapons.
      // Passives have no evo lineage, so a slot is locked purely by name match.
      const starterPassives = starterPassiveNames(char);
      const passiveStarterCount = char ? Math.min(starterPassives.length, counts.passives) : 0;
      const pSlots = Array.from({length: counts.passives}, (_, si) => {
        const base = player.passives[si] || null;
        const isLocked = si < passiveStarterCount && !!base && base.name === starterPassives[si];
        return slotHTML(base, { type:'passive', playerIdx:idx, slotIdx:si, locked:isLocked });
      }).join('');

      // Gift slots (Turbo → weapons row, Arma → passives row): a free-pick chooser until
      // the user picks from its pool. Appended to the MAIN row as one extra slot (never a
      // new row); one of each per whole build.
      const giftWeaponSlot = player.giftWeapon
        ? slotHTML(player.giftWeapon, { type:'weapon', playerIdx:idx, slotIdx:counts.weapons, gift:'weapon' })
        : '';
      const giftPassiveSlot = player.giftPassive
        ? slotHTML(player.giftPassive, { type:'passive', playerIdx:idx, slotIdx:counts.passives, gift:'passive' })
        : '';

      // Transient stage-pickup slots: real appended slots at array indices >= the core count
      // (free stage items — rings, metaglios, Academy Badge, Spinach, Fire Wand, …). Full
      // weapon/passive behavior; dropped by syncStageSlots when the stage stops supplying them.
      const transientWeaponSlots = player.weapons
        .map((w, i) => (i >= counts.weapons && w) ? slotHTML(w, { type:'weapon', playerIdx:idx, slotIdx:i, transient:true }) : '')
        .join('');
      const transientPassiveSlots = player.passives
        .map((p, i) => (i >= counts.passives && p) ? slotHTML(p, { type:'passive', playerIdx:idx, slotIdx:i, transient:true }) : '')
        .join('');

      // Hidden/extra passives — instances that don't occupy a core slot. Identical
      // instances collapse to ONE icon with an ×N badge to save space; the × removes a
      // single instance (which may devolve a bound OG weapon). Consumable passives (Mini)
      // are weapon-bound (auto consumed/restored on evolve/devolve), so they show no ×.
      const extraCounts = {};
      (player.extraPassives || []).forEach(nm => { extraCounts[nm] = (extraCounts[nm] || 0) + 1; });
      const hiddenPassiveRow = Object.keys(extraCounts).length
        ? `<div class="slot-row slot-row-hidden">${Object.entries(extraCounts).map(([nm, count]) => {
            const p = passiveByName(nm);
            const icon = p ? (p.icon || EMPTY_ICONS.passive) : EMPTY_ICONS.passive;
            const badge = count > 1 ? `<span class="dupe-badge">×${count}</span>` : '';
            const removeBtn = isConsumableExtra(nm) ? ''
              : `<button class="slot-remove" data-action="remove-extra-passive" data-player="${idx}" data-extra-name="${esc(nm)}" title="Remove one">×</button>`;
            return `<div class="slot slot-extra" data-action="view-extra-passive" data-player="${idx}" data-extra-name="${esc(nm)}" data-type="passive" title="${esc(nm)} (extra ×${count})">
              <img src="${esc(icon)}" alt="${esc(nm)}" onerror="this.src='${EMPTY_ICONS.passive}'">
              ${badge}
              ${removeBtn}
            </div>`;
          }).join('')}</div>`
        : '';

      return `<div class="player-card">
        <div class="player-header">
          <div class="player-header-left">
            <span class="player-name">Player ${idx+1}</span>
            ${char ? `<span class="char-name">— ${esc(char.name)}</span>` : ''}
          </div>
          <div class="player-header-actions">
            <button class="btn btn-sm" data-action="open-player-page" data-player="${idx}" title="Shared trait cross-reference">⊞ Traits</button>
            ${char ? `<button class="btn btn-sm" data-action="open-player-builds" data-player="${idx}" title="Saved builds for ${esc(char.name)}">★ Builds</button>` : ''}
            <button class="btn btn-sm" data-action="clear-player" data-player="${idx}" title="Clear all">✕ Clear</button>
          </div>
        </div>
        <div class="player-body">
          <div class="char-col">${charSlot}</div>
          <div class="slots-col">
            <div class="slot-row">${wSlots}${transientWeaponSlots}${giftWeaponSlot}</div>
            ${hiddenWeaponRow}
            ${absorbedWeaponRow}
            <div class="slot-row">${pSlots}${transientPassiveSlots}${giftPassiveSlot}</div>
            ${hiddenPassiveRow}
          </div>
        </div>
      </div>`;
    }).join('');

    // ── Global arcana + stage row
    const gASlots = state.arcana.map((arc, si) =>
      slotHTML(arc, { type:'arcana', playerIdx:0, slotIdx:si })
    ).join('');
    // Extra (character starting) arcana: locked, view-only, don't count toward the 3.
    const gExtraArcana = extraArcanaNames().map(nm =>
      slotHTML(arcanaByName(nm), { type:'arcana', playerIdx:0, slotIdx:-1, locked:true, removable:false, infoName:nm })
    ).join('');
    const gExtraArcanaRow = gExtraArcana
      ? `<span class="arcana-extra-divider" title="Starting arcana (extra)"></span>${gExtraArcana}`
      : '';
    const gStageSlot = slotHTML(state.stage ? { name:state.stage.name, icon:state.stage.icon } : null,
      { type:'stage', playerIdx:0, slotIdx:0 });

    // Preserve the player-list scroll position across every re-render. With the
    // single-column layout, stacked tiles (3-4 players) make `.planning-main`
    // scroll; clicking any icon rebuilds `#app`, so without this the list jumps
    // back to the top. Mirrors the overlay-scroll handling in refreshOverlay.
    const prevMain = document.querySelector('.planning-main');
    const prevScroll = prevMain ? prevMain.scrollTop : 0;

    document.getElementById('app').innerHTML = `
      <div id="planning">
        <div class="planning-header">
          <h1>Vampire Survivors Build Calculator</h1>
          <div class="planning-header-actions">
            <button class="btn" data-action="open-power-ups">Power-Ups</button>
            <button class="btn" data-action="open-seal">Seal Advisor</button>
            <button class="btn" data-action="open-collection">Manage Collection</button>
            <button class="btn" data-action="open-builds">Builds</button>
            <button class="btn" data-action="open-appendix">Appendix</button>
            <button class="btn btn-back" data-action="change-player-count">⟵ Change Player Count</button>
          </div>
        </div>
        <div class="planning-body">
          <div class="planning-main">
            <div class="global-row">
              <div class="global-row-inner">
                <div class="global-arcana-group">
                  <span class="slot-row-label">Arcana</span>
                  ${gASlots}
                  ${gExtraArcanaRow}
                </div>
                <div class="global-row-spacer" style="flex:1"></div>
                <div class="global-stage-group">
                  <span class="slot-row-label" style="width:auto;margin-right:.3rem">Stage</span>
                  ${gStageSlot}
                </div>
              </div>
            </div>
            <div class="players-grid p${playerCount}">${playerCards}</div>
          </div>
          ${buildInfoSidebar(state.infoPanel)}
        </div>
      </div>`;

    const newMain = document.querySelector('.planning-main');
    if (newMain) newMain.scrollTop = prevScroll;
  }

  // ═══════════════════════════════════════════════════════
  //  RENDER (router)
  // ═══════════════════════════════════════════════════════

  function render() {
    if (state.page === 'landing') renderLanding();
    else renderPlanning();
  }

  // ═══════════════════════════════════════════════════════
  //  OVERLAYS
  // ═══════════════════════════════════════════════════════

  // ── Character overlay ────────────────────────────────

  function openCharacterOverlay(playerIdx) {
    const player = state.players[playerIdx];
    state.overlay = { type:'char', playerIdx, fromEmpty: !player.character, prevItem: player.character };
    state.ovl.selected = player.character;
    buildAndShowOverlay(charOverlayHTML(playerIdx));
  }

  function charOverlayHTML(playerIdx) {
    const groups = charGroups();
    const sel = state.ovl.selected;

    // Base names already chosen by other players — dim these in the grid.
    const takenBaseNames = new Set(
      state.players
        .filter((_, i) => i !== playerIdx)
        .map(p => p.character?.base_name)
        .filter(Boolean)
    );

    let cards = '';
    for (const group of groups) {
      const vi  = (state.ovl.variantIdx[group[0].base_name] ?? 0) % group.length;
      const cur = group[vi];
      const isSelected = sel && group.some(c => c.name === sel.name);
      const isTaken    = takenBaseNames.has(group[0].base_name);
      const inaccessible = !charAccessible(cur.name);
      const uncls = inaccessible && !isSelected ? ' uncollected' : '';
      const hasVariants = group.length > 1;
      const searchVal = esc(group.map(c => c.name).join('|'));
      if (hasVariants) {
        cards += `<div class="stack-wrapper${isTaken ? ' dim' : ''}" data-search="${searchVal}">
          <div class="char-card stacked${isSelected ? ' selected' : ''}${uncls}" data-action="ovl-select-char" data-char="${esc(cur.name)}" data-base="${esc(group[0].base_name)}" title="${esc(cur.name)}${inaccessible ? ' — not in your collection' : ''}">
            <img src="${esc(cur.icon||EMPTY_ICONS.char)}" alt="${esc(cur.name)}" onerror="this.src='${EMPTY_ICONS.char}'">
            <div class="variant-count">${vi+1}/${group.length}</div>
          </div>
          <div class="stack-nav">
            <div class="stack-btn" data-action="cycle-char-variant" data-base="${esc(group[0].base_name)}" data-dir="-1">‹</div>
            <div class="stack-btn" data-action="cycle-char-variant" data-base="${esc(group[0].base_name)}" data-dir="1">›</div>
          </div>
        </div>`;
      } else {
        cards += `<div class="char-card${isSelected ? ' selected' : ''}${isTaken ? ' dim' : ''}${uncls}" data-action="ovl-select-char" data-char="${esc(cur.name)}" data-base="${esc(group[0].base_name)}" data-search="${searchVal}" title="${esc(cur.name)}${inaccessible ? ' — not in your collection' : ''}">
          <img src="${esc(cur.icon||EMPTY_ICONS.char)}" alt="${esc(cur.name)}" onerror="this.src='${EMPTY_ICONS.char}'">
        </div>`;
      }
    }

    const charLevel = state.players[playerIdx]?.charLevel ?? 1;
    const left = `${levelRowHTML(playerIdx, charLevel)}${statsHTML(sel, null, charLevel)}`;
    const rightTop = sel
      ? `${infoDetailButtonHTML('char', sel.name)}${charSpriteHTML(sel, false)}
         <div class="detail-name">${esc(sel.name)}</div>`
      : `<div class="detail-desc" style="text-align:center">Select a character</div>`;
    let rightBody = '';
    if (sel) {
      rightBody += descBlurbHTML(sel); // official blurb + effect clarifications (character)
      rightBody += startingLoadoutHTML(sel, true); // selector loadout items open detail pages
      if (sel.notes) rightBody += `<div class="detail-section"><h3>Notes</h3><div class="detail-desc" style="margin-top:.3rem">${esc(sel.notes).slice(0,400)}…</div></div>`;
      rightBody += affinitySectionHTML('char', sel.name, 'open-affinity-page');
    }

    return `<div class="overlay-header">
        <h2>Character Selection</h2>
        <button class="btn btn-icon overlay-close" data-action="ovl-close">✕</button>
      </div>
      <div class="overlay-body">
        <div class="ovl-center">
          <div class="ovl-center-search">${searchBarHTML('Search characters…')}</div>
          <div class="ovl-center-scroll"><div class="char-grid">${cards}</div></div>
        </div>
        <div class="ovl-info">
          <div class="ovl-right">
            <div class="ovl-right-top">${rightTop}</div>
            <div class="ovl-right-body">${rightBody}</div>
          </div>
          <div class="ovl-left">${left}</div>
        </div>
      </div>
      <div class="overlay-footer">
        <button class="btn btn-back" data-action="ovl-close">Cancel</button>
        <button class="btn btn-confirm" data-action="ovl-confirm">Confirm</button>
      </div>`;
  }

  // ── Item overlay ─────────────────────────────────────

  function openWeaponOverlay(playerIdx, slotIdx) {
    const player = state.players[playerIdx];
    const char = player.character;
    const hiddenSet = new Set(char?.hidden_items ?? []);
    const counts = SLOT_COUNTS[state.playerCount];
    const starterCount = char
      ? Math.min(char.starting_weapons.filter(w => !hiddenSet.has(w)).length, counts.weapons)
      : 0;
    // Locked-evo mode: clicking a locked starter slot opens a filtered selector
    // showing only that weapon's future evo forms, no other weapons.
    const isLockedEvo = slotIdx < starterCount && !!player.weapons[slotIdx];
    const prev = player.weapons[slotIdx];
    state.overlay = { type:'item', playerIdx, slotIdx, slotType:'weapon',
      fromEmpty: isLockedEvo || !prev, prevItem: prev, isLockedEvo };
    state.ovl.selected = isLockedEvo ? null : prev;
    buildAndShowOverlay(weaponOverlayHTML(playerIdx, slotIdx));
  }

  function openPassiveOverlay(playerIdx, slotIdx) {
    const player = state.players[playerIdx];
    const prev = player.passives[slotIdx];
    // Locked starter-passive slot — view-only (passives have no evo lineage to swap to).
    const counts = SLOT_COUNTS[state.playerCount];
    const starterPassives = starterPassiveNames(player.character);
    const passiveStarterCount = Math.min(starterPassives.length, counts.passives);
    if (slotIdx < passiveStarterCount && prev && prev.name === starterPassives[slotIdx]) return;
    state.overlay = { type:'item', playerIdx, slotIdx, slotType:'passive', fromEmpty: !prev, prevItem: prev };
    state.ovl.selected = prev;
    buildAndShowOverlay(passiveOverlayHTML(playerIdx, slotIdx));
  }

  // Open the pool selector for a Candybox-like free-pick slot. Shows the FULL grid with only
  // the item's pool undimmed (no filtering). `target` is where the pick lands: a normal
  // weapon slotIdx, 'giftWeapon', or 'giftPassive'.
  function openFreePickOverlay(playerIdx, slotIdx, sourceName, target) {
    const info = freePickInfo(sourceName);
    if (!info) return;
    const fp = { kind: info.kind, poolSet: info.pool, sourceName, target };
    const slotType = info.kind === 'passive' ? 'passive' : 'weapon';
    state.overlay = { type:'item', playerIdx, slotIdx, slotType, fromEmpty:false, prevItem:null, freePick: fp };
    state.ovl.selected = null;
    buildAndShowOverlay(info.kind === 'passive'
      ? passiveOverlayHTML(playerIdx, slotIdx)
      : weaponOverlayHTML(playerIdx, slotIdx));
  }

  // Limit Break table (weapon selector left panel). Limit Break = a weapon keeps leveling
  // past its last level, rolling one of these stats each time (Rarity = selection weight,
  // Max = cap; blank = uncapped). Data comes from weapon.limit_break (built by build-data.mjs).
  function limitBreakTableHTML(w) {
    if (!w.limit_break || !w.limit_break.length) return '';
    const none = '<span class="lb-none">—</span>';
    const cell = v => (v === '' || v == null) ? none : esc(v);
    // Rarity weight → % chance of rolling that stat, normalized over the pool's total
    // weight (we don't model max-reached rows dropping out of the pool). Rows with no
    // weight (source didn't provide one) fall back to a dash.
    const weights = w.limit_break.map(r => { const n = parseFloat(r.rarity); return isNaN(n) ? 0 : n; });
    const total = weights.reduce((a, b) => a + b, 0);
    const chance = (i, r) => (total > 0 && weights[i] > 0)
      ? `<td title="weight ${esc(r.rarity)}">${(weights[i] / total * 100).toFixed(2)}%</td>`
      : `<td>${none}</td>`;
    const rows = w.limit_break.map((r, i) => `<tr>
        <td>${esc(r.stat)}</td>
        <td>${cell(r.value)}</td>
        ${chance(i, r)}
        <td>${cell(r.max)}</td>
      </tr>`).join('');
    return `<div class="detail-section"><h3>Limit Break</h3>
      <table class="lb-table">
        <thead><tr><th>Stat</th><th>Value</th><th title="Chance to roll this stat when the weapon limit-breaks">Chance</th><th>Max</th></tr></thead>
        <tbody>${rows}</tbody>
      </table></div>`;
  }

  function weaponOverlayHTML(playerIdx, slotIdx) {
    const player = state.players[playerIdx];
    const sel    = state.ovl.selected;
    const isLockedEvo = !!state.overlay?.isLockedEvo;

    // ── Locked-evo mode: only show future forms of the starter weapon ──────
    // ── Normal mode: block evo-descendants of locked starters ──────────────
    const char = player.character;
    const hiddenSet = new Set(char?.hidden_items ?? []);
    const counts = SLOT_COUNTS[state.playerCount];
    const starterCount = char
      ? Math.min(char.starting_weapons.filter(w => !hiddenSet.has(w)).length, counts.weapons)
      : 0;

    let evoOnlySet = null; // non-null → locked-evo mode, show only these weapons
    if (isLockedEvo && player.weapons[slotIdx]) {
      evoOnlySet = collectDescendants(player.weapons[slotIdx].name);
      evoOnlySet.delete(player.weapons[slotIdx].name); // don't show the current form itself
    }
    // Free-pick mode: show the FULL grid, dim everything outside the item's pool.
    const freePickPool = state.overlay?.freePick?.kind === 'weapon' ? state.overlay.freePick.poolSet : null;

    const usedWeapons = new Set(player.weapons.filter((w, i) => w && i !== slotIdx).map(w => w.name));
    const consumedWeapons = getConsumedWeapons(playerIdx, slotIdx);
    if (!isLockedEvo) {
      // Block the LINEAR (non-union) evo descendants of other locked starters — those
      // must be selected via the locked slot. Union results are left selectable here so
      // a union partner in an unlocked slot can still form the final (it collapses onto
      // the locked slot in closeOverlay).
      for (let i = 0; i < starterCount; i++) {
        if (i === slotIdx) continue;
        const sw = player.weapons[i];
        if (sw) collectLinearDescendants(sw.name).forEach(name => consumedWeapons.add(name));
      }
    }

    // Banish layout order for sorting
    const banishOrder = new Map();
    D.banishLayout.forEach((name, i) => { if (name) banishOrder.set(name, i); });

    // Reverse map: evolution name → base weapon name
    const baseByEvo = new Map();
    D.weapons.forEach(w => { if (w.trans_result) baseByEvo.set(w.trans_result, w.name); });

    function weaponSortKey(w) {
      const base = baseByEvo.get(w.name) ?? w.name;
      return banishOrder.get(base) ?? banishOrder.get(w.name) ?? 9999;
    }

    // Locked-evo mode shows the FULL list; non-lineage weapons are dimmed in makeCard
    // (evoOnlySet still marks the clickable lineage forms).
    // Exclude the 'Special' category — pickups/consumables (Experience Gem, Gold Coin,
    // Rosary, Grenade, Floor Chicken…) that are never a level-up weapon CHOICE. They
    // never evolve and never appear in an evo lineage, so hiding them from the grid is
    // safe; the few characters that START with one still get it auto-placed (locked),
    // independent of this list. ('-' / Chaos weapons are left in — separate backlog.)
    // Familiars (ode_category 'Familiar') aren't direct grid picks either — they're chosen via
    // Familiar Forge (its free-pick pool, where they're shown) and live in the hidden/extra row.
    const isFamiliar = w => w.ode_category === 'Familiar';
    const weaponFilter = w => w.category !== 'Special'
      && (!isFamiliar(w) || (freePickPool && freePickPool.has(w.name)));
    const baseWeapons = D.weapons.filter(w => w.category === 'Base' && weaponFilter(w))
      .slice().sort((a, b) => weaponSortKey(a) - weaponSortKey(b));

    // Group non-base by category, each group sorted by base weapon order
    const evoGroups = new Map();
    D.weapons.filter(w => w.category !== 'Base' && weaponFilter(w)).forEach(w => {
      if (!evoGroups.has(w.category)) evoGroups.set(w.category, []);
      evoGroups.get(w.category).push(w);
    });
    for (const arr of evoGroups.values()) arr.sort((a, b) => weaponSortKey(a) - weaponSortKey(b));

    function makeCard(w) {
      const isSel      = sel && sel.name === w.name;
      // Locked-evo mode: only this starter's future forms (evoOnlySet) stay clickable;
      // every other weapon is dimmed. Normal mode uses used/consumed styling instead.
      const isOffLineage = (isLockedEvo && !(evoOnlySet && evoOnlySet.has(w.name)))
                        || (freePickPool && !freePickPool.has(w.name));
      const isUsed     = !isLockedEvo && usedWeapons.has(w.name);
      const isConsumed = !isLockedEvo && !isSel && !isUsed && consumedWeapons.has(w.name);
      // Gift items are one-of-each per build — dim once their gift is already consumed.
      const isGiftUsed = !freePickPool && ((w.name === TURBO && turboConsumed()) || (w.name === ARMA && armaConsumed()));
      // Unowned per the collection: dim but stay clickable (view-only; confirm is blocked).
      const inaccessible = !weaponAccessible(w.name);
      let cls = 'item-card';
      if (isSel) cls += ' selected';
      if (isUsed || isOffLineage || isGiftUsed) cls += ' dim';
      else if (isConsumed) cls += ' consumed';
      if (inaccessible && !isSel) cls += ' uncollected';
      const title = isConsumed
        ? `${w.name} — consumed in another evo chain`
        : w.name;
      return `<div class="${cls}" data-action="ovl-select-item" data-item="${esc(w.name)}" data-item-type="weapon" data-search="${esc(w.name)}" title="${esc(title)}">
        <img src="${esc(w.icon||EMPTY_ICON)}" alt="${esc(w.name)}" onerror="this.parentElement.classList.add('broken');this.src='${esc(EMPTY_ICON)}'">
      </div>`;
    }

    let centerGrid = '';
    if (baseWeapons.length) {
      centerGrid += `<div class="item-section-label">Base Weapons</div>
        <div class="item-grid">${baseWeapons.map(makeCard).join('')}</div>`;
    }
    for (const [cat, weapons] of evoGroups) {
      centerGrid += `<div class="item-section-label"${centerGrid ? ' style="margin-top:.75rem"' : ''}>${esc(cat)}</div>
        <div class="item-grid">${weapons.map(makeCard).join('')}</div>`;
    }
    const centerHTML = `<div class="ovl-center-search">${searchBarHTML('Search weapons…')}</div><div class="ovl-center-scroll">${centerGrid}</div>`;

    // Left panel: description + level ups for selected weapon
    let leftHTML = '<div class="detail-desc" style="margin-top:.5rem;color:var(--text-muted)">Select a weapon to see details</div>';
    let rightHTML = '';

    if (sel) {
      const w = D.weapons.find(w => w.name === sel.name);
      if (w) {
        leftHTML = `${w.level_ups.length ? `<div class="detail-section"><h3>Level Ups</h3><ul style="padding-left:1.1rem;margin:.3rem 0">
            ${w.level_ups.map((l,i) => `<li style="font-size:.94rem;margin-bottom:.15rem">${i === 0 ? '' : `Lv${i+1}: `}${esc(l)}</li>`).join('')}
          </ul></div>` : ''}${limitBreakTableHTML(w)}`;

        // Requirements with status
        let reqHTML = '';
        if (w.requirements.length) {
          const { pending, missing } = getEvolutionPassiveStatus(w, playerIdx);
          const pendingNames = new Set(pending.map(p => p.name));
          const hasError    = missing.length > 0;
          const effectiveAutoAdd = state.ovl.autoAdd ?? (pending.length > 0);
          const toggleHTML = pending.length > 0 ? (() => {
            const cls = `auto-add-toggle${effectiveAutoAdd ? ' checked' : ''}${hasError && !effectiveAutoAdd ? ' error' : ''}`;
            const check = effectiveAutoAdd ? '✓' : '';
            const warn  = hasError ? `<span class="auto-add-warn">${missing.length} won't fit</span>` : '';
            return `<div class="${cls}" data-action="toggle-auto-add">
              <span class="auto-add-box">${check}</span>
              <span>Auto-add ${pending.length} passive${pending.length > 1 ? 's' : ''}</span>
              ${warn}
            </div>`;
          })() : '';
          reqHTML = `<div class="detail-section"><h3>Requirements</h3>
            ${w.requirements.map(r => {
              const pObj = passiveByName(r);
              const wObj2 = weaponByName(r);
              const obj = pObj || wObj2;
              const icon = obj ? obj.icon : '';
              let statusHTML = '';
              if (pObj) {
                if (isExtraPassive(r))
                  statusHTML = extraCount(player, r) > 0
                    ? '<span class="req-status ok">✓ Extra bar</span>'
                    : '<span class="req-status add">+ Auto-add</span>';
                else if (player.passives.some(p => p && p.name === r))
                  statusHTML = '<span class="req-status ok">✓ Equipped</span>';
                else if (pendingNames.has(r))
                  statusHTML = '<span class="req-status add">+ Auto-add</span>';
                else
                  statusHTML = '<span class="req-status miss" title="No passive slot available">✗ No room</span>';
              } else if (wObj2) {
                statusHTML = player.weapons.some(pw => pw && pw.name === r)
                  ? '<span class="req-status ok">✓ In build</span>'
                  : '<span class="req-status miss" title="Add this weapon to the build">✗ Missing</span>';
              }
              return `<div class="req-row">
                <div class="req-icon">${icon ? `<img src="${esc(icon)}" alt="${esc(r)}" onerror="this.src='${esc(EMPTY_ICON)}'">` : ''}</div>
                <span style="flex:1;font-size:.75rem">${esc(r)}</span>${statusHTML}
              </div>`;
            }).join('')}
            ${toggleHTML}
          </div>`;
        }

        const chainHTML = buildEvoChainHTML(w);

        const wRightTop = `${infoDetailButtonHTML('weapon', w.name)}<div class="detail-icon"><img src="${esc(w.icon||EMPTY_ICON)}" onerror="this.parentElement.classList.add('broken');this.src='${esc(EMPTY_ICON)}'"></div>
          <div class="detail-name">${esc(w.name)}</div>
          ${w.category !== 'Base' ? `<div style="font-size:.7rem;color:var(--gold);text-align:center;margin-bottom:.2rem">${esc(w.category)}</div>` : ''}
          ${w.description ? `<div class="detail-desc" style="margin-top:.4rem">${esc(w.description)}</div>` : ''}`;
        const wRightBody = `${reqHTML}${chainHTML}${affinitySectionHTML('weapon', w.name, 'open-affinity-page')}`;
        rightHTML = `<div class="ovl-right-top">${wRightTop}</div><div class="ovl-right-body">${wRightBody}</div>`;
      }
    } else {
      rightHTML = `<div class="ovl-right-top"><div class="detail-desc" style="text-align:center">Select a weapon</div></div><div class="ovl-right-body"></div>`;
    }

    return `<div class="overlay-header">
        <h2>Weapon Slot ${slotIdx+1}</h2>
        <button class="btn btn-icon overlay-close" data-action="ovl-close">✕</button>
      </div>
      <div class="overlay-body">
        <div class="ovl-center">${centerHTML}</div>
        <div class="ovl-info">
          <div class="ovl-right">${rightHTML}</div>
          <div class="ovl-left">${leftHTML}</div>
        </div>
      </div>
      <div class="overlay-footer">
        <button class="btn btn-back" data-action="ovl-close">Cancel</button>
        <button class="btn btn-confirm" data-action="ovl-confirm">Confirm</button>
      </div>`;
  }

  function passiveOverlayHTML(playerIdx, slotIdx) {
    const player = state.players[playerIdx];
    const sel    = state.ovl.selected;
    // Block passives equipped by this player in other slots, and by any other player.
    const usedPassives = new Set([
      ...player.passives.filter((p, i) => p && i !== slotIdx).map(p => p.name),
      ...state.players.filter((_, i) => i !== playerIdx).flatMap(p => p.passives.filter(Boolean).map(p => p.name)),
    ]);

    // Free-pick mode (Arma Dio): show the FULL grid, dim everything outside the pool.
    const freePickPool = state.overlay?.freePick?.kind === 'passive' ? state.overlay.freePick.poolSet : null;
    let cards = '';
    for (const p of D.passives) {
      // Extra-bar passives (Weapon Power-Up, Outer Saboteur, Mini …) live outside the core
      // slots, capped by their enabling weapons. Kept in the list but dimmed/unselectable
      // when at cap or with no enabling weapon (never filtered out).
      const isExtra = isExtraPassive(p.name);
      const isSel = sel && sel.name === p.name;
      // Stage-exclusive passives (rings/metaglios/Academy Badge) are only selectable when a
      // stage/character supplies them AND no player already holds them (one per build).
      const exclusiveBlocked = STAGE_EXCLUSIVE_PASSIVES.has(p.name)
        && (!stageItemGateOpen(player, p.name) || anyPlayerOwnsPassive(p.name));
      const isDim = (freePickPool && !freePickPool.has(p.name))
        || exclusiveBlocked
        || (isExtra ? (extraCount(player, p.name) >= extraCap(player, p.name)) : usedPassives.has(p.name));
      const inaccessible = !passiveAccessible(p.name);
      cards += `<div class="item-card${isSel ? ' selected' : ''}${isDim ? ' dim' : ''}${inaccessible && !isSel ? ' uncollected' : ''}"
        data-action="ovl-select-item" data-item="${esc(p.name)}" data-item-type="passive" data-search="${esc(p.name)}"
        title="${esc(p.name)}${inaccessible ? ' — not in your collection' : ''}">
        <img src="${esc(p.icon||EMPTY_ICON)}" alt="${esc(p.name)}" onerror="this.parentElement.classList.add('broken');this.src='${esc(EMPTY_ICON)}'">
      </div>`;
    }

    let leftHTML = '<div class="detail-desc" style="margin-top:.5rem;color:var(--text-muted)">Select a passive to see details</div>';
    let rightTop = '<div class="detail-desc" style="margin-top:1rem;text-align:center">Select a passive</div>';
    let rightBody = '';

    if (sel) {
      const p = D.passives.find(p => p.name === sel.name);
      if (p) {
        leftHTML = `<div class="detail-desc" style="margin:.2rem 0">${esc(p.description)}</div>
          ${p.level_ups.length > 1 ? `<div class="detail-section"><h3>Level Ups</h3><ul style="padding-left:1.1rem;margin:.3rem 0">
            ${p.level_ups.slice(1).map((l,i) => `<li style="font-size:.75rem;margin-bottom:.15rem">Lv${i+2}: ${esc(l)}</li>`).join('')}
          </ul></div>` : ''}`;
        rightTop = `${infoDetailButtonHTML('passive', p.name)}<div class="detail-icon"><img src="${esc(p.icon||EMPTY_ICON)}" onerror="this.parentElement.classList.add('broken');this.src='${esc(EMPTY_ICON)}'"></div>
          <div class="detail-name">${esc(p.name)}</div>
          <div class="detail-desc">${esc(p.description)}</div>`;
        // Passives show affinity banners ABOVE the evolution list (the inverse case).
        rightBody = affinitySectionHTML('passive', p.name, 'open-affinity-page') + buildPassiveEvoHTML(p.name, null);
      }
    }
    const rightHTML = `<div class="ovl-right-top">${rightTop}</div><div class="ovl-right-body">${rightBody}</div>`;

    return `<div class="overlay-header">
        <h2>Passive Slot ${slotIdx+1}</h2>
        <button class="btn btn-icon overlay-close" data-action="ovl-close">✕</button>
      </div>
      <div class="overlay-body">
        <div class="ovl-center">
          <div class="ovl-center-search">${searchBarHTML('Search passives…')}</div>
          <div class="ovl-center-scroll"><div class="item-grid">${cards}</div></div>
        </div>
        <div class="ovl-info">
          <div class="ovl-right">${rightHTML}</div>
          <div class="ovl-left">${leftHTML}</div>
        </div>
      </div>
      <div class="overlay-footer">
        <button class="btn btn-back" data-action="ovl-close">Cancel</button>
        <button class="btn btn-confirm" data-action="ovl-confirm">Confirm</button>
      </div>`;
  }

  // ── Arcana overlay ───────────────────────────────────

  function openArcanaOverlay(slotIdx) {
    const prev = state.arcana[slotIdx];
    state.overlay = { type:'arcana', playerIdx:0, slotIdx, fromEmpty: !prev, prevItem: prev };
    state.ovl.selected = prev;
    buildAndShowOverlay(arcanaOverlayHTML(slotIdx));
  }

  function arcanaOverlayHTML(slotIdx) {
    const sel    = state.ovl.selected;
    const tab    = state.ovl.arcanaTab; // 'arcana' | 'darkana'
    const groups = arcanaGroups();
    const EMPTY_DARKANA = 'assets/icons/arcana/empty_darkana.png';

    const otherTab  = tab === 'arcana' ? 'darkana' : 'arcana';
    const tabLabel  = tab === 'arcana' ? 'Arcana' : 'Darkana';
    const switchLabel = tab === 'arcana' ? '→ Darkana' : '→ Arcana';

    const tabBtn = `<button class="arcana-tab-btn" data-action="arcana-tab-toggle" data-tab="${tab}">
      <span class="arcana-tab-current">${tabLabel}</span>
      <span class="arcana-tab-switch">${switchLabel}</span>
    </button>`;

    // Arcana already in the build — can't be picked again (uniqueness). Covers the
    // other pool slots AND extra (character starting) arcana: an "extra" takes no
    // pool slot but is still owned, so it must be removed from the selectable pool.
    const equippedElsewhere = new Set([
      ...state.arcana.filter((a, i) => a && i !== slotIdx).map(a => a.name),
      ...extraArcanaNames(),
    ]);

    let cards = tabBtn;
    for (const group of groups) {
      const key     = group[0].base_num;
      const arcana  = group.find(a => a.type === 'Arcana');
      const darkana = group.find(a => a.type === 'Darkana');
      const cur     = tab === 'arcana' ? arcana : (darkana || null);
      const isSel   = sel && group.some(a => a.name === sel.name);
      const searchVal = esc(group.map(a => a.name).join('|'));

      if (tab === 'darkana' && !darkana) {
        // Placeholder for positions without a Darkana variant
        cards += `<div class="item-card arcana-placeholder" data-search="${searchVal}" title="No Darkana variant">
          <img src="${EMPTY_DARKANA}" alt="No Darkana">
        </div>`;
      } else {
        const display = cur || arcana;
        const isUsed  = !isSel && equippedElsewhere.has(display.name);
        // Arcana/Darkana share one unlock (keyed on the Arcana name in the collection).
        const inaccessible = !arcanaAccessible((arcana || display).name);
        cards += `<div class="item-card${isSel ? ' selected' : ''}${isUsed ? ' consumed' : ''}${inaccessible && !isSel && !isUsed ? ' uncollected' : ''}"
          ${isUsed ? '' : 'data-action="ovl-select-arcana"'} data-arcana="${esc(display.name)}" data-base="${esc(key)}"
          data-search="${searchVal}" title="${esc(display.name)} (${display.type})${isUsed ? ' — already equipped' : inaccessible ? ' — not in your collection' : ''}">
          <img src="${esc(display.icon||EMPTY_ICON)}" alt="${esc(display.name)}" onerror="this.parentElement.classList.add('broken');this.src='${esc(EMPTY_ICON)}'">
        </div>`;
      }
    }

    const rightHTML = sel
      ? `<div class="ovl-right-top">
           ${infoDetailButtonHTML('arcana', sel.name)}
           <div class="detail-icon arcana-card"><img src="${esc(sel.icon||EMPTY_ICON)}" onerror="this.parentElement.classList.add('broken');this.src='${esc(EMPTY_ICON)}'"></div>
           <div class="detail-name">${esc(sel.name)}</div>
           <div class="hi-badge ${sel.type === 'Arcana' ? 'arcana' : 'item'}" style="display:block;text-align:center;margin-bottom:.3rem">${esc(sel.type)}</div>
         </div>
         <div class="ovl-right-body">
           <div class="detail-desc">${esc(sel.description)}</div>
           ${sel.notes ? `<div class="detail-section"><h3>Notes</h3><div class="detail-desc" style="margin-top:.3rem">${esc(sel.notes.slice(0,500))}…</div></div>` : ''}
           ${arcanaAffectsSectionsHTML(sel, 'selector')}
           ${affinitySectionHTML('arcana', sel.name, 'open-affinity-page')}
         </div>`
      : '<div class="ovl-right-top"><div class="detail-desc" style="text-align:center">Select an arcana</div></div><div class="ovl-right-body"></div>';

    return `<div class="overlay-header">
        <h2>Arcana Selection — Slot ${slotIdx+1}</h2>
        <button class="btn btn-icon overlay-close" data-action="ovl-close">✕</button>
      </div>
      <div class="overlay-body">
        <div class="ovl-center-wide">
          <div class="ovl-center-search">${searchBarHTML('Search arcana…')}</div>
          <div class="ovl-center-scroll"><div class="arcana-grid">${cards}</div></div>
        </div>
        <div class="ovl-info">
          <div class="ovl-right">${rightHTML}</div>
        </div>
      </div>
      <div class="overlay-footer">
        <button class="btn btn-back" data-action="ovl-close">Cancel</button>
        <button class="btn btn-confirm" data-action="ovl-confirm">Confirm</button>
      </div>`;
  }

  // ── Stage overlay ────────────────────────────────────

  function openStageOverlay() {
    state.overlay = { type:'stage', playerIdx:0, slotIdx:0, fromEmpty:!state.stage, prevItem:state.stage };
    state.ovl.selected = state.stage;
    buildAndShowOverlay(stageOverlayHTML());
  }

  function stageOverlayHTML() {
    const sel = state.ovl.selected;
    let tiles = '';
    for (const stage of STAGES) {
      const isSel = sel && sel.name === stage.name;
      const icon = stage.icon || EMPTY_ICONS.stage;
      tiles += `<div class="stage-tile${isSel ? ' selected' : ''}" data-action="ovl-select-stage" data-stage="${esc(stage.name)}" title="${esc(stage.name)}">
        <img src="${esc(icon)}" alt="${esc(stage.name)}" onerror="this.src='${EMPTY_ICONS.stage}'">
      </div>`;
    }

    let rightHTML = '';
    if (sel) {
      const stage = STAGES.find(s => s.name === sel.name);
      rightHTML = `<div class="ovl-right-top">
          <div class="stage-detail-img"><img src="${esc(sel.icon || EMPTY_ICONS.stage)}" alt="${esc(sel.name)}" onerror="this.src='${EMPTY_ICONS.stage}'"></div>
          <div class="detail-name">${esc(sel.name)}</div>
        </div>
        <div class="ovl-right-body">
          ${sel.description ? `<div class="detail-desc">${esc(sel.description)}</div>` : ''}
          ${stageItemsHTML(stage, t => `<h3>${esc(t)}</h3>`)}
        </div>`;
    } else {
      rightHTML = '<div class="ovl-right-top"><div class="detail-desc" style="text-align:center">Select a stage</div></div><div class="ovl-right-body"></div>';
    }

    return `<div class="overlay-header">
        <h2>Stage Selection</h2>
        <button class="btn btn-icon overlay-close" data-action="ovl-close">✕</button>
      </div>
      <div class="overlay-body">
        <div class="ovl-center"><div class="ovl-center-scroll"><div class="stage-grid">${tiles}</div></div></div>
        <div class="ovl-info">
          <div class="ovl-right">${rightHTML}</div>
        </div>
      </div>
      <div class="overlay-footer">
        <button class="btn btn-back" data-action="ovl-close">Cancel</button>
        <button class="btn btn-confirm" data-action="ovl-confirm">Confirm</button>
      </div>`;
  }

  // ── Show / rebuild overlay ───────────────────────────

  function searchBarHTML(placeholder) {
    return `<div class="ovl-search-wrap">
      <input type="text" class="ovl-search" placeholder="${esc(placeholder)}" autocomplete="off" spellcheck="false">
      <button class="ovl-search-clear" data-action="ovl-search-clear" tabindex="-1">✕</button>
    </div>`;
  }

  function levelRowHTML(playerIdx, level) {
    const atDefault = level === 1 ? ' data-at-default' : '';
    return `<div class="stats-heading-row">
      <h3 style="margin:0">Stats</h3>
      <div class="level-wrap"${atDefault}>
        <span class="level-prefix">Lv</span>
        <input type="number" class="level-input" value="${level}" min="1" max="999" data-player="${playerIdx}">
        <button class="level-clear" data-action="level-clear" data-player="${playerIdx}" tabindex="-1">✕</button>
      </div>
    </div>`;
  }

  function applyOverlaySearch(input) {
    const query = (input.value || '').toLowerCase().trim();
    const center = input.closest('.ovl-center, .ovl-center-wide');
    if (!center) return;
    center.querySelectorAll('[data-search]').forEach(el => {
      const matches = !query || el.dataset.search.toLowerCase().includes(query);
      el.classList.toggle('search-dim', !matches);
    });
    // Hide section labels whose entire grid is filtered out
    center.querySelectorAll('.item-section-label').forEach(label => {
      let sib = label.nextElementSibling;
      while (sib && !sib.classList.contains('item-grid')) sib = sib.nextElementSibling;
      const hasVisible = sib && sib.querySelector('[data-search]:not(.search-dim)');
      label.classList.toggle('search-dim', !hasVisible);
    });
  }

  function buildAndShowOverlay(inner) {
    const root = document.getElementById('overlay-root');
    root.innerHTML = `<div class="overlay-panel">${inner}</div>`;
    root.classList.remove('hidden');
    markOverlaySelection();
  }

  // Mobile splits the selector overlay into grid (top) + info panels (bottom) — but only once
  // something is selected. This marker on `.overlay-body` drives that split; desktop ignores it
  // (the rules are mobile-only). No-op for overlays without an `.overlay-body` (collection/builds).
  function markOverlaySelection() {
    const body = document.querySelector('#overlay-root .overlay-body');
    if (body) body.classList.toggle('has-selection', !!(state.ovl && state.ovl.selected));
  }

  // ═══════════════════════════════════════════════════════
  //  DETAILED INFO OVERLAY (stacking "encyclopedia" layer)
  // ═══════════════════════════════════════════════════════
  // A separate root (#detail-overlay-root, z-index 200) so it stacks ABOVE selector overlays.
  // Navigates a back/forward page history; each page is an object page (affinity banners) or
  // an affinity page (object-category sections + child-affinity banners for a parent).

  // Category metadata for affinity pages, in display order.
  // `iconOf` chooses which art a category's grid cell shows (defaults to the object's square
  // icon). Characters use their sprite here — it reads better in the list — while still linking
  // to the character page; NO other character-icon reference is affected.
  const DETAIL_CATS = [
    { key: 'arcana',     label: 'Arcana',     type: 'arcana',    empty: EMPTY_ICONS.arcana,  cls: 'arcana',  lookup: arcanaByName },
    { key: 'characters', label: 'Characters', type: 'character', empty: EMPTY_ICONS.char,    cls: 'sprite',  lookup: n => D.characters.find(c => c.name === n) || null },
    { key: 'passives',   label: 'Passives',   type: 'passive',   empty: EMPTY_ICONS.passive, cls: '',        lookup: passiveByName },
    { key: 'weapons',    label: 'Weapons',    type: 'weapon',     empty: EMPTY_ICONS.weapon,  cls: '',        lookup: weaponByName, iconOf: weaponSprite },
  ];
  const DETAIL_KIND_LABEL = { weapon: 'Weapon', passive: 'Passive', character: 'Character', arcana: 'Arcana' };

  function detailObjByType(type, name) {
    if (type === 'weapon')    return weaponByName(name);
    if (type === 'passive')   return passiveByName(name);
    if (type === 'arcana')    return arcanaByName(name);
    if (type === 'character') return D.characters.find(c => c.name === name) || null;
    return null;
  }

  // Push a page (object or affinity). First open seeds the stack; later opens truncate any
  // forward history. `player` (add-to-build target) is only updated when provided.
  function openDetailPage(page, player) {
    if (typeof player === 'number') state.detail.player = player;
    const d = state.detail;
    if (d.idx < 0) { d.stack = [page]; d.idx = 0; }
    else { d.stack = d.stack.slice(0, d.idx + 1); d.stack.push(page); d.idx = d.stack.length - 1; }
    renderDetailOverlay();
    document.getElementById('detail-overlay-root').classList.remove('hidden');
  }
  function detailBack()    { const d = state.detail; if (d.idx > 0) { d.idx--; renderDetailOverlay(); } }
  function detailForward() { const d = state.detail; if (d.idx < d.stack.length - 1) { d.idx++; renderDetailOverlay(); } }
  function closeDetailOverlay() {
    const r = document.getElementById('detail-overlay-root');
    r.classList.add('hidden'); r.innerHTML = '';
    state.detail.stack = []; state.detail.idx = -1; state.detail.appendixQuery = ''; state.detail.appendixTraits = [];
  }
  function renderDetailOverlay() {
    const page = state.detail.stack[state.detail.idx];
    if (!page) { closeDetailOverlay(); return; }
    const inner = page.kind === 'appendix' ? detailAppendixPageHTML()
      : page.kind === 'player' ? detailPlayerPageHTML(page.playerIdx)
      : page.kind === 'affinity' ? detailAffinityPageHTML(page.name, page.also || [])
      : detailObjectPageHTML(page.type, page.name);
    document.getElementById('detail-overlay-root').innerHTML = `<div class="overlay-panel">${inner}</div>`;
    // Restore appendix search (persisted per view) after the innerHTML rebuild.
    const search = document.querySelector('#detail-overlay-root .appendix-search');
    if (search && (state.detail.appendixQuery || state.detail.appendixTraits.length)) {
      search.value = state.detail.appendixQuery; applyAppendixSearch(search);
    }
  }

  // Shared header (back/forward/title/close) + body (left art column + scrolling main) + footer.
  // `headerAdorn` is optional markup placed right after the title (used by trait pages for the
  // "＋ add a condition" combobox).
  function detailChrome(title, leftHTML, mainHTML, footerHTML, headerAdorn = '') {
    const d = state.detail;
    const canBack = d.idx > 0, canFwd = d.idx < d.stack.length - 1;
    return `<div class="overlay-header">
        <div class="detail-head-left">
          <button class="detail-arrow-btn" data-action="detail-back" ${canBack ? '' : 'disabled'} title="Back">◀</button>
          <button class="detail-arrow-btn" data-action="detail-forward" ${canFwd ? '' : 'disabled'} title="Forward">▶</button>
          <h2>${esc(title)}</h2>
          ${headerAdorn}
        </div>
        <button class="btn btn-icon overlay-close" data-action="detail-close" title="Close">✕</button>
      </div>
      <div class="detail-body">
        <div class="detail-left">${leftHTML}</div>
        <div class="detail-main">${mainHTML}</div>
      </div>
      ${footerHTML ? `<div class="overlay-footer">${footerHTML}</div>` : ''}`;
  }

  // Left-column art for an object, per kind (weapon/passive icon · arcana card · char sprite).
  function detailObjArt(type, item) {
    if (type === 'character') return charSpriteHTML(item, true);
    if (type === 'arcana') return `<div class="detail-icon arcana-card"><img src="${esc(item.icon || EMPTY_ICONS.arcana)}" onerror="this.src='${EMPTY_ICONS.arcana}'"></div>`;
    const e = EMPTY_ICONS[type] || EMPTY_ICONS.weapon;
    const art = type === 'weapon' ? weaponSprite(item) : item.icon; // weapons show their sprite
    return `<div class="detail-icon"><img src="${esc(art || e)}" onerror="this.src='${e}'"></div>`;
  }

  // Resolve a bare name to a navigable reference across every dataset (weapon/passive/arcana/
  // character/affinity). Used by starting loadouts + arcana `affects_*` lists, whose names can
  // land in any file. Returns null for unmatched names (source typos, mechanics like "Reroll").
  function resolveRef(name) {
    const w = weaponByName(name);  if (w) return { kind: 'object', type: 'weapon',    name, icon: weaponSprite(w) };
    const p = passiveByName(name); if (p) return { kind: 'object', type: 'passive',   name, icon: p.icon };
    const a = arcanaByName(name);  if (a) return { kind: 'object', type: 'arcana',     name, icon: a.icon, arcana: true };
    const c = D.characters.find(x => x.name === name); if (c) return { kind: 'object', type: 'character', name, icon: charSpriteIcon(c), sprite: true };
    const af = affinityByName(name); if (af) return { kind: 'affinity', name, icon: af.icon };
    return null;
  }
  // A compact navigable icon for a resolved ref (affinity → its page, object → its page).
  function refNavIcon(ref) {
    const attrs = ref.kind === 'affinity'
      ? `data-action="nav-affinity" data-affinity="${esc(ref.name)}"`
      : `data-action="nav-object" data-detail-type="${ref.type}" data-detail-name="${esc(ref.name)}"`;
    const cls = 'ref-nav-icon' + (ref.sprite ? ' sprite' : ref.arcana ? ' arcana' : '');
    return `<span class="${cls}" ${attrs} title="${esc(ref.name)}"><img src="${esc(ref.icon || '')}" loading="lazy" onerror="this.style.visibility='hidden'"></span>`;
  }
  function resolveRefs(names) { return (names || []).map(resolveRef).filter(Boolean); }
  // A grid of ref icons from already-resolved refs. Unmatched names are dropped upstream by
  // resolveRefs (a handful of source typos + mechanics like Reroll/Skip/Banish have no page).
  function refIconsGridHTML(refs) {
    return `<div class="ref-icon-grid">${refs.map(refNavIcon).join('')}</div>`;
  }
  // Open the detail page for a resolved ref (shared by evo-node clicks).
  function openRef(ref, player) {
    if (!ref) return;
    if (ref.kind === 'affinity') openDetailPage({ kind: 'affinity', name: ref.name }, player);
    else openDetailPage({ kind: 'object', type: ref.type, name: ref.name }, player);
  }

  // Character starting loadout as a navigable icon grid (weapons + passives mixed, plus any
  // starting arcana). For the detail overlay's main column.
  function detailStartingLoadoutHTML(char) {
    const names = [...(char.starting_weapons || [])];
    // starting_arcana is usually one name, but Chaos legitimately starts with all 21 Arcana
    // (I–XXI, no Game Killer/Darkana) stored pipe-joined — split so each resolves to its icon.
    if (char.starting_arcana) names.push(...char.starting_arcana.split('|').map(s => s.trim()).filter(Boolean));
    const refs = resolveRefs(names);
    if (!refs.length) return '';
    return `<details class="detail-cat" open><summary class="detail-cat-label">Starting Loadout</summary>${refIconsGridHTML(refs)}</details>`;
  }

  // Arcana `affects_explicit` as a navigable icon list — a single UNLABELED list (the implicit
  // column was removed; those associations are handled via shared traits). `context` picks the
  // wrapper for spacing: 'overlay' → detail-cat; 'selector' → info-panel section.
  function arcanaAffectsSectionsHTML(a, context) {
    const refs = resolveRefs(a.affects_explicit);
    if (!refs.length) return '';
    return `<div class="${context === 'overlay' ? 'detail-cat' : 'detail-section'}">${refIconsGridHTML(refs)}</div>`;
  }

  // The Arcana associated with a weapon (its `arcana` column) → navigable arcana card icons.
  // On the weapon detail page, between the evo path and the affinity list.
  function weaponArcanaSectionHTML(weapon) {
    const refs = resolveRefs(weapon.arcana || []);
    if (!refs.length) return '';
    return `<details class="detail-cat" open><summary class="detail-cat-label">Arcana <span style="color:var(--text-dim);font-size:.75rem">(${refs.length})</span></summary>${refIconsGridHTML(refs)}</details>`;
  }

  // Object page: affinity banners as headers, each with the object's blurb below (blurb empty
  // until the per-object info column lands). Type-specific content sits around the banners:
  // character → starting loadout above; weapon → evo path above; passive → evo paths below
  // (they're long); arcana → affects lists above. Footer has "Add to build".
  function detailObjectPageHTML(type, name) {
    const item = detailObjByType(type, name);
    if (!item) return detailChrome(name, '', `<div class="detail-empty">“${esc(name)}” not found.</div>`, '');
    // A collapsible-base character shows its clean base name (variants are interchangeable),
    // so a page reached from the deduped list reads as the character, not a weapon loadout.
    const displayName = (type === 'character' && charVariantInfo().collapsible.has(item.base_name))
      ? item.base_name : item.name;
    const left = `<div class="detail-kicker">${DETAIL_KIND_LABEL[type] || ''}</div>
      ${detailObjArt(type, item)}
      <div class="detail-name">${esc(displayName)}</div>
      ${descBlurbHTML(item)}`;

    const { primary, rest, conflict, arcanaGroups } = objectAffinityGroups(type, name);
    const renderAff = aff => {
      const entries = affinityObjEntries(aff.name, name);
      return `<div class="detail-obj-affinity">
        <div class="detail-banner-header">${affinityBanner(aff, 'nav-affinity')}</div>
        ${entries.map(e => infoEntryHTML(e, false)).join('')}
      </div>`;
    };
    const arcanaBoxes = arcanaGroups.map(g => arcanaBoxHTML(g, 'nav-object', renderAff)).join('');
    const bannersHTML = (primary.length ? `<div class="primary-traits">${primary.map(renderAff).join('')}</div>` : '')
      + arcanaBoxes
      + (rest.length ? `<div class="primary-traits trait-ghost">${rest.map(renderAff).join('')}</div>` : '')
      + (conflict.length ? `<div class="primary-traits conflict-traits">${conflict.map(renderAff).join('')}</div>` : '');

    let pre = '', post = '';
    if (type === 'character')    pre  = detailStartingLoadoutHTML(item);
