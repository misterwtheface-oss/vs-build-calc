  function renderLanding() {
    const tiles = [1,2,3,4].map(n => {
      const counts = SLOT_COUNTS[n];
      const icons = Array.from({length: n}, (_, i) =>
        `<img class="player-icon" src="assets/icons/ui/player_${i+1}.png" alt="Player ${i+1}">`
      ).join('');
      return `<button class="player-tile-btn" data-action="set-player-count" data-count="${n}">
        <div class="count-icons">${icons}</div>
        <div class="tile-label">${n} Player${n > 1 ? 's' : ''}</div>
      </button>`;
    }).join('');

    document.getElementById('app').innerHTML = `
      <div id="landing">
        <div class="landing-banner">
          <h1>Vampire Survivors<br>Build Calculator</h1>
          <p>Select number of players to begin</p>
        </div>
        <div class="landing-grid">${tiles}</div>
      </div>`;
  }

  // ═══════════════════════════════════════════════════════
  //  PLANNING PAGE
  // ═══════════════════════════════════════════════════════

  // Character sprite thumbnail with a tiered fallback that steps through each candidate
  // on load error. animated=true → animated gif first, else static png sprite first;
  // both then fall back to the grid icon and finally the empty silhouette. The
  // char-sprite container uses object-fit: contain so no aspect ratio is ever clipped.
  function charSpriteHTML(item, animated = true) {
    const empty = EMPTY_ICONS.char;
    const order = animated
      ? [item.sprite_gif, item.sprite_static, item.icon, empty]
      : [item.sprite_static, item.sprite_gif, item.icon, empty];
    const chain = [...new Set(order.filter(Boolean))];
    const primary = esc(chain[0] || empty);
    const fbs = chain.slice(1).map(esc).join('|');
    return `<div class="detail-icon char-sprite"><img src="${primary}" data-fbs="${fbs}" onerror="var f=(this.dataset.fbs||'').split('|').filter(Boolean);if(f.length){this.src=f.shift();this.dataset.fbs=f.join('|');}else{this.onerror=null;}"></div>`;
  }

  // "Starting Loadout" section for a character: starting weapons AND passives
  // (passives live inside starting_weapons, e.g. Empty Tome), plus the character's
  // extra starting arcana. Shared by the char selector and the planner info panel.
  function startingLoadoutHTML(char) {
    if (!char) return '';
    const items = char.starting_weapons ?? [];
    if (!items.length && !char.starting_arcana) return '';
    let row = '';
    for (const wn of items) {
      const obj = weaponByName(wn) || passiveByName(wn);
      const isHidden = char.hidden_items?.includes(wn);
      const isMax    = char.max_items?.includes(wn);
      const badge = isMax ? '<span class="sw-badge sw-max">MAX</span>'
                  : isHidden ? '<span class="sw-badge sw-hidden">HID</span>' : '';
      const suffix = isHidden ? ' (Hidden)' : isMax ? ' (Max)' : '';
      row += `<div class="req-icon${isHidden ? ' sw-is-hidden' : ''}" title="${esc(wn)}${suffix}">${
        obj ? `<img src="${esc(obj.icon||EMPTY_ICONS.weapon)}" onerror="this.src='${EMPTY_ICONS.weapon}'">${badge}`
            : `<span style="font-size:.55rem">${esc(wn.slice(0,6))}</span>`}</div>`;
    }
    if (char.starting_arcana) {
      const a = arcanaByName(char.starting_arcana);
      row += `<div class="req-icon sw-arcana-icon" title="${esc(char.starting_arcana)} (Starting Arcana — extra)">${
        a ? `<img src="${esc(a.icon||EMPTY_ICONS.arcana)}" onerror="this.src='${EMPTY_ICONS.arcana}'"><span class="sw-badge sw-arcana">ARC</span>`
          : `<span style="font-size:.55rem">${esc(char.starting_arcana.slice(0,6))}</span>`}</div>`;
    }
    return `<div class="detail-section"><span class="detail-section-label">Starting Loadout</span><div class="req-row">${row}</div></div>`;
  }

  function buildInfoSidebar(panel) {
    if (!panel) {
      return `<div class="info-sidebar">
        <div class="sidebar-body"><div class="info-sidebar-empty">Left-click a slot<br>to see details<br><br>Right-click to change</div></div>
      </div>`;
    }
    const { type, playerIdx, slotIdx, hiddenName, refName } = panel;
    const player = state.players[playerIdx];

    let item = null;
    if (type === 'char')    item = player?.character;
    else if (type === 'weapon')  {
      item = hiddenName ? weaponByName(hiddenName) : player?.weapons[slotIdx];
    }
    else if (type === 'passive') item = refName ? passiveByName(refName) : player?.passives[slotIdx];
    else if (type === 'arcana')  item = refName ? arcanaByName(refName) : state.arcana[slotIdx];
    else if (type === 'stage')   item = state.stage;

    if (!item) return `<div class="info-sidebar"><div class="sidebar-body"><div class="info-sidebar-empty">Empty slot</div></div></div>`;

    const emptyIcon = EMPTY_ICONS[type] || EMPTY_ICONS.weapon;
    let top;
    if (type === 'char') {
      top = charSpriteHTML(item, true); // animated gif first
    } else if (type === 'stage') {
      // Landscape stage art — fit to its aspect instead of the square cover box (which clips).
      const icon = item.icon || emptyIcon;
      top = `<div class="stage-detail-img"><img src="${esc(icon)}" onerror="this.src='${emptyIcon}'"></div>`;
    } else {
      const icon = item.icon || emptyIcon;
      const iconClass = type === 'arcana' ? 'detail-icon arcana-card' : 'detail-icon';
      top = `<div class="${iconClass}"><img src="${esc(icon)}" onerror="this.src='${emptyIcon}'"></div>`;
    }
    top += `<div class="detail-name">${esc(item.name)}</div>`;
    if (item.description) top += `<div class="detail-desc">${esc(item.description)}</div>`;
    let html = '';

    if (type === 'char') {
      html += startingLoadoutHTML(item);
      const charLevel = player?.charLevel ?? 1;
      html += levelRowHTML(playerIdx, charLevel);
      html += statsHTML(item, player, charLevel);
    }

    if (type === 'weapon') {
      const wObj = D.weapons.find(w => w.name === item.name);
      if (wObj) html += buildEvoChainHTML(wObj);

      // Stage controls — only for real slots, not hidden weapon views
      if (wObj && slotIdx >= 0) {
        const player = state.players[playerIdx];
        const nextW  = wObj.trans_result ? weaponByName(wObj.trans_result) : null;
        // bases: weapons whose evo/union produces the current weapon (what we can devolve to)
        const bases  = D.weapons.filter(b => b.trans_result === wObj.name);

        if (nextW || bases.length > 0) {
          let stageInner = '';

          // ── Advance (Evolve / Union / Gift / …) ────────────
          if (nextW && wObj.method) {
            const methodStr = wObj.method;
            const label     = methodStr === 'Evolution' ? 'Evolve' : methodStr;
            let ready = false, missingText = '', dataAction, extraAttrs = '';

            if (methodStr === 'Union') {
              const allInputs  = D.weapons.filter(b => b.trans_result === wObj.trans_result && b.method === 'Union');
              const others     = allInputs.filter(u => u.name !== wObj.name);
              const otherPairs = others.map(u => ({
                name: u.name,
                slot: player.weapons.findIndex(w => w && w.name === u.name),
              }));
              const missingWeapons  = otherPairs.filter(p => p.slot < 0).map(p => p.name);
              // A union can ALSO require a passive (Phieraggi needs Tirajisú); enforce it.
              const missingPassives = missingPassiveReqs(wObj, player);
              const missing = [...missingWeapons, ...missingPassives];
              ready = missing.length === 0;
              missingText = missing.length ? `Missing: ${missing.map(esc).join(', ')}` : '';
              const inputSlots = [slotIdx, ...otherPairs.filter(p => p.slot >= 0).map(p => p.slot)];
              dataAction = 'perform-union';
              extraAttrs = `data-input-slots="${inputSlots.join(',')}"`;
            } else {
              const missing = missingPassiveReqs(wObj, player);
              ready = missing.length === 0;
              missingText = missing.length ? `Missing: ${missing.map(n => esc(n)).join(', ')}` : '';
              dataAction = 'perform-evolve';
            }

            const labelColor = ready ? 'color:var(--can-evolve)' : '';
            stageInner += `<div class="req-row" style="align-items:center;gap:.5rem;margin-bottom:.3rem">
              <div class="req-icon" title="${esc(nextW.name)}"><img src="${esc(nextW.icon||EMPTY_ICONS.weapon)}" onerror="this.src='${EMPTY_ICONS.weapon}'"></div>
              <span style="font-size:.75rem;${labelColor}">${esc(nextW.name)}${ready ? ' — Ready' : ''}</span>
            </div>
            <button class="btn btn-sm btn-stage" ${ready ? '' : 'disabled'}
                    data-action="${dataAction}"
                    data-player="${playerIdx}"
                    data-slot="${slotIdx}"
                    data-result="${esc(nextW.name)}"
                    ${extraAttrs}>${esc(label)} →</button>
            ${missingText ? `<div class="stage-missing">${missingText}</div>` : ''}`;
          }

          // ── Devolve ─────────────────────────────────────────
          if (bases.length > 0) {
            const primaryBase = bases[0];
            const devolveLabel = bases.length === 1
              ? `← ${esc(primaryBase.name)}`
              : '← Devolve';
            stageInner += `<button class="btn btn-sm btn-devolve"
                    data-action="perform-devolve"
                    data-player="${playerIdx}"
                    data-slot="${slotIdx}">${devolveLabel}</button>`;
          }

          html += `<div class="detail-section">
            <span class="detail-section-label">Stage</span>
            ${stageInner}
          </div>`;
        }
      }
    }

    if (type === 'passive') {
      html += buildPassiveEvoHTML(item.name, playerIdx);
    }

    if (type === 'arcana') {
      const aObj = D.arcana.find(a => a.name === item.name);
      if (aObj) html += `<div class="hi-badge ${aObj.type === 'Arcana' ? 'arcana' : 'item'}" style="text-align:center;margin:.4rem 0">${esc(aObj.type)}</div>`;
    }

    if (type === 'stage') {
      html += stageItemsHTML(item, t => `<span class="detail-section-label">${esc(t)}</span>`);
    }

    return `<div class="info-sidebar"><div class="sidebar-top">${top}</div><div class="sidebar-body">${html}</div></div>`;
  }

  function renderPlanning() {
    const { playerCount, players, infoPanel } = state;
    const counts = SLOT_COUNTS[playerCount];
    // Normalize Weapon Power-Up invariants for every weapon-mutation path (remove,
    // devolve, union, character change) — idempotent, so a per-render sweep is safe.
    players.forEach(syncExtraPassives);

    const playerCards = players.map((player, idx) => {
      const char = player.character;

      // ── Character slot
      const charSlot = slotHTML(char, { type:'char', playerIdx:idx, slotIdx:0, removable: !!char });

      // ── Weapon slots
      // Weapons listed in hidden_items start in hidden slots, not regular slots.
      // Passive-type starters (e.g. Empty Tome) are handled in the passive slots below.
      const hiddenItemSet = new Set(char?.hidden_items ?? []);
      const normalStarters = starterWeaponNames(char);
      const hiddenStarters = char
        ? char.starting_weapons.filter(wn => hiddenItemSet.has(wn) && !isPassiveName(wn))
        : [];
      const starterCount = char ? Math.min(normalStarters.length, counts.weapons) : 0;
      const starterLineages = normalStarters.slice(0, starterCount).map(wn => weaponLineage(wn));
      const wSlots = Array.from({length: counts.weapons}, (_, si) => {
        const base = player.weapons[si] || null;
        // Locked only if the weapon belongs to this slot's starter lineage (starter → evo → union result).
        // Empty slots and weapons from outside the lineage are not locked.
        const isLocked = si < starterCount && !!base && (starterLineages[si]?.has(base.name) ?? false);
        return slotHTML(base, { type:'weapon', playerIdx:idx, slotIdx:si, locked:isLocked });
      }).join('');

      // ── Hidden weapons (hidden starters + char overflow + counterparts unlocked by Gemini)
      const occupied = new Set(player.weapons.filter(Boolean).map(w => w.name));
      const charOverflow = char
        ? normalStarters.slice(counts.weapons).filter(wn => !occupied.has(wn))
        : [];
      const counterparts = getHiddenCounterparts(idx);
      // Hidden weapons spawned by equipped passives (slots + extra bar), e.g. each Mini
      // passive adds a hidden weapon. Derived from present passives, so removing the
      // passive (or consuming a Mini on evolve) removes its hidden weapon automatically.
      const passiveHidden = [];
      [...player.passives.filter(Boolean), ...(player.extraPassives || []).map(passiveByName).filter(Boolean)]
        .forEach(pv => (pv.grants || []).forEach(g => {
          if (g.op === 'add_hidden' && g.kind === 'weapon') {
            for (let i = 0; i < (g.amount || 1); i++) passiveHidden.push(g.name);
          }
        }));
      const allHidden = [...new Set([
        ...hiddenStarters.filter(wn => !occupied.has(wn)),
        ...charOverflow,
        ...counterparts,
        ...passiveHidden,
      ])];
      // Hidden/extra weapons get their own conditional row (between Weapons and
      // Passives) so they never push the Weapons row rightward / overflow.
      const hiddenWeaponRow = hiddenSlotRow(allHidden, 'weapon', idx);

      // ── Passive slots
      // Starter passives lock into the front slots, mirroring starter weapons.
      // Passives have no evo lineage, so a slot is locked purely by name match.
      const starterPassives = starterPassiveNames(char);
      const passiveStarterCount = char ? Math.min(starterPassives.length, counts.passives) : 0;
      const pSlots = Array.from({length: counts.passives}, (_, si) => {
        const base = player.passives[si] || null;
        const isLocked = si < passiveStarterCount && !!base && base.name === starterPassives[si];
        return slotHTML(base, { type:'passive', playerIdx:idx, slotIdx:si, locked:isLocked });
      }).join('');

      // Hidden/extra passives — instances that don't occupy a core slot. Identical
      // instances collapse to ONE icon with an ×N badge to save space; the × removes a
      // single instance (which may devolve a bound OG weapon). Consumable passives (Mini)
      // are weapon-bound (auto consumed/restored on evolve/devolve), so they show no ×.
      const extraCounts = {};
      (player.extraPassives || []).forEach(nm => { extraCounts[nm] = (extraCounts[nm] || 0) + 1; });
      const hiddenPassiveRow = Object.keys(extraCounts).length
        ? `<div class="slot-row slot-row-hidden">${Object.entries(extraCounts).map(([nm, count]) => {
            const p = passiveByName(nm);
            const icon = p ? (p.icon || EMPTY_ICONS.passive) : EMPTY_ICONS.passive;
            const badge = count > 1 ? `<span class="dupe-badge">×${count}</span>` : '';
            const removeBtn = isConsumableExtra(nm) ? ''
              : `<button class="slot-remove" data-action="remove-extra-passive" data-player="${idx}" data-extra-name="${esc(nm)}" title="Remove one">×</button>`;
            return `<div class="slot slot-extra" data-action="view-extra-passive" data-player="${idx}" data-extra-name="${esc(nm)}" data-type="passive" title="${esc(nm)} (extra ×${count})">
              <img src="${esc(icon)}" alt="${esc(nm)}" onerror="this.src='${EMPTY_ICONS.passive}'">
              ${badge}
              ${removeBtn}
            </div>`;
          }).join('')}</div>`
        : '';

      return `<div class="player-card">
        <div class="player-header">
          <div class="player-header-left">
            <span class="player-name">Player ${idx+1}</span>
            ${char ? `<span class="char-name">— ${esc(char.name)}</span>` : ''}
          </div>
          <div class="player-header-actions">
            <button class="btn btn-sm" data-action="clear-player" data-player="${idx}" title="Clear all">✕ Clear</button>
          </div>
        </div>
        <div class="player-body">
          <div class="char-col">${charSlot}</div>
          <div class="slots-col">
            <div class="slot-row">${wSlots}</div>
            ${hiddenWeaponRow}
            <div class="slot-row">${pSlots}</div>
            ${hiddenPassiveRow}
          </div>
        </div>
      </div>`;
    }).join('');

    // ── Global arcana + stage row
    const gASlots = state.arcana.map((arc, si) =>
      slotHTML(arc, { type:'arcana', playerIdx:0, slotIdx:si })
    ).join('');
    // Extra (character starting) arcana: locked, view-only, don't count toward the 3.
    const gExtraArcana = extraArcanaNames().map(nm =>
      slotHTML(arcanaByName(nm), { type:'arcana', playerIdx:0, slotIdx:-1, locked:true, removable:false, infoName:nm })
    ).join('');
    const gExtraArcanaRow = gExtraArcana
      ? `<span class="arcana-extra-divider" title="Starting arcana (extra)"></span>${gExtraArcana}`
      : '';
    const gStageSlot = slotHTML(state.stage ? { name:state.stage.name, icon:state.stage.icon } : null,
      { type:'stage', playerIdx:0, slotIdx:0 });

    // Preserve the player-list scroll position across every re-render. With the
    // single-column layout, stacked tiles (3-4 players) make `.planning-main`
    // scroll; clicking any icon rebuilds `#app`, so without this the list jumps
    // back to the top. Mirrors the overlay-scroll handling in refreshOverlay.
    const prevMain = document.querySelector('.planning-main');
    const prevScroll = prevMain ? prevMain.scrollTop : 0;

    document.getElementById('app').innerHTML = `
      <div id="planning">
        <div class="planning-header">
          <h1>Vampire Survivors Build Calculator</h1>
          <div class="planning-header-actions">
            <button class="btn" data-action="open-power-ups">Power-Ups</button>
            <button class="btn" data-action="open-seal">Seal Advisor</button>
            <button class="btn btn-back" data-action="change-player-count">⟵ Change Player Count</button>
          </div>
        </div>
        <div class="planning-body">
          <div class="planning-main">
            <div class="global-row">
              <div class="global-row-inner">
                <span class="slot-row-label">Arcana</span>
                ${gASlots}
                ${gExtraArcanaRow}
                <div style="flex:1"></div>
                <span class="slot-row-label" style="width:auto;margin-right:.3rem">Stage</span>
                ${gStageSlot}
              </div>
            </div>
            <div class="players-grid p${playerCount}">${playerCards}</div>
          </div>
          ${buildInfoSidebar(state.infoPanel)}
        </div>
      </div>`;

    const newMain = document.querySelector('.planning-main');
    if (newMain) newMain.scrollTop = prevScroll;
  }

  // ═══════════════════════════════════════════════════════
  //  RENDER (router)
  // ═══════════════════════════════════════════════════════

  function render() {
    if (state.page === 'landing') renderLanding();
    else renderPlanning();
  }

  // ═══════════════════════════════════════════════════════
  //  OVERLAYS
  // ═══════════════════════════════════════════════════════

  // ── Character overlay ────────────────────────────────

  function openCharacterOverlay(playerIdx) {
    const player = state.players[playerIdx];
    state.overlay = { type:'char', playerIdx, fromEmpty: !player.character, prevItem: player.character };
    state.ovl.selected = player.character;
    buildAndShowOverlay(charOverlayHTML(playerIdx));
  }

  function charOverlayHTML(playerIdx) {
    const groups = charGroups();
    const sel = state.ovl.selected;

    // Base names already chosen by other players — dim these in the grid.
    const takenBaseNames = new Set(
      state.players
        .filter((_, i) => i !== playerIdx)
        .map(p => p.character?.base_name)
        .filter(Boolean)
    );

    let cards = '';
    for (const group of groups) {
      const vi  = (state.ovl.variantIdx[group[0].base_name] ?? 0) % group.length;
      const cur = group[vi];
      const isSelected = sel && group.some(c => c.name === sel.name);
      const isTaken    = takenBaseNames.has(group[0].base_name);
      const hasVariants = group.length > 1;
      const searchVal = esc(group.map(c => c.name).join('|'));
      if (hasVariants) {
        cards += `<div class="stack-wrapper${isTaken ? ' dim' : ''}" data-search="${searchVal}">
          <div class="char-card stacked${isSelected ? ' selected' : ''}" data-action="ovl-select-char" data-char="${esc(cur.name)}" data-base="${esc(group[0].base_name)}">
            <img src="${esc(cur.icon||EMPTY_ICONS.char)}" alt="${esc(cur.name)}" onerror="this.src='${EMPTY_ICONS.char}'">
            <div class="variant-count">${vi+1}/${group.length}</div>
          </div>
          <div class="stack-nav">
            <div class="stack-btn" data-action="cycle-char-variant" data-base="${esc(group[0].base_name)}" data-dir="-1">‹</div>
            <div class="stack-btn" data-action="cycle-char-variant" data-base="${esc(group[0].base_name)}" data-dir="1">›</div>
          </div>
        </div>`;
      } else {
        cards += `<div class="char-card${isSelected ? ' selected' : ''}${isTaken ? ' dim' : ''}" data-action="ovl-select-char" data-char="${esc(cur.name)}" data-base="${esc(group[0].base_name)}" data-search="${searchVal}">
          <img src="${esc(cur.icon||EMPTY_ICONS.char)}" alt="${esc(cur.name)}" onerror="this.src='${EMPTY_ICONS.char}'">
        </div>`;
      }
    }

    const charLevel = state.players[playerIdx]?.charLevel ?? 1;
    const left = `${levelRowHTML(playerIdx, charLevel)}${statsHTML(sel, null, charLevel)}`;
    const rightTop = sel
      ? `${charSpriteHTML(sel, false)}
         <div class="detail-name">${esc(sel.name)}</div>`
      : `<div class="detail-desc" style="text-align:center">Select a character</div>`;
    let rightBody = '';
    if (sel) {
      if (sel.description) rightBody += `<div class="detail-desc">${esc(sel.description)}</div>`;
      rightBody += startingLoadoutHTML(sel);
      if (sel.notes) rightBody += `<div class="detail-section"><h3>Notes</h3><div class="detail-desc" style="margin-top:.3rem">${esc(sel.notes).slice(0,400)}…</div></div>`;
    }

    return `<div class="overlay-header">
        <h2>Character Selection</h2>
        <button class="btn btn-icon overlay-close" data-action="ovl-close">✕</button>
      </div>
      <div class="overlay-body">
        <div class="ovl-left">${left}</div>
        <div class="ovl-center">
          <div class="ovl-center-search">${searchBarHTML('Search characters…')}</div>
          <div class="ovl-center-scroll"><div class="char-grid">${cards}</div></div>
        </div>
        <div class="ovl-right">
          <div class="ovl-right-top">${rightTop}</div>
          <div class="ovl-right-body">${rightBody}</div>
        </div>
      </div>
      <div class="overlay-footer">
        <button class="btn btn-back" data-action="ovl-close">Cancel</button>
        <button class="btn btn-confirm" data-action="ovl-confirm">Confirm</button>
      </div>`;
  }

  // ── Item overlay ─────────────────────────────────────

  function openWeaponOverlay(playerIdx, slotIdx) {
    const player = state.players[playerIdx];
    const char = player.character;
    const hiddenSet = new Set(char?.hidden_items ?? []);
    const counts = SLOT_COUNTS[state.playerCount];
    const starterCount = char
      ? Math.min(char.starting_weapons.filter(w => !hiddenSet.has(w)).length, counts.weapons)
      : 0;
    // Locked-evo mode: clicking a locked starter slot opens a filtered selector
    // showing only that weapon's future evo forms, no other weapons.
    const isLockedEvo = slotIdx < starterCount && !!player.weapons[slotIdx];
    const prev = player.weapons[slotIdx];
    state.overlay = { type:'item', playerIdx, slotIdx, slotType:'weapon',
      fromEmpty: isLockedEvo || !prev, prevItem: prev, isLockedEvo };
    state.ovl.selected = isLockedEvo ? null : prev;
    buildAndShowOverlay(weaponOverlayHTML(playerIdx, slotIdx));
  }

  function openPassiveOverlay(playerIdx, slotIdx) {
    const player = state.players[playerIdx];
    const prev = player.passives[slotIdx];
    // Locked starter-passive slot — view-only (passives have no evo lineage to swap to).
    const counts = SLOT_COUNTS[state.playerCount];
    const starterPassives = starterPassiveNames(player.character);
    const passiveStarterCount = Math.min(starterPassives.length, counts.passives);
    if (slotIdx < passiveStarterCount && prev && prev.name === starterPassives[slotIdx]) return;
    state.overlay = { type:'item', playerIdx, slotIdx, slotType:'passive', fromEmpty: !prev, prevItem: prev };
    state.ovl.selected = prev;
    buildAndShowOverlay(passiveOverlayHTML(playerIdx, slotIdx));
  }

  function weaponOverlayHTML(playerIdx, slotIdx) {
    const player = state.players[playerIdx];
    const sel    = state.ovl.selected;
    const isLockedEvo = !!state.overlay?.isLockedEvo;

    // ── Locked-evo mode: only show future forms of the starter weapon ──────
    // ── Normal mode: block evo-descendants of locked starters ──────────────
    const char = player.character;
    const hiddenSet = new Set(char?.hidden_items ?? []);
    const counts = SLOT_COUNTS[state.playerCount];
    const starterCount = char
      ? Math.min(char.starting_weapons.filter(w => !hiddenSet.has(w)).length, counts.weapons)
      : 0;

    let evoOnlySet = null; // non-null → locked-evo mode, show only these weapons
    if (isLockedEvo && player.weapons[slotIdx]) {
      evoOnlySet = collectDescendants(player.weapons[slotIdx].name);
      evoOnlySet.delete(player.weapons[slotIdx].name); // don't show the current form itself
    }

    const usedWeapons = new Set(player.weapons.filter((w, i) => w && i !== slotIdx).map(w => w.name));
    const consumedWeapons = getConsumedWeapons(playerIdx, slotIdx);
    if (!isLockedEvo) {
      // Block the LINEAR (non-union) evo descendants of other locked starters — those
      // must be selected via the locked slot. Union results are left selectable here so
      // a union partner in an unlocked slot can still form the final (it collapses onto
      // the locked slot in closeOverlay).
      for (let i = 0; i < starterCount; i++) {
        if (i === slotIdx) continue;
        const sw = player.weapons[i];
        if (sw) collectLinearDescendants(sw.name).forEach(name => consumedWeapons.add(name));
      }
    }

    // Banish layout order for sorting
    const banishOrder = new Map();
    D.banishLayout.forEach((name, i) => { if (name) banishOrder.set(name, i); });

    // Reverse map: evolution name → base weapon name
    const baseByEvo = new Map();
    D.weapons.forEach(w => { if (w.trans_result) baseByEvo.set(w.trans_result, w.name); });

    function weaponSortKey(w) {
      const base = baseByEvo.get(w.name) ?? w.name;
      return banishOrder.get(base) ?? banishOrder.get(w.name) ?? 9999;
    }

    // Locked-evo mode shows the FULL list; non-lineage weapons are dimmed in makeCard
    // (evoOnlySet still marks the clickable lineage forms).
    // Exclude the 'Special' category — pickups/consumables (Experience Gem, Gold Coin,
    // Rosary, Grenade, Floor Chicken…) that are never a level-up weapon CHOICE. They
    // never evolve and never appear in an evo lineage, so hiding them from the grid is
    // safe; the few characters that START with one still get it auto-placed (locked),
    // independent of this list. ('-' / Chaos weapons are left in — separate backlog.)
    const weaponFilter = w => w.category !== 'Special';
    const baseWeapons = D.weapons.filter(w => w.category === 'Base' && weaponFilter(w))
      .slice().sort((a, b) => weaponSortKey(a) - weaponSortKey(b));

    // Group non-base by category, each group sorted by base weapon order
    const evoGroups = new Map();
    D.weapons.filter(w => w.category !== 'Base' && weaponFilter(w)).forEach(w => {
      if (!evoGroups.has(w.category)) evoGroups.set(w.category, []);
      evoGroups.get(w.category).push(w);
    });
    for (const arr of evoGroups.values()) arr.sort((a, b) => weaponSortKey(a) - weaponSortKey(b));

    function makeCard(w) {
      const isSel      = sel && sel.name === w.name;
      // Locked-evo mode: only this starter's future forms (evoOnlySet) stay clickable;
      // every other weapon is dimmed. Normal mode uses used/consumed styling instead.
      const isOffLineage = isLockedEvo && !(evoOnlySet && evoOnlySet.has(w.name));
      const isUsed     = !isLockedEvo && usedWeapons.has(w.name);
      const isConsumed = !isLockedEvo && !isSel && !isUsed && consumedWeapons.has(w.name);
      let cls = 'item-card';
      if (isSel) cls += ' selected';
      if (isUsed || isOffLineage) cls += ' dim';
      else if (isConsumed) cls += ' consumed';
      const title = isConsumed
        ? `${w.name} — consumed in another evo chain`
        : w.name;
      return `<div class="${cls}" data-action="ovl-select-item" data-item="${esc(w.name)}" data-item-type="weapon" data-search="${esc(w.name)}" title="${esc(title)}">
        <img src="${esc(w.icon||EMPTY_ICON)}" alt="${esc(w.name)}" onerror="this.parentElement.classList.add('broken');this.src='${esc(EMPTY_ICON)}'">
      </div>`;
    }

    let centerGrid = '';
    if (baseWeapons.length) {
      centerGrid += `<div class="item-section-label">Base Weapons</div>
        <div class="item-grid">${baseWeapons.map(makeCard).join('')}</div>`;
    }
    for (const [cat, weapons] of evoGroups) {
      centerGrid += `<div class="item-section-label"${centerGrid ? ' style="margin-top:.75rem"' : ''}>${esc(cat)}</div>
        <div class="item-grid">${weapons.map(makeCard).join('')}</div>`;
    }
    const centerHTML = `<div class="ovl-center-search">${searchBarHTML('Search weapons…')}</div><div class="ovl-center-scroll">${centerGrid}</div>`;

    // Left panel: description + level ups for selected weapon
    let leftHTML = '<div class="detail-desc" style="margin-top:.5rem;color:var(--text-muted)">Select a weapon to see details</div>';
    let rightHTML = '';

    if (sel) {
      const w = D.weapons.find(w => w.name === sel.name);
      if (w) {
        leftHTML = `<div class="detail-desc" style="margin:.2rem 0">${esc(w.description)}</div>
          ${w.level_ups.length ? `<div class="detail-section"><h3>Level Ups</h3><ul style="padding-left:1.1rem;margin:.3rem 0">
            ${w.level_ups.map((l,i) => `<li style="font-size:.75rem;margin-bottom:.15rem">Lv${i+1}: ${esc(l)}</li>`).join('')}
          </ul></div>` : ''}`;

        // Requirements with status
        let reqHTML = '';
        if (w.requirements.length) {
          const { pending, missing } = getEvolutionPassiveStatus(w, playerIdx);
          const pendingNames = new Set(pending.map(p => p.name));
          const hasError    = missing.length > 0;
          const effectiveAutoAdd = state.ovl.autoAdd ?? (pending.length > 0);
          const toggleHTML = pending.length > 0 ? (() => {
            const cls = `auto-add-toggle${effectiveAutoAdd ? ' checked' : ''}${hasError && !effectiveAutoAdd ? ' error' : ''}`;
            const check = effectiveAutoAdd ? '✓' : '';
            const warn  = hasError ? `<span class="auto-add-warn">${missing.length} won't fit</span>` : '';
            return `<div class="${cls}" data-action="toggle-auto-add">
              <span class="auto-add-box">${check}</span>
              <span>Auto-add ${pending.length} passive${pending.length > 1 ? 's' : ''}</span>
              ${warn}
            </div>`;
          })() : '';
          reqHTML = `<div class="detail-section"><h3>Requirements</h3>
            ${w.requirements.map(r => {
              const pObj = passiveByName(r);
              const wObj2 = weaponByName(r);
              const obj = pObj || wObj2;
              const icon = obj ? obj.icon : '';
              let statusHTML = '';
              if (pObj) {
                if (isExtraPassive(r))
                  statusHTML = extraCount(player, r) > 0
                    ? '<span class="req-status ok">✓ Extra bar</span>'
                    : '<span class="req-status add">+ Auto-add</span>';
                else if (player.passives.some(p => p && p.name === r))
                  statusHTML = '<span class="req-status ok">✓ Equipped</span>';
                else if (pendingNames.has(r))
                  statusHTML = '<span class="req-status add">+ Auto-add</span>';
                else
                  statusHTML = '<span class="req-status miss" title="No passive slot available">✗ No room</span>';
              } else if (wObj2) {
                statusHTML = player.weapons.some(pw => pw && pw.name === r)
                  ? '<span class="req-status ok">✓ In build</span>'
                  : '<span class="req-status miss" title="Add this weapon to the build">✗ Missing</span>';
              }
              return `<div class="req-row">
                <div class="req-icon">${icon ? `<img src="${esc(icon)}" alt="${esc(r)}" onerror="this.src='${esc(EMPTY_ICON)}'">` : ''}</div>
                <span style="flex:1;font-size:.75rem">${esc(r)}</span>${statusHTML}
              </div>`;
            }).join('')}
            ${toggleHTML}
          </div>`;
        }

        const chainHTML = buildEvoChainHTML(w);

        const wRightTop = `<div class="detail-icon"><img src="${esc(w.icon||EMPTY_ICON)}" onerror="this.parentElement.classList.add('broken');this.src='${esc(EMPTY_ICON)}'"></div>
          <div class="detail-name">${esc(w.name)}</div>
          ${w.category !== 'Base' ? `<div style="font-size:.7rem;color:var(--gold);text-align:center;margin-bottom:.2rem">${esc(w.category)}</div>` : ''}`;
        const wRightBody = `${reqHTML}${chainHTML}`;
        rightHTML = `<div class="ovl-right-top">${wRightTop}</div><div class="ovl-right-body">${wRightBody}</div>`;
      }
    } else {
      rightHTML = `<div class="ovl-right-top"><div class="detail-desc" style="text-align:center">Select a weapon</div></div><div class="ovl-right-body"></div>`;
    }

    return `<div class="overlay-header">
        <h2>Weapon Slot ${slotIdx+1}</h2>
        <button class="btn btn-icon overlay-close" data-action="ovl-close">✕</button>
      </div>
      <div class="overlay-body">
        <div class="ovl-left">${leftHTML}</div>
        <div class="ovl-center">${centerHTML}</div>
        <div class="ovl-right">${rightHTML}</div>
      </div>
      <div class="overlay-footer">
        <button class="btn btn-back" data-action="ovl-close">Cancel</button>
        <button class="btn btn-confirm" data-action="ovl-confirm">Confirm</button>
      </div>`;
  }

  function passiveOverlayHTML(playerIdx, slotIdx) {
    const player = state.players[playerIdx];
    const sel    = state.ovl.selected;
    // Block passives equipped by this player in other slots, and by any other player.
    const usedPassives = new Set([
      ...player.passives.filter((p, i) => p && i !== slotIdx).map(p => p.name),
      ...state.players.filter((_, i) => i !== playerIdx).flatMap(p => p.passives.filter(Boolean).map(p => p.name)),
    ]);

    let cards = '';
    for (const p of D.passives) {
      // Extra-bar passives (Weapon Power-Up, Outer Saboteur, Mini …) live outside the core
      // slots, capped by their enabling weapons. Kept in the list but dimmed/unselectable
      // when at cap or with no enabling weapon (never filtered out).
      const isExtra = isExtraPassive(p.name);
      const isSel = sel && sel.name === p.name;
      const isDim = isExtra ? (extraCount(player, p.name) >= extraCap(player, p.name)) : usedPassives.has(p.name);
      cards += `<div class="item-card${isSel ? ' selected' : ''}${isDim ? ' dim' : ''}"
        data-action="ovl-select-item" data-item="${esc(p.name)}" data-item-type="passive" data-search="${esc(p.name)}"
        title="${esc(p.name)}">
        <img src="${esc(p.icon||EMPTY_ICON)}" alt="${esc(p.name)}" onerror="this.parentElement.classList.add('broken');this.src='${esc(EMPTY_ICON)}'">
      </div>`;
    }

    let leftHTML = '<div class="detail-desc" style="margin-top:.5rem;color:var(--text-muted)">Select a passive to see details</div>';
    let rightTop = '<div class="detail-desc" style="margin-top:1rem;text-align:center">Select a passive</div>';
    let rightBody = '';

    if (sel) {
      const p = D.passives.find(p => p.name === sel.name);
      if (p) {
        leftHTML = `<div class="detail-desc" style="margin:.2rem 0">${esc(p.description)}</div>
          ${p.level_ups.length > 1 ? `<div class="detail-section"><h3>Level Ups</h3><ul style="padding-left:1.1rem;margin:.3rem 0">
            ${p.level_ups.slice(1).map((l,i) => `<li style="font-size:.75rem;margin-bottom:.15rem">Lv${i+2}: ${esc(l)}</li>`).join('')}
          </ul></div>` : ''}`;
        rightTop = `<div class="detail-icon"><img src="${esc(p.icon||EMPTY_ICON)}" onerror="this.parentElement.classList.add('broken');this.src='${esc(EMPTY_ICON)}'"></div>
          <div class="detail-name">${esc(p.name)}</div>
          <div class="detail-desc">${esc(p.description)}</div>`;
        rightBody = buildPassiveEvoHTML(p.name, null);
      }
    }
    const rightHTML = `<div class="ovl-right-top">${rightTop}</div><div class="ovl-right-body">${rightBody}</div>`;

    return `<div class="overlay-header">
        <h2>Passive Slot ${slotIdx+1}</h2>
        <button class="btn btn-icon overlay-close" data-action="ovl-close">✕</button>
      </div>
      <div class="overlay-body">
        <div class="ovl-left">${leftHTML}</div>
        <div class="ovl-center">
          <div class="ovl-center-search">${searchBarHTML('Search passives…')}</div>
          <div class="ovl-center-scroll"><div class="item-grid">${cards}</div></div>
        </div>
        <div class="ovl-right">${rightHTML}</div>
      </div>
      <div class="overlay-footer">
        <button class="btn btn-back" data-action="ovl-close">Cancel</button>
        <button class="btn btn-confirm" data-action="ovl-confirm">Confirm</button>
      </div>`;
  }

  function openArcanaOverlay(slotIdx) {
    const prev = state.arcana[slotIdx];
    state.overlay = { type:'arcana', playerIdx:0, slotIdx, fromEmpty: !prev, prevItem: prev };
    state.ovl.selected = prev;
    buildAndShowOverlay(arcanaOverlayHTML(slotIdx));

  function arcanaOverlayHTML(slotIdx) {
    const sel    = state.ovl.selected;
    const tab    = state.ovl.arcanaTab; // 'arcana' | 'darkana'
    const groups = arcanaGroups();
    const EMPTY_DARKANA = 'assets/icons/arcana/empty_darkana.png';

    const otherTab  = tab === 'arcana' ? 'darkana' : 'arcana';
    const tabLabel  = tab === 'arcana' ? 'Arcana' : 'Darkana';
    const switchLabel = tab === 'arcana' ? '→ Darkana' : '→ Arcana';

    const tabBtn = `<button class="arcana-tab-btn" data-action="arcana-tab-toggle" data-tab="${tab}">
      <span class="arcana-tab-current">${tabLabel}</span>
      <span class="arcana-tab-switch">${switchLabel}</span>
    </button>`;

    // Arcana already in the build — can't be picked again (uniqueness). Covers the
    // other pool slots AND extra (character starting) arcana: an "extra" takes no
    // pool slot but is still owned, so it must be removed from the selectable pool.
    const equippedElsewhere = new Set([
      ...state.arcana.filter((a, i) => a && i !== slotIdx).map(a => a.name),
      ...extraArcanaNames(),
    ]);

    let cards = tabBtn;
    for (const group of groups) {
      const key     = group[0].base_num;
      const arcana  = group.find(a => a.type === 'Arcana');
      const darkana = group.find(a => a.type === 'Darkana');
      const cur     = tab === 'arcana' ? arcana : (darkana || null);
      const isSel   = sel && group.some(a => a.name === sel.name);
      const searchVal = esc(group.map(a => a.name).join('|'));

      if (tab === 'darkana' && !darkana) {
        // Placeholder for positions without a Darkana variant
        cards += `<div class="item-card arcana-placeholder" data-search="${searchVal}" title="No Darkana variant">
          <img src="${EMPTY_DARKANA}" alt="No Darkana">
        </div>`;
      } else {
        const display = cur || arcana;
        const isUsed  = !isSel && equippedElsewhere.has(display.name);
        cards += `<div class="item-card${isSel ? ' selected' : ''}${isUsed ? ' consumed' : ''}"
          ${isUsed ? '' : 'data-action="ovl-select-arcana"'} data-arcana="${esc(display.name)}" data-base="${esc(key)}"
          data-search="${searchVal}" title="${esc(display.name)} (${display.type})${isUsed ? ' — already equipped' : ''}">
          <img src="${esc(display.icon||EMPTY_ICON)}" alt="${esc(display.name)}" onerror="this.parentElement.classList.add('broken');this.src='${esc(EMPTY_ICON)}'">
        </div>`;
      }
    }

    const rightHTML = sel
      ? `<div class="ovl-right-top">
           <div class="detail-icon arcana-card"><img src="${esc(sel.icon||EMPTY_ICON)}" onerror="this.parentElement.classList.add('broken');this.src='${esc(EMPTY_ICON)}'"></div>
           <div class="detail-name">${esc(sel.name)}</div>
           <div class="hi-badge ${sel.type === 'Arcana' ? 'arcana' : 'item'}" style="display:block;text-align:center;margin-bottom:.3rem">${esc(sel.type)}</div>
         </div>
         <div class="ovl-right-body">
           <div class="detail-desc">${esc(sel.description)}</div>
           ${sel.notes ? `<div class="detail-section"><h3>Notes</h3><div class="detail-desc" style="margin-top:.3rem">${esc(sel.notes.slice(0,500))}…</div></div>` : ''}
         </div>`
      : '<div class="ovl-right-top"><div class="detail-desc" style="text-align:center">Select an arcana</div></div><div class="ovl-right-body"></div>';

    return `<div class="overlay-header">
        <h2>Arcana Selection — Slot ${slotIdx+1}</h2>
        <button class="btn btn-icon overlay-close" data-action="ovl-close">✕</button>
      </div>
      <div class="overlay-body">
        <div class="ovl-center-wide">
          <div class="ovl-center-search">${searchBarHTML('Search arcana…')}</div>
          <div class="ovl-center-scroll"><div class="arcana-grid">${cards}</div></div>
        </div>
        <div class="ovl-right">${rightHTML}</div>
      </div>
      <div class="overlay-footer">
        <button class="btn btn-back" data-action="ovl-close">Cancel</button>
        <button class="btn btn-confirm" data-action="ovl-confirm">Confirm</button>
      </div>`;
  }

  // ── Stage overlay ────────────────────────────────────

  function openStageOverlay() {

    state.ovl.selected = state.stage;
    buildAndShowOverlay(stageOverlayHTML());
  }

          <div class="detail-name">${esc(sel.name)}</div>

  // ── Show / rebuild overlay ───────────────────────────

  function searchBarHTML(placeholder) {
    return `<div class="ovl-search-wrap">
      <input type="text" class="ovl-search" placeholder="${esc(placeholder)}" autocomplete="off" spellcheck="false">
      <button class="ovl-search-clear" data-action="ovl-search-clear" tabindex="-1">✕</button>
    </div>`;
  }

  function levelRowHTML(playerIdx, level) {
    const atDefault = level === 1 ? ' data-at-default' : '';
    return `<div class="stats-heading-row">
      <h3 style="margin:0">Stats</h3>
      <div class="level-wrap"${atDefault}>
        <span class="level-prefix">Lv</span>
        <input type="number" class="level-input" value="${level}" min="1" max="999" data-player="${playerIdx}">
        <button class="level-clear" data-action="level-clear" data-player="${playerIdx}" tabindex="-1">✕</button>
      </div>
    </div>`;
  }

  function applyOverlaySearch(input) {
    const query = (input.value || '').toLowerCase().trim();
    const center = input.closest('.ovl-center, .ovl-center-wide');
    if (!center) return;
    center.querySelectorAll('[data-search]').forEach(el => {
      const matches = !query || el.dataset.search.toLowerCase().includes(query);
      el.classList.toggle('search-dim', !matches);
    });
    // Hide section labels whose entire grid is filtered out
    center.querySelectorAll('.item-section-label').forEach(label => {
      let sib = label.nextElementSibling;
      while (sib && !sib.classList.contains('item-grid')) sib = sib.nextElementSibling;
      const hasVisible = sib && sib.querySelector('[data-search]:not(.search-dim)');
      label.classList.toggle('search-dim', !hasVisible);
    });
  }

  function buildAndShowOverlay(inner) {
    const root = document.getElementById('overlay-root');
    root.innerHTML = `<div class="overlay-panel">${inner}</div>`;
    root.classList.remove('hidden');
  }

  function refreshOverlay() {
    const { type, playerIdx, slotIdx, slotType } = state.overlay;
    let inner = '';
    if (type === 'char')                             inner = charOverlayHTML(playerIdx);
    else if (type === 'item' && slotType === 'weapon')  inner = weaponOverlayHTML(playerIdx, slotIdx);
    else if (type === 'item' && slotType === 'passive') inner = passiveOverlayHTML(playerIdx, slotIdx);
    else if (type === 'arcana') inner = arcanaOverlayHTML(slotIdx);
    else if (type === 'stage')  inner = stageOverlayHTML();
    const panel = document.getElementById('overlay-root').querySelector('.overlay-panel');
    const scroller = panel.querySelector('.ovl-center-scroll');
    const scrollTop = scroller ? scroller.scrollTop : 0;
    panel.innerHTML = inner;
    const newScroller = panel.querySelector('.ovl-center-scroll');
    if (newScroller) newScroller.scrollTop = scrollTop;
    const searchInput = panel.querySelector('.ovl-search');
    if (searchInput && state.ovl.search) {
      searchInput.value = state.ovl.search;
      applyOverlaySearch(searchInput);
    }
  }

  function closeOverlay(confirmed) {
    const { type, playerIdx, slotIdx, slotType, fromEmpty, prevItem } = state.overlay;
    const sel = state.ovl.selected;

    if (confirmed || (fromEmpty && sel)) {
      // Apply selection
      if (type === 'char') {
        const oldChar = state.players[playerIdx].character;
        state.players[playerIdx].character = sel;
        if (sel) {
          const counts = SLOT_COUNTS[state.playerCount];
          const pw = state.players[playerIdx].weapons;
          const selNormalStarters = starterWeaponNames(sel).slice(0, counts.weapons);
          // Lineage (base + all forward evo forms) for each starter, in slot order.
          const lineages = selNormalStarters.map(wn => collectDescendants(wn));
          const allLineageNames = new Set();
          lineages.forEach(s => s.forEach(n => allLineageNames.add(n)));
          // Forms locked by the previous character — dropped, they belonged to the
          // replaced character's starter lineage.
          const oldStarterLineage = new Set();
          starterWeaponNames(oldChar)
            .forEach(wn => collectDescendants(wn).forEach(n => oldStarterLineage.add(n)));

          // For each starter slot, prefer an already-equipped weapon in that starter's
          // lineage (e.g. user pre-equipped Fuwalafuwaloo, which is in Whip's lineage →
          // lock Fuwalafuwaloo into the slot). Otherwise place the base starter weapon.
          const claimed = new Set(); // pw indices consumed as starter-slot occupants
          const rebuilt = new Array(counts.weapons).fill(null);
          selNormalStarters.forEach((wn, si) => {
            const lineage = lineages[si];
            let bestIdx = -1, bestSize = Infinity; // smaller descendant set = more evolved
            for (let i = 0; i < counts.weapons; i++) {
              const w = pw[i];
              if (!w || claimed.has(i) || !lineage.has(w.name)) continue;
              const size = collectDescendants(w.name).size;
              if (size < bestSize) { bestSize = size; bestIdx = i; }
            }
            if (bestIdx >= 0) { claimed.add(bestIdx); rebuilt[si] = pw[bestIdx]; }
            else rebuilt[si] = weaponByName(wn) || null;
          });

          // Preserve the user's other weapons: not claimed as a starter occupant, not part
          // of any new starter's lineage (already represented / would conflict), and not
          // part of the replaced character's starter lineage.
          const preserved = [];
          for (let i = 0; i < counts.weapons; i++) {
            if (claimed.has(i)) continue;
            const w = pw[i];
            if (!w || allLineageNames.has(w.name) || oldStarterLineage.has(w.name)) continue;
            preserved.push(w);
          }
          let fill = selNormalStarters.length;
          for (const w of preserved) { if (fill >= counts.weapons) break; rebuilt[fill++] = w; }
          state.players[playerIdx].weapons = rebuilt;

          // Starter passives (e.g. Empty Tome) lock into the front passive slots,
          // mirroring starter weapons. Passives have no evo lineage, so placement is
          // by name; the user's other passives are preserved after them, and the
          // replaced character's starter passives are dropped.
          const pp = state.players[playerIdx].passives;
          const selStarterPassives = starterPassiveNames(sel).slice(0, counts.passives);
          const oldStarterPassives = new Set(starterPassiveNames(oldChar));
          const rebuiltP = new Array(counts.passives).fill(null);
          const claimedP = new Set();
          selStarterPassives.forEach((pn, si) => {
            rebuiltP[si] = passiveByName(pn);
            const exist = pp.findIndex((p, i) => p && p.name === pn && !claimedP.has(i));
            if (exist >= 0) claimedP.add(exist);
          });
          const preservedP = [];
          for (let i = 0; i < counts.passives; i++) {
            if (claimedP.has(i)) continue;
            const p = pp[i];
            if (!p || selStarterPassives.includes(p.name) || oldStarterPassives.has(p.name)) continue;
            preservedP.push(p);
          }
          let fillP = selStarterPassives.length;
          for (const p of preservedP) { if (fillP >= counts.passives) break; rebuiltP[fillP++] = p; }
          state.players[playerIdx].passives = rebuiltP;
        }
        // If the new character's starting arcana already sits in a pool slot, clear
        // that slot — the extra now owns it and a pool copy would be a duplicate.
        const newArc = sel?.starting_arcana;
        if (newArc) {
          const dupIdx = state.arcana.findIndex(a => a?.name === newArc);
          if (dupIdx >= 0) state.arcana[dupIdx] = null;
        }
      } else if (type === 'item') {
        if (sel) {
          const isWeapon = D.weapons.some(w => w.name === sel.name);
          const isPassive = D.passives.some(p => p.name === sel.name);
          if (slotType === 'weapon' && isWeapon && slotIdx >= 0) {
            const wDef = D.weapons.find(w => w.name === sel.name);
            const counts = SLOT_COUNTS[state.playerCount];
            const player = state.players[playerIdx];
            // Add all passives required by the full evo chain that aren't already equipped
            const chain = collectWeaponChain(wDef.name);
            const allEquippedPassiveNames = new Set(
              state.players.flatMap(p => p.passives.filter(Boolean).map(p => p.name))
            );
            const skippedPassives = [];
            for (const pname of collectChainPassives(chain)) {
              if (isExtraPassive(pname)) continue; // extra-bar passive; backed after placement
              if (allEquippedPassiveNames.has(pname)) continue;
              // Find the first free passive slot, bounded by the slot count — the
              // passives array may be empty/sparse, so findIndex alone is unreliable.
              let emptySlot = -1;
              for (let i = 0; i < counts.passives; i++) {
                if (!player.passives[i]) { emptySlot = i; break; }
              }
              if (emptySlot >= 0) {
                player.passives[emptySlot] = passiveByName(pname);
                allEquippedPassiveNames.add(pname);
              } else {
                skippedPassives.push(pname);
              }
            }
            if (skippedPassives.length) {
              showToast(`No passive slot for: ${skippedPassives.join(', ')}`, 'warn');
            }
            // Collapse target: if a chain member currently occupies a locked starter
            // slot, the result lands there (locked slots stay bound to their lineage —
            // e.g. selecting Million Cut from Valmanway's slot collapses onto the locked
            // Thousand Edge/Knife slot). Otherwise it lands in the slot selected from.
            const cHiddenSet = new Set(player.character?.hidden_items ?? []);
            const starterCount = player.character
              ? Math.min(player.character.starting_weapons.filter(w => !cHiddenSet.has(w)).length, counts.weapons)
              : 0;
            let targetSlot = slotIdx;
            for (let i = 0; i < starterCount; i++) {
              const w = player.weapons[i];
              if (w && chain.has(w.name)) { targetSlot = i; break; }
            }
            // Place weapon in the target slot
            player.weapons[targetSlot] = wDef;
            // Clear other chain members from this player's slots (consumed by this evo)
            for (let i = 0; i < counts.weapons; i++) {
              if (i === targetSlot) continue;
              const w = player.weapons[i];
              if (w && chain.has(w.name)) player.weapons[i] = null;
            }
            // Extra-passive auto-add: adding a weapon contributes one instance of each
            // extra-bar passive it requires (Weapon Power-Up, Outer Saboteur, Mini …) to
            // the extra bar, up to that passive's cap, when auto-add is on. Unbacked
            // evolved OG weapons are devolved by syncExtraPassives.
            const extraAutoAdd = state.ovl.autoAdd ?? true;
            if (extraAutoAdd) {
              for (const pname of collectChainPassives(chain)) {
                if (!isExtraPassive(pname)) continue;
                if (extraCount(player, pname) < extraCap(player, pname)) player.extraPassives.push(pname);
              }
            }
            syncExtraPassives(player);
          }
          if (slotType === 'passive' && isPassive && slotIdx >= 0) {
            // Extra-bar passives never occupy a core slot — add an instance to the extra
            // bar (up to their cap) instead of the selected slot.
            if (isExtraPassive(sel.name)) {
              const player = state.players[playerIdx];
              if (extraCount(player, sel.name) < extraCap(player, sel.name)) player.extraPassives.push(sel.name);
              syncExtraPassives(player);
            } else {
              // Replacing a passive can remove one an equipped evo depends on — re-check.
              state.players[playerIdx].passives[slotIdx] = D.passives.find(p => p.name === sel.name);
              autoDevolveBrokenEvos();
            }
          }
        }
      } else if (type === 'arcana') {
        if (sel && (state.arcana.some((a, i) => a && i !== slotIdx && a.name === sel.name)
                    || extraArcanaNames().includes(sel.name))) {
          showToast(`${sel.name} already equipped`, 'warn');
        } else {
          state.arcana[slotIdx] = sel;
        }
      } else if (type === 'stage') {
        state.stage = sel;
      }
    }
    // else: cancel (no change)

    state.overlay = null;
    state.ovl = { selected: null, variantIdx: state.ovl.variantIdx, arcanaTab: 'arcana', autoAdd: null, search: '' };
    document.getElementById('overlay-root').classList.add('hidden');
    render();
  }

  // ═══════════════════════════════════════════════════════
  //  POWER-UP CALCULATIONS
  // ═══════════════════════════════════════════════════════

  function calcCharScalingBonus(charStatKey, char, level) {
    if (!char?.scaling?.length || !level || level < 1) return 0;
    let total = 0;
    for (const s of char.scaling) {
      if (s.key !== charStatKey) continue;
      let bonus;
      if (s.interval === 0) {
        bonus = s.value;
      } else if (s.interval === null || s.interval === 1) {
        // "per level" (no N, or N=1) — first increment lands at level 2, not level 1
        bonus = s.value * Math.max(0, level - 1);
      } else {
        // "per N level" — increments at N, 2N, 3N, …
        bonus = s.value * Math.floor(level / s.interval);
      }
      if (s.max !== null) {
        bonus = s.value > 0 ? Math.min(s.max, bonus) : Math.max(s.max, bonus);
      }
      total += bonus;
    }
    return total;
  }

  function calcPowerUpBonus(charStatKey) {
    let additive = 0;
    let multiplierSum = 0;
    D.stats.forEach(stat => {
      const level = state.powerUps[stat.name] ?? stat.max_level;
      for (let i = 0; i < level; i++) {
        const val = stat.levels[i]?.[charStatKey];
        if (val === undefined || val === null) continue;
        if (stat.stacking === 'multiplicative') multiplierSum += val;
        else additive += val;
      }
    });
    return { additive, multiplierSum, multiplier: 1 + multiplierSum };
  }

  function calcPassiveBonus(charStatKey, player) {
    let additive = 0;
    let multiplierSum = 0;
    if (!player) return { additive, multiplierSum };
    const isMultStat = D.stats.find(s => s.key === charStatKey)?.stacking === 'multiplicative';
    // Slotted passives + extra-passive instances (e.g. Weapon Power-Up) — the latter
    // may repeat, so each instance contributes the passive's real stats once.
    const contribute = name => {
      const passive = D.passives.find(d => d.name === name);
      if (!passive?.level_up_values?.length) return;
      passive.level_up_values.forEach(lvl => {
        const val = lvl[charStatKey];
        if (val === undefined || val === null) return;
        if (isMultStat) multiplierSum += val;
        else additive += val;
      });
    };
    player.passives.filter(Boolean).forEach(p => contribute(p.name));
    (player.extraPassives || []).forEach(contribute);
    return { additive, multiplierSum };
  }

  // ── Character grant instances (count engine for the later dupe-badge render) ──
  // Character `add_item` grants can add multiple copies over levels (Scorej-Oni gains
  // a hidden Lightning Ring every 8 levels). Instance COUNT logic; visuals come later.
  function grantInstanceCount(grant, player) {
    const level  = player?.charLevel ?? 1;
    const amount = grant.amount ?? 1;
    if (grant.interval) {
      return Math.max(0, Math.min(Math.floor(level / grant.interval), grant.max ?? Infinity)) * amount;
    }
    if (grant.at?.length) return grant.at.filter(l => level >= l).length * amount;
    return amount; // static
  }

  // ── Extra-bar passives (don't occupy a core slot; gated/capped by the weapons that
  //    require them). Three mechanics today:
  //    • Weapon Power-Up (OG weapons): `perWeapon` cap, one instance per OG weapon,
  //      bound 1:1 to each EVOLVED OG weapon (removing one devolves a weapon).
  //    • Outer Saboteur (AC weapons): `single` shared instance enables all AC evolutions.
  //    • Mini <X> (EM weapons): `consumable` — bound to its EM weapon AT BASE stage;
  //      consumed when the weapon evolves, restored when it devolves. (Hidden-weapon
  //      spawning is still deferred.)
  const WEAPON_POWER_UP = 'Weapon Power-Up';
  function extraPassiveCapMode(name) {
    if (name === WEAPON_POWER_UP) return 'perWeapon';
    if (name === 'Outer Saboteur') return 'single';
    if (/^Mini /.test(name)) return 'consumable';
    return null; // not an extra-bar passive
  }
  const isExtraPassive = name => extraPassiveCapMode(name) !== null;
  const isConsumableExtra = name => extraPassiveCapMode(name) === 'consumable';

  // Ultimate base of a weapon's evo chain (follow trans_result backward). Guards against
  // cycles / self-references in the data so a bad trans_result can't infinite-loop.
  function ogBaseName(name) {
    let cur = name; const seen = new Set();
    while (!seen.has(cur)) {
      seen.add(cur);
      const b = D.weapons.find(w => w.trans_result === cur && w.name !== cur);
      if (!b) break;
      cur = b.name;
    }
    return cur;
  }
  // A weapon "requires" an extra passive if its ultimate base lists it as a requirement.
  function weaponRequiresExtra(weaponName, passiveName) {
    const base = weaponByName(ogBaseName(weaponName));
    return !!base && (base.requirements || []).includes(passiveName);
  }
  const isOperationGunsWeapon = name => weaponRequiresExtra(name, WEAPON_POWER_UP);
  // Equipped weapons that enable a given extra passive. Consumable passives (Mini) only
  // count their EM weapon while it's AT BASE — an evolved one has consumed its instance.
  function enablingWeaponCount(player, passiveName) {
    const baseOnly = isConsumableExtra(passiveName);
    return (player?.weapons || []).filter(w =>
      w && weaponRequiresExtra(w.name, passiveName) && (!baseOnly || w.name === ogBaseName(w.name))
    ).length;
  }
  // Max instances of an extra passive: perWeapon = one per enabling weapon; single/consumable = 1 if any.
  function extraCap(player, passiveName) {
    const n = enablingWeaponCount(player, passiveName);
    return extraPassiveCapMode(passiveName) === 'perWeapon' ? n : (n > 0 ? 1 : 0);
  }
  const extraCount = (player, passiveName) => (player?.extraPassives || []).filter(n => n === passiveName).length;
  // WPU convenience aliases (its 1:1 binding logic is Weapon-Power-Up-specific).
  const wpuCap   = player => extraCap(player, WEAPON_POWER_UP);
  const wpuCount = player => extraCount(player, WEAPON_POWER_UP);
  function evolvedOGCount(player) {
    return (player?.weapons || []).filter(w => w && isOperationGunsWeapon(w.name) && w.name !== ogBaseName(w.name)).length;
  }
  function lastEvolvedOGIndex(player) {
    const counts = SLOT_COUNTS[state.playerCount];
    for (let i = counts.weapons - 1; i >= 0; i--) {
      const w = player.weapons[i];
      if (w && isOperationGunsWeapon(w.name) && w.name !== ogBaseName(w.name)) return i;
    }
    return -1;
  }
  // Enforce extra-passive invariants after any weapon/instance change: clamp every extra
  // passive to its cap, then apply Weapon Power-Up's 1:1 binding — while there are fewer
  // instances than evolved OG weapons, devolve the last evolved OG weapon one stage.
  function syncExtraPassives(player) {
    if (!player) return;
    if (!player.extraPassives) player.extraPassives = [];
    // Clamp every extra passive to its cap (this also CONSUMES a Mini when its EM weapon
    // evolves: the evolved weapon no longer counts, so the cap drops to 0).
    for (const nm of new Set(player.extraPassives)) {
      for (let over = extraCount(player, nm) - extraCap(player, nm); over > 0; over--) {
        const i = player.extraPassives.lastIndexOf(nm);
        if (i < 0) break;
        player.extraPassives.splice(i, 1);
      }
    }
    // Consumable passives (Mini) are RESTORED to their base EM weapon — devolving back to
    // base raises the cap to 1, so a missing instance is re-added.
    const wantConsumable = new Set();
    (player.weapons || []).filter(Boolean).forEach(w => {
      const base = weaponByName(ogBaseName(w.name));
      (base?.requirements || []).forEach(r => { if (isConsumableExtra(r)) wantConsumable.add(r); });
    });
    for (const nm of wantConsumable) {
      while (extraCount(player, nm) < extraCap(player, nm)) player.extraPassives.push(nm);
    }
    let guard = 0;
    while (wpuCount(player) < evolvedOGCount(player) && guard++ < 30) {
      const idx = lastEvolvedOGIndex(player);
      if (idx < 0) break;
      const cur = player.weapons[idx];
      const prev = D.weapons.find(w => w.trans_result === cur.name);
      player.weapons[idx] = prev || weaponByName(ogBaseName(cur.name));
    }
  }

  function calcStatTotal(charStatKey, charStats, player, char, level) {
    const statDef  = D.stats.find(s => s.key === charStatKey);
    const isPct    = PCT_STATS.has(charStatKey);
    const inverted = INVERTED_STATS.has(charStatKey);
    const rawBase  = statDef ? statDef.base_value : (isPct ? 100 : 0);
    const rawCharBase = charStats ? (charStats[charStatKey] || 0) : 0;
    const scaling  = calcCharScalingBonus(charStatKey, char, level ?? 1);
    const rawChar  = rawCharBase + scaling;
    const { additive, multiplierSum, multiplier } = calcPowerUpBonus(charStatKey);
    const { additive: passiveAdd, multiplierSum: passiveMultSum } = calcPassiveBonus(charStatKey, player);
    const isMultStat = statDef?.stacking === 'multiplicative';

    // Base column: power-up-adjusted baseline (no char bonus)
    let adjBase;
    if (isMultStat) {
      adjBase = Math.round(rawBase * multiplier);
    } else if (isPct) {
      adjBase = Math.round(rawBase + additive * 100);
    } else {
      adjBase = Math.round(rawBase + additive);
    }

    // Total: PU and passive both contribute
    let total;
    if (isMultStat) {
      total = Math.round((rawBase + rawChar) * (1 + multiplierSum + passiveMultSum));
    } else if (isPct) {
      total = Math.round(rawBase + rawChar * 100 + additive * 100 + passiveAdd * 100);
    } else {
      total = Math.round(rawBase + rawChar + additive + passiveAdd);
    }

    // Cap
    let isCapped = false;
    if (statDef?.max_value != null) {
      const cap = statDef.max_value;
      if (inverted ? total <= cap : total >= cap) { total = cap; isCapped = true; }
    }

    // PU column display
    let dispPU;
    if (isMultStat && multiplierSum !== 0) {
      const factor = (1 + multiplierSum);
      dispPU = '×' + (Number.isInteger(factor) ? factor : parseFloat(factor.toFixed(2)));
    } else if (!isMultStat && additive !== 0) {
      const val = isPct ? Math.round(additive * 100) : Math.round(additive);
      dispPU = (val > 0 ? '+' : '') + val + (isPct ? '%' : '');
    } else {
      dispPU = null;
    }

    // Passive column display
    let dispPassive;
    if (isMultStat && passiveMultSum !== 0) {
      const factor = 1 + passiveMultSum;
      dispPassive = '×' + (Number.isInteger(factor) ? factor : parseFloat(factor.toFixed(2)));
    } else if (!isMultStat && passiveAdd !== 0) {
      const val = isPct ? Math.round(passiveAdd * 100) : parseFloat(passiveAdd.toFixed(1));
      dispPassive = (val > 0 ? '+' : '') + val + (isPct ? '%' : '');
    } else {
      dispPassive = null;
    }

    const dispBase = isPct ? rawBase + '%' : rawBase;
    const dispChar = isPct ? Math.round(rawChar * 100) : Math.round(rawChar);
    return { dispBase, dispChar, dispPU, dispPassive, total, isPct, isCapped };
  }

  // ═══════════════════════════════════════════════════════
  //  POWER-UP OVERLAY
  // ═══════════════════════════════════════════════════════

  function renderPowerUpOverlay() {
    const rows = D.stats.map(stat => {
      const level   = state.powerUps[stat.name] ?? stat.max_level;
      const hasLevels = stat.max_level > 0;
      const id      = 'pu-lv-' + stat.name.replace(/\W+/g, '_');
      return `<div class="pu-row${hasLevels ? '' : ' no-levels'}">
        <img class="pu-icon" src="${esc(stat.icon)}" alt="${esc(stat.name)}"
          onerror="this.src='assets/icons/stats/template_stats.png'">
        <span class="pu-name" title="${esc(stat.description)}">${esc(stat.name)}</span>
        ${hasLevels ? `<div class="pu-level-ctrl">
          <button data-action="pu-level" data-stat="${esc(stat.name)}" data-delta="-1"
            ${level <= 0 ? 'disabled' : ''}>−</button>
          <span class="pu-level-display" id="${id}">${level}/${stat.max_level}</span>
          <button data-action="pu-level" data-stat="${esc(stat.name)}" data-delta="1"
            ${level >= stat.max_level ? 'disabled' : ''}>+</button>
        </div>` : `<span class="pu-level-display" style="color:var(--text-muted)">—</span>`}
      </div>`;
    }).join('');

    const root = document.getElementById('overlay-root');
    root.innerHTML = `
      <div class="overlay-panel pu-panel">
        <div class="overlay-header">
          <h2>Power-Ups</h2>
          <div style="display:flex;gap:.4rem;align-items:center">
            <button class="btn btn-sm btn-confirm" data-action="pu-max-all">Max All</button>
            <button class="btn btn-sm btn-back" data-action="pu-disable-all">Disable All</button>
            <button class="btn btn-icon overlay-close" data-action="pu-close">✕</button>
          </div>
        </div>
        <div class="pu-list-wrap"><div class="pu-list">${rows}</div></div>
