<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Vampire Survivors Build Calculator</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@400;600;700&family=Crimson+Text:ital,wght@0,400;1,400&display=swap" rel="stylesheet">
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    :root {
      --bg:          #120404;
      --surface:     #1e0808;
      --surface2:    #2c1010;
      --border:      #b88820;
      --border-hi:   #e8b820;
      --accent:      #c01020;
      --accent-glow: rgba(192,16,32,.4);
      --gold:        #e8b820;
      --gold-dim:    #8a6010;
      --text:        #f0e8d0;
      --text-muted:  #a08858;
      --text-dim:    #5a3820;
      --slot-bg:     #160606;
      --slot-border: #b88820;
      --hi-char:     #3a7ad9;   /* char-associated */
      --hi-arcana:   #9b3fd9;   /* arcana-associated */
      --hi-item:     #2aaa60;   /* item-associated */
      --evolved:     #e8c000;
      --font-title:  'Cinzel', Georgia, serif;
      --font-body:   'Crimson Text', Georgia, serif;
      --slot-size:   52px;
      --char-size:   110px;
    }

    body {
      background: var(--bg);
      color: var(--text);
      font-family: var(--font-body);
      font-size: 16px;
      min-height: 100vh;
      overflow-x: hidden;
    }

    #app { min-height: 100vh; }

    /* ── Typography ── */
    h1, h2, h3, .label { font-family: var(--font-title); letter-spacing: .05em; }
    h1 { font-size: clamp(1.4rem, 3vw, 2.2rem); font-weight: 700; color: var(--text); }
    h2 { font-size: 1.1rem; font-weight: 600; color: var(--gold); }
    h3 { font-size: .85rem; font-weight: 600; color: var(--text-muted); text-transform: uppercase; letter-spacing: .08em; }
    .label { font-size: .7rem; text-transform: uppercase; letter-spacing: .1em; color: var(--text-muted); }

    /* ── Buttons ── */
    button {
      font-family: var(--font-title);
      cursor: pointer;
      border: none;
      outline: none;
      transition: background .15s, color .15s, box-shadow .15s;
    }
    .btn {
      background: var(--surface2);
      color: var(--text);
      border: 1px solid var(--border);
      border-radius: 4px;
      padding: .35rem .9rem;
      font-size: .8rem;
      letter-spacing: .05em;
    }
    .btn:hover { border-color: var(--border-hi); color: var(--gold); }
    .btn-accent {
      background: var(--accent);
      color: #fff;
      border-color: var(--accent);
      font-weight: 600;
    }
    .btn-accent:hover { background: #e01828; box-shadow: 0 0 10px var(--accent-glow); }
    .btn-confirm {
      background: #4d9a42;
      color: #fff;
      border: 3px solid var(--border-hi);
      border-radius: 2px;
      text-transform: uppercase;
      letter-spacing: .08em;
      font-weight: 600;
      box-shadow: inset 0 1px 0 rgba(255,255,255,.2), inset 0 -2px 0 rgba(0,0,0,.25);
    }
    .btn-confirm:hover { background: #5cb050; box-shadow: inset 0 1px 0 rgba(255,255,255,.25), 0 0 10px rgba(80,180,65,.45); }
    .btn-back {
      background: #7a1515;
      color: #fff;
      border: 3px solid var(--border-hi);
      border-radius: 2px;
      text-transform: uppercase;
      letter-spacing: .08em;
      font-weight: 600;
      box-shadow: inset 0 1px 0 rgba(255,255,255,.1), inset 0 -2px 0 rgba(0,0,0,.3);
    }
    .btn-back:hover { background: #921c1c; box-shadow: inset 0 1px 0 rgba(255,255,255,.15), 0 0 10px rgba(140,20,20,.5); }
    .btn-sm { padding: .2rem .55rem; font-size: .72rem; }
    .btn-icon { background: none; border: none; padding: 3px; line-height: 1; font-size: .85rem; color: var(--text-muted); }
    .btn-icon:hover { color: var(--accent); }

    /* ═══════════════════════════════════════════════════
       LANDING PAGE
    ═══════════════════════════════════════════════════ */
    #landing {
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 2.5rem;
      padding: 2rem;
      background: radial-gradient(ellipse at 50% 30%, #2c0808 0%, #120404 70%);
    }
    .landing-banner {
      text-align: center;
    }
    .landing-banner h1 {
      text-shadow: 0 0 20px rgba(192,16,32,.6);
      font-size: clamp(1.6rem, 4vw, 2.8rem);
    }
    .landing-banner p {
      color: var(--text-muted);
      margin-top: .5rem;
      font-size: 1rem;
      font-style: italic;
    }
    .landing-grid {
      display: grid;
      grid-template-columns: repeat(2, 270px);
      gap: 1.25rem;
    }
    .player-tile-btn {
      width: 270px;
      min-height: 150px;
      box-sizing: border-box;
      background: var(--surface);
      border: 2px solid var(--border-hi);
      border-radius: 14px;
      padding: 2rem 1.5rem;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: .7rem;
      cursor: pointer;
      transition: border-color .2s, box-shadow .2s, background .2s;
    }
    .player-tile-btn:hover {
      border-color: var(--gold);
      background: var(--surface2);
      box-shadow: 0 0 18px rgba(232,184,32,.3);
    }
    .player-tile-btn .count-icons {
      display: flex;
      flex-wrap: nowrap;
      gap: 6px;
      justify-content: center;
    }
    .player-tile-btn .player-icon {
      width: 48px; height: 48px;
      image-rendering: pixelated;
    }
    .player-tile-btn .tile-label {
      font-family: var(--font-title);
      font-size: 1rem;
      font-weight: 600;
      color: var(--text);
    }


    /* ═══════════════════════════════════════════════════
       PLANNING PAGE
    ═══════════════════════════════════════════════════ */
    #planning {
      min-height: 100vh;
      display: flex;
      flex-direction: column;
    }
    .planning-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: .75rem 1.25rem;
      background: var(--surface);
      border-bottom: 1px solid var(--border);
      flex-shrink: 0;
    }
    .planning-header h1 { font-size: 1.1rem; }
    .planning-header-actions { display: flex; gap: .5rem; align-items: center; }

    /* ── Banish overlay ── */
    .banish-panel {
      max-width: 520px;
      width: 95vw;
    }
    .banish-controls {
      display: flex;
      align-items: center;
      gap: .65rem;
      padding: .55rem .9rem;
      border-bottom: 1px solid var(--border);
      background: var(--surface2);
      flex-wrap: wrap;
      flex-shrink: 0;
    }
    .banish-controls label { display: flex; align-items: center; gap: .35rem; font-size: .78rem; cursor: pointer; user-select: none; }
    .banish-rarity-ctrl { display: flex; align-items: center; gap: .4rem; font-size: .78rem; }
    .banish-rarity-ctrl input[type=range] { width: 90px; accent-color: var(--gold); }
    .banish-rarity-val { font-family: var(--font-title); color: var(--gold); min-width: 2.2rem; }
    .banish-grid-wrap { overflow-y: auto; padding: .65rem; flex: 1; }
    .banish-grid {
      display: grid;
      grid-template-columns: repeat(8, var(--slot-size));
      gap: 3px;
      width: fit-content;
      margin: 0 auto;
    }
    .banish-cell {
      position: relative;
      width: var(--slot-size); height: var(--slot-size);
      cursor: pointer;
    }
    .banish-cell:hover .banish-icon { filter: brightness(1.25); }
    .banish-cell.empty { cursor: default; }
    .banish-cell.in-build { box-shadow: 0 0 0 2px var(--gold); cursor: default; }
    .banish-cell.in-build:hover .banish-icon { filter: none; }
    .banish-cell.passive-off { opacity: .3; cursor: default; pointer-events: none; }
    .banish-icon { width: 100%; height: 100%; image-rendering: pixelated; object-fit: cover; display: block; }
    .banish-seal {
      position: absolute; inset: 0;
      width: 100%; height: 100%;
      image-rendering: pixelated;
      object-fit: contain;
      opacity: 0;
      pointer-events: none;
    }
    .banish-cell.banished .banish-seal { opacity: .5; }
    .planning-body {
      flex: 1;
      padding: 1rem;
      overflow-y: auto;
      display: flex;
      gap: 1rem;
      align-items: flex-start;
    }
    .planning-main {
      flex: 1;
      min-width: 0;
    }
    .info-sidebar {
      width: 260px;
      flex-shrink: 0;
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 8px;
      padding: 1rem;
      position: sticky;
      top: 0;
      max-height: calc(100vh - 100px);
      overflow-y: auto;
    }
    .info-sidebar-empty {
      color: var(--text-dim);
      font-size: .82rem;
      text-align: center;
      padding: 2rem 0;
      font-style: italic;
      line-height: 1.8;
    }
    .info-sidebar .detail-icon { text-align: center; margin-bottom: .5rem; }
    .info-sidebar .detail-icon img { max-width: 120px; image-rendering: pixelated; }
    .info-sidebar .detail-name {
      font-family: var(--font-title);
      font-size: 1rem;
      color: var(--gold);
      text-align: center;
      margin-bottom: .4rem;
    }
    .info-sidebar .detail-desc {
      font-size: .8rem;
      color: var(--text-muted);
      font-style: italic;
      line-height: 1.5;
      margin-bottom: .75rem;
    }
    .info-sidebar .detail-section { margin: .6rem 0; }
    .info-sidebar .detail-section-label {
      font-size: .65rem;
      text-transform: uppercase;
      letter-spacing: .08em;
      color: var(--text-dim);
      display: block;
      margin-bottom: .3rem;
    }
    .info-sidebar .req-row { display: flex; flex-wrap: wrap; gap: 4px; }
    .info-sidebar .req-icon { width: 32px; height: 32px; }
    .info-sidebar .req-icon img { width: 100%; height: 100%; image-rendering: pixelated; object-fit: cover; }
    .info-sidebar .stat-grid { font-size: .78rem; }
    .info-sidebar .stat-row { padding: 2px 0; }
    .info-sidebar .stat-header { padding: 0 0 3px; }
    /* Player rows grid — varies by player count */
    .players-grid {
      display: grid;
      gap: 1rem;
    }
    .players-grid.p1 { grid-template-columns: 1fr; max-width: 900px; margin: 0 auto; }
    .players-grid.p1 + .global-row { max-width: 900px; margin-left: auto; margin-right: auto; }
    .players-grid.p2 { grid-template-columns: 1fr 1fr; }
    .players-grid.p3 { grid-template-columns: 1fr 1fr 1fr; }
    .players-grid.p4 { grid-template-columns: 1fr 1fr; }

    /* ── Global arcana/stage row ── */
    .global-row {
      margin-top: .75rem;
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 8px;
      padding: .6rem 1rem;
    }
    .global-row-inner {
      display: flex;
      align-items: center;
      gap: .5rem;
      flex-wrap: wrap;
    }

    /* ── Player card ── */
    .player-card {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 10px;
      overflow: hidden;
    }
    .player-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: .5rem .85rem;
      background: var(--surface2);
      border-bottom: 1px solid var(--border);
      cursor: pointer;
      user-select: none;
    }
    .player-header:hover { background: #3a1010; }
    .player-header-left { display: flex; align-items: center; gap: .5rem; }
    .player-header-left .player-name { font-family: var(--font-title); font-size: .85rem; color: var(--gold); }
    .player-header-left .char-name { font-size: .82rem; color: var(--text-muted); font-style: italic; }
    .player-header-actions { display: flex; gap: .4rem; align-items: center; }

    .player-body { padding: .75rem; display: flex; flex-direction: row; gap: .75rem; align-items: flex-start; }
    .char-col { flex-shrink: 0; }
    .slots-col { display: flex; flex-direction: column; gap: .6rem; flex: 1; min-width: 0; }

    /* ── Slot rows ── */
    .slot-row { display: flex; align-items: center; gap: .4rem; flex-wrap: wrap; }
    .slot-row-label { font-size: .65rem; text-transform: uppercase; letter-spacing: .08em; color: var(--text-dim); width: 3.5rem; flex-shrink: 0; }

    /* ── Slots ── */
    .slot {
      width: var(--slot-size); height: var(--slot-size);
      cursor: pointer;
      position: relative;
      flex-shrink: 0;
      transition: box-shadow .15s, filter .15s;
    }
    .slot:hover img { filter: brightness(1.2); }
    .slot img { width: 100%; height: 100%; object-fit: cover; display: block; image-rendering: pixelated; }
    .slot .slot-remove {
      position: absolute; top: 1px; right: 1px;
      width: 16px; height: 16px;
      background: rgba(0,0,0,.7);
      border: none; border-radius: 2px;
      color: #aaa; font-size: 10px; line-height: 1;
      cursor: pointer; display: none;
      align-items: center; justify-content: center;
    }
    .slot:hover .slot-remove { display: flex; }
    .slot .slot-remove:hover { color: var(--accent); }
    .slot.evolved { box-shadow: 0 0 0 2px var(--evolved), 0 0 6px rgba(232,192,0,.4); }
    .slot.evolved::after {
      content: '⬆';
      position: absolute; bottom: 1px; left: 2px;
      font-size: 9px; color: var(--evolved); line-height: 1;
    }
    .slot.hi-char  { box-shadow: 0 0 0 2px var(--hi-char),   0 0 6px rgba(58,122,217,.4); }
    .slot.hi-arcana{ box-shadow: 0 0 0 2px var(--hi-arcana), 0 0 6px rgba(155,63,217,.4); }
    .slot.hi-item  { box-shadow: 0 0 0 2px var(--hi-item),   0 0 6px rgba(42,170,96,.4); }
    .slot.hidden-weapon { opacity: .4; cursor: default; }
    .slot.hidden-weapon:hover img { filter: none; }
    .slot.hidden-weapon .slot-remove { display: none !important; }
    .slot.slot-locked { cursor: default; }
    .slot.slot-locked:hover img { filter: none; }
    .slot .slot-lock {
      position: absolute;
      top: 0; left: 50%;
      transform: translate(-50%, -55%);
      width: 18px; height: 18px;
      object-fit: fill;
      image-rendering: pixelated;
      pointer-events: none;
      z-index: 2;
    }

    .slot-char   { --slot-size: var(--char-size); }
    .slot-arcana { height: auto; }
    .slot-arcana img { height: auto; object-fit: fill; }
    .slot-stage  { width: 120px; height: auto; }
    .slot-stage img { width: 120px; height: auto; object-fit: fill; }



    /* ── Hidden weapons divider ── */
    .hidden-divider {
      width: 1px; height: var(--slot-size);
      background: var(--border);
      margin: 0 .25rem;
      flex-shrink: 0;
    }

    /* ═══════════════════════════════════════════════════
       OVERLAY
    ═══════════════════════════════════════════════════ */
    #overlay-root {
      position: fixed; inset: 0;
      background: rgba(0,0,0,.75);
      z-index: 100;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 1rem;
    }
    #overlay-root.hidden { display: none; }

    .overlay-panel {
      background: var(--surface);
      border: 1px solid var(--border-hi);
      border-radius: 12px;
      width: 75vw;
      max-width: 960px;
      max-height: 85vh;
      display: flex;
      flex-direction: column;
      overflow: hidden;
      box-shadow: 0 0 40px rgba(0,0,0,.8);
    }
    .overlay-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: .75rem 1.1rem;
      border-bottom: 1px solid var(--border);
      background: var(--surface2);
      flex-shrink: 0;
    }
    .overlay-header h2 { margin: 0; }
    .overlay-close { font-size: 1.3rem; line-height: 1; }
    .overlay-body {
      display: flex;
      flex: 1;
      overflow: hidden;
    }

    /* left panel (stats) */
    .ovl-left {
      width: 215px;
      flex-shrink: 0;
      border-right: 1px solid var(--border);
      overflow-y: auto;
      padding: .75rem;
      display: flex;
      flex-direction: column;
      gap: .5rem;
    }
    /* center grid */
    .ovl-center {
      flex: 1;
      overflow-y: auto;
      padding: .75rem;
    }
    /* right panel (identity / detail) */
    .ovl-right {
      width: 220px;
      flex-shrink: 0;
      border-left: 1px solid var(--border);
      overflow-y: auto;
      padding: .75rem;
      display: flex;
      flex-direction: column;
      gap: .5rem;
    }
    .overlay-footer {
      display: flex;
      align-items: center;
      justify-content: flex-end;
      gap: .6rem;
      padding: .6rem 1rem;
      border-top: 1px solid var(--border);
      background: var(--surface2);
      flex-shrink: 0;
    }

    /* ── Stat grid ── */
    .stat-grid { display: flex; flex-direction: column; gap: 1px; }
    .stat-header {
      display: grid; grid-template-columns: 1fr 36px 36px 40px 46px;
      font-size: .62rem; text-transform: uppercase;
      color: var(--text-muted); padding: 0 4px 3px; border-bottom: 1px solid var(--border);
      margin-bottom: 2px;
    }
    .stat-header span { text-align: right; }
    .stat-header span:first-child { text-align: left; }
    .ovl-left .stat-header,
    .ovl-left .stat-row { grid-template-columns: 1fr 30px 30px 34px 40px; font-size: .67rem; }
    .ovl-left .stat-header { font-size: .58rem; }
    .stat-row {
      display: grid; grid-template-columns: 1fr 36px 36px 40px 46px;
      align-items: center; font-size: .71rem; padding: 2px 4px; border-radius: 3px;
    }
    .stat-row.changed { background: rgba(232,184,32,.12); }
    .stat-key { color: var(--text-muted); }
    .stat-base  { text-align: right; color: var(--text-muted); font-size: .68rem; }
    .stat-char  { text-align: right; font-weight: 600; }
    .stat-pu    { text-align: right; color: #7ab8e8; font-size: .69rem; }
    .stat-total { text-align: right; font-weight: 700; color: var(--text); }
    .stat-row.capped .stat-total { color: var(--gold); font-weight: 600; }
    .stat-val.pos { color: #5ddd88; }
    .stat-val.neg { color: #dd5555; }

    /* ── Power-up overlay ── */
    .pu-panel { max-width: 480px; width: 92vw; }
    .pu-list-wrap { overflow-y: auto; padding: .5rem .75rem; flex: 1; }
    .pu-row {
      display: grid; grid-template-columns: 24px 1fr auto;
      align-items: center; gap: .5rem;
      padding: 4px 2px; border-bottom: 1px solid rgba(184,136,32,.15);
    }
    .pu-row.no-levels { opacity: .4; }
    .pu-icon { width: 24px; height: 24px; image-rendering: pixelated; object-fit: cover; }
    .pu-name { font-size: .8rem; color: var(--text); }
    .pu-level-ctrl { display: flex; align-items: center; gap: 4px; }
    .pu-level-ctrl button {
      width: 20px; height: 20px; padding: 0; line-height: 1;
      font-size: .85rem; border: 1px solid var(--border); border-radius: 3px;
      background: var(--surface2); color: var(--text); cursor: pointer;
    }
    .pu-level-ctrl button:disabled { opacity: .3; cursor: default; }
    .pu-level-ctrl button:not(:disabled):hover { border-color: var(--border-hi); color: var(--gold); }
    .pu-level-display { font-size: .75rem; font-family: var(--font-title); color: var(--gold); min-width: 30px; text-align: center; }

    /* ── Item / Arcana grid ── */
    .item-section-label {
      font-family: var(--font-title);
      font-size: .7rem;
      text-transform: uppercase;
      letter-spacing: .1em;
      color: var(--text-muted);
      margin: .5rem 0 .3rem;
      padding-bottom: 3px;
      border-bottom: 1px solid var(--border);
    }
    .item-grid {
      display: flex;
      flex-wrap: wrap;
      gap: 6px;
    }
    .item-card {
      width: var(--slot-size); height: var(--slot-size);
      border-radius: 6px;
      cursor: pointer;
      position: relative;
      overflow: hidden;
      flex-shrink: 0;
      transition: box-shadow .15s, opacity .15s;
    }
    .item-card img { width: 100%; height: 100%; object-fit: cover; display: block; }
    .item-card:hover { box-shadow: 0 0 0 2px var(--border-hi), 0 0 8px rgba(184,136,32,.4); }
    .item-card.selected { box-shadow: 0 0 0 2px var(--gold), 0 0 10px rgba(232,184,32,.5); }
    .item-card.hi-char   { box-shadow: 0 0 0 2px var(--hi-char),   0 0 6px rgba(58,122,217,.4); }
    .item-card.hi-arcana { box-shadow: 0 0 0 2px var(--hi-arcana), 0 0 6px rgba(155,63,217,.4); }
    .item-card.hi-item   { box-shadow: 0 0 0 2px var(--hi-item),   0 0 6px rgba(42,170,96,.4); }
    .item-card.dim { opacity: .35; pointer-events: none; }
    .search-dim { display: none !important; }
    .ovl-search-wrap { position: relative; margin-bottom: .6rem; }
    .ovl-search {
      width: 100%; box-sizing: border-box;
      background: var(--surface2); border: 1px solid var(--border);
      border-radius: 4px; padding: 5px 28px 5px 9px;
      color: var(--text); font-size: .82rem; font-family: var(--font-body);
      outline: none; display: block;
    }
    .ovl-search:focus { border-color: var(--border-hi); }
    .ovl-search-clear {
      position: absolute; right: 0; top: 0; bottom: 0;
      width: 26px; background: none; border: none; cursor: pointer;
      color: var(--text-muted); font-size: .8rem; line-height: 1;
      display: none; align-items: center; justify-content: center;
      padding: 0;
    }
    .ovl-search-clear:hover { color: var(--text); }
    .ovl-search:not(:placeholder-shown) + .ovl-search-clear { display: flex; }
    .item-card.evo { box-shadow: 0 0 0 1px rgba(232,184,32,.3); }
    .req-row { display:flex; align-items:center; gap:.4rem; margin:.2rem 0; }
    .req-icon { width:26px; height:26px; flex-shrink:0; border-radius:4px; overflow:hidden; }
    .req-icon img { width:100%; height:100%; object-fit:cover; display:block; }
    .req-status { font-size:.67rem; padding:1px 5px; border-radius:2px; white-space:nowrap; }
    .req-status.ok   { color:#5ddd88; }
    .req-status.add  { color:var(--gold); }
    .req-status.miss { color:#dd5555; cursor:help; }
    .item-card .card-badge {
      position: absolute; bottom: 0; left: 0; right: 0;
      background: rgba(0,0,0,.7);
      font-size: 8px;
      text-align: center;
      color: var(--text-muted);
      padding: 1px;
      line-height: 1.2;
      white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
    }
    /* variant stack effect */
    .item-card.stacked::before {
      content: '';
      position: absolute; inset: -3px;
      background: var(--surface2);
      border-radius: 7px;
      z-index: -1;
      transform: translate(4px, 4px);
    }
    .stack-wrapper {
      position: relative;
      width: calc(var(--slot-size) + 6px);
      height: calc(var(--slot-size) + 6px);
      flex-shrink: 0;
    }
    .stack-wrapper .item-card { position: absolute; top: 0; left: 0; }
    .stack-nav {
      position: absolute; bottom: -1px; right: -1px;
      display: flex; gap: 2px;
    }
    .stack-btn {
      width: 14px; height: 14px;
      background: rgba(0,0,0,.85);
      border: 1px solid var(--border-hi);
      border-radius: 2px;
      color: var(--text); font-size: 8px;
      display: flex; align-items: center; justify-content: center;
      cursor: pointer; z-index: 2;
    }
    .stack-btn:hover { color: var(--gold); }

    /* ── Detail panels (right side) ── */
    .detail-icon { width: 64px; height: 64px; border-radius: 8px; overflow: hidden; margin: 0 auto .5rem; }
    .detail-icon img { width: 100%; height: 100%; object-fit: cover; }
    .detail-name { font-family: var(--font-title); font-size: .95rem; text-align: center; color: var(--gold); margin-bottom: .3rem; }
    .detail-desc { font-size: .8rem; color: var(--text-muted); line-height: 1.5; font-style: italic; }
    .detail-section { margin-top: .5rem; }
    .detail-section h3 { margin-bottom: .25rem; }
    .detail-section ul { list-style: none; padding: 0; }
    .detail-section li { font-size: .77rem; color: var(--text-muted); padding: 2px 0; line-height: 1.4; }
    .detail-section li::before { content: '▸ '; color: var(--gold-dim); }
    .evo-flow { display: flex; flex-direction: column; gap: 8px; margin-top: .35rem; }
    .evo-row { display: flex; align-items: center; gap: 4px; flex-wrap: nowrap; }
    .evo-node { width: 28px; height: 28px; flex-shrink: 0; border-radius: 4px; overflow: hidden; }
    .evo-node.current { outline: 1px solid var(--gold); box-shadow: 0 0 6px rgba(232,184,32,.4); }
    .evo-node.evo-hidden { opacity: .4; }
    .evo-node img { width: 100%; height: 100%; object-fit: cover; display: block; }
    .evo-op { font-size: .8rem; color: var(--text-muted); flex-shrink: 0; }
    .evo-nw { display: inline-flex; flex-direction: column; align-items: center; gap: 1px; flex-shrink: 0; }
    .evo-max { font-size: .5rem; font-weight: 700; color: var(--gold); line-height: 1; letter-spacing: .02em; }
    .evo-sub { font-size: .48rem; color: var(--text-muted); line-height: 1; text-align: center; white-space: nowrap; }
    .evo-dash-line { width: 14px; border-top: 1.5px dashed var(--text-dim); flex-shrink: 0; }
    .evo-gem { width: 14px; height: 14px; flex-shrink: 0; border-radius: 3px; overflow: hidden; }
    .evo-gem img { width: 100%; height: 100%; object-fit: cover; display: block; }
    /* merge-bar: stacked rows on left → bar → output right (dual/Vandalier/Universitas) */
    .evo-merge { display: flex; align-items: stretch; gap: 6px; }
    .evo-merge-rows { display: flex; flex-direction: column; gap: 6px; justify-content: center; }
    .evo-merge-bar { width: 2px; background: var(--border); border-radius: 1px; flex-shrink: 0; min-height: 24px; }
    .evo-merge-out { display: flex; align-items: center; gap: 4px; }
    /* u2f grid: base-evo on left | bar | mid on right-top, union-partner on right-bot | final (centered) */
    .evo-u2f { display: grid; grid-template-columns: auto 2px auto auto; grid-template-rows: auto auto; gap: 4px 6px; align-items: center; }
    .evo-u2f > .u2l { grid-column:1; grid-row:1; display:flex; align-items:center; gap:4px; }
    .evo-u2f > .u2b { grid-column:2; grid-row:1/3; background:var(--border); align-self:stretch; border-radius:1px; }
    .evo-u2f > .u2t { grid-column:3; grid-row:1; display:flex; align-items:center; gap:4px; }
    .evo-u2f > .u2m { grid-column:3; grid-row:2; display:flex; align-items:center; gap:4px; }
    .evo-u2f > .u2f { grid-column:4; grid-row:1/3; display:flex; align-items:center; gap:4px; }
    /* triple/quad union: stacked inputs + bar + final */
    .evo-multi-union { display: flex; align-items: stretch; gap: 6px; }
    .evo-multi-inputs { display: flex; flex-direction: column; gap: 4px; justify-content: center; }
    /* collection finals */
    .evo-coll-wrap { display: flex; flex-direction: column; gap: 4px; }
    .evo-coll-inputs { display: flex; flex-wrap: wrap; gap: 3px; }
    /* pentagram (FivePassive) */
    .evo-pentagram { position: relative; width: 110px; height: 110px; margin: .4rem 0; }
    .evo-pentagram .ep-item { position: absolute; transform: translate(-50%,-50%); }
    .evo-pentagram .ep-center { position: absolute; top: 50%; left: 50%; transform: translate(-50%,-50%); }
    /* hexagram (Tuna) */
    .evo-hexagram { position: relative; width: 160px; height: 150px; margin: .4rem 0; }
    .evo-hexagram .eh-item { position: absolute; transform: translate(-50%,-50%); }
    .evo-hexagram .eh-label { position: absolute; font-size: .44rem; color: var(--text-muted); white-space: nowrap; transform: translate(-50%,0); }
    .req-icons { display: flex; gap: 4px; flex-wrap: wrap; margin-top: .3rem; }
    .req-icon { width: 28px; height: 28px; border-radius: 4px; overflow: hidden; }
    .req-icon img { width: 100%; height: 100%; object-fit: cover; }
    .hi-badge {
      display: inline-block;
      font-size: .65rem;
      padding: 1px 4px;
      border-radius: 3px;
      font-family: var(--font-title);
      letter-spacing: .04em;
      margin: 2px;
    }
    .hi-badge.char   { background: rgba(58,122,217,.25);  color: #6aadff; border: 1px solid rgba(58,122,217,.4);  }
    .hi-badge.arcana { background: rgba(155,63,217,.25);   color: #c08dff; border: 1px solid rgba(155,63,217,.4);  }
    .hi-badge.item   { background: rgba(42,170,96,.25);    color: #6ae8a4; border: 1px solid rgba(42,170,96,.4);   }

    /* ── Character grid (overlay) ── */
    .char-grid {
      display: grid;
      grid-template-columns: repeat(4, 1fr);
      gap: 8px;
      align-content: flex-start;
    }
    .char-grid .stack-wrapper {
      width: 100%;
      height: auto;
      aspect-ratio: 1;
    }
    .char-card {
      width: 100%;
      aspect-ratio: 1;
      cursor: pointer;
      overflow: hidden;
      position: relative;
      border-radius: 8px;
      transition: box-shadow .15s, filter .15s;
    }
    .char-card img { width: 100%; height: 100%; object-fit: cover; image-rendering: pixelated; }
    .char-card:hover img { filter: brightness(1.15); }
    .char-card.selected { box-shadow: 0 0 0 3px var(--gold), 0 0 12px rgba(232,184,32,.5); }
    .char-card.broken {
      background: var(--slot-bg);
      border: 2px solid var(--slot-border);
    }
    .char-card.stacked::before {
      content: '';
      position: absolute; inset: -3px;
      background: var(--surface2);
      border: 2px solid var(--slot-border);
      border-radius: 9px;
      z-index: -1;
      transform: translate(4px, 4px);
    }
    .variant-count {
      position: absolute; top: 2px; right: 2px;
      background: rgba(0,0,0,.75);
      color: var(--gold);
      font-size: 8px;
      font-family: var(--font-title);
      padding: 1px 3px;
      border-radius: 2px;
    }

    /* arcana overlay two-panel (no left stats) */
    .ovl-center-wide { flex: 1; overflow-y: auto; padding: .75rem; }

    /* stage grid */
    .stage-grid { display: flex; flex-direction: column; gap: 4px; }
    .stage-row {
      display: flex; align-items: center; gap: .6rem;
      padding: .4rem .6rem;
      border: 1px solid transparent;
      border-radius: 6px;
      cursor: pointer;
      transition: background .15s, border-color .15s;
      font-size: .85rem;
    }
    .stage-row:hover { background: var(--surface2); border-color: var(--border); }
    .stage-row.selected { background: rgba(232,184,32,.1); border-color: var(--gold); color: var(--gold); }
    .stage-row .stage-icon {
      width: 32px; height: 32px;
      border-radius: 4px; overflow: hidden;
      flex-shrink: 0;
      display: flex; align-items: center; justify-content: center;
      font-size: .7rem; color: var(--text-dim);
    }

    /* scrollbar */
    ::-webkit-scrollbar { width: 6px; }
    ::-webkit-scrollbar-track { background: transparent; }
    ::-webkit-scrollbar-thumb { background: var(--border); border-radius: 3px; }
    ::-webkit-scrollbar-thumb:hover { background: var(--border-hi); }

    /* ── Responsive ── */
    @media (max-width: 700px) {
      .players-grid.p3, .players-grid.p4 { grid-template-columns: 1fr 1fr; }
      .players-grid.p2 { grid-template-columns: 1fr; }
      .overlay-panel { width: 95vw; }
      .ovl-left, .ovl-right { width: 140px; }
    }
    @media (max-width: 480px) {
      .ovl-left { display: none; }
      .ovl-right { width: 160px; }
    }
  </style>

<body>
  <div id="app"></div>
  <div id="overlay-root" class="hidden"></div>

  <script src="data/data.js"></script>
  <script>
  // ═══════════════════════════════════════════════════════
  //  CONSTANTS
  // ═══════════════════════════════════════════════════════

  const SLOT_COUNTS = {
    1: { weapons: 6, passives: 6 },
    2: { weapons: 4, passives: 4 },
    3: { weapons: 3, passives: 3 },
    4: { weapons: 2, passives: 2 },
  };

  const STAT_LABELS = {
    max_health: 'Max Health', recovery: 'Recovery',   armor: 'Armor',
    move_speed: 'Move Speed', might: 'Might',          speed: 'Proj. Speed',
    duration:   'Duration',   area: 'Area',             cooldown: 'Cooldown',
    amount:     'Amount',     revival: 'Revival',       magnet: 'Magnet',
    luck:       'Luck',       growth: 'Growth',         greed: 'Greed',
    curse:      'Curse',
  };

  // Stats expressed as percentage multipliers (0.4 → +40%)
  const PCT_STATS      = new Set(['move_speed','might','speed','duration','area','cooldown','luck','growth','greed','curse']);
  const INVERTED_STATS = new Set(['cooldown']); // negative is good

  const EMPTY_ICONS = {
    char:    'assets/icons/characters/empty.png',
    weapon:  'assets/icons/weapons/empty.png',
    passive: 'assets/icons/passives/empty.png',
    arcana:  'assets/icons/arcana/empty.png',
    stage:   'assets/icons/stages/empty.png',
  };
  const EMPTY_ICON = EMPTY_ICONS.passive;

  // Hardcoded stages (pending stages.csv)
  const STAGES = [
    { name: 'Mad Forest',       items: ['Hollow Heart','Pummarola','Candelabrador','Bracer'] },
    { name: 'Inlaid Library',   items: ['Metaglio Left','Metaglio Right','Spellbinder','Crown'] },
    { name: 'Dairy Plant',      items: ['Silver Ring','Gold Ring','Attractorb','Clover'] },
    { name: 'Gallo Tower',      items: ['Clock Lancet','Laurel','Spinach','Wings'] },
    { name: 'Cappella Magna',   items: ['Pentagram Crown','Empty Tome','Stone Mask'] },
    { name: 'The Bone Zone',    items: ['Skull O\'Maniac','Armor'] },
    { name: 'Holy Forbidden',   items: [] },
    { name: 'Moongolow',        items: [] },
    { name: 'Boss Rash',        items: [] },
    { name: 'Il Molise',        items: [] },
    { name: 'Green Acres',      items: [] },
    { name: 'Bat Country',      items: [] },
    { name: 'Tiny Bridge',      items: [] },
    { name: 'Misty Mountains',  items: [] },
    { name: 'Lake Foscari',     items: ['Parm Aegis','Torrona\'s Box'] },
    { name: 'Abyss Foscari',    items: [] },
    { name: 'Forest Foscari',   items: [] },
    { name: 'Mt. Moonspell',    items: [] },
    { name: 'Starroad',         items: [] },
    { name: 'Eudaimonia M.',    items: [] },
  ];

  // ═══════════════════════════════════════════════════════
  //  STATE
  // ═══════════════════════════════════════════════════════

  let D = null; // VS_DATA

  const state = {
    page: 'landing',
    playerCount: 1,
    players: [],
    arcana: [null, null, null], // global — shared across all players
    stage: null,                // global — shared across all players
    infoPanel: null,
    overlay: null,   // { type, playerIdx, slotIdx, slotType, fromEmpty, prevItem }
    ovl: {
      selected: null,
      variantIdx: {}, // baseName → idx
      stackIdx: {},   // baseNum → idx (0=arcana,1=darkana)
      search: '',
    },
    puActive: false,
    powerUps: {}, // stat name → current level (initialized from D.stats on load)
    banish: {
      active: false,
      selected: new Set(),
      minRarity: 50,     // default: recommend weapons rarity >= 50
      banishPassives: false,
    },
  };

  function makePlayer() {
    return { character: null, weapons: [], passives: [] };
  }

  function initPlayers(newCount, prevPlayers = []) {
    const players = [];
    for (let i = 0; i < newCount; i++) {
      players.push(prevPlayers[i] ? prevPlayers[i] : makePlayer());
    }
    // Trim weapon/passive slots to new count (slots already on player object)
    return players;
  }

  // ═══════════════════════════════════════════════════════
  //  DATA HELPERS
  // ═══════════════════════════════════════════════════════

  function weaponByName(name) { return D.weapons.find(w => w.name === name) || null; }
  function passiveByName(name) { return D.passives.find(p => p.name === name) || null; }

  // ── Evo path renderer ────────────────────────────────────────────────────

  function evoPathsFor(name) {
    return (D.evoPaths || []).filter(ep => ep.related_to.includes(name) || ep.evo_path === name);
  }

  function evoIcon(name) {
    if (!name) return EMPTY_ICON;
    const w = D.weapons.find(x => x.name === name); if (w) return w.icon || EMPTY_ICON;
    const p = D.passives.find(x => x.name === name); if (p) return p.icon || EMPTY_ICON;
    const a = D.arcana.find(x => x.name === name);   if (a) return a.icon || EMPTY_ICON;
    const c = D.characters.find(x => x.name === name); if (c) return c.icon || EMPTY_ICON;
    return EMPTY_ICON;
  }

  function eNode(name, { cur = false, max = false, hidden = false, sub = null } = {}) {
    if (!name) return '';
    const icon = evoIcon(name);
    let cls = 'evo-node'; if (cur) cls += ' current'; if (hidden) cls += ' evo-hidden';
    const img = `<img src="${esc(icon)}" alt="${esc(name)}" onerror="this.src='${esc(EMPTY_ICON)}'">`;
    const nd = `<div class="${cls}" title="${esc(name)}">${img}</div>`;
    const extras = [];
    if (max) extras.push(`<div class="evo-max">MAX</div>`);
    if (sub) extras.push(`<div class="evo-sub">${esc(sub)}</div>`);
    if (!extras.length) return nd;
    return `<div class="evo-nw">${nd}${extras.join('')}</div>`;
  }

  const EP = `<span class="evo-op">+</span>`;
  const EA = `<span class="evo-op">→</span>`;

  // Small Gemini connector node — replaces ← [gem] + between counterpart and base.
  // pos: 'top' = align-self:flex-start, 'bot' = flex-end, 'center' = center
  function gemNode(name, pos = 'center') {
    const icon = evoIcon(name);
    const as = pos === 'top' ? 'flex-start' : pos === 'bot' ? 'flex-end' : 'center';
    return `<div class="evo-gem" style="align-self:${as}" title="${esc(name)}"><img src="${esc(icon)}" alt="${esc(name)}" onerror="this.src='${esc(EMPTY_ICON)}'"></div>`;
  }

  function eRow(...parts) { return `<div class="evo-row">${parts.join('')}</div>`; }

  function mergeBar(leftRows, rightHTML) {
    const rows = leftRows.map(r => `<div class="evo-row">${r}</div>`).join('');
    return `<div class="evo-merge"><div class="evo-merge-rows">${rows}</div><div class="evo-merge-bar"></div><div class="evo-merge-out">${rightHTML}</div></div>`;
  }

  // Grid layout: base-evo left | bar | mid(top) + union-partner(bot) | final(centered)
  function u2f(leftHTML, midHTML, partHTML, finalHTML) {
    return `<div class="evo-u2f"><div class="u2l">${leftHTML}</div><div class="u2b"></div><div class="u2t">${midHTML}</div><div class="u2m">${partHTML}</div><div class="u2f">${finalHTML}</div></div>`;
  }

  function buildEvoChainHTML(w) {
    const paths = evoPathsFor(w.name);
    if (!paths.length) return '';
    const sections = paths.map(ep => renderEvoPath(ep, w.name)).filter(Boolean);
    if (!sections.length) return '';
    return `<div class="detail-section"><h3>Evolution</h3><div class="evo-flow">${sections.join('')}</div></div>`;
  }

  function renderEvoPath(ep, cur) {
    const n = (name, opts = {}) => eNode(name, { ...opts, cur: name === cur });
    const { b1_1, b1_2, b1_3, b1_4, b1_r, b2_1, b2_2, b2_r, b3_1, b3_2, b3_r, pattern: pat } = ep;

    if (pat === 'Final') return '';

    if (pat === 'Evo>Final')
      return eRow(n(b1_1), EP, n(b1_2), EA, n(b1_r));

    if (pat === 'Evo(Max)>Final')
      return eRow(n(b1_1), EP, n(b1_2, { max: true }), EA, n(b1_r));

    if (pat === 'Evo(Max)>HiddenFinal')
      return eRow(n(b1_1), EP, n(b1_2, { max: true }), EA, n(b1_r, { hidden: true, sub: 'Hidden' }));

    if (pat === 'TwoReqEvo>Final')
      return eRow(n(b1_1), EP, n(b1_2), EP, n(b1_3), EA, n(b1_r));

    if (pat === 'TwoReqEvo(Max)>Final')
      return eRow(n(b1_1), EP, n(b1_2, { max: true }), EP, n(b1_3, { max: true }), EA, n(b1_r));

    if (pat === 'Evo>Union>Final') {
      // left: [b1_1]+[b1_2] | mid: [b1_r] | bot: [b2_2] (aligned with mid) | final: +→[b2_r]
      return u2f(n(b1_1) + EP + n(b1_2), n(b1_r), n(b2_2), EP + EA + n(b2_r));
    }

    if (pat === 'TripleUnion>Final') {
      return `<div class="evo-multi-union"><div class="evo-multi-inputs">${[b1_1,b1_2,b1_3].map(nm => `<div class="evo-row">${n(nm)}</div>`).join('')}</div><div class="evo-merge-bar"></div><div class="evo-merge-out">${EA}${n(b1_r)}</div></div>`;
    }

    if (pat === 'QuadUnion>HiddenFinal') {
      return `<div class="evo-multi-union"><div class="evo-multi-inputs">${[b1_1,b1_2,b1_3,b1_4].map(nm => `<div class="evo-row">${n(nm)}</div>`).join('')}</div><div class="evo-merge-bar"></div><div class="evo-merge-out">${EA}${n(b1_r, { hidden: true, sub: 'Hidden' })}</div></div>`;
    }

    if (pat === 'EzEvo>EzEvo>Final')
      return eRow(n(b1_1), EA, n(b1_r), EA, n(b3_1));

    if (pat === 'EzEvo>EzEvo>Union>Final') {
      // left: [b1_1]→[b1_r] | mid: [b2_r] | bot: [b3_2] (aligned) | final: +→[b3_r]
      return u2f(n(b1_1) + EA + n(b1_r), n(b2_r), n(b3_2), EP + EA + n(b3_r));
    }

    if (pat === 'EzEvo>AlucardGiftFinal') {
      const examples = ['Bloody Tear','Holy Wand','Thousand Edge','Death Spiral','Heaven Sword'];
      const dimRow = `<div class="evo-row" style="gap:2px;opacity:.45">${examples.map(nm => n(nm, { hidden: true })).join('')}<span class="evo-sub" style="align-self:center;margin-left:4px">+5 evos</span></div>`;
      return eRow(n(b1_1), EA, n(b1_r), EA, n(b2_1, { hidden: true, sub: 'Hidden' })) + dimRow;
    }

    if (pat === 'Counterpart:Final')
      return eRow(n(b1_r), gemNode(b1_2), n(b1_1));

    if (pat === 'Counterpart:Evo(Max)>Final')
      return eRow(n(b1_r), gemNode(b1_2), n(b1_1), EP, n(b2_2, { max: true }), EA, n(b2_r));

    if (pat === 'Counterpart:Evo>Union>Final') {
      // base shown once; gemNode replaces ←[gem]+ between counterpart and base
      return u2f(
        n(b1_r) + gemNode(b1_2) + n(b1_1) + EP + n(b2_2),
        n(b2_r),
        n(b3_2),
        EP + EA + n(b3_r)
      );
    }

    if (pat === 'Counterpart:TwoReqEvo>Final')
      return eRow(n(b1_r), gemNode(b1_2), n(b1_1), EP, n(b2_2), EA, n(b2_r));

    if (pat === 'Dual(Counterpart):Union>Final') {
      // gem in row 1 sits toward top, row 2 toward bottom — visually anchors each to its row
      return mergeBar(
        [n(b1_r) + gemNode(b1_2, 'top') + n(b1_1) + EA, n(b2_r) + gemNode(b2_2, 'bot') + n(b2_1) + EA],
        n(b3_r)
      );
    }

    if (pat === 'Dual(Evo(Max))>HiddenFinal') {
      return mergeBar(
        [n(b1_1) + EP + n(b1_2, { max: true }) + EA + n(b1_r) + EA, n(b2_1) + EP + n(b2_2, { max: true }) + EA + n(b2_r) + EA],
        n(b3_r, { hidden: true, sub: 'Hidden' })
      );
    }

    if (pat === 'ChaosEvolution>Final') {
      // b1_1=chaos item, b1_2=character, b1_3=base weapon, b1_r=final
      const chaosNode = `<div class="evo-nw">${n(b1_2)}<div class="evo-sub">Lv.80</div></div>`;
      return eRow(n(b1_3), EA, chaosNode, EA, n(b1_r));
    }

    if (pat === 'GlimmerEzEvo>GlimmerEzEvo>Final')
      return eRow(n(b1_1), EA, n(b1_r), EA, n(b2_r));

    if (pat === 'GlimmerEvo>Final')
      return b1_3 ? eRow(n(b1_1), EP, n(b1_3), EA, n(b1_r)) : eRow(n(b1_1), EA, n(b1_r));

    const COLL_PATS = ['Magic Whip>Final','Vampire-Killing Tool>Final','Magic Weapon>Final',
      "Belnades' Spell>Final",'Ambiguous Power>Final','Familiar>Final','Emerald Diorama>Final'];
    if (COLL_PATS.includes(pat)) {
      if (cur !== ep.evo_path) return '';
      // new format: b1_1 holds the pipe-delimited ingredient list
      // old format (Familiar Forge, Intuition not yet updated): fall back to related_to
      const inputs = (b1_1 && b1_1.includes('|'))
        ? b1_1.split('|').map(s => s.trim()).filter(Boolean)
        : ep.related_to.filter(nm => nm !== ep.evo_path);
      const MAX_ROW = 8;
      let rows = '';
      for (let i = 0; i < inputs.length; i += MAX_ROW)
        rows += `<div class="evo-coll-inputs">${inputs.slice(i, i + MAX_ROW).map(nm => n(nm)).join('')}</div>`;
      return `<div class="evo-coll-wrap">${rows}<div class="evo-row" style="margin-top:2px">${EA}${n(ep.evo_path)}</div></div>`;
    }

    if (pat === 'Gift(Treasure)>Final')
      return eRow(n(b1_1), EA, n(b1_2), `<span class="evo-op" title="Luck roll">🍀</span>`, EA, n(b1_r));

    if (pat === 'FivePassive>Final') {
      const angles = [270, 342, 54, 126, 198];
      const r = 36, cx = 55, cy = 55;
      const items = angles.map(deg => {
        const rd = deg * Math.PI / 180;
        return `<div class="ep-item" style="left:${cx + r * Math.cos(rd)}px;top:${cy + r * Math.sin(rd)}px">${n(b1_1)}</div>`;
      }).join('');
      return `<div class="evo-pentagram">${items}<div class="ep-center">${n(b1_r)}</div></div>`;
    }

    if (pat === 'Tuna>Final') {
      const forms = [b1_2, b1_3, b2_1, b2_2, b3_1, b3_2];
      const r = 52, cx = 80, cy = 75;
      const hexItems = forms.map((nm, i) => {
        const rd = (i * 60 - 90) * Math.PI / 180;
        return `<div class="eh-item" style="left:${cx + r * Math.cos(rd)}px;top:${cy + r * Math.sin(rd)}px">${n(nm)}</div>`;
      }).join('');
      const labelX = cx + 18, labelY = cy + 18;
      return `<div class="evo-hexagram">
        ${hexItems}
        <div class="eh-item" style="left:${cx - 18}px;top:${cy}px">${n(b1_1)}</div>
        <div class="eh-item" style="left:${cx + 18}px;top:${cy}px">${n(b3_r)}</div>
        <div class="eh-label" style="left:${labelX}px;top:${labelY}px">6 Evolutions</div>
      </div>`;
    }

    return '';
  }

  function getEvolutionPassiveStatus(selW, playerIdx) {
    const player = state.players[playerIdx];
    const counts = SLOT_COUNTS[state.playerCount];
    const pending = []; // {name, slot}
    const missing = []; // names
    const virtuallyTaken = new Set();
    for (const req of (selW.requirements || [])) {
      if (!D.passives.some(p => p.name === req)) continue; // weapon req, skip
      if (player.passives.some(p => p && p.name === req)) continue; // already equipped
      const emptySlot = player.passives.findIndex(
        (p, i) => !p && i < counts.passives && !virtuallyTaken.has(i)
      );
      if (emptySlot >= 0) { virtuallyTaken.add(emptySlot); pending.push({ name: req, slot: emptySlot }); }
      else missing.push(req);
    }
    return { pending, missing };
  }

  // Group characters by base_name, preserving CSV order of first appearance
  function charGroups() {
    const order = [];
    const map = {};
    for (const c of D.characters) {
      const key = c.base_name || c.name;
      if (!map[key]) { map[key] = []; order.push(key); }
      map[key].push(c);
    }
    return order.map(k => map[k]);
  }

  // Group arcana: pair Arcana + Darkana sharing the same base_num
  function arcanaGroups() {
    const order = [];
    const map = {};
    for (const a of D.arcana) {
      const key = a.base_num || a.number;
      if (!map[key]) { map[key] = []; order.push(key); }
      map[key].push(a);
    }
    // Sort so Arcana type comes before Darkana within each group
    return order.map(k => {
      const g = map[k];
      g.sort((a, b) => (a.type === 'Arcana' ? -1 : 1) - (b.type === 'Arcana' ? -1 : 1));
      return g;
    });
  }

  // ═══════════════════════════════════════════════════════
  //  EVOLUTION
  // ═══════════════════════════════════════════════════════

  function computeEffectiveWeapon(weapon, player) {
    if (!weapon || !weapon.trans_result) return weapon;
    const passiveNames = new Set(player.passives.filter(Boolean).map(p => p.name));
    const weaponNames  = new Set(player.weapons.filter(Boolean).map(w => w.name));
    const all = new Set([...passiveNames, ...weaponNames]);
    const met = weapon.requirements.every(r => all.has(r));
    if (!met) return weapon;
    const evolved = weaponByName(weapon.trans_result);
    if (!evolved) return weapon;
    return computeEffectiveWeapon(evolved, player); // chain-evolve
  }

  // ═══════════════════════════════════════════════════════
  //  HIGHLIGHTS: which weapons are associated with char / arcana / items
  // ═══════════════════════════════════════════════════════

  function getHighlights(playerIdx) {
    const player = state.players[playerIdx];
    if (!player) return { weaponHi: new Set(), passiveHi: new Set(), arcanaHi: new Set() };
    const char = player.character;
    const selectedWeaponNames = player.weapons.filter(Boolean).map(w => w.name);
    const selectedArcana = state.arcana.filter(Boolean);

    // weapons highlighted by character
    const charWeapons = new Set(char ? char.starting_weapons : []);

    // weapons highlighted by selected arcana
    const arcanaWeapons = new Set();
    for (const arc of selectedArcana) {
      if (!arc.weapon_col) continue;
      for (const w of D.weapons) {
        if (w.arcana_ratings[arc.weapon_col]) arcanaWeapons.add(w.name);
      }
    }

    // passives highlighted: those that are requirements for selected weapons
    const passiveHi = new Set();
    for (const w of player.weapons.filter(Boolean)) {
      for (const req of w.requirements) passiveHi.add(req);
    }

    // arcana highlighted by selected weapons
    const arcanaHi = new Set();
    for (const w of player.weapons.filter(Boolean)) {
      for (const col of Object.keys(w.arcana_ratings)) arcanaHi.add(col);
    }

    return { charWeapons, arcanaWeapons, passiveHi, arcanaHi };
  }

  // ═══════════════════════════════════════════════════════

  function esc(s) {
    return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
  }

  function slotHTML(item, opts = {}) {
    const { type = 'weapon', playerIdx = 0, slotIdx = 0,
            evolved = false, hidden = false, removable = true, locked = false } = opts;
    const isChar  = type === 'char';
    const emptyIcon = EMPTY_ICONS[type] || EMPTY_ICONS.weapon;
    const icon = (item && item.icon) ? item.icon : emptyIcon;
    const classes = [
      'slot',
      isChar ? 'slot-char' : '',
      type === 'arcana' ? 'slot-arcana' : '',
      type === 'stage'  ? 'slot-stage'  : '',
      evolved ? 'evolved' : '',
      hidden  ? 'hidden-weapon' : '',
      locked  ? 'slot-locked'   : '',
    ].filter(Boolean).join(' ');

    const removeBtn = (!hidden && removable && item && !locked)
      ? `<button class="slot-remove" data-action="remove-slot" data-player="${playerIdx}" data-slot="${slotIdx}" data-type="${type}" title="Remove">×</button>`
      : '';

    const imgTag = `<img src="${esc(icon)}" alt="${item ? esc(item.name) : ''}" onerror="this.src='${emptyIcon}'">`;
    const slotAction = hidden ? '' : item ? 'view-slot' : locked ? '' : 'open-slot';

    const lockIcon = locked ? `<img class="slot-lock" src="assets/icons/ui/locked.png" alt="">` : '';
    return `<div class="${classes}"
      ${slotAction ? `data-action="${slotAction}"` : ''} data-player="${playerIdx}" data-slot="${slotIdx}" data-type="${type}"
      title="${item ? esc(item.name) + (locked ? ' (starter)' : '') : 'Empty'}">
      ${imgTag}
      ${removeBtn}
      ${lockIcon}
    </div>`;
  }

  function statVal(key, val) {
    if (val === 0) return null;
    const pct = PCT_STATS.has(key);
    const num = pct ? Math.round(val * 100) : val;
    const sign = num > 0 ? '+' : '';
    const suffix = pct ? '%' : '';
    const isGood = INVERTED_STATS.has(key) ? num < 0 : num > 0;
    const cls = isGood ? 'pos' : 'neg';
    return `<span class="stat-val ${cls}">${sign}${num}${suffix}</span>`;
  }

  function statsHTML(char) {
    let rows = '';
    for (const [key, label] of Object.entries(STAT_LABELS)) {
      const rawChar = char ? (char.stats[key] || 0) : 0;
      const { dispBase, dispChar, dispPU, total, isPct, isCapped } = calcStatTotal(key, char?.stats);
      const suffix = isPct ? '%' : '';
      const charIsZero = dispChar === 0;
      const charSign = dispChar > 0 ? '+' : '';
      const isGood = INVERTED_STATS.has(key) ? dispChar < 0 : dispChar > 0;
      const charCls = charIsZero ? '' : (isGood ? 'pos' : 'neg');
      const charDisplay = charIsZero
        ? '<span class="stat-char stat-val">—</span>'
        : `<span class="stat-char stat-val ${charCls}">${charSign}${dispChar}${suffix}</span>`;
      const puDisplay = dispPU
        ? `<span class="stat-pu">${dispPU}</span>`
        : '<span class="stat-pu" style="color:var(--text-muted)">—</span>';
      const changed = rawChar !== 0;
      const rowCls = ['stat-row', changed ? 'changed' : '', isCapped ? 'capped' : ''].filter(Boolean).join(' ');
      rows += `<div class="${rowCls}">
        <span class="stat-key">${label}</span>
        <span class="stat-base">${dispBase}</span>
        ${charDisplay}
        ${puDisplay}
        <span class="stat-total">${total}${suffix}</span>
      </div>`;
    }
    const header = `<div class="stat-header"><span>Stat</span><span>Base</span><span>Char</span><span>PU</span><span>Total</span></div>`;
    return `<div class="stat-grid">${header}${rows}</div>`;
  }

  function buildInfoSidebar(panel) {
    if (!panel) {
      return `<div class="info-sidebar">
        <div class="info-sidebar-empty">Left-click a slot<br>to see details<br><br>Right-click to change</div>
      </div>`;
    }
    const { type, playerIdx, slotIdx } = panel;
    const player = state.players[playerIdx];

    let item = null;
    if (type === 'char')    item = player?.character;
    else if (type === 'weapon')  {
      const base = player?.weapons[slotIdx];
      item = computeEffectiveWeapon(base, player) || base;
    }
    else if (type === 'passive') item = player?.passives[slotIdx];
    else if (type === 'arcana')  item = state.arcana[slotIdx];
    else if (type === 'stage')   item = state.stage;

    if (!item) return `<div class="info-sidebar"><div class="info-sidebar-empty">Empty slot</div></div>`;

    const icon = (item.icon) ? item.icon : (EMPTY_ICONS[type] || EMPTY_ICONS.weapon);
    let html = `<div class="detail-icon"><img src="${esc(icon)}" onerror="this.src='${EMPTY_ICONS[type]||EMPTY_ICONS.weapon}'"></div>`;
    html += `<div class="detail-name">${esc(item.name)}</div>`;
    if (item.description) html += `<div class="detail-desc">${esc(item.description)}</div>`;

    if (type === 'char') {
      if (item.starting_weapons?.length) {
        html += `<div class="detail-section"><span class="detail-section-label">Starting Weapons</span><div class="req-row">`;
        for (const wn of item.starting_weapons) {
          const w = weaponByName(wn);
          html += `<div class="req-icon" title="${esc(wn)}">${w ? `<img src="${esc(w.icon||EMPTY_ICONS.weapon)}" onerror="this.src='${EMPTY_ICONS.weapon}'">` : `<span style="font-size:.55rem">${esc(wn.slice(0,6))}</span>`}</div>`;
        }
        html += `</div></div>`;
      }
      html += statsHTML(item);
    }

    if (type === 'weapon') {
      const wObj = D.weapons.find(w => w.name === item.name);
      if (wObj?.trans_result) {
        const ev = weaponByName(wObj.trans_result);
        html += `<div class="detail-section"><span class="detail-section-label">Evolves Into</span><div class="req-row">`;
        if (ev) html += `<div class="req-icon" title="${esc(ev.name)}"><img src="${esc(ev.icon||EMPTY_ICONS.weapon)}" onerror="this.src='${EMPTY_ICONS.weapon}'"></div>`;
        html += `</div></div>`;
        if (wObj.trans_reqs?.length) {
          html += `<div class="detail-section"><span class="detail-section-label">Requires</span><div class="req-row">`;
          for (const r of wObj.trans_reqs) {
            const pi = passiveByName(r);
            html += `<div class="req-icon" title="${esc(r)}">${pi ? `<img src="${esc(pi.icon||EMPTY_ICONS.passive)}" onerror="this.src='${EMPTY_ICONS.passive}'">` : `<span style="font-size:.55rem">${esc(r.slice(0,6))}</span>`}</div>`;
          }
          html += `</div></div>`;
        }
      }
    }

    if (type === 'passive') {
      const related = D.weapons.filter(w => w.trans_reqs?.includes(item.name));
      if (related.length) {
        html += `<div class="detail-section"><span class="detail-section-label">Used for Evolution</span><div class="req-row">`;
        for (const w of related.slice(0, 8)) {
          html += `<div class="req-icon" title="${esc(w.name)}"><img src="${esc(w.icon||EMPTY_ICONS.weapon)}" onerror="this.src='${EMPTY_ICONS.weapon}'"></div>`;
        }
        html += `</div></div>`;
      }
    }

    if (type === 'arcana') {
      const aObj = D.arcana.find(a => a.name === item.name);
      if (aObj) html += `<div class="hi-badge arcana" style="text-align:center;margin:.4rem 0">${esc(aObj.type)} · ${esc(aObj.number)}</div>`;
    }

    return `<div class="info-sidebar">${html}</div>`;
  }

  function renderPlanning() {
    const { playerCount, players, infoPanel } = state;
    const counts = SLOT_COUNTS[playerCount];

    const playerCards = players.map((player, idx) => {
      const char = player.character;
      const eff  = player.weapons.map(w => computeEffectiveWeapon(w, player));

      // ── Character slot
      const charSlot = slotHTML(char, { type:'char', playerIdx:idx, slotIdx:0, removable: !!char });

      // ── Weapon slots
      const starterCount = char ? Math.min(char.starting_weapons.length, counts.weapons) : 0;
      const wSlots = Array.from({length: counts.weapons}, (_, si) => {
        const base = player.weapons[si] || null;
        const ev   = eff[si] || null;
        const isEvolved = base && ev && base.name !== ev.name;
        const isLocked = si < starterCount;
        return slotHTML(ev, { type:'weapon', playerIdx:idx, slotIdx:si, evolved:isEvolved, locked:isLocked });
      }).join('');

      // ── Hidden weapons (char starting weapons beyond slot count)
      let hiddenSlots = '';
      if (char) {
        const occupied = player.weapons.filter(Boolean).map(w => w.name);
        const hidden = char.starting_weapons.slice(counts.weapons)
          .filter(wn => !occupied.includes(wn));
        if (hidden.length) {
          hiddenSlots += '<div class="hidden-divider"></div>';
          hiddenSlots += hidden.map(wn => slotHTML(weaponByName(wn), {
            type:'weapon', playerIdx:idx, slotIdx:-1, hidden:true
          })).join('');
        }
      }

      // ── Passive slots
      const pSlots = Array.from({length: counts.passives}, (_, si) =>
        slotHTML(player.passives[si] || null, { type:'passive', playerIdx:idx, slotIdx:si })
      ).join('');

      return `<div class="player-card">
        <div class="player-header">
          <div class="player-header-left">
            <span class="player-name">Player ${idx+1}</span>
            ${char ? `<span class="char-name">— ${esc(char.name)}</span>` : ''}
          </div>
          <div class="player-header-actions">
            <button class="btn btn-sm" data-action="clear-player" data-player="${idx}" title="Clear all">✕ Clear</button>
          </div>
        </div>
        <div class="player-body">
          <div class="char-col">${charSlot}</div>
          <div class="slots-col">
            <div class="slot-row">
              <span class="slot-row-label">Weapons</span>
              ${wSlots}${hiddenSlots}
            </div>
            <div class="slot-row">
              <span class="slot-row-label">Passives</span>
              ${pSlots}
            </div>
          </div>
        </div>
      </div>`;
    }).join('');

    // ── Global arcana + stage row
    const gASlots = state.arcana.map((arc, si) =>
      slotHTML(arc, { type:'arcana', playerIdx:0, slotIdx:si })
    ).join('');
    const gStageSlot = slotHTML(state.stage ? { name:state.stage.name, icon:'' } : null,
      { type:'stage', playerIdx:0, slotIdx:0 });

    document.getElementById('app').innerHTML = `
      <div id="planning">
        <div class="planning-header">
          <h1>Vampire Survivors Build Calculator</h1>
          <div class="planning-header-actions">
            <button class="btn" data-action="open-power-ups">Power-Ups</button>
            <button class="btn" data-action="open-banish">Banish Advisor</button>
            <button class="btn btn-back" data-action="change-player-count">⟵ Change Player Count</button>
          </div>
        </div>
        <div class="planning-body">
          <div class="planning-main">
            <div class="players-grid p${playerCount}">${playerCards}</div>
            <div class="global-row">
              <div class="global-row-inner">
                <span class="slot-row-label">Arcana</span>
                ${gASlots}
                <div style="flex:1"></div>
                <span class="slot-row-label" style="width:auto;margin-right:.3rem">Stage</span>
                ${gStageSlot}
              </div>
            </div>
          </div>
          ${buildInfoSidebar(state.infoPanel)}
        </div>
      </div>`;
  }

  function weaponOverlayHTML(playerIdx, slotIdx) {
    const player = state.players[playerIdx];
    const sel    = state.ovl.selected;
    const { charWeapons, arcanaWeapons } = getHighlights(playerIdx);
    const usedWeapons = new Set(player.weapons.filter((w, i) => w && i !== slotIdx).map(w => w.name));

    // Banish layout order for sorting
    const banishOrder = new Map();
    D.banishLayout.forEach((name, i) => { if (name) banishOrder.set(name, i); });

    // Reverse map: evolution name → base weapon name
    const baseByEvo = new Map();
    D.weapons.forEach(w => { if (w.trans_result) baseByEvo.set(w.trans_result, w.name); });

    function weaponSortKey(w) {
      const base = baseByEvo.get(w.name) ?? w.name;
      return banishOrder.get(base) ?? banishOrder.get(w.name) ?? 9999;
    }

    const baseWeapons = D.weapons.filter(w => w.category === 'Base')
      .slice().sort((a, b) => weaponSortKey(a) - weaponSortKey(b));

    // Group non-base by category, each group sorted by base weapon order
    const evoGroups = new Map();
    D.weapons.filter(w => w.category !== 'Base').forEach(w => {
      if (!evoGroups.has(w.category)) evoGroups.set(w.category, []);
      evoGroups.get(w.category).push(w);
    });
    for (const arr of evoGroups.values()) arr.sort((a, b) => weaponSortKey(a) - weaponSortKey(b));

    function makeCard(w) {
      const isSel  = sel && sel.name === w.name;
      const isUsed = usedWeapons.has(w.name);
      const isEvo  = w.category !== 'Base';
      const hiChar   = charWeapons.has(w.name);
      const hiArcana = arcanaWeapons.has(w.name);
      let cls = 'item-card';
      if (isSel) cls += ' selected';
      else if (isEvo) cls += ' evo';
      if (!isSel && hiChar)   cls += ' hi-char';
      else if (!isSel && hiArcana) cls += ' hi-arcana';
      if (isUsed) cls += ' dim';
      return `<div class="${cls}" data-action="ovl-select-item" data-item="${esc(w.name)}" data-item-type="weapon" data-search="${esc(w.name)}" title="${esc(w.name)}">
        <img src="${esc(w.icon||EMPTY_ICON)}" alt="${esc(w.name)}" onerror="this.parentElement.classList.add('broken');this.src='${esc(EMPTY_ICON)}'">
      </div>`;
    }

    let centerHTML = `${searchBarHTML('Search weapons…')}
      <div class="item-section-label">Base Weapons</div>
      <div class="item-grid">${baseWeapons.map(makeCard).join('')}</div>`;
    for (const [cat, weapons] of evoGroups) {
      centerHTML += `<div class="item-section-label" style="margin-top:.75rem">${esc(cat)}</div>
        <div class="item-grid">${weapons.map(makeCard).join('')}</div>`;
    }

    // Left panel: description + level ups for selected weapon
    let leftHTML = '<div class="detail-desc" style="margin-top:.5rem;color:var(--text-muted)">Select a weapon to see details</div>';
    let rightHTML = '';

    if (sel) {
      const w = D.weapons.find(w => w.name === sel.name);
      if (w) {
        leftHTML = `<div class="detail-desc" style="margin:.2rem 0">${esc(w.description)}</div>
          ${w.level_ups.length ? `<div class="detail-section"><h3>Level Ups</h3><ul style="padding-left:1.1rem;margin:.3rem 0">
            ${w.level_ups.map((l,i) => `<li style="font-size:.75rem;margin-bottom:.15rem">Lv${i+1}: ${esc(l)}</li>`).join('')}
          </ul></div>` : ''}`;

        // Requirements with status
        let reqHTML = '';
        if (w.requirements.length) {
          const { pending, missing } = getEvolutionPassiveStatus(w, playerIdx);
          const pendingNames = new Set(pending.map(p => p.name));
          reqHTML = `<div class="detail-section"><h3>Requirements</h3>
            ${w.requirements.map(r => {
              const pObj = passiveByName(r);
              const wObj2 = weaponByName(r);
              const obj = pObj || wObj2;
              const icon = obj ? obj.icon : '';
              let statusHTML = '';
              if (pObj) {
                if (player.passives.some(p => p && p.name === r))
                  statusHTML = '<span class="req-status ok">✓ Equipped</span>';
                else if (pendingNames.has(r))
                  statusHTML = '<span class="req-status add">+ Auto-add</span>';
                else
                  statusHTML = '<span class="req-status miss" title="No passive slot available">✗ No room</span>';
              } else if (wObj2) {
                statusHTML = player.weapons.some(pw => pw && pw.name === r)
                  ? '<span class="req-status ok">✓ In build</span>'
                  : '<span class="req-status miss" title="Add this weapon to the build">✗ Missing</span>';
              }
              return `<div class="req-row">
                <div class="req-icon">${icon ? `<img src="${esc(icon)}" alt="${esc(r)}" onerror="this.src='${esc(EMPTY_ICON)}'">` : ''}</div>
                <span style="flex:1;font-size:.75rem">${esc(r)}</span>${statusHTML}
              </div>`;
            }).join('')}
          </div>`;
        }

        const chainHTML = buildEvoChainHTML(w);

        rightHTML = `<div class="detail-icon"><img src="${esc(w.icon||EMPTY_ICON)}" onerror="this.parentElement.classList.add('broken');this.src='${esc(EMPTY_ICON)}'"></div>
          <div class="detail-name">${esc(w.name)}</div>
          ${w.category !== 'Base' ? `<div style="font-size:.7rem;color:var(--gold);text-align:center;margin-bottom:.2rem">${esc(w.category)}</div>` : ''}
          ${reqHTML}${chainHTML}

            <ul style="padding-left:1rem;margin:.3rem 0">${Object.entries(w.arcana_ratings).slice(0,6).map(([k,v]) =>

            ).join('')}</ul>
          </div>` : ''}`;
      }
    } else {
      rightHTML = '<div class="detail-desc" style="margin-top:1rem;text-align:center">Select a weapon</div>';
    }

    return `<div class="overlay-header">
        <h2>Weapon Slot ${slotIdx+1}</h2>
        <button class="btn btn-icon overlay-close" data-action="ovl-close">✕</button>

      <button class="ovl-search-clear" data-action="ovl-search-clear" tabindex="-1">✕</button>

  function applyOverlaySearch(input) {
    const query = (input.value || '').toLowerCase().trim();
    const center = input.closest('.ovl-center, .ovl-center-wide');
    if (!center) return;
    center.querySelectorAll('[data-search]').forEach(el => {
      const matches = !query || el.dataset.search.toLowerCase().includes(query);
      el.classList.toggle('search-dim', !matches);
    });
    // Hide section labels whose entire grid is filtered out
    center.querySelectorAll('.item-section-label').forEach(label => {
      let sib = label.nextElementSibling;
      while (sib && !sib.classList.contains('item-grid')) sib = sib.nextElementSibling;
      const hasVisible = sib && sib.querySelector('[data-search]:not(.search-dim)');
      label.classList.toggle('search-dim', !hasVisible);
    });
  }

  function buildAndShowOverlay(inner) {
    const root = document.getElementById('overlay-root');
    root.innerHTML = `<div class="overlay-panel">${inner}</div>`;
    root.classList.remove('hidden');
  }

  function refreshOverlay() {
    const { type, playerIdx, slotIdx, slotType } = state.overlay;
    let inner = '';
    if (type === 'char')                             inner = charOverlayHTML(playerIdx);
    else if (type === 'item' && slotType === 'weapon')  inner = weaponOverlayHTML(playerIdx, slotIdx);
    else if (type === 'item' && slotType === 'passive') inner = passiveOverlayHTML(playerIdx, slotIdx);
    else if (type === 'arcana') inner = arcanaOverlayHTML(slotIdx);
    else if (type === 'stage')  inner = stageOverlayHTML();
    const panel = document.getElementById('overlay-root').querySelector('.overlay-panel');
    const scroller = panel.querySelector('.ovl-center, .ovl-center-wide');
    const scrollTop = scroller ? scroller.scrollTop : 0;
    panel.innerHTML = inner;
    const newScroller = panel.querySelector('.ovl-center, .ovl-center-wide');
    if (newScroller) newScroller.scrollTop = scrollTop;
    const searchInput = panel.querySelector('.ovl-search');
    if (searchInput && state.ovl.search) {
      searchInput.value = state.ovl.search;
      applyOverlaySearch(searchInput);
    }
  }

  function closeOverlay(confirmed) {
    const { type, playerIdx, slotIdx, slotType, fromEmpty, prevItem } = state.overlay;
    const sel = state.ovl.selected;

    if (confirmed || (fromEmpty && sel)) {
      // Apply selection
      if (type === 'char') {
        state.players[playerIdx].character = sel;
        // Auto-fill starting weapons into empty slots
        if (sel) {
          const counts = SLOT_COUNTS[state.playerCount];
          sel.starting_weapons.slice(0, counts.weapons).forEach((wn, i) => {
            if (!state.players[playerIdx].weapons[i]) {
              state.players[playerIdx].weapons[i] = weaponByName(wn) || null;
            }
          });
        }
      } else if (type === 'item') {
        if (sel) {
          const isWeapon = D.weapons.some(w => w.name === sel.name);
          const isPassive = D.passives.some(p => p.name === sel.name);
          if (slotType === 'weapon' && isWeapon && slotIdx >= 0) {
            const wDef = D.weapons.find(w => w.name === sel.name);
            state.players[playerIdx].weapons[slotIdx] = wDef;
            if (wDef && wDef.category !== 'Base') {
              const { pending } = getEvolutionPassiveStatus(wDef, playerIdx);
              pending.forEach(({ name, slot }) => {
                state.players[playerIdx].passives[slot] = passiveByName(name);
              });
            }
          }
          if (slotType === 'passive' && isPassive && slotIdx >= 0) state.players[playerIdx].passives[slotIdx] = D.passives.find(p => p.name === sel.name);
        }
      } else if (type === 'arcana') {
        state.arcana[slotIdx] = sel;
      } else if (type === 'stage') {
        state.stage = sel;
      }
    }
    // else: cancel (no change)

    state.overlay = null;
    state.ovl = { selected: null, variantIdx: state.ovl.variantIdx, stackIdx: state.ovl.stackIdx, search: '' };
    document.getElementById('overlay-root').classList.add('hidden');
    render();
  }

  // ═══════════════════════════════════════════════════════
  //  POWER-UP CALCULATIONS
  // ═══════════════════════════════════════════════════════

  function calcPowerUpBonus(charStatKey) {
    let additive = 0;
    let multiplierSum = 0;
    D.stats.forEach(stat => {
      const level = state.powerUps[stat.name] ?? stat.max_level;
      for (let i = 0; i < level; i++) {
        const val = stat.levels[i]?.[charStatKey];
        if (val === undefined || val === null) continue;
        if (stat.stacking === 'multiplicative') multiplierSum += val;
        else additive += val;
      }
    });
    return { additive, multiplierSum, multiplier: 1 + multiplierSum };
  }

  function calcStatTotal(charStatKey, charStats) {
    const statDef  = D.stats.find(s => s.key === charStatKey);
    const isPct    = PCT_STATS.has(charStatKey);
    const inverted = INVERTED_STATS.has(charStatKey);
    const rawBase  = statDef ? statDef.base_value : (isPct ? 100 : 0);
    const rawChar  = charStats ? (charStats[charStatKey] || 0) : 0;
    const { additive, multiplierSum, multiplier } = calcPowerUpBonus(charStatKey);
    const isMultStat = statDef?.stacking === 'multiplicative';

    // Base column: power-up-adjusted baseline (no char bonus)
    let adjBase;
    if (isMultStat) {
      adjBase = Math.round(rawBase * multiplier);
    } else if (isPct) {
      adjBase = Math.round(rawBase + additive * 100);
    } else {
      adjBase = Math.round(rawBase + additive);
    }

    // Total: (base + char) × multiplier  OR  base + char_pct + additive
    let total;
    if (isMultStat) {
      total = Math.round((rawBase + rawChar) * multiplier);
    } else if (isPct) {
      total = Math.round(rawBase + rawChar * 100 + additive * 100);
    } else {
      total = Math.round(rawBase + rawChar + additive);
    }

    // Cap
    let isCapped = false;
    if (statDef?.max_value != null) {
      const cap = statDef.max_value;
      if (inverted ? total <= cap : total >= cap) { total = cap; isCapped = true; }
    }

    // PU column display
    let dispPU;
    if (isMultStat && multiplierSum !== 0) {
      const factor = (1 + multiplierSum);
      dispPU = '×' + (Number.isInteger(factor) ? factor : parseFloat(factor.toFixed(2)));
    } else if (!isMultStat && additive !== 0) {
      const val = isPct ? Math.round(additive * 100) : Math.round(additive);
      dispPU = (val > 0 ? '+' : '') + val + (isPct ? '%' : '');
    } else {
      dispPU = null;
    }

    const dispBase = isPct ? rawBase + '%' : rawBase;
    const dispChar = isPct ? Math.round(rawChar * 100) : Math.round(rawChar);
    return { dispBase, dispChar, dispPU, total, isPct, isCapped };
  }

  function renderPowerUpOverlay() {
