<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Vampire Survivors Build Calculator</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Cormorant:ital,wght@0,400;0,600;0,700;1,400;1,600;1,700&display=swap" rel="stylesheet">
  <style>
    @font-face {
      font-family: 'Perfect DOS VGA 437';
      src: url('assets/fonts/Perfect DOS VGA 437.ttf') format('truetype');
      font-weight: normal;
      font-style: normal;
    }
    @font-face {
      font-family: 'LanaPixel';
      src: url('assets/fonts/LanaPixel.ttf') format('truetype');
      font-weight: normal;
      font-style: normal;
    }
  </style>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    :root {
      --bg:          #120404;
      --surface:     #1e0808;
      --surface2:    #2c1010;
      --border:      #b88820;
      --border-hi:   #e8b820;
      --accent:      #c01020;
      --accent-glow: rgba(192,16,32,.4);
      --gold:        #e8b820;
      --gold-dim:    #b08c28;
      --text:        #f0e8d0;
      --text-muted:  #cead7e;
      --text-dim:    #a07848;
      --slot-bg:     #160606;
      --slot-border: #b88820;
      --can-evolve:  #ffe840;
      --font-title:  'Cormorant', Georgia, serif;
      --font-body:   'Cormorant', Georgia, serif;
      --slot-size:   52px;
      --char-size:   110px;
    }

    img { image-rendering: pixelated; }
    body {
      background: var(--bg);
      color: var(--text);
      font-family: var(--font-body);
      font-size: 22px;
      font-weight: 600;
      min-height: 100vh;
      overflow-x: hidden;
      -webkit-font-smoothing: antialiased;
      -moz-osx-font-smoothing: grayscale;
    }

    #app { min-height: 100vh; }

    /* ── Typography ── */
    h1, h2, h3, .label { font-family: var(--font-title); letter-spacing: .05em; }
    h1 { font-size: clamp(1.4rem, 3vw, 2.2rem); font-weight: 700; color: var(--text); }
    h2 { font-size: 1.15rem; font-weight: 600; color: var(--gold); }
    h3 { font-size: .9rem; font-weight: 600; color: var(--text-muted); text-transform: uppercase; letter-spacing: .08em; }
    .label { font-size: .78rem; text-transform: uppercase; letter-spacing: .1em; color: var(--text-muted); }

    /* ── Buttons ── */
    button {
      font-family: var(--font-title);
      cursor: pointer;
      border: none;
      outline: none;
      transition: background .15s, color .15s, box-shadow .15s;
    }
    .btn {
      background: var(--surface2);
      color: var(--text);
      border: 1px solid var(--border);
      border-radius: 4px;
      padding: .35rem .9rem;
      font-size: .88rem;
      letter-spacing: .05em;
    }
    .btn:hover { border-color: var(--border-hi); color: var(--gold); }
    .btn-accent {
      background: var(--accent);
      color: #fff;
      border-color: var(--accent);
      font-weight: 600;
    }
    .btn-accent:hover { background: #e01828; box-shadow: 0 0 10px var(--accent-glow); }
    .btn-confirm {
      background: #4d9a42;
      color: #fff;
      border: 3px solid var(--border-hi);
      border-radius: 2px;
      text-transform: uppercase;
      letter-spacing: .08em;
      font-weight: 600;
      box-shadow: inset 0 1px 0 rgba(255,255,255,.2), inset 0 -2px 0 rgba(0,0,0,.25);
    }
    .btn-confirm:hover { background: #5cb050; box-shadow: inset 0 1px 0 rgba(255,255,255,.25), 0 0 10px rgba(80,180,65,.45); }
    .btn-back {
      background: #7a1515;
      color: #fff;
      border: 3px solid var(--border-hi);
      border-radius: 2px;
      text-transform: uppercase;
      letter-spacing: .08em;
      font-weight: 600;
      box-shadow: inset 0 1px 0 rgba(255,255,255,.1), inset 0 -2px 0 rgba(0,0,0,.3);
    }
    .btn-back:hover { background: #921c1c; box-shadow: inset 0 1px 0 rgba(255,255,255,.15), 0 0 10px rgba(140,20,20,.5); }
    .btn-sm { padding: .2rem .55rem; font-size: .8rem; }
    .btn-stage { width: 100%; }
    .btn-stage:disabled { opacity: .4; cursor: default; }
    .btn-stage:disabled:hover { border-color: var(--border); color: var(--text); }
    .btn-devolve { width: 100%; background: rgba(160,25,25,.1); border-color: rgba(200,50,50,.3); color: #cc7070; }
    .btn-devolve:hover { background: rgba(160,25,25,.22); border-color: rgba(200,50,50,.55); color: #dd8080; }
    .stage-missing { font-size: .7rem; color: var(--text-muted); margin: .15rem 0 .25rem; }
    .btn-icon { background: none; border: none; padding: 3px; line-height: 1; font-size: .9rem; color: var(--text-muted); }
    .btn-icon:hover { color: var(--accent); }

    /* ═══════════════════════════════════════════════════
       LANDING PAGE
    ═══════════════════════════════════════════════════ */
    #landing {
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 2.5rem;
      padding: 2rem;
      background: radial-gradient(ellipse at 50% 30%, #2c0808 0%, #120404 70%);
    }
    .landing-banner {
      text-align: center;
    }
    .landing-banner h1 {
      text-shadow: 0 0 20px rgba(192,16,32,.6);
      font-size: clamp(1.6rem, 4vw, 2.8rem);
    }
    .landing-banner p {
      color: var(--text-muted);
      margin-top: .5rem;
      font-size: 1rem;
      font-style: italic;
    }
    .landing-grid {
      display: grid;
      grid-template-columns: repeat(2, 270px);
      gap: 1.25rem;
    }
    .player-tile-btn {
      width: 270px;
      min-height: 150px;
      box-sizing: border-box;
      background: var(--surface);
      border: 2px solid var(--border-hi);
      border-radius: 14px;
      padding: 2rem 1.5rem;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: .7rem;
      cursor: pointer;
      transition: border-color .2s, box-shadow .2s, background .2s;
    }
    .player-tile-btn:hover {
      border-color: var(--gold);
      background: var(--surface2);
      box-shadow: 0 0 18px rgba(232,184,32,.3);
    }
    .player-tile-btn .count-icons {
      display: flex;
      flex-wrap: nowrap;
      gap: 6px;
      justify-content: center;
    }
    .player-tile-btn .player-icon {
      width: 48px; height: 48px;
      image-rendering: pixelated;
    }
    .player-tile-btn .tile-label {
      font-family: var(--font-title);
      font-size: 1rem;
      font-weight: 600;
      color: var(--text);
    }


    /* ═══════════════════════════════════════════════════
       PLANNING PAGE
    ═══════════════════════════════════════════════════ */
    #planning {
      height: 100vh;
      display: flex;
      flex-direction: column;
    }
    .planning-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: .75rem 1.25rem;
      background: var(--surface);
      border-bottom: 1px solid var(--border);
      flex-shrink: 0;
    }
    .planning-header h1 { font-size: 1.1rem; }
    .planning-header-actions { display: flex; gap: .5rem; align-items: center; }

    /* ── Seal overlay ── */
    .seal-panel {
      max-width: 520px;
      width: 95vw;
    }
    .seal-controls {
      display: flex;
      align-items: center;
      gap: .65rem;
      padding: .55rem .9rem;
      border-bottom: 1px solid var(--border);
      background: var(--surface2);
      flex-wrap: wrap;
      flex-shrink: 0;
    }
    .seal-controls label { display: flex; align-items: center; gap: .35rem; font-size: .78rem; cursor: pointer; user-select: none; }
    .seal-rarity-ctrl { display: flex; align-items: center; gap: .4rem; font-size: .78rem; }
    .seal-rarity-ctrl input[type=range] { width: 90px; accent-color: var(--gold); }
    .seal-rarity-val { font-family: var(--font-title); color: var(--gold); min-width: 2.2rem; }
    .seal-grid-wrap { overflow-y: auto; padding: .65rem; flex: 1; }
    .seal-grid {
      display: grid;
      grid-template-columns: repeat(8, var(--slot-size));
      gap: 3px;
      width: fit-content;
      margin: 0 auto;
    }
    .seal-cell {
      position: relative;
      width: var(--slot-size); height: var(--slot-size);
      cursor: pointer;
    }
    .seal-cell:hover .seal-icon { filter: brightness(1.25); }
    .seal-cell.empty { cursor: default; }
    /* "Protected from sealing" states — shown as ICON TINTS, not just a thin colored
       border (borders vanished against the icons' own baked-in borders in the dense grid).
       Hue encodes the reason; a matching INSET ring keeps the edge crisp. */
    .seal-cell.in-build   { box-shadow: inset 0 0 0 2px var(--gold); cursor: default; }
    .seal-cell.in-build   .seal-icon { filter: sepia(1) saturate(3) hue-rotate(2deg)   brightness(1.05); }
    .seal-cell.in-build:hover .seal-icon { filter: sepia(1) saturate(3) hue-rotate(2deg) brightness(1.05); }
    /* Lineage component that must drop to build an equipped weapon — locked from sealing */
    .seal-cell.needed     { box-shadow: inset 0 0 0 2px #3fb7d6; cursor: default; }
    .seal-cell.needed     .seal-icon { filter: sepia(1) saturate(5) hue-rotate(150deg) brightness(1.02); }
    .seal-cell.needed:hover .seal-icon { filter: sepia(1) saturate(5) hue-rotate(150deg) brightness(1.02); }
    /* Free on the selected stage — not auto-recommended, but still sealable manually */
    .seal-cell.stage-item { box-shadow: inset 0 0 0 2px #5fa84a; }
    .seal-cell.stage-item .seal-icon { filter: sepia(1) saturate(4) hue-rotate(75deg)  brightness(1.02); }
    .seal-cell.passive-off { opacity: .3; cursor: default; pointer-events: none; }
    .seal-icon { width: 100%; height: 100%; image-rendering: pixelated; object-fit: cover; display: block; }
    .seal-mark {
      position: absolute; inset: 0;
      width: 100%; height: 100%;
      image-rendering: pixelated;
      object-fit: contain;
      opacity: 0;
      pointer-events: none;
    }
    /* Seal mark reads clearly against the busy grid but at .75 so a little of the icon
       behind peeks through (user preference). Icon itself stays untinted. */
    .seal-cell.sealed .seal-mark { opacity: .75; }

    /* ── Manage Collection overlay ── */
    .collection-panel { max-width: 560px; width: 95vw; }
    .collection-tabs { display: flex; gap: .3rem; margin-right: auto; }
    .collection-tab {
      padding: .3rem .6rem; font-size: .75rem; cursor: pointer;
      border: 1px solid var(--border); background: var(--surface2);
      color: var(--text-muted); border-radius: 4px; user-select: none;
    }
    .collection-tab.active { color: var(--gold); border-color: var(--gold); background: var(--surface); }
    .collection-hint { font-size: .72rem; color: var(--text-muted); padding: .35rem .9rem 0; }
    .collection-grid-wrap { overflow-y: auto; padding: .65rem; flex: 1; }
    /* Collection Characters tab: 8 small tiles per row (the selector's own .char-grid is
       untouched — it lives in a narrow center column and stays 4-up). Scoped under
       .collection-grid-wrap so it out-specifies the later base .char-grid rule. */
    .collection-grid-wrap .collection-char-grid { grid-template-columns: repeat(8, 1fr); gap: 5px; }
    .collection-char-grid .variant-count { font-size: 7px; padding: 0 2px; }
    .collection-char-grid .stack-btn { font-size: .8rem; }
    .collection-derived { cursor: default; }
    /* Unowned marker — reused by the collection grid AND by selectors/seal grid as the
       "not accessible" dim. Dims but KEEPS pointer-events so the item is still clickable
       to view its info panel (only committing it to a tile is blocked elsewhere). */
    .uncollected { position: relative; filter: grayscale(.7) brightness(.5); opacity: .6; }
    .uncollected::after {
      content: '🔒'; position: absolute; bottom: 0; right: 1px;
      font-size: .62rem; line-height: 1; opacity: .95; pointer-events: none;
      text-shadow: 0 0 2px #000, 0 0 2px #000;
    }
    /* ── Builds overlay ── */
    .builds-panel { max-width: 620px; width: 95vw; }
    .builds-hint { font-size: .72rem; color: var(--text-muted); padding: .35rem .9rem 0; }
    .builds-scroll { overflow-y: auto; padding: .65rem .9rem .9rem; flex: 1; }
    .builds-section + .builds-section { margin-top: 1rem; }
    .builds-section-title {
      font-size: .78rem; text-transform: uppercase; letter-spacing: .08em;
      color: var(--gold); margin: 0 0 .45rem; display: flex; align-items: center; gap: .4rem;
    }
    .builds-count {
      font-size: .68rem; color: var(--text-muted); background: var(--surface2);
      border: 1px solid var(--border); border-radius: 10px; padding: 0 .4rem; font-weight: 400;
    }
    .builds-empty { font-size: .74rem; color: var(--text-muted); font-style: italic; padding: .3rem .1rem .5rem; }
    .build-row {
      display: flex; align-items: center; gap: .6rem;
      padding: .5rem .6rem; margin-bottom: .4rem;
      background: var(--surface2); border: 1px solid var(--border); border-radius: 5px;
    }
    .build-row:hover { border-color: var(--gold); }
    .build-row-icon { width: 40px; height: 40px; flex: none; }
    .build-row-icon img { width: 100%; height: 100%; object-fit: contain; }
    /* Character sprite icons are tall — give them room and pixel-crisp scaling. */
    .build-row-sprite { width: 44px; height: 52px; }
    .build-row-sprite img { image-rendering: pixelated; }
    .build-row-main { flex: 1; min-width: 0; }
    .build-row-name { font-weight: 600; font-size: .9rem; color: var(--text); }
    .build-row-meta { font-size: .68rem; color: var(--text-muted); }
    .build-row-desc { font-size: .72rem; color: var(--text-muted); margin-top: .1rem; }
    .build-tags { display: flex; flex-wrap: wrap; gap: .25rem; margin-top: .25rem; }
    .build-tag {
      font-size: .62rem; text-transform: uppercase; letter-spacing: .04em;
      color: var(--gold); border: 1px solid var(--border-hi); border-radius: 3px; padding: 0 .3rem;
    }
    /* Top-3 trait banners (colored per trait) shown in place of free-text tags. */
    .build-trait-banner {
      font-size: .62rem; font-weight: 700; text-transform: uppercase; letter-spacing: .04em;
      background: var(--aff-color); color: var(--aff-text);
      border-radius: 3px; padding: .05rem .4rem; white-space: nowrap;
    }
    .build-row-actions { display: flex; flex-wrap: wrap; gap: .3rem; justify-content: flex-end; flex: none; max-width: 45%; }
    .btn-danger { background: rgba(160,25,25,.15); border-color: rgba(200,50,50,.4); color: #cc7070; }
    .btn-danger:hover { background: rgba(160,25,25,.3); border-color: rgba(200,50,50,.7); color: #dd8080; }
    .planning-body {
      flex: 1;
      min-height: 0;
      padding: 1rem;
      overflow: hidden;
      display: flex;
      gap: 1rem;
      align-items: stretch;
    }
    .planning-main {
      flex: 1;
      min-width: 0;
      overflow-y: auto;
    }
    .info-sidebar {
      width: 400px;
      flex-shrink: 0;
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 8px;
      display: flex;
      flex-direction: column;
      overflow: hidden;
    }
    .sidebar-top {
      flex-shrink: 0;
      padding: 1rem 1rem .5rem;
      border-bottom: 1px solid var(--border);
    }
    .sidebar-body {
      flex: 1;
      overflow-y: auto;
      padding: .5rem 1rem 1rem;
    }
    .info-sidebar-empty {
      color: var(--text-dim);
      font-size: .9rem;
      text-align: center;
      padding: 2rem 0;
      font-style: italic;
      line-height: 1.8;
    }
    .info-sidebar .detail-icon { text-align: center; margin-bottom: .5rem; width: 100px; height: 100px; }
    .info-sidebar .detail-icon img { width: 100%; height: 100%; object-fit: cover; image-rendering: pixelated; }
    /* Character full-body sprites: taller box, contain so no aspect ratio is clipped. */
    .info-sidebar .detail-icon.char-sprite { width: 100%; height: 132px; }
    .info-sidebar .detail-icon.char-sprite img { width: 100%; height: 100%; object-fit: contain; image-rendering: pixelated; }
    .info-sidebar .detail-name {
      font-family: var(--font-title);
      font-size: 1.1rem;
      color: var(--gold);
      text-align: center;
      margin-bottom: .4rem;
    }
    .info-sidebar .detail-desc {
      font-size: .88rem;
      color: var(--text-muted);
      font-style: italic;
      line-height: 1.5;
      margin-bottom: .75rem;
    }
    .info-sidebar .detail-section { margin: .6rem 0; }
    .info-sidebar .detail-section-label {
      font-size: .75rem;
      text-transform: uppercase;
      letter-spacing: .08em;
      color: var(--text-dim);
      display: block;
      margin-bottom: .3rem;
    }
    /* ── Affinity banners (shared by info panel + detail overlay) ── */
    .sidebar-top { position: relative; }
    .info-detail-btn {
      position: absolute; top: .5rem; right: .5rem;
      width: 22px; height: 22px; padding: 0;
      border: 1px solid var(--border-hi); border-radius: 50%;
      background: var(--surface2); color: var(--gold);
      font-family: var(--font-title); font-style: italic; font-size: .85rem; line-height: 1;
      cursor: pointer; z-index: 2;
    }
    .info-detail-btn:hover { background: var(--gold); color: #1a1206; }
    .affinity-section .affinity-row { margin-bottom: 4px; }
    .affinity-row {
      display: flex; align-items: center; gap: 6px;
      cursor: pointer; user-select: none;
    }
    .affinity-row-icon { width: 26px; height: 26px; flex-shrink: 0; }
    .affinity-row-icon img { width: 100%; height: 100%; object-fit: contain; image-rendering: pixelated; }
    .affinity-row-banner {
      flex: 1; min-width: 0;
      padding: 3px 9px; border-radius: 4px;
      background: var(--aff-color, var(--surface2));
      color: var(--aff-text, #fff);
      font-size: .82rem; font-weight: 600;
      white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
    }
    .affinity-row:hover .affinity-row-banner { filter: brightness(1.12); }
    /* Primary (elevated) traits grouped in a shared bordered container; used in both the info
       panels and the detail overlay object pages. */
    .primary-traits {
      border: 1px solid var(--gold-dim); border-radius: 8px;
      background: rgba(232,184,32,.06);
      padding: 5px 7px; margin-bottom: 6px;
    }
    .primary-traits > :last-child { margin-bottom: 0; }
    /* Ghost variant: same box geometry (keeps the 1px border + padding so inner width matches
       a real primary container) but invisible — for the default/null-list traits. */
    .primary-traits.trait-ghost { border-color: transparent; background: transparent; }
    /* Conflict traits (bad for this object): red box, rendered below the default group. */
    .primary-traits.conflict-traits { border-color: #e0384a; background: rgba(192,16,32,.13); }
    /* Arcana-conditional traits: box colored by the arcana's identity color, with a header. */
    .primary-traits.arcana-traits {
      border-color: var(--arc-color);
      background: color-mix(in srgb, var(--arc-color) 13%, transparent);
    }
    .arcana-traits-head {
      display: flex; align-items: center; gap: 6px; margin-bottom: 6px; cursor: pointer;
      font-size: .78rem; font-weight: 700; letter-spacing: .02em;
      color: color-mix(in srgb, var(--arc-color) 55%, var(--text));
    }
    .arcana-traits-head img { width: 18px; height: 26px; object-fit: contain; image-rendering: pixelated; flex-shrink: 0; }
    .arcana-traits-head:hover { filter: brightness(1.25); }
    /* A ghost directly under a real primary container drops its top padding (no reserved
       header space) so it sits snug beneath; a standalone ghost keeps its top spacing. */
    .primary-traits + .primary-traits.trait-ghost { padding-top: 0; }
    #detail-overlay-root .primary-traits { padding: 9px 12px 3px; margin-bottom: 12px; }
    #detail-overlay-root .primary-traits + .primary-traits.trait-ghost { padding-top: 0; }
    .info-sidebar .req-row { display: flex; flex-wrap: wrap; gap: 4px; }
    .info-sidebar .req-icon { width: 32px; height: 32px; }
    .info-sidebar .req-icon img { width: 100%; height: 100%; image-rendering: pixelated; object-fit: cover; }
    .info-sidebar .stat-grid { font-size: .88rem; }
    .info-sidebar .stat-row { padding: 2px 0; }
    .info-sidebar .stat-header { padding: 0 0 3px; }
    .info-sidebar .stat-grid.with-pass .stat-header,
    .info-sidebar .stat-grid.with-pass .stat-row { grid-template-columns: 1fr 50px 50px 56px 56px 62px; }
    /* Stats heading row with level input */
    .stats-heading-row { display: flex; align-items: center; gap: .5rem; margin-bottom: .35rem; }
    .stats-heading-row h3 { margin: 0; flex-shrink: 0; }
    .level-wrap { position: relative; display: flex; align-items: center; gap: 3px; width: 50%; margin-left: auto; }
    .level-prefix { font-size: .78rem; color: var(--text-muted); flex-shrink: 0; }
    .level-input {
      flex: 1; min-width: 0; width: 100%; box-sizing: border-box;
      padding: 4px 24px 4px 8px; font-size: .85rem; text-align: left;
      background: var(--surface2); color: var(--text); border: 1px solid var(--border);
      border-radius: 3px; font-family: var(--font-title);
      -moz-appearance: textfield; appearance: textfield;
    }
    .level-input:focus { outline: none; border-color: var(--border-hi); }
    .level-input::-webkit-inner-spin-button,
    .level-input::-webkit-outer-spin-button { -webkit-appearance: none; margin: 0; }
    .level-clear {
      position: absolute; right: 0; top: 0; bottom: 0; width: 24px;
      background: none; border: none; cursor: pointer; padding: 0;
      color: var(--text-muted); font-size: .75rem; line-height: 1;
      display: none; align-items: center; justify-content: center;
    }
    .level-clear:hover { color: var(--text); }
    .level-wrap:not([data-at-default]) .level-clear { display: flex; }
    /* Starting weapon hidden/max badges. .req-icon must establish a containing
       block so the absolutely-positioned .sw-badge anchors to the icon (not to
       the fixed #overlay-root, which would fling it to the screen corner). */
    .req-icon { position: relative; }
    .sw-badge { position: absolute; bottom: 0; right: 0; font-size: .6rem; padding: 0 2px;
      border-radius: 2px; line-height: 1.4; font-family: var(--font-title); }
    .sw-max    { background: var(--gold); color: #1a1209; }
    .sw-hidden { background: #444; color: var(--text-muted); }
    .sw-arcana { background: #7a3fd9; color: #fff; }
    .sw-is-hidden img { opacity: .55; }
    /* Arcana are tall portrait cards; crop to fit the square loadout thumbnail. */
    .sw-arcana-icon img { object-fit: cover; }
    /* Divider between the 3 shared arcana slots and the extra (starting) arcana. */
    .arcana-extra-divider { width: 2px; align-self: stretch; margin: 0 .25rem;
      background: linear-gradient(var(--gold), transparent); opacity: .5; border-radius: 2px; }
    /* Player rows grid — varies by player count */
    /* 1-2 players: one full-width row per player (a card is short, so stacking is
       cheap). 3-4 players: a 2x2 grid to keep them on-screen. Overflow-proof
       either way — hidden weapons/passives get their own conditional wrapping row
       (see .slot-row-hidden), and 3-4p cards only hold 2-3 slots per row. */
    .players-grid {
      display: grid;
      grid-template-columns: 1fr;
      gap: 1rem;
      max-width: 900px;
      margin: 0 auto;
    }
    .players-grid.p3, .players-grid.p4 { grid-template-columns: 1fr 1fr; }

    /* ── Global arcana/stage row (pinned to top so it stays visible when the
       player list scrolls with 3-4 players) ── */
    .global-row {
      margin: 0 auto .75rem;
      max-width: 900px;
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 8px;
      padding: .6rem 1rem;
    }
    .global-row-inner {
      display: flex;
      align-items: center;
      gap: .5rem;
      flex-wrap: wrap;
    }
    /* Arcana and Stage are wrapped in groups so mobile can lay them out as two zones (arcana left,
       stage reserved right). On desktop both are `display:contents` — the wrapper vanishes from
       layout and the labels/slots render exactly as a flat row, so the web layout is unchanged. */
    .global-arcana-group, .global-stage-group { display: contents; }

    /* ── Player card ── */
    .player-card {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 10px;
      overflow: hidden;
    }
    .player-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: .5rem .85rem;
      background: var(--surface2);
      border-bottom: 1px solid var(--border);
      cursor: pointer;
      user-select: none;
    }
    .player-header:hover { background: #3a1010; }
    .player-header-left { display: flex; align-items: center; gap: .5rem; }
    .player-header-left .player-name { font-family: var(--font-title); font-size: .85rem; color: var(--gold); }
    .player-header-left .char-name { font-size: .82rem; color: var(--text-muted); font-style: italic; }
    .player-header-actions { display: flex; gap: .4rem; align-items: center; }

    .player-body { padding: .75rem; display: flex; flex-direction: row; gap: .75rem; align-items: flex-start; }
    .char-col { flex-shrink: 0; }
    .slots-col { display: flex; flex-direction: column; gap: .6rem; flex: 1; min-width: 0; }

    /* ── Slot rows ── */
    .slot-row { display: flex; align-items: center; gap: .4rem; flex-wrap: nowrap; }
    /* Hidden-item rows only appear when populated and may hold many items, so
       they wrap (normal weapon/passive rows stay nowrap to keep slots aligned). */
    .slot-row-hidden { flex-wrap: wrap; }
    .slot-row-label { font-size: .75rem; text-transform: uppercase; letter-spacing: .08em; color: var(--text-dim); width: 3.5rem; flex-shrink: 0; }

    /* ── Slots ── */
    .slot {
      width: var(--slot-size); height: var(--slot-size);
      cursor: pointer;
      position: relative;
      flex-shrink: 0;
      transition: box-shadow .15s, filter .15s;
    }
    .slot:hover img { filter: brightness(1.2); }
    .slot img { width: 100%; height: 100%; object-fit: cover; display: block; image-rendering: pixelated; }
    .slot .slot-remove {
      position: absolute; top: 1px; right: 1px;
      width: 16px; height: 16px;
      background: rgba(0,0,0,.7);
      border: none; border-radius: 2px;
      color: #aaa; font-size: 10px; line-height: 1;
      cursor: pointer; display: none;
      align-items: center; justify-content: center;
    }
    .slot:hover .slot-remove { display: flex; }
    .slot .slot-remove:hover { color: var(--accent); }
    /* Touch devices have no hover to reveal the × on demand, so show it faintly at all times and
       require a two-tap confirm (JS arms it → .armed). Armed = prominent red so the confirm is
       deliberate. Hidden weapons keep their !important display:none and stay non-removable. */
    @media (hover: none) {
      .slot .slot-remove { display: flex; opacity: .5; }
      .slot .slot-remove.armed {
        opacity: 1; background: #c0392b; color: #fff;
        width: 20px; height: 20px; font-size: 12px;
      }
    }
    .slot.hidden-weapon { opacity: .4; cursor: default; }
    .slot.hidden-weapon:hover img { filter: none; }
    .slot.hidden-weapon .slot-remove { display: none !important; }
    /* Absorbed weapons stay editable (Alucard Shield's hidden evolutions) — brighter than a
       plain hidden weapon, with a pointer + gold hover to signal they respond to clicks. */
    .slot.slot-absorbed { opacity: .7; cursor: pointer; }
    .slot.slot-absorbed:hover { opacity: 1; outline: 1px solid var(--gold-dim); }
    /* Extra passive instances (e.g. Weapon Power-Up) — active, not dimmed like hidden. */
    .slot.slot-extra { border-color: rgba(155,63,217,.55); box-shadow: inset 0 0 0 1px rgba(155,63,217,.25); }
    /* Gift slot (Candybox Turbo / Arma Dio) — extra slot appended to the main row. */
    .slot.slot-gift { border-color: var(--gold); border-style: dashed; box-shadow: inset 0 0 0 1px rgba(212,175,55,.3); }
    /* Familiar (picked via Familiar Forge) — sits in the hidden/extra row but is removable. */
    .slot.slot-familiar { opacity: .85; border-color: rgba(90,180,120,.6); }
    .slot.slot-familiar:hover { opacity: 1; }
    /* ×N count badge for collapsed duplicate instances (bottom-right, clear of the × button). */
    .dupe-badge { position: absolute; bottom: 1px; right: 1px; padding: 0 3px;
      font-size: .62rem; line-height: 1.35; font-family: var(--font-title); font-weight: 600;
      background: rgba(155,63,217,.9); color: #fff; border-radius: 3px; pointer-events: none; }
    .slot.slot-locked { cursor: default; }
    .slot.slot-locked:hover img { filter: none; }
    .slot .slot-lock {
      position: absolute;
      top: 0; left: 50%;
      transform: translate(-50%, -55%);
      width: 18px; height: 18px;
      object-fit: fill;
      image-rendering: pixelated;
      pointer-events: none;
      z-index: 2;
    }

    .slot-char   { --slot-size: var(--char-size); }
    .slot-arcana { height: auto; }
    .slot-arcana img { height: auto; object-fit: fill; }
    .slot-stage  { width: 120px; height: auto; }
    .slot-stage img { width: 120px; height: auto; object-fit: fill; }

    /* ═══════════════════════════════════════════════════
       OVERLAY
    ═══════════════════════════════════════════════════ */
    #overlay-root {
      position: fixed; inset: 0;
      background: rgba(0,0,0,.75);
      z-index: 100;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 1rem;
    }
    #overlay-root.hidden { display: none; }

    /* ═══ Detailed Info Overlay — stacks ABOVE the selector overlay ═══ */
    #detail-overlay-root {
      position: fixed; inset: 0;
      background: rgba(0,0,0,.78);
      z-index: 200;
      display: flex; align-items: center; justify-content: center;
      padding: 1rem;
    }
    #detail-overlay-root.hidden { display: none; }
    #detail-overlay-root .overlay-panel { width: 94vw; max-width: 1600px; max-height: 92vh; }
    #detail-overlay-root .overlay-header { padding: 1rem 1.4rem; }
    #detail-overlay-root .overlay-header h2 { font-size: 1.5rem; }
    .detail-head-left { display: flex; align-items: center; gap: .4rem; }
    .detail-arrow-btn {
      width: 38px; height: 38px; padding: 0;
      border: 1px solid var(--border-hi); border-radius: 6px;
      background: var(--surface2); color: var(--gold);
      font-size: 1.25rem; line-height: 1; cursor: pointer;
    }
    .detail-arrow-btn:disabled { opacity: .35; cursor: default; }
    .detail-arrow-btn:not(:disabled):hover { background: var(--gold); color: #1a1206; }
    .detail-body { display: flex; flex: 1; overflow: hidden; }
    .detail-left {
      width: 320px; flex-shrink: 0;
      border-right: 1px solid var(--border);
      padding: 1.5rem; text-align: center;
      overflow-y: auto;
    }
    .detail-left .detail-icon { width: 200px; height: 200px; margin: 0 auto .75rem; border-radius: 8px; overflow: hidden; }
    .detail-left .detail-icon img { width: 100%; height: 100%; object-fit: contain; image-rendering: pixelated; }
    .detail-left .detail-icon.arcana-card { width: 190px; height: 272px; }
    .detail-left .detail-icon.arcana-card img { object-fit: fill; }
    .detail-left .detail-icon.char-sprite { width: 100%; height: 230px; }
    .detail-left .detail-name { font-family: var(--font-title); color: var(--gold); font-size: 1.55rem; margin-bottom: .5rem; }
    .detail-left .detail-desc { font-size: .98rem; color: var(--text-muted); font-style: italic; line-height: 1.55; text-align: left; }
    /* Markdown **bold** in blurbs — explicit 700 + brighter than the muted body so it reads. */
    .detail-desc strong { font-weight: 700; color: var(--text); }
    /* Blurb paragraphs (official desc + clarifications): small controlled gap, not a full line. */
    .blurb-p { display: block; }
    .blurb-p + .blurb-p { margin-top: .5rem; }
    .detail-kicker { font-size: .78rem; text-transform: uppercase; letter-spacing: .1em; color: var(--text-dim); margin-bottom: .5rem; }
    .detail-main { flex: 1; overflow-y: auto; padding: 1.5rem 1.8rem; }
    .detail-cat { margin-bottom: 1.5rem; }
    .detail-cat-label {
      font-family: var(--font-title); font-size: 1.2rem; color: var(--gold);
      border-bottom: 1px solid var(--border); padding-bottom: .35rem; margin-bottom: .7rem;
    }
    /* Collapsible category sections (native <details>/<summary>) with a custom marker. */
    summary.detail-cat-label { cursor: pointer; user-select: none; list-style: none; }
    summary.detail-cat-label::-webkit-details-marker { display: none; }
    summary.detail-cat-label::before { content: '▾ '; color: var(--gold-dim); font-size: 1rem; }
    details.detail-cat:not([open]) > summary.detail-cat-label { margin-bottom: 0; }
    details.detail-cat:not([open]) > summary.detail-cat-label::before { content: '▸ '; }
    /* Per-object interaction blurb: the objects' icon row, then the italic note below it. */
    .detail-info-entry { margin: 0 0 .9rem; }
    .detail-info-entry .ref-icon-grid { margin-bottom: .35rem; }
    .detail-info-entry .detail-info-blurb { font-size: .95rem; margin: 0; text-align: left; }
    /* Affinity-page blurbs pack into a compact 3-up grid (icons over text) to save height. */
    .detail-info-grid { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: .8rem 1.1rem; margin-bottom: .8rem; }
    .detail-info-grid .detail-info-entry { margin: 0; }
    .aff-icon-grid { display: flex; flex-wrap: wrap; gap: 9px; }
    .aff-nav-icon {
      width: 60px; height: 60px; flex-shrink: 0;
      border-radius: 6px; overflow: hidden;
      cursor: pointer;
    }
    .aff-nav-icon.arcana { width: 60px; height: 84px; }
    .aff-nav-icon.sprite { width: 66px; height: 88px; }
    .aff-nav-icon img { width: 100%; height: 100%; object-fit: cover; image-rendering: pixelated; }
    .aff-nav-icon.sprite img { object-fit: contain; }
    .aff-nav-icon:hover { box-shadow: 0 0 6px rgba(232,184,32,.5); }
    .detail-banner-header { margin: 0 0 .4rem; }
    .detail-obj-affinity { margin-bottom: 1.2rem; }
    /* Trait page ＋ combobox: add another trait as an AND condition. */
    .aff-add { position: relative; display: inline-flex; }
    .aff-add-btn {
      width: 30px; height: 30px; border-radius: 6px; cursor: pointer; line-height: 1;
      border: 1px solid var(--gold-dim); background: rgba(232,184,32,.12); color: var(--gold);
      font-size: 1.15rem; padding: 0;
    }
    .aff-add-btn:hover { background: rgba(232,184,32,.28); border-color: var(--gold); }
    .aff-add-pop {
      position: absolute; top: calc(100% + 6px); left: 0; z-index: 50; width: 280px;
      background: var(--surface); border: 1px solid var(--gold-dim); border-radius: 8px;
      box-shadow: 0 8px 24px rgba(0,0,0,.5); padding: .5rem;
    }
    .aff-add-search {
      width: 100%; box-sizing: border-box; margin-bottom: .4rem; padding: .45rem .6rem;
      background: var(--surface2); color: var(--text); border: 1px solid var(--border-hi); border-radius: 5px;
    }
    .aff-add-search:focus { outline: none; border-color: var(--gold); }
    .aff-add-list { max-height: 320px; overflow-y: auto; display: flex; flex-direction: column; gap: 2px; }
    .aff-add-opt {
      display: flex; align-items: center; gap: .5rem; width: 100%; text-align: left; cursor: pointer;
      background: transparent; border: none; color: var(--text); padding: .3rem .4rem; border-radius: 4px; font-size: .92rem;
    }
    .aff-add-opt:hover { background: var(--surface2); color: var(--gold); }
    .aff-add-opt img { width: 22px; height: 22px; object-fit: contain; image-rendering: pixelated; flex: none; }
    /* Combo trait chips in the left column (removable AND conditions). */
    .aff-combo-chips { display: flex; flex-wrap: wrap; gap: .35rem; justify-content: center; margin-top: .6rem; }
    .aff-combo-chip {
      display: inline-flex; align-items: center; gap: .3rem; padding: .12rem .28rem .12rem .4rem;
      background: var(--aff-color); color: var(--aff-text); border-radius: 4px; font-size: .8rem; font-weight: 700;
    }
    .aff-combo-chip img { width: 16px; height: 16px; object-fit: contain; image-rendering: pixelated; }
    /* Object-page affinity banners: scale up within the overlay only (info panels unchanged). */
    #detail-overlay-root .affinity-row { gap: 10px; }
    #detail-overlay-root .affinity-row-icon { width: 40px; height: 40px; }
    #detail-overlay-root .affinity-row-banner { padding: 7px 14px; font-size: 1.05rem; border-radius: 5px; }
    .detail-empty { color: var(--text-dim); font-style: italic; padding: 1rem 0; }
    .overlay-footer .btn-add-build { margin-left: auto; }

    /* Reference icon grids (character starting loadout · arcana affects lists). Shared by the
       detail overlay and the arcana selector's right panel, so kept compact. */
    .ref-icon-grid { display: flex; flex-wrap: wrap; gap: 6px; align-items: center; }
    .ref-nav-icon { width: 42px; height: 42px; flex-shrink: 0; border-radius: 5px; overflow: hidden; cursor: pointer; }
    .ref-nav-icon.arcana { width: 42px; height: 58px; }
    .ref-nav-icon.sprite { width: 40px; height: 54px; }
    .ref-nav-icon img { width: 100%; height: 100%; object-fit: cover; image-rendering: pixelated; }
    .ref-nav-icon.sprite img { object-fit: contain; }
    .ref-nav-icon:hover { box-shadow: 0 0 6px rgba(232,184,32,.5); }
    .req-icon.stage-nav { cursor: pointer; }
    .req-icon.stage-nav:hover { box-shadow: 0 0 6px rgba(232,184,32,.5); border-radius: 4px; }

    /* ── Player page: shared-trait cross-reference matrix ── */
    .xref-wrap { overflow: auto; max-width: 100%; }
    table.player-xref { border-collapse: collapse; font-size: .92rem; }
    .player-xref th, .player-xref td { border: 1px solid var(--border); }
    .player-xref thead th { position: sticky; top: 0; z-index: 2; }
    .xref-corner { position: sticky; left: 0; top: 0; z-index: 4; background: var(--surface2); }
    .xref-rowhead {
      position: sticky; left: 0; z-index: 1;
      background: var(--surface2); text-align: left; white-space: nowrap;
      padding: 4px 12px 4px 6px; cursor: pointer; max-width: 240px; overflow: hidden;
    }
    .xref-rowhead img { width: 27px; height: 27px; vertical-align: middle; margin-right: 8px; object-fit: contain; image-rendering: pixelated; }
    .xref-rowhead:hover { color: var(--gold); }
    /* Vertical column headers: icon anchored at the BOTTOM (by the grid), trait name stacked
       above it reading downward — compact for width. */
    .xref-colhead { padding: 0; height: 140px; vertical-align: bottom; }
    .xref-col {
      display: flex; flex-direction: column-reverse; align-items: center; gap: 5px;
      height: 100%; padding: 7px 3px; min-width: 34px; cursor: pointer;
      background: var(--aff-color); color: var(--aff-text);
    }
    .xref-col:hover { filter: brightness(1.12); }
    .xref-col-icon { width: 27px; height: 27px; object-fit: contain; image-rendering: pixelated; flex-shrink: 0; }
    .xref-col-name { writing-mode: vertical-rl; font-size: .8rem; font-weight: 600; white-space: nowrap; }
    .player-xref tbody td { text-align: center; width: 34px; min-width: 34px; height: 30px; color: var(--text-dim); }
    .player-xref td.xref-on { color: var(--gold); }
    .xref-shared th, .xref-shared td { position: sticky; bottom: 0; z-index: 1; background: var(--surface2); font-weight: 700; }
    .xref-shared td { color: var(--text-muted); }
    .xref-shared td.xref-sh { color: var(--gold); }
    /* Character row (top): set it apart from the item rows. */
    .xref-char-row .xref-rowhead { color: var(--gold); font-weight: 700; }
    .xref-char-row td, .xref-char-row .xref-rowhead { border-bottom: 2px solid var(--border-hi); }
    /* Priority traits (from the character's grouped affinity schema) — bold the whole column. */
    .player-xref .xref-priority { font-weight: 800; }
    .player-xref td.xref-priority { background: rgba(232,184,32,.09); }
    .player-xref td.xref-on.xref-priority { color: var(--gold); }
    .xref-colhead.xref-priority .xref-col { outline: 2px solid var(--gold); outline-offset: -2px; }
    /* Reused evo-path sections (weapon/passive detail pages): make their <h3> match the gold
       category headers, and tile a passive's many "Used In" paths into a compact grid. */
    #detail-overlay-root .detail-section h3 {
      font-family: var(--font-title); color: var(--gold); font-size: 1.2rem;
      border-bottom: 1px solid var(--border); padding-bottom: .35rem; margin-bottom: .6rem;
    }
    /* Breathing room between stacked detail-page sections so a section's last entry —
       especially tall/wide evolution paths — doesn't crowd or bleed into the next header. */
    #detail-overlay-root .detail-main > .detail-section { margin-top: 1.6rem; }
    #detail-overlay-root .detail-main > .detail-section:first-child { margin-top: 0; }
    #detail-overlay-root .detail-main > .detail-section + .primary-traits { margin-top: 1.6rem; }
    /* Evo-node MAX/Hidden labels are absolutely positioned below their node (top:100%), so they
       overflow the section box and can touch the next header. Reserve a little space beneath evo
       paths on the detail page so those labels clear the following section. (Evo layout untouched.) */
    #detail-overlay-root .detail-main .detail-section .evo-flow { padding-bottom: 1rem; }
    #detail-overlay-root .detail-passive-evo .evo-flow {
      display: grid; grid-template-columns: repeat(auto-fill, minmax(240px, 1fr));
      gap: 1rem; align-items: start;
    }

    /* ── Appendix (index) page ── */
    .appendix-search {
      width: 100%; box-sizing: border-box; margin-bottom: 1rem;
      padding: .65rem .9rem; font-size: 1.05rem;
      background: var(--surface2); color: var(--text);
      border: 1px solid var(--border-hi); border-radius: 6px;
    }
    .appendix-search:focus { outline: none; border-color: var(--gold); }
    /* Multi-trait filter bar: active trait chips (AND) shown above results. */
    .appendix-trait-filter {
      display: flex; flex-wrap: wrap; align-items: center; gap: .4rem;
      margin: -.4rem 0 1rem; padding: .55rem .6rem;
      background: var(--surface2); border: 1px solid var(--border-hi); border-radius: 6px;
    }
    .appendix-filter-label { font-size: .78rem; color: var(--text-dim); text-transform: uppercase; letter-spacing: .06em; }
    .appendix-chip {
      display: inline-flex; align-items: center; gap: .35rem; padding: .15rem .3rem .15rem .4rem;
      background: var(--aff-color); color: var(--aff-text); border-radius: 4px; font-size: .82rem; font-weight: 700;
    }
    .appendix-chip img { width: 18px; height: 18px; object-fit: contain; image-rendering: pixelated; }
    .appendix-chip-x {
      border: none; background: rgba(0,0,0,.25); color: inherit; cursor: pointer;
      width: 16px; height: 16px; border-radius: 3px; line-height: 1; font-size: .72rem; padding: 0;
    }
    .appendix-chip-x:hover { background: rgba(0,0,0,.45); }
    .appendix-filter-clear {
      margin-left: auto; border: 1px solid var(--border-hi); background: transparent; color: var(--text-muted);
      cursor: pointer; font-size: .76rem; padding: .15rem .5rem; border-radius: 4px;
    }
    .appendix-filter-clear:hover { color: var(--gold); border-color: var(--gold); }
    /* "Add a trait filter" suggestion rows + results section heads. */
    .appendix-suggest-head, .appendix-results-head {
      font-size: .74rem; text-transform: uppercase; letter-spacing: .06em; color: var(--gold-dim);
      margin: .8rem 0 .4rem; padding-bottom: .25rem; border-bottom: 1px solid var(--border);
    }
    .appendix-suggest-head:first-child { margin-top: 0; }
    .appendix-count {
      color: var(--text-dim); background: var(--surface2); border: 1px solid var(--border);
      border-radius: 10px; padding: 0 .4rem; font-size: .7rem; margin-left: .3rem;
    }
    .appendix-suggest { display: flex; align-items: center; gap: .5rem; margin-bottom: 5px; }
    .appendix-suggest .affinity-row { flex: 1; margin-bottom: 0; }
    .appendix-suggest-add {
      flex: none; width: 26px; height: 26px; border-radius: 5px; cursor: pointer;
      border: 1px solid var(--gold-dim); background: rgba(232,184,32,.12); color: var(--gold);
      font-size: 1rem; line-height: 1; padding: 0;
    }
    .appendix-suggest-add:hover { background: rgba(232,184,32,.28); border-color: var(--gold); }
    .appendix-section { margin-bottom: 1.5rem; }
    .appendix-section-label {
      font-family: var(--font-title); font-size: 1.2rem; color: var(--gold);
      border-bottom: 1px solid var(--border); padding-bottom: .35rem; margin-bottom: .55rem;
    }
    .appendix-row {
      display: flex; align-items: center; gap: 11px;
      padding: 5px 9px; border-radius: 4px; cursor: pointer;
    }
    .appendix-row:hover { background: var(--surface2); }
    .appendix-row.appendix-child { margin-left: 2rem; }
    /* Trait entries in the appendix render as banners — space them and offset nested children. */
    .appendix .affinity-row { margin-bottom: 5px; }
    .appendix .affinity-row.appendix-child { margin-left: 2rem; }
    .appendix-icon { width: 36px; height: 36px; flex-shrink: 0; }
    .appendix-icon.sprite { width: 32px; height: 44px; }
    .appendix-icon img { width: 100%; height: 100%; object-fit: contain; image-rendering: pixelated; }
    .appendix-row-name { flex: 1; min-width: 0; font-size: 1.02rem; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    .appendix-row-kind { font-size: .76rem; color: var(--text-dim); text-transform: uppercase; letter-spacing: .06em; flex-shrink: 0; }
    .appendix-more { font-size: .88rem; color: var(--text-dim); font-style: italic; padding: .6rem 9px; }

    .overlay-panel {
      background: var(--surface);
      border: 1px solid var(--border-hi);
      border-radius: 12px;
      width: 88vw;
      max-width: 1380px;
      max-height: 85vh;
      display: flex;
      flex-direction: column;
      overflow: hidden;
      box-shadow: 0 0 40px rgba(0,0,0,.8);
    }
    .overlay-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: .75rem 1.1rem;
      border-bottom: 1px solid var(--border);
      background: var(--surface2);
      flex-shrink: 0;
    }
    .overlay-header h2 { margin: 0; }
    .overlay-close { font-size: 1.3rem; line-height: 1; }
    .overlay-body {
      display: flex;
      flex: 1;
      overflow: hidden;
    }
    /* Right + left info panels are wrapped in .ovl-info so mobile can scroll them as ONE region
       (detail above stats). On desktop the wrapper is display:contents — invisible to layout — and
       `order` restores the exact left | center | right arrangement, so the web layout is unchanged. */
    .ovl-info { display: contents; }
    .ovl-left { order: 1; }
    .ovl-center, .ovl-center-wide { order: 2; }
    .ovl-right { order: 3; }

    /* Overscroll containment: overscrolling inside ANY overlay's scroll region must not chain to /
       nudge the planner behind it. One rule for every overlay scroller (selection, detail/appendix,
       seal, collection, builds, power-ups). Purely a scroll-chaining behavior — no layout change.
       (Excludes the planner's own .planning-main / .sidebar-body, which aren't overlays.) */
    .ovl-center-scroll, .ovl-left, .ovl-right-body, .ovl-info,
    .detail-main, .detail-left, .detail-body, .xref-wrap, .aff-add-list,
    .seal-grid-wrap, .collection-grid-wrap, .builds-scroll, .pu-list-wrap {
      overscroll-behavior: contain;
    }

    /* left panel (stats) */
    .ovl-left {
      width: 320px;
      flex-shrink: 0;
      border-right: 1px solid var(--border);
      overflow-y: auto;
      padding: .75rem;
      display: flex;
      flex-direction: column;
      gap: .5rem;
    }
    /* center grid */
    .ovl-center {
      flex: 1;
      display: flex;
      flex-direction: column;
      overflow: hidden;
    }
    .ovl-center-search {
      flex-shrink: 0;
      padding: .75rem .75rem .4rem;
      border-bottom: 1px solid var(--border);
    }
    .ovl-center-scroll {
      flex: 1;
      overflow-y: auto;
      padding: .75rem;
    }
    /* right panel (identity / detail) */
    .ovl-right {
      width: 300px;
      flex-shrink: 0;
      border-left: 1px solid var(--border);
      display: flex;
      flex-direction: column;
      overflow: hidden;
    }
    .ovl-right-top {
      flex-shrink: 0;
      padding: .75rem .75rem .4rem;
      border-bottom: 1px solid var(--border);
      display: flex;
      flex-direction: column;
      gap: .4rem;
      position: relative; /* anchors the info-"i" detail button */
    }
    .ovl-right-body {
      flex: 1;
      overflow-y: auto;
      padding: .5rem .75rem .75rem;
    }
    .overlay-footer {
      display: flex;
      align-items: center;
      justify-content: flex-end;
      gap: .6rem;
      padding: .6rem 1rem;
      border-top: 1px solid var(--border);
      background: var(--surface2);
      flex-shrink: 0;
    }

    /* ── Stat grid ── */
    .stat-grid { display: flex; flex-direction: column; gap: 1px; }
    .stat-header {
      display: grid; grid-template-columns: 1fr 50px 50px 56px 62px;
      font-size: .74rem; text-transform: uppercase;
      color: var(--text-muted); padding: 0 4px 3px; border-bottom: 1px solid var(--border);
      margin-bottom: 2px;
    }
    .stat-row {
      display: grid; grid-template-columns: 1fr 50px 50px 56px 62px;
      align-items: center; font-size: .82rem; padding: 2px 4px; border-radius: 3px;
    }
    /* 6-column variant when passive column is shown */
    .stat-grid.with-pass .stat-header,
    .stat-grid.with-pass .stat-row { grid-template-columns: 1fr 50px 50px 56px 56px 62px; }
    .stat-header span { text-align: right; }
    .stat-header span:first-child { text-align: left; }
    .ovl-left .stat-header,
    .ovl-left .stat-row { grid-template-columns: 1fr 48px 48px 54px 60px; font-size: .82rem; }
    .ovl-left .stat-header { font-size: .74rem; }
    .stat-row.changed { background: rgba(232,184,32,.12); }
    .stat-key { color: var(--text-muted); min-width: 0; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    .stat-base  { text-align: right; color: var(--text-muted); font-size: .82rem; }
    .stat-char  { text-align: right; font-weight: 600; }
    .stat-pu      { text-align: right; color: #7ab8e8; font-size: .82rem; }
    .stat-passive { text-align: right; color: #c8a86e; font-size: .82rem; }
    .stat-total   { text-align: right; font-weight: 700; color: var(--text); }
    .stat-row.capped .stat-total { color: var(--gold); font-weight: 600; }
    .stat-val.pos { color: #5ddd88; }
    .stat-val.neg { color: #dd5555; }

    /* ── Power-up overlay ── */
    .pu-panel { max-width: 480px; width: 92vw; }
    .pu-list-wrap { overflow-y: auto; padding: .5rem .75rem; flex: 1; }
    .pu-row {
      display: grid; grid-template-columns: 24px 1fr auto;
      align-items: center; gap: .5rem;
      padding: 4px 2px; border-bottom: 1px solid rgba(184,136,32,.15);
    }
    .pu-row.no-levels { opacity: .4; }
    .pu-icon { width: 24px; height: 24px; image-rendering: pixelated; object-fit: cover; }
    .pu-name { font-size: .8rem; color: var(--text); }
    .pu-level-ctrl { display: flex; align-items: center; gap: 4px; }
    .pu-level-ctrl button {
      width: 20px; height: 20px; padding: 0; line-height: 1;
      font-size: .85rem; border: 1px solid var(--border); border-radius: 3px;
      background: var(--surface2); color: var(--text); cursor: pointer;
    }
    .pu-level-ctrl button:disabled { opacity: .3; cursor: default; }
    .pu-level-ctrl button:not(:disabled):hover { border-color: var(--border-hi); color: var(--gold); }
    .pu-level-display { font-size: .75rem; font-family: var(--font-title); color: var(--gold); min-width: 30px; text-align: center; }

    /* ── Item / Arcana grid ── */
    .item-section-label {
      font-family: var(--font-title);
      font-size: .7rem;
      text-transform: uppercase;
      letter-spacing: .1em;
      color: var(--text-muted);
      margin: .5rem 0 .3rem;
      padding-bottom: 3px;
      border-bottom: 1px solid var(--border);
    }
    .item-grid {
      display: flex;
      flex-wrap: wrap;
      gap: 6px;
    }
    .item-card {
      width: var(--slot-size); height: var(--slot-size);
      border-radius: 6px;
      cursor: pointer;
      position: relative;
      overflow: hidden;
      flex-shrink: 0;
      transition: box-shadow .15s, opacity .15s;
    }
    .item-card img { width: 100%; height: 100%; object-fit: cover; display: block; }
    .item-card:hover { box-shadow: 0 0 0 2px var(--border-hi), 0 0 8px rgba(184,136,32,.4); }
    /* Selection reads through busy grids: an INSET ring (sits on top of the icon's own
       baked-in border, not outside it) + a gold wash tint over the img + a brightness
       lift — icons already carry a bold border, so a thin outer ring alone disappears. */
    .item-card.selected { box-shadow: inset 0 0 0 2px var(--gold), 0 0 12px rgba(232,184,32,.6); }
    .item-card.selected img { filter: brightness(1.12) saturate(1.15); }
    .item-card.selected::after {
      content: ''; position: absolute; inset: 0; pointer-events: none;
      background: rgba(232,184,32,.30); mix-blend-mode: overlay;
    }
    .item-card.dim      { opacity: .35; pointer-events: none; }
    .item-card.consumed { opacity: .25; pointer-events: none; filter: grayscale(.7) sepia(.4); }
    .search-dim { display: none !important; }
    .ovl-search-wrap { position: relative; margin-bottom: .6rem; }
    .ovl-search {
      width: 100%; box-sizing: border-box;
      background: var(--surface2); border: 1px solid var(--border);
      border-radius: 4px; padding: 5px 28px 5px 9px;
      color: var(--text); font-size: .82rem; font-family: var(--font-body);
      outline: none; display: block;
    }
    .ovl-search:focus { border-color: var(--border-hi); }
    .ovl-search-clear {
      position: absolute; right: 0; top: 0; bottom: 0;
      width: 26px; background: none; border: none; cursor: pointer;
      color: var(--text-muted); font-size: .8rem; line-height: 1;
      display: none; align-items: center; justify-content: center;
      padding: 0;
    }
    .ovl-search-clear:hover { color: var(--text); }
    .ovl-search:not(:placeholder-shown) + .ovl-search-clear { display: flex; }
    .req-row { display:flex; align-items:center; gap:.4rem; margin:.2rem 0; }
    .req-icon { width:26px; height:26px; flex-shrink:0; border-radius:4px; overflow:hidden; }
    .req-icon img { width:100%; height:100%; object-fit:cover; display:block; }
    .req-status { font-size:.75rem; padding:1px 5px; border-radius:2px; white-space:nowrap; }
    .req-status.ok   { color:#5ddd88; }
    .req-status.add  { color:var(--gold); }
    .req-status.miss { color:#dd5555; cursor:help; }
    .auto-add-toggle {
      display: flex; align-items: center; gap: .5rem;
      margin-top: .6rem; padding: .35rem .5rem;
      border-radius: 5px; border: 1px solid var(--border);
      cursor: pointer; user-select: none;
      font-size: .8rem; color: var(--text);
      transition: border-color .15s, background .15s;
    }
    .auto-add-toggle:hover { border-color: var(--border-hi); background: var(--surface2); }
    .auto-add-toggle.checked { border-color: rgba(93,221,136,.4); background: rgba(93,221,136,.06); }
    .auto-add-toggle.error   { border-color: rgba(220,60,60,.4);  background: rgba(220,60,60,.06); }
    .auto-add-box {
      width: 14px; height: 14px; flex-shrink: 0;
      border: 1px solid var(--border-hi); border-radius: 3px;
      display: flex; align-items: center; justify-content: center;
      font-size: .7rem; color: #5ddd88;
    }
    .auto-add-toggle.error .auto-add-box { border-color: #dd5555; color: #dd5555; }
    .auto-add-warn { font-size: .72rem; color: #dd5555; margin-left: auto; }
    .item-card .card-badge {
      position: absolute; bottom: 0; left: 0; right: 0;
      background: rgba(0,0,0,.7);
      font-size: 8px;
      text-align: center;
      color: var(--text-muted);
      padding: 1px;
      line-height: 1.2;
      white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
    }
    /* variant stack effect */
    .item-card.stacked::before {
      content: '';
      position: absolute; inset: -3px;
      background: var(--surface2);
      border-radius: 7px;
      z-index: -1;
      transform: translate(4px, 4px);
    }
    .stack-wrapper {
      position: relative;
      width: calc(var(--slot-size) + 6px);
      height: calc(var(--slot-size) + 6px);
      flex-shrink: 0;
    }
    .stack-wrapper .item-card { position: absolute; top: 0; left: 0; }
    .stack-nav {
      position: absolute; bottom: -1px; right: -1px;
      display: flex; gap: 2px;
    }
    .stack-btn {
      width: 14px; height: 14px;
      background: rgba(0,0,0,.85);
      border: 1px solid var(--border-hi);
      border-radius: 2px;
      color: var(--text); font-size: 8px;
      display: flex; align-items: center; justify-content: center;
      cursor: pointer; z-index: 2;
    }
    .stack-btn:hover { color: var(--gold); }

    /* ── Detail panels (right side) ── */
    .detail-icon { width: 64px; height: 64px; border-radius: 8px; overflow: hidden; margin: 0 auto .5rem; }
    .ovl-right-top .detail-icon { width: 88px; height: 88px; }
    .detail-icon img { width: 100%; height: 100%; object-fit: cover; }
    /* Arcana cards are portrait 224×320 — override square assumptions */
    .detail-icon.arcana-card { width: 140px; height: 200px; }
    .detail-icon.arcana-card img { object-fit: fill; }
    /* Character full-body sprites in the selector preview: contain, never clipped. */
    .ovl-right-top .detail-icon.char-sprite { width: 100%; height: 120px; border-radius: 0; }
    .ovl-right-top .detail-icon.char-sprite img { object-fit: contain; image-rendering: pixelated; }
    .ovl-center-wide .item-grid { gap: 12px; row-gap: 14px; }
    .arcana-grid {
      display: grid;
      grid-template-columns: repeat(8, 1fr);
      gap: 10px;
      align-items: start;
      padding: .75rem;
    }
    .arcana-grid .item-card { width: 100%; height: auto; aspect-ratio: 224 / 320; }
    .arcana-grid .item-card img { object-fit: fill; width: 100%; height: 100%; }
    .arcana-tab-btn {
      grid-column: span 2;
      align-self: stretch;
      background: var(--surface2);
      border: 2px solid var(--border);
      border-radius: 6px;
      cursor: pointer;
      display: flex; flex-direction: column;
      align-items: center; justify-content: center;
      gap: .4rem; color: var(--text);
    }
    .arcana-tab-btn[data-tab="arcana"]  { background: rgba(180,30,30,.2);  border-color: rgba(220,60,60,.45);  }
    .arcana-tab-btn[data-tab="darkana"] { background: rgba(120,40,200,.2); border-color: rgba(155,80,220,.45); }
    .arcana-tab-btn[data-tab="arcana"]:hover  { border-color: rgba(220,60,60,.8);  }
    .arcana-tab-btn[data-tab="darkana"]:hover { border-color: rgba(155,80,220,.8); }
    .arcana-tab-current { font-family: var(--font-title); font-size: 1.5rem; color: var(--gold); font-weight: 600; }
    .arcana-tab-switch { font-size: 1rem; color: var(--text-muted); }
    .arcana-placeholder { opacity: .3; cursor: default; pointer-events: none; }
    .detail-name { font-family: var(--font-title); font-size: 1.05rem; text-align: center; color: var(--gold); margin-bottom: .3rem; }
    .detail-desc { font-size: .88rem; color: var(--text-muted); line-height: 1.5; font-style: italic; }
    .detail-section { margin-top: .5rem; }
    .detail-section h3 { margin-bottom: .25rem; }
    .detail-section ul { list-style: none; padding: 0; }
    .detail-section li { font-size: .85rem; color: var(--text-muted); padding: 2px 0; line-height: 1.4; }
    .detail-section li::before { content: '▸ '; color: var(--gold-dim); }
    .lb-table { width: 100%; border-collapse: collapse; margin-top: .3rem; font-size: .9rem; }
    .lb-table th, .lb-table td { padding: 2px 6px; text-align: left; border-bottom: 1px solid var(--border); }
    .lb-table th { color: var(--gold-dim); font-weight: 600; text-transform: uppercase; letter-spacing: .03em; font-size: .8rem; }
    .lb-table td { color: var(--text-muted); }
    .lb-table td:first-child { color: var(--text); }
    .lb-table tbody tr:last-child td { border-bottom: none; }
    .lb-table .lb-none { color: var(--gold-dim); opacity: .6; }
    /* Left selector panel scaled up ~25% for readability (headers + placeholder;
       level-up rows and .lb-table carry their own bumped sizes). */
    .ovl-left h3 { font-size: 1.12rem; }
    .ovl-left .detail-desc { font-size: 1.1rem; }
    .evo-flow { display: flex; flex-direction: column; gap: 18px; margin-top: .35rem; }
    .evo-path-group { padding-top: .6rem; border-top: 1px solid var(--border); }
    .evo-path-group:first-child { padding-top: 0; border-top: none; }
    .evo-row { display: flex; align-items: center; gap: 4px; flex-wrap: nowrap; }
    .evo-node { width: 44px; height: 44px; flex-shrink: 0; border-radius: 5px; overflow: hidden; }
    .evo-node.current { outline: 1px solid var(--gold); box-shadow: 0 0 6px rgba(232,184,32,.4); }
    .evo-node.evo-hidden { opacity: .4; }
    /* Glimmer tech: scale the reused Emerald Rapture art to crop its baked-in frame
       (overflow:hidden on .evo-node clips the overscan) so the node looks borderless. */
    .evo-node.evo-glimmer img { transform: scale(1.24); }
    /* Chaos-morph character sprite: show the full character art, not a cropped portrait. */
    .evo-node.evo-char-sprite img { object-fit: contain; image-rendering: pixelated; }
    .evo-node[data-evo-item]:not(.current) { cursor: context-menu; }
    .evo-node[data-evo-item]:not(.current):hover { outline: 1px solid var(--border-hi); }
    .evo-gem[data-evo-item] { cursor: context-menu; }
    .evo-gem[data-evo-item]:hover { outline: 1px solid var(--border-hi); }
    .evo-toast {
      position: fixed; bottom: 1.5rem; left: 50%; transform: translateX(-50%);
      padding: .4rem 1.1rem; border-radius: 6px; z-index: 9999; pointer-events: none;
      font-size: .88rem; white-space: nowrap;
      animation: toast-in .18s ease, toast-out .3s ease 1.7s forwards;
    }
    .evo-toast.ok  { background: rgba(18,18,12,.96); border: 1px solid rgba(93,221,136,.5); color: #5ddd88; }
    .evo-toast.err { background: rgba(18,18,12,.96); border: 1px solid rgba(220,80,80,.5);  color: #ff8080; }
    .evo-toast.warn{ background: rgba(18,18,12,.96); border: 1px solid rgba(232,184,32,.4); color: var(--gold); }
    @keyframes toast-in  { from { opacity:0; transform:translateX(-50%) translateY(6px); } to { opacity:1; transform:translateX(-50%) translateY(0); } }
    @keyframes toast-out { to   { opacity:0; transform:translateX(-50%) translateY(6px); } }
    .evo-node img { width: 100%; height: 100%; object-fit: cover; display: block; }
    .evo-op { font-size: .8rem; color: var(--text-muted); flex-shrink: 0; }
    /* Level-up pipe: gold and bold so it reads as a connector, not stray punctuation. */
    .evo-op-lvl { color: var(--gold-dim); font-weight: 700; font-size: 1.05rem; line-height: 1; }
    .evo-nw { display: inline-flex; align-items: center; flex-shrink: 0; position: relative; }
    .evo-max { position: absolute; top: 100%; left: 50%; transform: translateX(-50%); margin-top: 2px; font-size: .65rem; font-weight: 700; color: var(--gold); line-height: 1; letter-spacing: .02em; white-space: nowrap; }
    .evo-sub { position: absolute; top: 100%; left: 50%; transform: translateX(-50%); margin-top: 2px; font-size: .63rem; color: var(--text-muted); line-height: 1; text-align: center; white-space: nowrap; }
    /* Glimmer attack names can be long — let them wrap instead of overflowing the row. */
    .evo-sub.evo-sub-wrap { white-space: normal; max-width: 60px; line-height: 1.05; }
    .evo-dash-line { width: 14px; border-top: 1.5px dashed var(--text-dim); flex-shrink: 0; }
    /* Gemini gem uses the Arcana card aspect (~0.7, i.e. 224x320) instead of a square. */
    .evo-gem { width: 22px; height: 31px; flex-shrink: 0; border-radius: 3px; overflow: hidden; }
    .evo-gem img { width: 100%; height: 100%; object-fit: fill; display: block; }
    /* merge-bar: stacked rows on left → bar → output right (dual/Vandalier/Universitas) */
    .evo-merge { display: inline-flex; align-items: stretch; gap: 3px; }
    /* Stacked branches need enough vertical gap that a top-branch MAX/sub label (absolutely
       positioned below its node) clears the branch beneath it, without reserving per-node room
       (which would offset icon centering within a row). */
    .evo-merge-rows { display: flex; flex-direction: column; gap: 18px; justify-content: center; }
    .evo-merge-bar { width: 2px; background: var(--border); border-radius: 1px; flex-shrink: 0; min-height: 24px; }
    .evo-merge-out { display: flex; align-items: center; gap: 4px; }
    /* u2f grid: base-evo on left | bar | mid on right-top, union-partner on right-bot | final (centered) */
    .evo-u2f { display: grid; grid-template-columns: auto 2px auto auto; grid-template-rows: auto auto; gap: 16px 3px; align-items: center; justify-content: start; }
    .evo-u2f > .u2l { grid-column:1; grid-row:1; display:flex; align-items:center; gap:4px; }
    .evo-u2f > .u2b { grid-column:2; grid-row:1/3; background:var(--border); align-self:stretch; border-radius:1px; }
    .evo-u2f > .u2t { grid-column:3; grid-row:1; display:flex; align-items:center; gap:4px; }
    .evo-u2f > .u2m { grid-column:3; grid-row:2; display:flex; align-items:center; gap:4px; }
    .evo-u2f > .u2f { grid-column:4; grid-row:1/3; display:flex; align-items:center; gap:4px; }
    /* triple/quad union: stacked inputs + bar + final */
    .evo-multi-union { display: inline-flex; align-items: stretch; gap: 3px; }
    .evo-multi-inputs { display: flex; flex-direction: column; gap: 4px; justify-content: center; }
    /* absorb-union: the hidden bases shown a 2nd time to the right of the result. */
    .evo-absorb-col { display: flex; flex-direction: column; align-items: center; gap: 3px; margin-left: 8px; justify-content: center; }
    .evo-absorb-label { font-size: .6rem; letter-spacing: .04em; color: var(--text-muted); text-transform: uppercase; }
    .evo-absorb-col .evo-multi-inputs { gap: 3px; }
    /* collection finals */
    .evo-coll-wrap { display: flex; flex-direction: column; gap: 4px; }
    .evo-coll-inputs { display: flex; flex-wrap: wrap; gap: 3px; }
    /* pentagram (FivePassive) */
    .evo-pentagram { position: relative; width: 136px; height: 136px; margin: .4rem 0; }
    .evo-pentagram .ep-item { position: absolute; transform: translate(-50%,-50%); }
    .evo-pentagram .ep-center { position: absolute; top: 50%; left: 50%; transform: translate(-50%,-50%); }
    /* Alucard gift: 3-over-2 example-evo block to the right of Alucard Shield */
    .alucard-evos { display: inline-flex; align-items: center; gap: 2px; opacity: .5; margin-left: 2px; }
    .alucard-evos-col { display: flex; flex-direction: column; gap: 2px; align-items: center; }
    /* hexagram (Tuna) */
    .evo-hexagram { position: relative; width: 160px; height: 150px; margin: .4rem 0; }
    .evo-hexagram .eh-item { position: absolute; transform: translate(-50%,-50%); }
    .evo-hexagram .eh-label { position: absolute; font-size: .63rem; color: var(--text-muted); white-space: nowrap; transform: translate(-50%,0); }
    .req-icons { display: flex; gap: 4px; flex-wrap: wrap; margin-top: .3rem; }
    .req-icon { width: 28px; height: 28px; border-radius: 4px; overflow: hidden; }
    .req-icon img { width: 100%; height: 100%; object-fit: cover; }
    .hi-badge {
      display: inline-block;
      font-size: .65rem;
      padding: 1px 4px;
      border-radius: 3px;
      font-family: var(--font-title);
      letter-spacing: .04em;
      margin: 2px;
    }
    .hi-badge.char   { background: rgba(58,122,217,.25);  color: #6aadff; border: 1px solid rgba(58,122,217,.4);  }
    .hi-badge.arcana { background: rgba(155,63,217,.25);   color: #c08dff; border: 1px solid rgba(155,63,217,.4);  }
    .hi-badge.item   { background: rgba(180,30,30,.25);    color: #ff8080; border: 1px solid rgba(220,60,60,.4);   }

    /* ── Character grid (overlay) ── */
    .char-grid {
      display: grid;
      grid-template-columns: repeat(4, 1fr);
      gap: 8px;
      align-content: flex-start;
    }
    .char-grid .stack-wrapper {
      width: 100%;
      height: auto;
      aspect-ratio: 1;
    }
    .char-card {
      width: 100%;
      aspect-ratio: 1;
      cursor: pointer;
      overflow: hidden;
      position: relative;
      border-radius: 8px;
      transition: box-shadow .15s, filter .15s;
    }
    .char-card img { width: 100%; height: 100%; object-fit: cover; image-rendering: pixelated; }
    .char-card:hover img { filter: brightness(1.15); }
    .char-card.selected { box-shadow: 0 0 0 3px var(--gold), 0 0 12px rgba(232,184,32,.5); }
    .char-card.dim, .stack-wrapper.dim { opacity: .35; pointer-events: none; }
    .char-card.broken {
      background: var(--slot-bg);
      border: 2px solid var(--slot-border);
    }
    .char-card.stacked::before {
      content: '';
      position: absolute; inset: -3px;
      background: var(--surface2);
      border: 2px solid var(--slot-border);
      border-radius: 9px;
      z-index: -1;
      transform: translate(4px, 4px);
    }
    .variant-count {
      position: absolute; top: 2px; right: 2px;
      background: rgba(0,0,0,.75);
      color: var(--gold);
      font-size: 8px;
      font-family: var(--font-title);
      padding: 1px 3px;
      border-radius: 2px;
    }

    /* arcana overlay two-panel (no left stats) */
    .ovl-center-wide { flex: 1; display: flex; flex-direction: column; overflow: hidden; }

    /* stage grid — bordered art tiles, ~4 per row, fluid with zoom */
    .stage-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(230px, 1fr));
      gap: .8rem;
    }
    /* larger stage-item icons in both the selector detail panel and planner sidebar */
    .req-icons.stage-items { gap: 6px; }
    .req-icons.stage-items .req-icon { width: 44px; height: 44px; border-radius: 5px; }
    /* click-to-add stage items (planner sidebar): addable = gold hover + "+" badge;
       blocked = dimmed/greyed with a reason tooltip; special floor pickups = slightly muted. */
    .req-icon.stage-add { cursor: pointer; }
    .req-icon.stage-add:hover { outline: 2px solid var(--gold); box-shadow: 0 0 6px rgba(232,184,32,.5); }
    .req-icon.stage-add-plus {
      position: absolute; bottom: -3px; right: -3px; background: var(--gold); color: #1a0000;
      font-size: .62rem; line-height: 1; padding: 1px 3px; border-radius: 3px; font-weight: bold;
      opacity: 0; transition: opacity .1s; pointer-events: none;
    }
    .req-icon.stage-add:hover .stage-add-plus { opacity: 1; }
    .req-icon.stage-add-off { opacity: .38; filter: grayscale(.6); cursor: not-allowed; }
    .req-icon.stage-pickup { opacity: .7; }
    /* 44px icons (matching stage items) in every .req-row list: Starting Loadout
       (selector + info panel), weapon requirements (weapon selector info panel),
       and evo-stage navigation (planner info panel). Placed after the earlier
       .req-icon / .info-sidebar .req-icon rules so it wins the cascade. */
    .req-row .req-icon { width: 44px; height: 44px; border-radius: 5px; }
    .stage-tile { cursor: pointer; display: flex; flex-direction: column; gap: .3rem; }
    .stage-tile img {
      width: 100%;
      aspect-ratio: 312 / 192;
      object-fit: fill;
      image-rendering: pixelated;
      display: block;
      transition: filter .15s, box-shadow .15s;
    }
    .stage-tile:hover img { filter: brightness(1.2); }
    .stage-tile.selected img { box-shadow: 0 0 0 2px var(--gold), 0 0 10px rgba(232,184,32,.55); }
    /* stage image in the detail panel — same landscape aspect */
    .stage-detail-img img {
      width: 100%;
      aspect-ratio: 312 / 192;
      object-fit: fill;
      image-rendering: pixelated;
      display: block;
    }

    /* scrollbar */
    ::-webkit-scrollbar { width: 6px; }
    ::-webkit-scrollbar-track { background: transparent; }
    ::-webkit-scrollbar-thumb { background: var(--border); border-radius: 3px; }
    ::-webkit-scrollbar-thumb:hover { background: var(--border-hi); }

    /* ── Responsive ── */
    @media (max-width: 700px) {
      .players-grid.p3, .players-grid.p4 { grid-template-columns: 1fr; }
      .overlay-panel { width: 95vw; }
      .ovl-left, .ovl-right { width: 140px; }
      .detail-info-grid { grid-template-columns: repeat(2, minmax(0, 1fr)); }
    }
    /* ══════════════════════════════════════════════════════════════════════
       MOBILE (phones, ≤600px) — reflow ONLY. Every rule here is an override
       that fires at phone widths; the desktop/tablet layout above is untouched.
       No markup/JS changes, so the web design is byte-for-byte identical >600px.
       ══════════════════════════════════════════════════════════════════════ */
    @media (max-width: 600px) {
      /* Slightly smaller slots so rows fit a phone; cascades to every slot/grid. */
      :root { --slot-size: 46px; }

      /* ── Overlays go full-screen (no wasted margin, easier to scroll) ── */
      #overlay-root, #detail-overlay-root { padding: 0; }
      .overlay-panel, #detail-overlay-root .overlay-panel,
      .builds-panel, .collection-panel, .seal-panel, .pu-panel {
        width: 100vw; max-width: 100vw;
        height: 100vh; height: 100dvh; max-height: 100vh; max-height: 100dvh;
        border-radius: 0; border: none;
      }
      .overlay-header h2 { font-size: 1.2rem; }
      #detail-overlay-root .overlay-header h2 { font-size: 1.25rem; }

      /* ── Landing ── */
      .landing-grid { grid-template-columns: 1fr; gap: .75rem; }
      .player-tile-btn { width: 100%; }

      /* ── Planner header (wraps instead of overflowing) ── */
      .planning-header { flex-wrap: wrap; gap: .4rem; padding: .55rem .7rem; }
      .planning-header h1 { font-size: 1rem; }
      .planning-header-actions { flex-wrap: wrap; gap: .35rem; }
      .planning-header-actions .btn { font-size: .78rem; padding: .3rem .5rem; }

      /* ── Planner body: single column, tighter padding ── */
      .planning-body { flex-direction: column; padding: .6rem; gap: .6rem; overflow: visible; }
      .planning-main { overflow: visible; }
      .global-row { max-width: 100%; padding: .5rem .6rem; }
      .players-grid, .players-grid.p3, .players-grid.p4 { grid-template-columns: 1fr; max-width: 100%; }
      /* Two zones, top-aligned: Arcana fills the left and WRAPS internally; Stage keeps a reserved
         spot on the right that never shifts (label top-right like Arcana's label is top-left, icon
         below). Both labels are one line high, so the Stage icon lines up with the first arcana row. */
      .global-row-inner { align-items: flex-start; }
      .global-row-spacer { display: none; }
      .global-arcana-group {
        display: flex; flex: 1; flex-wrap: wrap; align-items: center; align-content: flex-start; gap: .3rem;
      }
      /* Zero the label's own margin so the label→first-row gap is exactly the flex row-gap (.3rem)
         in BOTH zones — that's what makes the Stage icon line up with the first Arcana row. */
      .global-arcana-group .slot-row-label { width: 100%; margin: 0; }
      .global-stage-group {
        display: inline-flex; flex-direction: column; align-items: flex-end; gap: .3rem; flex: none;
      }
      .global-stage-group .slot-row-label { width: auto !important; margin: 0 !important; text-align: right; }

      /* ── Player card: character on top, slots below; slot rows wrap ── */
      .player-header { flex-wrap: wrap; gap: .3rem; }
      .player-header-actions { flex-wrap: wrap; }
      /* Stack the tile and CENTER its columns. The base .player-body uses align-items:flex-start,
         which (in a column) left-anchors the slots column and shrinks it to content — so a full
         6-slot row looked left-aligned. align-items:center centers the character AND the slots
         column in the tile; justify-content:center then centers partial/wrapped rows within it. */
      .player-body { flex-direction: column; align-items: center; gap: .6rem; padding: .6rem; }
      .slot-row-label { width: 100%; margin-bottom: .1rem; }
      .slots-col { flex: none; }
      .slots-col .slot-row { flex-wrap: wrap; justify-content: center; }

      /* ── Selection overlay (mobile): exactly TWO scroll regions — the grid and ONE info panel.
         Nothing selected → the grid is the whole screen. Something selected → grid on the top half,
         and .ovl-info on the bottom half as a SINGLE scroller holding the detail (right) followed by
         the stats (left). Headers aren't locked, so there's no dead zone; overscroll-behavior stops
         chaining to the page behind. `.has-selection` is toggled in JS from state.ovl.selected.
         Desktop keeps its 3-column layout (these rules are mobile-only). ── */
      .overlay-body { flex-direction: column; overflow: hidden; overscroll-behavior: contain; }
      .ovl-center, .ovl-center-wide { order: 1; width: 100%; min-height: 0; display: flex; flex-direction: column; overflow: hidden; }
      .ovl-center-scroll { flex: 1; min-height: 0; max-height: none; overflow-y: auto; overscroll-behavior: contain; -webkit-overflow-scrolling: touch; }
      /* The one info scroller. Its panels (detail then stats) flow inside it — no inner scrollers,
         no locked headers — so the whole thing scrolls as a single window. */
      .ovl-info {
        display: flex; flex-direction: column; order: 2; width: 100%; min-height: 0;
        overflow-y: auto; overscroll-behavior: contain; -webkit-overflow-scrolling: touch;
      }
      .ovl-info .ovl-right, .ovl-info .ovl-left {
        order: 0; width: 100%; flex: none; min-height: 0; overflow: visible;
        border-left: none; border-right: none;
      }
      .ovl-info .ovl-left { border-top: 1px solid var(--border); }
      .ovl-info .ovl-right-body { flex: none; overflow: visible; }
      /* Nothing selected → grid fills the screen, info hidden. */
      .overlay-body:not(.has-selection) .ovl-center,
      .overlay-body:not(.has-selection) .ovl-center-wide { flex: 1 1 100%; }
      .overlay-body:not(.has-selection) .ovl-info { display: none; }
      /* Something selected → grid = top half, the single info panel = bottom half. */
      .overlay-body.has-selection .ovl-center,
      .overlay-body.has-selection .ovl-center-wide { flex: 0 0 50%; }
      .overlay-body.has-selection .ovl-info { flex: 1 1 0; }
      .ovl-right-top .detail-icon { width: 72px; height: 72px; }
      /* Stage picker: two smaller side-by-side tiles instead of one big column (names removed;
         the icon art already contains the stage name). */
      .stage-grid { grid-template-columns: repeat(2, 1fr); gap: .5rem; }

      /* Stat table shrinks to fit narrow screens */
      .ovl-left .stat-row { grid-template-columns: 1fr 40px 40px 46px 52px; font-size: .76rem; }

      /* ── Detail overlay: art on top, single column, page scrolls ── */
      .detail-body { flex-direction: column; overflow-y: auto; -webkit-overflow-scrolling: touch; }
      .detail-left {
        width: 100%; flex: none; border-right: none;
        border-bottom: 1px solid var(--border); padding: 1rem; text-align: center;
      }
      .detail-left .detail-icon { width: 128px; height: 128px; margin: 0 auto .6rem; }
      .detail-left .detail-icon.arcana-card { width: 132px; height: 190px; }
