    root.classList.remove('hidden');
    state.puActive = true;
  }

  function closePowerUpOverlay() {
    document.getElementById('overlay-root').classList.add('hidden');
    state.puActive = false;
    render(); // update stat totals in sidebar
  }

  // ═══════════════════════════════════════════════════════
  //  SEAL OVERLAY
  // ═══════════════════════════════════════════════════════

  function sealBuildItems() {
    const items = new Set();
    state.players.forEach(p => {
      p.weapons.forEach(w => w && items.add(w.name));
      p.passives.forEach(p => p && items.add(p.name));
    });
    return items;
  }

  // Items actually reachable on the selected stage: its always-present items plus any
  // arcana-gated groups whose gating arcana is currently equipped (e.g. Boss Rash's items
  // only count when Mad Groove (VIII) is in the build).
  function stageItemSet() {
    const stage = state.stage;
    if (!stage) return new Set();
    const set = new Set(stage.items ?? []);
    (stage.conditional ?? []).forEach(group => {
      if (state.arcana.some(a => a && a.name === group.arcana)) {
        group.items.forEach(i => set.add(i));
      }
    });
    return set;
  }

  // Items the seal advisor must NEVER recommend sealing, because they must be able to
  // drop for the build to come together. This is the acutal-consumed lineage, not the
  // abstract one: for each equipped weapon we take its full backward chain (the weapons
  // and passives consumed to reach it), then prune the parts a character's STARTER made
  // unnecessary. Minnah starts with Bloody Tear, so Whip (and its ingredient Hollow
  // Heart) were never pulled from the pool — they stay sealable. A weapon kept in an
  // early form (Bloody Tear, not Fuwalafuwaloo) does not protect its forward union
  // partner, so that partner (and the union result) can be sealed to lock the form.
  //
  // Returns { protectedSet, equippedWeapons } — equippedWeapons drives the recommend
  // logic that seals a union/evolution only when the build can actually form it.
  function sealProtectedItems() {
    const passiveNames    = new Set(D.passives.map(p => p.name));
    const protectedSet    = new Set();
    const equippedWeapons = new Set();

    state.players.forEach(p => p.weapons.forEach(w => w && equippedWeapons.add(w.name)));

    state.players.forEach(player => {
      const char    = player.character;
      const hidden  = new Set(char?.hidden_items ?? []);
      const starters = new Set((char?.starting_weapons ?? []).filter(sw => !hidden.has(sw)));

      // Equipped passives are part of the desired build — always protected.
      player.passives.forEach(p => p && protectedSet.add(p.name));

      player.weapons.forEach(w => {
        if (!w) return;
        const chain = collectWeaponChain(w.name); // w + every weapon consumed to reach it

        // Upstream bases a starter-provided evolved weapon skipped (never dropped).
        const skipped = new Set();
        starters.forEach(sw => {
          if (chain.has(sw) && D.weapons.some(b => b.trans_result === sw)) {
            collectWeaponChain(sw).forEach(anc => {
              if (anc !== sw && !equippedWeapons.has(anc)) skipped.add(anc);
            });
          }
        });

        // Protect every weapon that must still drop (chain minus starter-skipped bases).
        chain.forEach(n => { if (!skipped.has(n)) protectedSet.add(n); });

        // Protect passives consumed by transforms that actually occur: every chain weapon
        // except the equipped form itself (whose requirement points beyond the build) and
        // the starter-skipped bases (whose transform never happened).
        chain.forEach(n => {
          if (skipped.has(n) || n === w.name) return;
          const wo = D.weapons.find(x => x.name === n);
          if (!wo) return;
          (wo.requirements || []).forEach(req => {
            if (passiveNames.has(req)) protectedSet.add(req);
          });
        });
      });
    });

    return { protectedSet, equippedWeapons };
  }

  // ── Seal advisor strategy constants ──
  // Free-pick enabler weapons — never auto-seal. Candybox/Turbo grant a free weapon pick,
  // Arma Dio a free passive; sealing them throws those picks away. (Arma Dio is rarity 50,
  // so it would otherwise be caught by the default threshold.)
  const SEAL_FREE_PICKS = new Set(['Candybox', 'Super Candybox II Turbo', 'Arma Dio']);
  // Arcana that hand you passives outside the normal pool, making passive-sealing
  // counterproductive: Hail from the Future drops Arma Dios; Moonlight Bolero's chests hold
  // passives even with full slots. With either equipped, don't auto-seal passives at all.
  const SEAL_PASSIVE_BLOCKING_ARCANA = new Set(['Moonlight Bolero (VI)', 'Hail from the Future (X)']);
  // Keep weapons at/below this rarity unsealed so regular Candybox (and Hail's Candybox
  // drops) still have cheap picks — these barely surface as normal level-ups anyway.
  const SEAL_CANDYBOX_RESERVE_RARITY = 1;
  // Priority order for the one passive left unsealed for Arma Dio to grant (the routine
  // extra passive in single player). Reserve the highest-ranked one not already in the build.
  const SEAL_ARMA_PASSIVE_PRIORITY = [
    'Duplicator', 'Empty Tome', 'Spinach', 'Candelabrador', 'Spellbinder', 'Bracer',
    'Attractorb', 'Tirajisú', 'Clover', 'Crown', 'Pummarola', 'Hollow Heart', 'Armor',
    'Wings', 'Stone Mask', "Skull O'Maniac",
  ];

  function applySealRecommend() {
    const { protectedSet, equippedWeapons } = sealProtectedItems();
    const passiveNames = new Set(D.passives.map(p => p.name));
    const minRarity = state.seal.minRarity;

    // Arcana context can veto passive sealing entirely (see SEAL_PASSIVE_BLOCKING_ARCANA).
    const blockingArcana = state.arcana.find(a => a && SEAL_PASSIVE_BLOCKING_ARCANA.has(a.name));
    const sealPassives = state.seal.sealPassives && !blockingArcana;

    // Items reachable on the selected stage — usually not worth sealing (you can grab them
    // as a late 7th/8th slot). Never auto-recommend; the user can still seal manually.
    const stageItems = stageItemSet();

    // Reserve one high-value passive (not already in the build, and not free on this stage)
    // for Arma Dio to fill.
    const armaReserve = sealPassives
      ? SEAL_ARMA_PASSIVE_PRIORITY.find(pn =>
          passiveNames.has(pn) && !protectedSet.has(pn) && !stageItems.has(pn))
      : null;

    state.seal.selected.clear();

    D.banishLayout.forEach(name => {
      if (!name) return;
      if (protectedSet.has(name)) return;
      if (SEAL_FREE_PICKS.has(name)) return; // Candybox / Turbo / Arma Dio — keep the free picks
      if (stageItems.has(name)) return;      // free on the selected stage — leave for pickup

      const isPassive = passiveNames.has(name);

      if (isPassive) {
        if (!sealPassives) return;
        if (name === armaReserve) return;    // leave one valuable passive for Arma Dio
        const passive = D.passives.find(p => p.name === name);
        if (passive && passive.rarity >= minRarity) state.seal.selected.add(name);
        return;
      }

      const weapon = D.weapons.find(w => w.name === name);
      if (!weapon) return;

      if (weapon.rarity > 0) {
        // Offerable weapon. Leave the cheapest tier unsealed for Candybox picks.
        if (weapon.rarity <= SEAL_CANDYBOX_RESERVE_RARITY) return;
        if (weapon.rarity >= minRarity) state.seal.selected.add(name);
      } else {
        // Evolutions/unions (rarity 0) never drop but auto-form from their parts. Seal one
        // only when the build holds a component that could form it — locks an equipped weapon
        // in its current stage (e.g. seal Vandalier to keep Peachone + Ebony Wings). We don't
        // blanket-seal evolutions: Turbo Candybox picks from the evolved pool, so keeping
        // them available matters.
        const parts = collectWeaponChain(name);
        let formable = false;
        parts.forEach(part => { if (part !== name && equippedWeapons.has(part)) formable = true; });
        if (formable) state.seal.selected.add(name);
      }
    });

    // Report whether the arcana veto suppressed passive sealing, so the UI can explain it.
    return { blockedByArcana: state.seal.sealPassives && blockingArcana ? blockingArcana.name : null };
  }

  function renderSealOverlay() {
    const passiveNames = new Set(D.passives.map(p => p.name));
    const weaponMap   = Object.fromEntries(D.weapons.map(w => [w.name, w]));
    const passiveMap  = Object.fromEntries(D.passives.map(p => [p.name, p]));
    const buildItems  = sealBuildItems();
    const { protectedSet } = sealProtectedItems();
    const stageItems  = stageItemSet();

    const rarityValues = [...new Set(
      D.weapons.map(w => w.rarity).filter(r => r > 0)
    )].sort((a, b) => a - b);

    const sliderMax = rarityValues.length - 1;
    const curIdx    = Math.max(0, rarityValues.indexOf(state.seal.minRarity));
    const dispVal   = rarityValues[curIdx] ?? state.seal.minRarity;

    const cells = D.banishLayout.map(name => {
      if (!name) return `<div class="seal-cell empty"></div>`;

      const isPassive = passiveNames.has(name);
      const inBuild   = buildItems.has(name);
      const sealed  = state.seal.selected.has(name);
      const passiveOff = isPassive && !state.seal.sealPassives;

      const item  = weaponMap[name] || passiveMap[name];
      const icon  = item ? item.icon : (isPassive ? EMPTY_ICONS.passive : EMPTY_ICONS.weapon);
      const fallback = isPassive ? EMPTY_ICONS.passive : EMPTY_ICONS.weapon;

      // Lineage component that must still drop to build an equipped weapon (e.g. Peachone
      // when Vandalier is equipped). Locked — sealing it would break the build.
      const needed = !inBuild && protectedSet.has(name);
      // Free on the selected stage — flagged but still sealable if the user insists.
      const stageItem = !inBuild && !needed && stageItems.has(name);

      const classes = ['seal-cell',
        inBuild    ? 'in-build'     : '',
        needed     ? 'needed'       : '',
        stageItem  ? 'stage-item'   : '',
        sealed   ? 'sealed'     : '',
        passiveOff ? 'passive-off'  : '',
      ].filter(Boolean).join(' ');

      const lockToggle = inBuild || needed || passiveOff;
      const actionAttr = lockToggle
        ? '' : `data-action="seal-toggle" data-name="${esc(name)}"`;

      const tip = esc(name)
        + (item ? ` — rarity ${item.rarity}` : '')
        + (inBuild ? ' (in build)' : '')
        + (needed ? ' (needed for lineage)' : '')
        + (stageItem ? ' (free on stage)' : '');

      return `<div class="${classes}" ${actionAttr} title="${tip}">
        <img class="seal-icon" src="${esc(icon)}" alt="${esc(name)}" onerror="this.src='${fallback}'">
        <img class="seal-mark" src="assets/icons/ui/seal.png" alt="">
      </div>`;
    }).join('');

    const root = document.getElementById('overlay-root');
    root.innerHTML = `
      <div class="overlay-panel seal-panel">
        <div class="overlay-header">
          <h2>Seal Advisor</h2>
          <button class="btn btn-icon overlay-close" data-action="seal-close">✕</button>
        </div>
        <div class="seal-controls">
          <label>
            <input type="checkbox" id="seal-passives-chk" ${state.seal.sealPassives ? 'checked' : ''}>
            Seal Passives
          </label>
          <div class="seal-rarity-ctrl">
            <span>Min Rarity</span>
            <input type="range" id="seal-rarity-slider"
              min="0" max="${sliderMax}" value="${curIdx}"
              data-rarities="${rarityValues.join(',')}">
            <span class="seal-rarity-val" id="seal-rarity-val">${dispVal}</span>
          </div>
          <button class="btn btn-confirm btn-sm" data-action="seal-recommend">Recommend</button>
          <button class="btn btn-sm" data-action="seal-clear">Clear All</button>
        </div>
        <div class="seal-grid-wrap">
          <div class="seal-grid">${cells}</div>
        </div>
      </div>`;
    root.classList.remove('hidden');
    state.seal.active = true;
  }

  function closeSealOverlay() {
    document.getElementById('overlay-root').classList.add('hidden');
    state.seal.active = false;
  }

  // ═══════════════════════════════════════════════════════
  //  EVENT HANDLERS
  // ═══════════════════════════════════════════════════════

  function handleOverlayClick(e) {
    const btn = e.target.closest('[data-action]');
    if (!btn) {
      if (e.target === document.getElementById('overlay-root')) {
        if (state.puActive) closePowerUpOverlay();
        else if (state.seal.active) closeSealOverlay();
        else closeOverlay(false);
      }
      return;
    }
    e.stopPropagation();
    const action = btn.dataset.action;

    // ── Power-up overlay actions ──
    if (action === 'pu-close') { closePowerUpOverlay(); return; }
    if (action === 'pu-disable-all') {
      D.stats.forEach(s => { state.powerUps[s.name] = 0; });
      renderPowerUpOverlay(); return;
    }
    if (action === 'pu-max-all') {
      D.stats.forEach(s => { state.powerUps[s.name] = s.max_level; });
      renderPowerUpOverlay(); return;
    }
    if (action === 'pu-level') {
      const statName = btn.dataset.stat;
      const delta    = parseInt(btn.dataset.delta);
      const stat     = D.stats.find(s => s.name === statName);
      if (!stat) return;
      const cur  = state.powerUps[statName] ?? stat.max_level;
      const next = Math.max(0, Math.min(stat.max_level, cur + delta));
      state.powerUps[statName] = next;
      // patch DOM in-place instead of full re-render
      const id = 'pu-lv-' + statName.replace(/\W+/g, '_');
      const lbl = document.getElementById(id);
      if (lbl) lbl.textContent = `${next}/${stat.max_level}`;
      const row  = btn.closest('.pu-row');
      const btns = row?.querySelectorAll('[data-action="pu-level"]');
      if (btns) {
        btns[0].disabled = next <= 0;
        btns[1].disabled = next >= stat.max_level;
      }
      return;
    }

    // ── Seal overlay actions ──
    if (action === 'seal-close') { closeSealOverlay(); return; }
    if (action === 'seal-toggle') {
      const name = btn.dataset.name;
      if (state.seal.selected.has(name)) state.seal.selected.delete(name);
      else state.seal.selected.add(name);
      btn.classList.toggle('sealed', state.seal.selected.has(name));
      return;
    }
    if (action === 'seal-recommend') {
      const { blockedByArcana } = applySealRecommend();
      renderSealOverlay();
      if (blockedByArcana) showToast(`Passives left unsealed — ${blockedByArcana} grants passives outside the pool`, 'warn');
      return;
    }
    if (action === 'seal-clear') {
      state.seal.selected.clear();
      renderSealOverlay();
      return;
    }

    if (action === 'ovl-close') { closeOverlay(false); return; }
    if (action === 'ovl-confirm') { closeOverlay(true); return; }
    if (action === 'ovl-search-clear') {
      const input = e.target.closest('.ovl-search-wrap')?.querySelector('.ovl-search');
      if (input) { input.value = ''; state.ovl.search = ''; applyOverlaySearch(input); input.focus(); }
      return;
    }
    if (action === 'level-clear') {
      state.players[parseInt(btn.dataset.player ?? '0')].charLevel = 1;
      refreshOverlay(); return;
    }

    if (action === 'ovl-select-char') {
      const name = btn.dataset.char;
      state.ovl.selected = D.characters.find(c => c.name === name) || null;
      refreshOverlay(); return;
    }
    if (action === 'cycle-char-variant') {
      const base = btn.dataset.base;
      const groups = charGroups();
      const grp = groups.find(g => g[0].base_name === base) || [];
      const cur = state.ovl.variantIdx[base] ?? 0;
      const dir = parseInt(btn.dataset.dir) || 1;
      state.ovl.variantIdx[base] = (cur + dir + grp.length) % grp.length;
      refreshOverlay(); return;
    }

    if (action === 'ovl-select-item') {
      const name = btn.dataset.item;
      const itemType = btn.dataset.itemType;
      if (itemType === 'passive') state.ovl.selected = D.passives.find(p => p.name === name) || null;
      else                        state.ovl.selected = D.weapons.find(w => w.name === name) || null;
      state.ovl.autoAdd = null; // reset to computed default for new selection
      refreshOverlay(); return;
    }
    if (action === 'toggle-auto-add') {
      const ovCtx = state.overlay;
      const { pending, missing } = getEvolutionPassiveStatus(
        D.weapons.find(w => w.name === state.ovl.selected?.name) || {},
        ovCtx.playerIdx
      );
      const current = state.ovl.autoAdd ?? (pending.length > 0);
      state.ovl.autoAdd = !current;
      refreshOverlay(); return;
    }

    if (action === 'ovl-select-arcana') {
      const name = btn.dataset.arcana;
      state.ovl.selected = D.arcana.find(a => a.name === name) || null;
      refreshOverlay(); return;
    }
    if (action === 'arcana-tab-toggle') {
      state.ovl.arcanaTab = state.ovl.arcanaTab === 'arcana' ? 'darkana' : 'arcana';
      state.ovl.selected = null;
      refreshOverlay(); return;
    }

    if (action === 'ovl-select-stage') {
      const name = btn.dataset.stage;
      state.ovl.selected = STAGES.find(s => s.name === name) || null;
      refreshOverlay(); return;
    }
  }

  function handleAppClick(e) {
    const btn = e.target.closest('[data-action]');
    if (!btn) return;
    const action = btn.dataset.action;
    const playerIdx = parseInt(btn.dataset.player ?? '0');
    const slotIdx   = parseInt(btn.dataset.slot   ?? '0');
    const slotType  = btn.dataset.type;

    if (action === 'set-player-count') {
      const n = parseInt(btn.dataset.count);
      state.playerCount = n;
      state.players = initPlayers(n, state.players);
      state.page = 'planning';
      render();
      return;
    }
    if (action === 'open-power-ups') {
      renderPowerUpOverlay();
      return;
    }
    if (action === 'open-seal') {
      renderSealOverlay();
      return;
    }
    if (action === 'change-player-count') {
      state.page = 'landing';
      render();
      return;
    }
    if (action === 'clear-player') {
      state.players[playerIdx] = makePlayer();
      if (state.infoPanel?.playerIdx === playerIdx) state.infoPanel = null;
      render();
      return;
    }
    if (action === 'level-clear') {
      state.players[playerIdx].charLevel = 1;
      render();
      return;
    }
    if (action === 'remove-slot') {
      e.stopPropagation();
      const p = state.players[playerIdx];
      if (slotType === 'char')    p.character = null;
      else if (slotType === 'weapon')  p.weapons[slotIdx] = null;
      else if (slotType === 'passive') { p.passives[slotIdx] = null; autoDevolveBrokenEvos(); }
      else if (slotType === 'arcana')  state.arcana[slotIdx] = null;
      else if (slotType === 'stage')   state.stage = null;
      state.infoPanel = null;
      render();
      return;
    }
    if (action === 'view-slot') {
      const refName = btn.dataset.infoName || null;
      state.infoPanel = { type: slotType, playerIdx, slotIdx, refName };
      render();
      return;
    }
    if (action === 'view-hidden') {
      state.infoPanel = { type: 'weapon', playerIdx, slotIdx: -1, hiddenName: btn.dataset.hiddenName };
      render();
      return;
    }
    if (action === 'view-extra-passive') {
      state.infoPanel = { type: 'passive', playerIdx, slotIdx: -1, refName: btn.dataset.extraName };
      render();
      return;
    }
    if (action === 'remove-extra-passive') {
      e.stopPropagation();
      const p = state.players[playerIdx];
      const i = p.extraPassives.indexOf(btn.dataset.extraName); // remove ONE instance
      if (i >= 0) p.extraPassives.splice(i, 1);
      // Removing a shared requirement (Outer Saboteur / Mini) can break other evolutions;
      // syncExtraPassives handles Weapon Power-Up's 1:1 devolve, autoDevolve the rest.
      autoDevolveBrokenEvos();
      syncExtraPassives(p);
      state.infoPanel = null;
      render();
      return;
    }
    if (action === 'perform-evolve') {
      const resultW = weaponByName(btn.dataset.result);
      if (resultW) {
        const p = state.players[playerIdx];
        p.weapons[slotIdx] = resultW;
        // Back the evolved weapon with any extra-bar passive it requires (capped).
        for (const pname of collectChainPassives(collectWeaponChain(resultW.name))) {
          if (isExtraPassive(pname) && extraCount(p, pname) < extraCap(p, pname)) p.extraPassives.push(pname);
        }
        syncExtraPassives(p);
        state.infoPanel = { type: 'weapon', playerIdx, slotIdx };
      }
      render();
      return;
    }
    if (action === 'perform-union') {
      const inputSlots = (btn.dataset.inputSlots || '').split(',').map(Number);
      const resultW = weaponByName(btn.dataset.result);
      if (resultW && inputSlots.length) {
        inputSlots.forEach((si, i) => {
          state.players[playerIdx].weapons[si] = i === 0 ? resultW : null;
        });
        state.infoPanel = { type: 'weapon', playerIdx, slotIdx: inputSlots[0] };
      }
      render();
      return;
    }
    if (action === 'perform-devolve') {
      const player = state.players[playerIdx];
      const current = player.weapons[slotIdx];
      if (current) {
        const counts = SLOT_COUNTS[state.playerCount];
        // All weapons that produced the current weapon (one for evo, two+ for union)
        const bases = D.weapons.filter(b => b.trans_result === current.name);
        if (bases.length) {
          // Primary base reclaims the current slot
          player.weapons[slotIdx] = bases[0];
          // Remaining union partners are restored to the first available empty slot,
          // skipping any that are already present (guards against duplicate slots).
          for (let i = 1; i < bases.length; i++) {
            if (player.weapons.some(w => w && w.name === bases[i].name)) continue;
            let emptySlot = -1;
            for (let j = 0; j < counts.weapons; j++) {
              if (!player.weapons[j]) { emptySlot = j; break; }
            }
            if (emptySlot >= 0) player.weapons[emptySlot] = bases[i];
          }
          state.infoPanel = { type: 'weapon', playerIdx, slotIdx };
        }
      }
      render();
      return;
    }
    if (action === 'open-slot') {
      openSlotOverlay(slotType, playerIdx, slotIdx);
      return;
    }
  }

  function openSlotOverlay(slotType, playerIdx, slotIdx) {
    if (slotType === 'char')    { openCharacterOverlay(playerIdx); return; }
    if (slotType === 'weapon')  { openWeaponOverlay(playerIdx, slotIdx); return; }
    if (slotType === 'passive') { openPassiveOverlay(playerIdx, slotIdx); return; }
    if (slotType === 'arcana')  { openArcanaOverlay(slotIdx); return; }
    if (slotType === 'stage')   { openStageOverlay(); return; }
  }

  function showToast(msg, kind = 'ok') {
    document.querySelectorAll('.evo-toast').forEach(t => t.remove());
    const el = document.createElement('div');
    el.className = `evo-toast ${kind}`;
    el.textContent = msg;
    document.body.appendChild(el);
    setTimeout(() => el.remove(), 2100);
  }

  // Collect all missing base weapons + passives needed to make weaponName achievable.
  // Handles unions recursively (their requirements are themselves evo weapons).
  // Collect all weapon names in the full chain reaching targetName by following
  // trans_result backward (bases that evolve/union into the target, recursively).
  // We deliberately do NOT recurse into w.requirements weapon entries — those are
  // union partners already reachable via trans_result, and recursing into them
  // from the partner's side incorrectly inflates unrelated branches (e.g. Vento
  // Sacro's partner Bloody Tear would pull Whip into Vento Sacro's chain).
  function collectWeaponChain(targetName, visited = new Set()) {
    if (visited.has(targetName)) return visited;
    visited.add(targetName);
    D.weapons.filter(b => b.trans_result === targetName)
      .forEach(b => collectWeaponChain(b.name, visited));
    return visited;
  }

  // Walk forward from targetName via trans_result to collect all future forms.
  // Used to block forward-evo weapons in the selector when a base is already equipped.
  function collectDescendants(targetName, visited = new Set()) {
    if (visited.has(targetName)) return visited;
    visited.add(targetName);
    const w = D.weapons.find(x => x.name === targetName);
    if (!w || !w.trans_result) return visited;
    collectDescendants(w.trans_result, visited);
    return visited;
  }

  // Like collectDescendants, but STOPS at a Union step. Union results require an
  // external partner from another slot, so they must stay selectable from that
  // partner's slot — only the purely-linear (Evolution) forms are locked to a
  // starter's own slot and should be blocked elsewhere.
  function collectLinearDescendants(targetName, visited = new Set()) {
    if (visited.has(targetName)) return visited;
    visited.add(targetName);
    const w = D.weapons.find(x => x.name === targetName);
    if (!w || !w.trans_result || w.method === 'Union') return visited;
    collectLinearDescendants(w.trans_result, visited);
    return visited;
  }

  // Return all passive names required by any weapon in the given chain set.
  function collectChainPassives(chain) {
    const passives = new Set();
    chain.forEach(wname => {
      const w = D.weapons.find(x => x.name === wname);
      if (!w) return;
      (w.requirements || []).forEach(req => {
        if (D.passives.find(p => p.name === req)) passives.add(req);
      });
    });
    return passives;
  }

  // Return the Set of weapon names consumed across ALL players (drop pool is shared).
  // excludePlayerIdx + excludeSlotIdx: omit one slot from the computation — used when
  // the weapon overlay is open so the slot being replaced doesn't block its own weapon.
  //
  // Starter-evolved exception: if a character starts with an evolved weapon (e.g. Minnah
  // starts with Bloody Tear), the upstream bases (Whip) were never pulled from the drop
  // pool. If that starter evo was itself later consumed into a union, the starter-evolved
  // weapon can also be re-produced from scratch.
  function getConsumedWeapons(excludePlayerIdx = -1, excludeSlotIdx = -1) {
    const consumed          = new Set();
    const starterEvolvedBases = new Set(); // upstream bases exempt from consumed
    const starterEvolvedSelf  = new Set(); // the starter evo weapon itself (re-producible)
    const allEquipped         = new Set(); // all weapon names in any slot, any player

    state.players.forEach((player, pidx) => {
      const char = player.character;
      const hiddenSet         = new Set(char?.hidden_items ?? []);
      const nonHiddenStarters = new Set((char?.starting_weapons ?? []).filter(sw => !hiddenSet.has(sw)));

      // Accumulate starter-evolved exceptions for this player's character.
      nonHiddenStarters.forEach(sw => {
        if (D.weapons.some(b => b.trans_result === sw)) {
          collectWeaponChain(sw).forEach(name => { if (name !== sw) starterEvolvedBases.add(name); });
          starterEvolvedSelf.add(sw);
        }
      });

      // Add every equipped weapon's full chain to consumed.
      player.weapons.forEach((w, sidx) => {
        if (!w) return;
        if (pidx === excludePlayerIdx && sidx === excludeSlotIdx) return;
        collectWeaponChain(w.name).forEach(name => consumed.add(name));
        allEquipped.add(w.name);
      });
    });

    // Un-consume upstream bases of starter-evolved weapons (they were never picked up).
    starterEvolvedBases.forEach(name => {
      if (!allEquipped.has(name)) consumed.delete(name);
    });

    // Un-consume the starter-evolved weapon itself if no player currently has it equipped
    // (it was consumed into a union, so it can be re-produced from its freed prerequisites).
    starterEvolvedSelf.forEach(sw => {
      if (!allEquipped.has(sw)) consumed.delete(sw);
    });

    return consumed;
  }

  // Place a list of {name, type} items into available slots. Returns {added, failed}.
  function applyBuildItems(items, playerIdx) {
    const player = state.players[playerIdx];
    const counts = SLOT_COUNTS[state.playerCount];
    const char = player.character;
    const hiddenSet = new Set(char?.hidden_items ?? []);
    const starterCount = char
      ? Math.min(char.starting_weapons.filter(wn => !hiddenSet.has(wn)).length, counts.weapons)
      : 0;
    const added = [], failed = [];
    for (const item of items) {
      if (item.type === 'weapon') {
        const wObj = D.weapons.find(w => w.name === item.name);
        if (!wObj) continue;
        let slot = -1;
        for (let i = starterCount; i < counts.weapons; i++) { if (!player.weapons[i]) { slot = i; break; } }
        if (slot < 0) for (let i = 0; i < counts.weapons; i++) { if (!player.weapons[i]) { slot = i; break; } }
        if (slot < 0) { failed.push(item.name); continue; }
        player.weapons[slot] = wObj;
        added.push(item.name);
      } else if (item.type === 'passive') {
        const pObj = D.passives.find(p => p.name === item.name);
        if (!pObj) continue;
        let slot = -1;
        for (let i = 0; i < counts.passives; i++) { if (!player.passives[i]) { slot = i; break; } }
        if (slot < 0) { failed.push(item.name); continue; }
        player.passives[slot] = pObj;
        added.push(item.name);
      }
    }
    return { added, failed };
  }

  function evoQuickAdd(name, playerIdx) {
    const player = state.players[playerIdx];
    const counts = SLOT_COUNTS[state.playerCount];

    // ── Arcana ──
    const arcanaObj = D.arcana.find(a => a.name === name);
    if (arcanaObj) {
      if (state.arcana.some(a => a?.name === name) || extraArcanaNames().includes(name)) { showToast(`${name} already in build`, 'warn'); return; }
      const slot = state.arcana.findIndex(a => !a);
      if (slot < 0) { showToast('No arcana slots available', 'err'); return; }
      state.arcana[slot] = arcanaObj;
      showToast(`Added ${name}`); render(); return;
    }

    // ── Passive ──
    const passiveObj = D.passives.find(p => p.name === name);
    if (passiveObj) {
      if (isExtraPassive(name)) {
        // Extra-bar passive (no core slot), capped by its enabling weapons.
        if (extraCap(player, name) === 0) { showToast(`${name} needs a matching weapon`, 'warn'); return; }
        if (extraCount(player, name) >= extraCap(player, name)) { showToast(`${name} already at max`, 'warn'); return; }
        player.extraPassives.push(name);
        syncExtraPassives(player);
        showToast(`Added ${name}`); render(); return;
      }
      if (player.passives.some(p => p?.name === name)) { showToast(`${name} already equipped`, 'warn'); return; }
      let slot = -1;
      for (let i = 0; i < counts.passives; i++) { if (!player.passives[i]) { slot = i; break; } }
      if (slot < 0) { showToast(`No room for ${name}`, 'err'); return; }
      player.passives[slot] = passiveObj;
      showToast(`Added ${name}`); render(); return;
    }

    // ── Weapon ──
    // Right-click = "I want this weapon in my final build."
    // Find the chain of all weapons needed to produce it (bases + union partners),
    // then reuse any equipped chain weapon's slot for the target. Only add passives
    // as extra slots — transient weapons in the chain are never added separately.
    const weaponObj = D.weapons.find(w => w.name === name);
    if (!weaponObj) { showToast(`${name} not found`, 'err'); return; }

    const equippedW = new Set(player.weapons.filter(Boolean).map(w => w.name));
    // Cross-player evo: a passive equipped by any player satisfies the condition.
    const equippedP = new Set(
      state.players.flatMap(p => p.passives.filter(Boolean).map(p => p.name))
    );

    if (equippedW.has(name)) { showToast(`${name} already in build`, 'warn'); return; }

    // Check if this weapon is consumed in any player's evo chain (drop pool is shared).
    const consumed = getConsumedWeapons();
    if (consumed.has(name)) {
      let consumedBy = null;
      for (const p of state.players) {
        consumedBy = p.weapons.find(w => w && collectWeaponChain(w.name).has(name));
        if (consumedBy) break;
      }
      showToast(consumedBy ? `${name} consumed by ${consumedBy.name}` : `${name} already consumed`, 'err');
      return;
    }

    const chain = collectWeaponChain(name);
    const requiredPassives = collectChainPassives(chain);
    // Extra-bar passives are never slot passives — backed via the extra bar after placement.
    const missingPassives  = [...requiredPassives].filter(p => !isExtraPassive(p) && !equippedP.has(p));

    // Find anchor: first equipped weapon slot belonging to this chain
    let anchorSlot = -1;
    for (let i = 0; i < counts.weapons; i++) {
      const w = player.weapons[i];
      if (w && chain.has(w.name)) { anchorSlot = i; break; }
    }

    const added = [], failed = [];

    // Add missing passives
    if (missingPassives.length) {
      const r = applyBuildItems(missingPassives.map(p => ({ name: p, type: 'passive' })), playerIdx);
      added.push(...r.added);
      failed.push(...r.failed);
    }

    // Place target weapon — replace anchor slot, or claim an empty slot
    if (anchorSlot >= 0) {
      player.weapons[anchorSlot] = weaponObj;
      added.unshift(name);
    } else {
      const char = player.character;
      const hiddenSet = new Set(char?.hidden_items ?? []);
      const starterCount = char
        ? Math.min(char.starting_weapons.filter(wn => !hiddenSet.has(wn)).length, counts.weapons)
        : 0;
      let slot = -1;
      for (let i = starterCount; i < counts.weapons; i++) { if (!player.weapons[i]) { slot = i; break; } }
      if (slot < 0) for (let i = 0; i < counts.weapons; i++) { if (!player.weapons[i]) { slot = i; break; } }
      if (slot >= 0) {
        player.weapons[slot] = weaponObj;
        added.unshift(name);
      } else {
        failed.unshift(name);
      }
    }

    // Consume other chain weapons already in player's slots (e.g. union partners
    // placed before the final form was committed via right-click).
    if (added.length && added[0] === name) {
      for (let i = 0; i < counts.weapons; i++) {
        const w = player.weapons[i];
        if (w && w.name !== name && chain.has(w.name)) {
          player.weapons[i] = null;
        }
      }
      // Back the weapon with any extra-bar passive it requires (extra bar, capped).
      for (const pname of requiredPassives) {
        if (isExtraPassive(pname) && extraCount(player, pname) < extraCap(player, pname)) {
          player.extraPassives.push(pname);
          added.push(pname);
        }
      }
    }
    syncExtraPassives(player);

    if (!added.length) {
      const label = failed.length === 1 ? failed[0] : failed.slice(0, 2).join(', ') + (failed.length > 2 ? '…' : '');
      showToast(`No room for ${label}`, 'err');
    } else {
      const [wAdded, ...pAdded] = added;
      let msg = `Added ${wAdded}`;
      if (pAdded.length === 1) msg += ` + ${pAdded[0]}`;
      else if (pAdded.length > 1) msg += ` + ${pAdded.length} passives`;
      if (failed.length) msg += ` — no room for ${failed.join(', ')}`;
      showToast(msg, failed.length ? 'warn' : 'ok');
    }
    render();
  }

  function handleAppContextMenu(e) {
    // Right-click on an evo path node → quick-add
    const evoEl = e.target.closest('[data-evo-item]');
    if (evoEl) {
      e.preventDefault();
      const playerIdx = state.infoPanel?.playerIdx ?? 0;
      evoQuickAdd(evoEl.dataset.evoItem, playerIdx);
      return;
    }
    // Right-click on a slot → open its overlay. Locked starter slots open the
    // locked-evo selector (openWeaponOverlay detects the locked-evo mode).
    const slot = e.target.closest('[data-action="view-slot"],[data-action="open-slot"]');
    if (!slot) return;
    e.preventDefault();
    const playerIdx = parseInt(slot.dataset.player ?? '0');
    const slotIdx   = parseInt(slot.dataset.slot   ?? '0');
    const slotType  = slot.dataset.type;
    // Derived/locked reference slots (e.g. extra starting arcana) use slotIdx -1 and
    // aren't backed by a pool entry — they're view-only, so don't open a change overlay.
    if (slotIdx < 0) return;
    openSlotOverlay(slotType, playerIdx, slotIdx);
  }

  // ─── Keyboard ────────────────────────────────────────

  document.addEventListener('keydown', e => {
    if (e.key !== 'Escape') return;
    if (state.puActive) { closePowerUpOverlay(); return; }
    if (state.seal.active) { closeSealOverlay(); return; }
    if (!state.overlay) return;
    const { fromEmpty } = state.overlay;
    const hasSelection = !!state.ovl.selected;
    if (fromEmpty && hasSelection) closeOverlay(true);
    else closeOverlay(false);
  });

  // ═══════════════════════════════════════════════════════
  //  INIT
  // ═══════════════════════════════════════════════════════

  document.addEventListener('DOMContentLoaded', () => {
    if (!window.VS_DATA) {
      document.getElementById('app').innerHTML =
        '<div style="padding:2rem;text-align:center;color:#c01020;font-family:serif">' +
        '<h2>Data not found</h2><p>Run <code>node tools/build-data.mjs</code> first.</p></div>';
      return;
    }
    D = window.VS_DATA;
    STAGES = D.stages || [];
    D.stats.forEach(s => { state.powerUps[s.name] = s.max_level; });
    render();
    // Bind once to persistent elements — survives innerHTML replacements
    document.getElementById('app').addEventListener('click', handleAppClick);
    document.getElementById('app').addEventListener('contextmenu', handleAppContextMenu);
    document.getElementById('app').addEventListener('change', e => {
      if (!e.target.classList.contains('level-input')) return;
      const playerIdx = parseInt(e.target.dataset.player ?? '0');
      const val = Math.max(1, Math.min(999, parseInt(e.target.value) || 1));
      state.players[playerIdx].charLevel = val;
      render();
    });
    const ovlRoot = document.getElementById('overlay-root');
    ovlRoot.addEventListener('click', handleOverlayClick);
    ovlRoot.addEventListener('input', e => {
      if (e.target.id === 'seal-rarity-slider') {
        const rarities = e.target.dataset.rarities.split(',').map(Number);
        const val = rarities[parseInt(e.target.value)] ?? 0;
        state.seal.minRarity = val;
        const disp = document.getElementById('seal-rarity-val');
        if (disp) disp.textContent = val;
        return;
      }
      if (e.target.classList.contains('ovl-search')) {
        state.ovl.search = e.target.value;
        applyOverlaySearch(e.target);
      }
    });
    ovlRoot.addEventListener('change', e => {
      if (e.target.classList.contains('level-input')) {
        const playerIdx = parseInt(e.target.dataset.player ?? '0');
        const val = Math.max(1, Math.min(999, parseInt(e.target.value) || 1));
        state.players[playerIdx].charLevel = val;
        refreshOverlay();
        return;
      }
      if (e.target.id !== 'seal-passives-chk') return;
      state.seal.sealPassives = e.target.checked;
      renderSealOverlay();
    });
  });
  </script>
</body>
</html>
