<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Vampire Survivors Build Calculator</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Cormorant:ital,wght@0,400;0,600;0,700;1,400;1,600&display=swap" rel="stylesheet">
  <style>
    @font-face {
      font-family: 'Perfect DOS VGA 437';
      src: url('assets/fonts/Perfect DOS VGA 437.ttf') format('truetype');
      font-weight: normal;
      font-style: normal;
    }
    @font-face {
      font-family: 'LanaPixel';
      src: url('assets/fonts/LanaPixel.ttf') format('truetype');
      font-weight: normal;
      font-style: normal;
    }
  </style>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    :root {
      --bg:          #120404;
      --surface:     #1e0808;
      --surface2:    #2c1010;
      --border:      #b88820;
      --border-hi:   #e8b820;
      --accent:      #c01020;
      --accent-glow: rgba(192,16,32,.4);
      --gold:        #e8b820;
      --gold-dim:    #b08c28;
      --text:        #f0e8d0;
      --text-muted:  #cead7e;
      --text-dim:    #a07848;
      --slot-bg:     #160606;
      --slot-border: #b88820;
      --can-evolve:  #ffe840;
      --font-title:  'Cormorant', Georgia, serif;
      --font-body:   'Cormorant', Georgia, serif;
      --slot-size:   52px;
      --char-size:   110px;
    }

    img { image-rendering: pixelated; }
    body {
      background: var(--bg);
      color: var(--text);
      font-family: var(--font-body);
      font-size: 22px;
      font-weight: 600;
      min-height: 100vh;
      overflow-x: hidden;
      -webkit-font-smoothing: antialiased;
      -moz-osx-font-smoothing: grayscale;
    }

    #app { min-height: 100vh; }

    /* ── Typography ── */
    h1, h2, h3, .label { font-family: var(--font-title); letter-spacing: .05em; }
    h1 { font-size: clamp(1.4rem, 3vw, 2.2rem); font-weight: 700; color: var(--text); }
    h2 { font-size: 1.15rem; font-weight: 600; color: var(--gold); }
    h3 { font-size: .9rem; font-weight: 600; color: var(--text-muted); text-transform: uppercase; letter-spacing: .08em; }
    .label { font-size: .78rem; text-transform: uppercase; letter-spacing: .1em; color: var(--text-muted); }

    /* ── Buttons ── */
    button {
      font-family: var(--font-title);
      cursor: pointer;
      border: none;
      outline: none;
      transition: background .15s, color .15s, box-shadow .15s;
    }
    .btn {
      background: var(--surface2);
      color: var(--text);
      border: 1px solid var(--border);
      border-radius: 4px;
      padding: .35rem .9rem;
      font-size: .88rem;
      letter-spacing: .05em;
    }
    .btn:hover { border-color: var(--border-hi); color: var(--gold); }
    .btn-accent {
      background: var(--accent);
      color: #fff;
      border-color: var(--accent);
      font-weight: 600;
    }
    .btn-accent:hover { background: #e01828; box-shadow: 0 0 10px var(--accent-glow); }
    .btn-confirm {
      background: #4d9a42;
      color: #fff;
      border: 3px solid var(--border-hi);
      border-radius: 2px;
      text-transform: uppercase;
      letter-spacing: .08em;
      font-weight: 600;
      box-shadow: inset 0 1px 0 rgba(255,255,255,.2), inset 0 -2px 0 rgba(0,0,0,.25);
    }
    .btn-confirm:hover { background: #5cb050; box-shadow: inset 0 1px 0 rgba(255,255,255,.25), 0 0 10px rgba(80,180,65,.45); }
    .btn-back {
      background: #7a1515;
      color: #fff;
      border: 3px solid var(--border-hi);
      border-radius: 2px;
      text-transform: uppercase;
      letter-spacing: .08em;
      font-weight: 600;
      box-shadow: inset 0 1px 0 rgba(255,255,255,.1), inset 0 -2px 0 rgba(0,0,0,.3);
    }
    .btn-back:hover { background: #921c1c; box-shadow: inset 0 1px 0 rgba(255,255,255,.15), 0 0 10px rgba(140,20,20,.5); }
    .btn-sm { padding: .2rem .55rem; font-size: .8rem; }
    .btn-stage { width: 100%; }
    .btn-stage:disabled { opacity: .4; cursor: default; }
    .btn-stage:disabled:hover { border-color: var(--border); color: var(--text); }
    .btn-devolve { width: 100%; background: rgba(160,25,25,.1); border-color: rgba(200,50,50,.3); color: #cc7070; }
    .btn-devolve:hover { background: rgba(160,25,25,.22); border-color: rgba(200,50,50,.55); color: #dd8080; }
    .stage-missing { font-size: .7rem; color: var(--text-muted); margin: .15rem 0 .25rem; }
    .btn-icon { background: none; border: none; padding: 3px; line-height: 1; font-size: .9rem; color: var(--text-muted); }
    .btn-icon:hover { color: var(--accent); }

    /* ═══════════════════════════════════════════════════
       LANDING PAGE
    ═══════════════════════════════════════════════════ */
    #landing {
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 2.5rem;
      padding: 2rem;
      background: radial-gradient(ellipse at 50% 30%, #2c0808 0%, #120404 70%);
    }
    .landing-banner {
      text-align: center;
    }
    .landing-banner h1 {
      text-shadow: 0 0 20px rgba(192,16,32,.6);
      font-size: clamp(1.6rem, 4vw, 2.8rem);
    }
    .landing-banner p {
      color: var(--text-muted);
      margin-top: .5rem;
      font-size: 1rem;
      font-style: italic;
    }
    .landing-grid {
      display: grid;
      grid-template-columns: repeat(2, 270px);
      gap: 1.25rem;
    }
    .player-tile-btn {
      width: 270px;
      min-height: 150px;
      box-sizing: border-box;
      background: var(--surface);
      border: 2px solid var(--border-hi);
      border-radius: 14px;
      padding: 2rem 1.5rem;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: .7rem;
      cursor: pointer;
      transition: border-color .2s, box-shadow .2s, background .2s;
    }
    .player-tile-btn:hover {
      border-color: var(--gold);
      background: var(--surface2);
      box-shadow: 0 0 18px rgba(232,184,32,.3);
    }
    .player-tile-btn .count-icons {
      display: flex;
      flex-wrap: nowrap;
      gap: 6px;
      justify-content: center;
    }
    .player-tile-btn .player-icon {
      width: 48px; height: 48px;
      image-rendering: pixelated;
    }
    .player-tile-btn .tile-label {
      font-family: var(--font-title);
      font-size: 1rem;
      font-weight: 600;
      color: var(--text);
    }


    /* ═══════════════════════════════════════════════════
       PLANNING PAGE
    ═══════════════════════════════════════════════════ */
    #planning {
      height: 100vh;
      display: flex;
      flex-direction: column;
    }
    .planning-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: .75rem 1.25rem;
      background: var(--surface);
      border-bottom: 1px solid var(--border);
      flex-shrink: 0;
    }
    .planning-header h1 { font-size: 1.1rem; }
    .planning-header-actions { display: flex; gap: .5rem; align-items: center; }

    /* ── Seal overlay ── */
    .seal-panel {
      max-width: 520px;
      width: 95vw;
    }
    .seal-controls {
      display: flex;
      align-items: center;
      gap: .65rem;
      padding: .55rem .9rem;
      border-bottom: 1px solid var(--border);
      background: var(--surface2);
      flex-wrap: wrap;
      flex-shrink: 0;
    }
    .seal-controls label { display: flex; align-items: center; gap: .35rem; font-size: .78rem; cursor: pointer; user-select: none; }
    .seal-rarity-ctrl { display: flex; align-items: center; gap: .4rem; font-size: .78rem; }
    .seal-rarity-ctrl input[type=range] { width: 90px; accent-color: var(--gold); }
    .seal-rarity-val { font-family: var(--font-title); color: var(--gold); min-width: 2.2rem; }
    .seal-grid-wrap { overflow-y: auto; padding: .65rem; flex: 1; }
    .seal-grid {
      display: grid;
      grid-template-columns: repeat(8, var(--slot-size));
      gap: 3px;
      width: fit-content;
      margin: 0 auto;
    }
    .seal-cell {
      position: relative;
      width: var(--slot-size); height: var(--slot-size);
      cursor: pointer;
    }
    .seal-cell:hover .seal-icon { filter: brightness(1.25); }
    .seal-cell.empty { cursor: default; }
    /* "Protected from sealing" states — shown as ICON TINTS, not just a thin colored
       border (borders vanished against the icons' own baked-in borders in the dense grid).
       Hue encodes the reason; a matching INSET ring keeps the edge crisp. */
    .seal-cell.in-build   { box-shadow: inset 0 0 0 2px var(--gold); cursor: default; }
    .seal-cell.in-build   .seal-icon { filter: sepia(1) saturate(3) hue-rotate(2deg)   brightness(1.05); }
    .seal-cell.in-build:hover .seal-icon { filter: sepia(1) saturate(3) hue-rotate(2deg) brightness(1.05); }
    /* Lineage component that must drop to build an equipped weapon — locked from sealing */
    .seal-cell.needed     { box-shadow: inset 0 0 0 2px #3fb7d6; cursor: default; }
    .seal-cell.needed     .seal-icon { filter: sepia(1) saturate(5) hue-rotate(150deg) brightness(1.02); }
    .seal-cell.needed:hover .seal-icon { filter: sepia(1) saturate(5) hue-rotate(150deg) brightness(1.02); }
    /* Free on the selected stage — not auto-recommended, but still sealable manually */
    .seal-cell.stage-item { box-shadow: inset 0 0 0 2px #5fa84a; }
    .seal-cell.stage-item .seal-icon { filter: sepia(1) saturate(4) hue-rotate(75deg)  brightness(1.02); }
    .seal-cell.passive-off { opacity: .3; cursor: default; pointer-events: none; }
    .seal-icon { width: 100%; height: 100%; image-rendering: pixelated; object-fit: cover; display: block; }
    .seal-mark {
      position: absolute; inset: 0;
      width: 100%; height: 100%;
      image-rendering: pixelated;
      object-fit: contain;
      opacity: 0;
      pointer-events: none;
    }
    /* Seal mark reads clearly against the busy grid but at .75 so a little of the icon
       behind peeks through (user preference). Icon itself stays untinted. */
    .seal-cell.sealed .seal-mark { opacity: .75; }
    .planning-body {
      flex: 1;
      min-height: 0;
      padding: 1rem;
      overflow: hidden;
      display: flex;
      gap: 1rem;
      align-items: stretch;
    }
    .planning-main {
      flex: 1;
      min-width: 0;
      overflow-y: auto;
    }
    .info-sidebar {
      width: 400px;
      flex-shrink: 0;
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 8px;
      display: flex;
      flex-direction: column;
      overflow: hidden;
    }
    .sidebar-top {
      flex-shrink: 0;
      padding: 1rem 1rem .5rem;
      border-bottom: 1px solid var(--border);
    }
    .sidebar-body {
      flex: 1;
      overflow-y: auto;
      padding: .5rem 1rem 1rem;
    }
    .info-sidebar-empty {
      color: var(--text-dim);
      font-size: .9rem;
      text-align: center;
      padding: 2rem 0;
      font-style: italic;
      line-height: 1.8;
    }
    .info-sidebar .detail-icon { text-align: center; margin-bottom: .5rem; width: 100px; height: 100px; }
    .info-sidebar .detail-icon img { width: 100%; height: 100%; object-fit: cover; image-rendering: pixelated; }
    /* Character full-body sprites: taller box, contain so no aspect ratio is clipped. */
    .info-sidebar .detail-icon.char-sprite { width: 100%; height: 132px; }
    .info-sidebar .detail-icon.char-sprite img { width: 100%; height: 100%; object-fit: contain; image-rendering: pixelated; }
    .info-sidebar .detail-name {
      font-family: var(--font-title);
      font-size: 1.1rem;
      color: var(--gold);
      text-align: center;
      margin-bottom: .4rem;
    }
    .info-sidebar .detail-desc {
      font-size: .88rem;
      color: var(--text-muted);
      font-style: italic;
      line-height: 1.5;
      margin-bottom: .75rem;
    }
    .info-sidebar .detail-section { margin: .6rem 0; }
    .info-sidebar .detail-section-label {
      font-size: .75rem;
      text-transform: uppercase;
      letter-spacing: .08em;
      color: var(--text-dim);
      display: block;
      margin-bottom: .3rem;
    }
    .info-sidebar .req-row { display: flex; flex-wrap: wrap; gap: 4px; }
    .info-sidebar .req-icon { width: 32px; height: 32px; }
    .info-sidebar .req-icon img { width: 100%; height: 100%; image-rendering: pixelated; object-fit: cover; }
    .info-sidebar .stat-grid { font-size: .88rem; }
    .info-sidebar .stat-row { padding: 2px 0; }
    .info-sidebar .stat-header { padding: 0 0 3px; }
    .info-sidebar .stat-grid.with-pass .stat-header,
    .info-sidebar .stat-grid.with-pass .stat-row { grid-template-columns: 1fr 50px 50px 56px 56px 62px; }
    /* Stats heading row with level input */
    .stats-heading-row { display: flex; align-items: center; gap: .5rem; margin-bottom: .35rem; }
    .stats-heading-row h3 { margin: 0; flex-shrink: 0; }
    .level-wrap { position: relative; display: flex; align-items: center; gap: 3px; width: 50%; margin-left: auto; }
    .level-prefix { font-size: .78rem; color: var(--text-muted); flex-shrink: 0; }
    .level-input {
      flex: 1; min-width: 0; width: 100%; box-sizing: border-box;
      padding: 4px 24px 4px 8px; font-size: .85rem; text-align: left;
      background: var(--surface2); color: var(--text); border: 1px solid var(--border);
      border-radius: 3px; font-family: var(--font-title);
      -moz-appearance: textfield; appearance: textfield;
    }
    .level-input:focus { outline: none; border-color: var(--border-hi); }
    .level-input::-webkit-inner-spin-button,
    .level-input::-webkit-outer-spin-button { -webkit-appearance: none; margin: 0; }
    .level-clear {
      position: absolute; right: 0; top: 0; bottom: 0; width: 24px;
      background: none; border: none; cursor: pointer; padding: 0;
      color: var(--text-muted); font-size: .75rem; line-height: 1;
      display: none; align-items: center; justify-content: center;
    }
    .level-clear:hover { color: var(--text); }
    .level-wrap:not([data-at-default]) .level-clear { display: flex; }
    /* Starting weapon hidden/max badges. .req-icon must establish a containing
       block so the absolutely-positioned .sw-badge anchors to the icon (not to
       the fixed #overlay-root, which would fling it to the screen corner). */
    .req-icon { position: relative; }
    .sw-badge { position: absolute; bottom: 0; right: 0; font-size: .6rem; padding: 0 2px;
      border-radius: 2px; line-height: 1.4; font-family: var(--font-title); }
    .sw-max    { background: var(--gold); color: #1a1209; }
    .sw-hidden { background: #444; color: var(--text-muted); }
    .sw-arcana { background: #7a3fd9; color: #fff; }
    .sw-is-hidden img { opacity: .55; }
    /* Arcana are tall portrait cards; crop to fit the square loadout thumbnail. */
    .sw-arcana-icon img { object-fit: cover; }
    /* Divider between the 3 shared arcana slots and the extra (starting) arcana. */
    .arcana-extra-divider { width: 2px; align-self: stretch; margin: 0 .25rem;
      background: linear-gradient(var(--gold), transparent); opacity: .5; border-radius: 2px; }
    /* Player rows grid — varies by player count */
    /* 1-2 players: one full-width row per player (a card is short, so stacking is
       cheap). 3-4 players: a 2x2 grid to keep them on-screen. Overflow-proof
       either way — hidden weapons/passives get their own conditional wrapping row
       (see .slot-row-hidden), and 3-4p cards only hold 2-3 slots per row. */
    .players-grid {
      display: grid;
      grid-template-columns: 1fr;
      gap: 1rem;
      max-width: 900px;
      margin: 0 auto;
    }
    .players-grid.p3, .players-grid.p4 { grid-template-columns: 1fr 1fr; }

    /* ── Global arcana/stage row (pinned to top so it stays visible when the
       player list scrolls with 3-4 players) ── */
    .global-row {
      margin: 0 auto .75rem;
      max-width: 900px;
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 8px;
      padding: .6rem 1rem;
    }
    .global-row-inner {
      display: flex;
      align-items: center;
      gap: .5rem;
      flex-wrap: wrap;
    }

    /* ── Player card ── */
    .player-card {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 10px;
      overflow: hidden;
    }
    .player-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: .5rem .85rem;
      background: var(--surface2);
      border-bottom: 1px solid var(--border);
      cursor: pointer;
      user-select: none;
    }
    .player-header:hover { background: #3a1010; }
    .player-header-left { display: flex; align-items: center; gap: .5rem; }
    .player-header-left .player-name { font-family: var(--font-title); font-size: .85rem; color: var(--gold); }
    .player-header-left .char-name { font-size: .82rem; color: var(--text-muted); font-style: italic; }
    .player-header-actions { display: flex; gap: .4rem; align-items: center; }

    .player-body { padding: .75rem; display: flex; flex-direction: row; gap: .75rem; align-items: flex-start; }
    .char-col { flex-shrink: 0; }
    .slots-col { display: flex; flex-direction: column; gap: .6rem; flex: 1; min-width: 0; }

    /* ── Slot rows ── */
    .slot-row { display: flex; align-items: center; gap: .4rem; flex-wrap: nowrap; }
    /* Hidden-item rows only appear when populated and may hold many items, so
       they wrap (normal weapon/passive rows stay nowrap to keep slots aligned). */
    .slot-row-hidden { flex-wrap: wrap; }
    .slot-row-label { font-size: .75rem; text-transform: uppercase; letter-spacing: .08em; color: var(--text-dim); width: 3.5rem; flex-shrink: 0; }

    /* ── Slots ── */
    .slot {
      width: var(--slot-size); height: var(--slot-size);
      cursor: pointer;
      position: relative;
      flex-shrink: 0;
      transition: box-shadow .15s, filter .15s;
    }
    .slot:hover img { filter: brightness(1.2); }
    .slot img { width: 100%; height: 100%; object-fit: cover; display: block; image-rendering: pixelated; }
    .slot .slot-remove {
      position: absolute; top: 1px; right: 1px;
      width: 16px; height: 16px;
      background: rgba(0,0,0,.7);
      border: none; border-radius: 2px;
      color: #aaa; font-size: 10px; line-height: 1;
      cursor: pointer; display: none;
      align-items: center; justify-content: center;
    }
    .slot:hover .slot-remove { display: flex; }
    .slot .slot-remove:hover { color: var(--accent); }
    .slot.hidden-weapon { opacity: .4; cursor: default; }
    .slot.hidden-weapon:hover img { filter: none; }
    .slot.hidden-weapon .slot-remove { display: none !important; }
    /* Extra passive instances (e.g. Weapon Power-Up) — active, not dimmed like hidden. */
    .slot.slot-extra { border-color: rgba(155,63,217,.55); box-shadow: inset 0 0 0 1px rgba(155,63,217,.25); }
    /* ×N count badge for collapsed duplicate instances (bottom-right, clear of the × button). */
    .dupe-badge { position: absolute; bottom: 1px; right: 1px; padding: 0 3px;
      font-size: .62rem; line-height: 1.35; font-family: var(--font-title); font-weight: 600;
      background: rgba(155,63,217,.9); color: #fff; border-radius: 3px; pointer-events: none; }
    .slot.slot-locked { cursor: default; }
    .slot.slot-locked:hover img { filter: none; }
    .slot .slot-lock {
      position: absolute;
      top: 0; left: 50%;
      transform: translate(-50%, -55%);
      width: 18px; height: 18px;
      object-fit: fill;
      image-rendering: pixelated;
      pointer-events: none;
      z-index: 2;
    }

    .slot-char   { --slot-size: var(--char-size); }
    .slot-arcana { height: auto; }
    .slot-arcana img { height: auto; object-fit: fill; }
    .slot-stage  { width: 120px; height: auto; }
    .slot-stage img { width: 120px; height: auto; object-fit: fill; }

    /* ═══════════════════════════════════════════════════
       OVERLAY
    ═══════════════════════════════════════════════════ */
    #overlay-root {
      position: fixed; inset: 0;
      background: rgba(0,0,0,.75);
      z-index: 100;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 1rem;
    }
    #overlay-root.hidden { display: none; }

    .overlay-panel {
      background: var(--surface);
      border: 1px solid var(--border-hi);
      border-radius: 12px;
      width: 88vw;
      max-width: 1380px;
      max-height: 85vh;
      display: flex;
      flex-direction: column;
      overflow: hidden;
      box-shadow: 0 0 40px rgba(0,0,0,.8);
    }
    .overlay-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: .75rem 1.1rem;
      border-bottom: 1px solid var(--border);
      background: var(--surface2);
      flex-shrink: 0;
    }
    .overlay-header h2 { margin: 0; }
    .overlay-close { font-size: 1.3rem; line-height: 1; }
    .overlay-body {
      display: flex;
      flex: 1;
      overflow: hidden;
    }

    /* left panel (stats) */
    .ovl-left {
      width: 320px;
      flex-shrink: 0;
      border-right: 1px solid var(--border);
      overflow-y: auto;
      padding: .75rem;
      display: flex;
      flex-direction: column;
      gap: .5rem;
    }
    /* center grid */
    .ovl-center {
      flex: 1;
      display: flex;
      flex-direction: column;
      overflow: hidden;
    }
    .ovl-center-search {
      flex-shrink: 0;
      padding: .75rem .75rem .4rem;
      border-bottom: 1px solid var(--border);
    }
    .ovl-center-scroll {
      flex: 1;
      overflow-y: auto;
      padding: .75rem;
    }
    /* right panel (identity / detail) */
    .ovl-right {
      width: 300px;
      flex-shrink: 0;
      border-left: 1px solid var(--border);
      display: flex;
      flex-direction: column;
      overflow: hidden;
    }
    .ovl-right-top {
      flex-shrink: 0;
      padding: .75rem .75rem .4rem;
      border-bottom: 1px solid var(--border);
      display: flex;
      flex-direction: column;
      gap: .4rem;
    }
    .ovl-right-body {
      flex: 1;
      overflow-y: auto;
      padding: .5rem .75rem .75rem;
    }
    .overlay-footer {
      display: flex;
      align-items: center;
      justify-content: flex-end;
      gap: .6rem;
      padding: .6rem 1rem;
      border-top: 1px solid var(--border);
      background: var(--surface2);
      flex-shrink: 0;
    }

    /* ── Stat grid ── */
    .stat-grid { display: flex; flex-direction: column; gap: 1px; }
    .stat-header {
      display: grid; grid-template-columns: 1fr 50px 50px 56px 62px;
      font-size: .74rem; text-transform: uppercase;
      color: var(--text-muted); padding: 0 4px 3px; border-bottom: 1px solid var(--border);
      margin-bottom: 2px;
    }
    .stat-row {
      display: grid; grid-template-columns: 1fr 50px 50px 56px 62px;
      align-items: center; font-size: .82rem; padding: 2px 4px; border-radius: 3px;
    }
    /* 6-column variant when passive column is shown */
    .stat-grid.with-pass .stat-header,
    .stat-grid.with-pass .stat-row { grid-template-columns: 1fr 50px 50px 56px 56px 62px; }
    .stat-header span { text-align: right; }
    .stat-header span:first-child { text-align: left; }
    .ovl-left .stat-header,
    .ovl-left .stat-row { grid-template-columns: 1fr 48px 48px 54px 60px; font-size: .82rem; }
    .ovl-left .stat-header { font-size: .74rem; }
    .stat-row.changed { background: rgba(232,184,32,.12); }
    .stat-key { color: var(--text-muted); min-width: 0; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    .stat-base  { text-align: right; color: var(--text-muted); font-size: .82rem; }
    .stat-char  { text-align: right; font-weight: 600; }
    .stat-pu      { text-align: right; color: #7ab8e8; font-size: .82rem; }
    .stat-passive { text-align: right; color: #c8a86e; font-size: .82rem; }
    .stat-total   { text-align: right; font-weight: 700; color: var(--text); }
    .stat-row.capped .stat-total { color: var(--gold); font-weight: 600; }
    .stat-val.pos { color: #5ddd88; }
    .stat-val.neg { color: #dd5555; }

    /* ── Power-up overlay ── */
    .pu-panel { max-width: 480px; width: 92vw; }
    .pu-list-wrap { overflow-y: auto; padding: .5rem .75rem; flex: 1; }
    .pu-row {
      display: grid; grid-template-columns: 24px 1fr auto;
      align-items: center; gap: .5rem;
      padding: 4px 2px; border-bottom: 1px solid rgba(184,136,32,.15);
    }
    .pu-row.no-levels { opacity: .4; }
    .pu-icon { width: 24px; height: 24px; image-rendering: pixelated; object-fit: cover; }
    .pu-name { font-size: .8rem; color: var(--text); }
    .pu-level-ctrl { display: flex; align-items: center; gap: 4px; }
    .pu-level-ctrl button {
      width: 20px; height: 20px; padding: 0; line-height: 1;
      font-size: .85rem; border: 1px solid var(--border); border-radius: 3px;
      background: var(--surface2); color: var(--text); cursor: pointer;
    }
    .pu-level-ctrl button:disabled { opacity: .3; cursor: default; }
    .pu-level-ctrl button:not(:disabled):hover { border-color: var(--border-hi); color: var(--gold); }
    .pu-level-display { font-size: .75rem; font-family: var(--font-title); color: var(--gold); min-width: 30px; text-align: center; }

    /* ── Item / Arcana grid ── */
    .item-section-label {
      font-family: var(--font-title);
      font-size: .7rem;
      text-transform: uppercase;
      letter-spacing: .1em;
      color: var(--text-muted);
      margin: .5rem 0 .3rem;
      padding-bottom: 3px;
      border-bottom: 1px solid var(--border);
    }
    .item-grid {
      display: flex;
      flex-wrap: wrap;
      gap: 6px;
    }
    .item-card {
      width: var(--slot-size); height: var(--slot-size);
      border-radius: 6px;
      cursor: pointer;
      position: relative;
      overflow: hidden;
      flex-shrink: 0;
      transition: box-shadow .15s, opacity .15s;
    }
    .item-card img { width: 100%; height: 100%; object-fit: cover; display: block; }
    .item-card:hover { box-shadow: 0 0 0 2px var(--border-hi), 0 0 8px rgba(184,136,32,.4); }
    /* Selection reads through busy grids: an INSET ring (sits on top of the icon's own
       baked-in border, not outside it) + a gold wash tint over the img + a brightness
       lift — icons already carry a bold border, so a thin outer ring alone disappears. */
    .item-card.selected { box-shadow: inset 0 0 0 2px var(--gold), 0 0 12px rgba(232,184,32,.6); }
    .item-card.selected img { filter: brightness(1.12) saturate(1.15); }
    .item-card.selected::after {
      content: ''; position: absolute; inset: 0; pointer-events: none;
      background: rgba(232,184,32,.30); mix-blend-mode: overlay;
    }
    .item-card.dim      { opacity: .35; pointer-events: none; }
    .item-card.consumed { opacity: .25; pointer-events: none; filter: grayscale(.7) sepia(.4); }
    .search-dim { display: none !important; }
    .ovl-search-wrap { position: relative; margin-bottom: .6rem; }
    .ovl-search {
      width: 100%; box-sizing: border-box;
      background: var(--surface2); border: 1px solid var(--border);
      border-radius: 4px; padding: 5px 28px 5px 9px;
      color: var(--text); font-size: .82rem; font-family: var(--font-body);
      outline: none; display: block;
    }
    .ovl-search:focus { border-color: var(--border-hi); }
    .ovl-search-clear {
      position: absolute; right: 0; top: 0; bottom: 0;
      width: 26px; background: none; border: none; cursor: pointer;
      color: var(--text-muted); font-size: .8rem; line-height: 1;
      display: none; align-items: center; justify-content: center;
      padding: 0;
    }
    .ovl-search-clear:hover { color: var(--text); }
    .ovl-search:not(:placeholder-shown) + .ovl-search-clear { display: flex; }
    .req-row { display:flex; align-items:center; gap:.4rem; margin:.2rem 0; }
    .req-icon { width:26px; height:26px; flex-shrink:0; border-radius:4px; overflow:hidden; }
    .req-icon img { width:100%; height:100%; object-fit:cover; display:block; }
    .req-status { font-size:.75rem; padding:1px 5px; border-radius:2px; white-space:nowrap; }
    .req-status.ok   { color:#5ddd88; }
    .req-status.add  { color:var(--gold); }
    .req-status.miss { color:#dd5555; cursor:help; }
    .auto-add-toggle {
      display: flex; align-items: center; gap: .5rem;
      margin-top: .6rem; padding: .35rem .5rem;
      border-radius: 5px; border: 1px solid var(--border);
      cursor: pointer; user-select: none;
      font-size: .8rem; color: var(--text);
      transition: border-color .15s, background .15s;
    }
    .auto-add-toggle:hover { border-color: var(--border-hi); background: var(--surface2); }
    .auto-add-toggle.checked { border-color: rgba(93,221,136,.4); background: rgba(93,221,136,.06); }
    .auto-add-toggle.error   { border-color: rgba(220,60,60,.4);  background: rgba(220,60,60,.06); }
    .auto-add-box {
      width: 14px; height: 14px; flex-shrink: 0;
      border: 1px solid var(--border-hi); border-radius: 3px;
      display: flex; align-items: center; justify-content: center;
      font-size: .7rem; color: #5ddd88;
    }
    .auto-add-toggle.error .auto-add-box { border-color: #dd5555; color: #dd5555; }
    .auto-add-warn { font-size: .72rem; color: #dd5555; margin-left: auto; }
    .item-card .card-badge {
      position: absolute; bottom: 0; left: 0; right: 0;
      background: rgba(0,0,0,.7);
      font-size: 8px;
      text-align: center;
      color: var(--text-muted);
      padding: 1px;
      line-height: 1.2;
      white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
    }
    /* variant stack effect */
    .item-card.stacked::before {
      content: '';
      position: absolute; inset: -3px;
      background: var(--surface2);
      border-radius: 7px;
      z-index: -1;
      transform: translate(4px, 4px);
    }
    .stack-wrapper {
      position: relative;
      width: calc(var(--slot-size) + 6px);
      height: calc(var(--slot-size) + 6px);
      flex-shrink: 0;
    }
    .stack-wrapper .item-card { position: absolute; top: 0; left: 0; }
    .stack-nav {
      position: absolute; bottom: -1px; right: -1px;
      display: flex; gap: 2px;
    }
    .stack-btn {
      width: 14px; height: 14px;
      background: rgba(0,0,0,.85);
      border: 1px solid var(--border-hi);
      border-radius: 2px;
      color: var(--text); font-size: 8px;
      display: flex; align-items: center; justify-content: center;
      cursor: pointer; z-index: 2;
    }
    .stack-btn:hover { color: var(--gold); }

    /* ── Detail panels (right side) ── */
    .detail-icon { width: 64px; height: 64px; border-radius: 8px; overflow: hidden; margin: 0 auto .5rem; }
    .ovl-right-top .detail-icon { width: 88px; height: 88px; }
    .detail-icon img { width: 100%; height: 100%; object-fit: cover; }
    /* Arcana cards are portrait 224×320 — override square assumptions */
    .detail-icon.arcana-card { width: 140px; height: 200px; }
    .detail-icon.arcana-card img { object-fit: fill; }
    /* Character full-body sprites in the selector preview: contain, never clipped. */
    .ovl-right-top .detail-icon.char-sprite { width: 100%; height: 120px; border-radius: 0; }
    .ovl-right-top .detail-icon.char-sprite img { object-fit: contain; image-rendering: pixelated; }
    .ovl-center-wide .item-grid { gap: 12px; row-gap: 14px; }
    .arcana-grid {
      display: grid;
      grid-template-columns: repeat(8, 1fr);
      gap: 10px;
      align-items: start;
      padding: .75rem;
    }
    .arcana-grid .item-card { width: 100%; height: auto; aspect-ratio: 224 / 320; }
    .arcana-grid .item-card img { object-fit: fill; width: 100%; height: 100%; }
    .arcana-tab-btn {
      grid-column: span 2;
      align-self: stretch;
      background: var(--surface2);
      border: 2px solid var(--border);
      border-radius: 6px;
      cursor: pointer;
      display: flex; flex-direction: column;
      align-items: center; justify-content: center;
      gap: .4rem; color: var(--text);
    }
    .arcana-tab-btn[data-tab="arcana"]  { background: rgba(180,30,30,.2);  border-color: rgba(220,60,60,.45);  }
    .arcana-tab-btn[data-tab="darkana"] { background: rgba(120,40,200,.2); border-color: rgba(155,80,220,.45); }
    .arcana-tab-btn[data-tab="arcana"]:hover  { border-color: rgba(220,60,60,.8);  }
    .arcana-tab-btn[data-tab="darkana"]:hover { border-color: rgba(155,80,220,.8); }
    .arcana-tab-current { font-family: var(--font-title); font-size: 1.5rem; color: var(--gold); font-weight: 600; }
    .arcana-tab-switch { font-size: 1rem; color: var(--text-muted); }
    .arcana-placeholder { opacity: .3; cursor: default; pointer-events: none; }
    .detail-name { font-family: var(--font-title); font-size: 1.05rem; text-align: center; color: var(--gold); margin-bottom: .3rem; }
    .detail-desc { font-size: .88rem; color: var(--text-muted); line-height: 1.5; font-style: italic; }
    .detail-section { margin-top: .5rem; }
    .detail-section h3 { margin-bottom: .25rem; }
    .detail-section ul { list-style: none; padding: 0; }
    .detail-section li { font-size: .85rem; color: var(--text-muted); padding: 2px 0; line-height: 1.4; }
    .detail-section li::before { content: '▸ '; color: var(--gold-dim); }
    .evo-flow { display: flex; flex-direction: column; gap: 14px; margin-top: .35rem; }
    .evo-path-group { padding-top: .6rem; border-top: 1px solid var(--border); }
    .evo-path-group:first-child { padding-top: 0; border-top: none; }
    .evo-row { display: flex; align-items: center; gap: 4px; flex-wrap: nowrap; }
    .evo-node { width: 44px; height: 44px; flex-shrink: 0; border-radius: 5px; overflow: hidden; }
    .evo-node.current { outline: 1px solid var(--gold); box-shadow: 0 0 6px rgba(232,184,32,.4); }
    .evo-node.evo-hidden { opacity: .4; }
    /* Glimmer tech: scale the reused Emerald Rapture art to crop its baked-in frame
       (overflow:hidden on .evo-node clips the overscan) so the node looks borderless. */
    .evo-node.evo-glimmer img { transform: scale(1.24); }
    /* Chaos-morph character sprite: show the full character art, not a cropped portrait. */
    .evo-node.evo-char-sprite img { object-fit: contain; image-rendering: pixelated; }
    .evo-node[data-evo-item]:not(.current) { cursor: context-menu; }
    .evo-node[data-evo-item]:not(.current):hover { outline: 1px solid var(--border-hi); }
    .evo-gem[data-evo-item] { cursor: context-menu; }
    .evo-gem[data-evo-item]:hover { outline: 1px solid var(--border-hi); }
    .evo-toast {
      position: fixed; bottom: 1.5rem; left: 50%; transform: translateX(-50%);
      padding: .4rem 1.1rem; border-radius: 6px; z-index: 9999; pointer-events: none;
      font-size: .88rem; white-space: nowrap;
      animation: toast-in .18s ease, toast-out .3s ease 1.7s forwards;
    }
    .evo-toast.ok  { background: rgba(18,18,12,.96); border: 1px solid rgba(93,221,136,.5); color: #5ddd88; }
    .evo-toast.err { background: rgba(18,18,12,.96); border: 1px solid rgba(220,80,80,.5);  color: #ff8080; }
    .evo-toast.warn{ background: rgba(18,18,12,.96); border: 1px solid rgba(232,184,32,.4); color: var(--gold); }
    @keyframes toast-in  { from { opacity:0; transform:translateX(-50%) translateY(6px); } to { opacity:1; transform:translateX(-50%) translateY(0); } }
    @keyframes toast-out { to   { opacity:0; transform:translateX(-50%) translateY(6px); } }
    .evo-node img { width: 100%; height: 100%; object-fit: cover; display: block; }
    .evo-op { font-size: .8rem; color: var(--text-muted); flex-shrink: 0; }
    /* Level-up pipe: gold and bold so it reads as a connector, not stray punctuation. */
    .evo-op-lvl { color: var(--gold-dim); font-weight: 700; font-size: 1.05rem; line-height: 1; }
    .evo-nw { display: inline-flex; align-items: center; flex-shrink: 0; position: relative; }
    .evo-max { position: absolute; top: 100%; left: 50%; transform: translateX(-50%); margin-top: 2px; font-size: .65rem; font-weight: 700; color: var(--gold); line-height: 1; letter-spacing: .02em; white-space: nowrap; }
    .evo-sub { position: absolute; top: 100%; left: 50%; transform: translateX(-50%); margin-top: 2px; font-size: .63rem; color: var(--text-muted); line-height: 1; text-align: center; white-space: nowrap; }
    /* Glimmer attack names can be long — let them wrap instead of overflowing the row. */
    .evo-sub.evo-sub-wrap { white-space: normal; max-width: 60px; line-height: 1.05; }
    .evo-dash-line { width: 14px; border-top: 1.5px dashed var(--text-dim); flex-shrink: 0; }
    /* Gemini gem uses the Arcana card aspect (~0.7, i.e. 224x320) instead of a square. */
    .evo-gem { width: 22px; height: 31px; flex-shrink: 0; border-radius: 3px; overflow: hidden; }
    .evo-gem img { width: 100%; height: 100%; object-fit: fill; display: block; }
    /* merge-bar: stacked rows on left → bar → output right (dual/Vandalier/Universitas) */
    .evo-merge { display: inline-flex; align-items: stretch; gap: 3px; }
    .evo-merge-rows { display: flex; flex-direction: column; gap: 6px; justify-content: center; }
    .evo-merge-bar { width: 2px; background: var(--border); border-radius: 1px; flex-shrink: 0; min-height: 24px; }
    .evo-merge-out { display: flex; align-items: center; gap: 4px; }
    /* u2f grid: base-evo on left | bar | mid on right-top, union-partner on right-bot | final (centered) */
    .evo-u2f { display: grid; grid-template-columns: auto 2px auto auto; grid-template-rows: auto auto; gap: 4px 3px; align-items: center; justify-content: start; }
    .evo-u2f > .u2l { grid-column:1; grid-row:1; display:flex; align-items:center; gap:4px; }
    .evo-u2f > .u2b { grid-column:2; grid-row:1/3; background:var(--border); align-self:stretch; border-radius:1px; }
    .evo-u2f > .u2t { grid-column:3; grid-row:1; display:flex; align-items:center; gap:4px; }
    .evo-u2f > .u2m { grid-column:3; grid-row:2; display:flex; align-items:center; gap:4px; }
    .evo-u2f > .u2f { grid-column:4; grid-row:1/3; display:flex; align-items:center; gap:4px; }
    /* triple/quad union: stacked inputs + bar + final */
    .evo-multi-union { display: inline-flex; align-items: stretch; gap: 3px; }
    .evo-multi-inputs { display: flex; flex-direction: column; gap: 4px; justify-content: center; }
    /* collection finals */
    .evo-coll-wrap { display: flex; flex-direction: column; gap: 4px; }
    .evo-coll-inputs { display: flex; flex-wrap: wrap; gap: 3px; }
    /* pentagram (FivePassive) */
    .evo-pentagram { position: relative; width: 136px; height: 136px; margin: .4rem 0; }
    .evo-pentagram .ep-item { position: absolute; transform: translate(-50%,-50%); }
    .evo-pentagram .ep-center { position: absolute; top: 50%; left: 50%; transform: translate(-50%,-50%); }
    /* Alucard gift: 3-over-2 example-evo block to the right of Alucard Shield */
    .alucard-evos { display: inline-flex; align-items: center; gap: 2px; opacity: .5; margin-left: 2px; }
    .alucard-evos-col { display: flex; flex-direction: column; gap: 2px; align-items: center; }
    /* hexagram (Tuna) */
    .evo-hexagram { position: relative; width: 160px; height: 150px; margin: .4rem 0; }
    .evo-hexagram .eh-item { position: absolute; transform: translate(-50%,-50%); }
    .evo-hexagram .eh-label { position: absolute; font-size: .63rem; color: var(--text-muted); white-space: nowrap; transform: translate(-50%,0); }
    .req-icons { display: flex; gap: 4px; flex-wrap: wrap; margin-top: .3rem; }
    .req-icon { width: 28px; height: 28px; border-radius: 4px; overflow: hidden; }
    .req-icon img { width: 100%; height: 100%; object-fit: cover; }
    .hi-badge {
      display: inline-block;
      font-size: .65rem;
      padding: 1px 4px;
      border-radius: 3px;
      font-family: var(--font-title);
      letter-spacing: .04em;
      margin: 2px;
    }
    .hi-badge.char   { background: rgba(58,122,217,.25);  color: #6aadff; border: 1px solid rgba(58,122,217,.4);  }
    .hi-badge.arcana { background: rgba(155,63,217,.25);   color: #c08dff; border: 1px solid rgba(155,63,217,.4);  }
    .hi-badge.item   { background: rgba(180,30,30,.25);    color: #ff8080; border: 1px solid rgba(220,60,60,.4);   }

    /* ── Character grid (overlay) ── */
    .char-grid {
      display: grid;
      grid-template-columns: repeat(4, 1fr);
      gap: 8px;
      align-content: flex-start;
    }
    .char-grid .stack-wrapper {
      width: 100%;
      height: auto;
      aspect-ratio: 1;
    }
    .char-card {
      width: 100%;
      aspect-ratio: 1;
      cursor: pointer;
      overflow: hidden;
      position: relative;
      border-radius: 8px;
      transition: box-shadow .15s, filter .15s;
    }
    .char-card img { width: 100%; height: 100%; object-fit: cover; image-rendering: pixelated; }
    .char-card:hover img { filter: brightness(1.15); }
    .char-card.selected { box-shadow: 0 0 0 3px var(--gold), 0 0 12px rgba(232,184,32,.5); }
    .char-card.dim, .stack-wrapper.dim { opacity: .35; pointer-events: none; }
    .char-card.broken {
      background: var(--slot-bg);
      border: 2px solid var(--slot-border);
    }
    .char-card.stacked::before {
      content: '';
      position: absolute; inset: -3px;
      background: var(--surface2);
      border: 2px solid var(--slot-border);
      border-radius: 9px;
      z-index: -1;
      transform: translate(4px, 4px);
    }
    .variant-count {
      position: absolute; top: 2px; right: 2px;
      background: rgba(0,0,0,.75);
      color: var(--gold);
      font-size: 8px;
      font-family: var(--font-title);
      padding: 1px 3px;
      border-radius: 2px;
    }

    /* arcana overlay two-panel (no left stats) */
    .ovl-center-wide { flex: 1; display: flex; flex-direction: column; overflow: hidden; }

    /* stage grid — bordered art tiles, ~4 per row, fluid with zoom */
    .stage-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(230px, 1fr));
      gap: .8rem;
    }
    /* larger stage-item icons in both the selector detail panel and planner sidebar */
    .req-icons.stage-items { gap: 6px; }
    .req-icons.stage-items .req-icon { width: 44px; height: 44px; border-radius: 5px; }
    /* 44px icons (matching stage items) in every .req-row list: Starting Loadout
       (selector + info panel), weapon requirements (weapon selector info panel),
       and evo-stage navigation (planner info panel). Placed after the earlier
       .req-icon / .info-sidebar .req-icon rules so it wins the cascade. */
    .req-row .req-icon { width: 44px; height: 44px; border-radius: 5px; }
    .stage-tile { cursor: pointer; display: flex; flex-direction: column; gap: .3rem; }
    .stage-tile img {
      width: 100%;
      aspect-ratio: 312 / 192;
      object-fit: fill;
      image-rendering: pixelated;
      display: block;
      transition: filter .15s, box-shadow .15s;
    }
    .stage-tile:hover img { filter: brightness(1.2); }
    .stage-tile.selected img { box-shadow: 0 0 0 2px var(--gold), 0 0 10px rgba(232,184,32,.55); }
    .stage-tile-name {
      font-size: .72rem; text-align: center; line-height: 1.15;
      color: var(--text-muted);
    }
    .stage-tile:hover .stage-tile-name { color: var(--text); }
    .stage-tile.selected .stage-tile-name { color: var(--gold); }
    /* stage image in the detail panel — same landscape aspect */
    .stage-detail-img img {
      width: 100%;
      aspect-ratio: 312 / 192;
      object-fit: fill;
      image-rendering: pixelated;
      display: block;
    }

    /* scrollbar */
    ::-webkit-scrollbar { width: 6px; }
    ::-webkit-scrollbar-track { background: transparent; }
    ::-webkit-scrollbar-thumb { background: var(--border); border-radius: 3px; }
    ::-webkit-scrollbar-thumb:hover { background: var(--border-hi); }

    /* ── Responsive ── */
    @media (max-width: 700px) {
      .players-grid.p3, .players-grid.p4 { grid-template-columns: 1fr; }
      .overlay-panel { width: 95vw; }
      .ovl-left, .ovl-right { width: 140px; }
    }
    @media (max-width: 480px) {
      .ovl-left { display: none; }
      .ovl-right { width: 160px; }
    }
  </style>
</head>
<body>
  <div id="app"></div>
  <div id="overlay-root" class="hidden"></div>

  <script src="data/data.js"></script>
  <script>
  // ═══════════════════════════════════════════════════════
  //  CONSTANTS
  // ═══════════════════════════════════════════════════════

  const SLOT_COUNTS = {
    1: { weapons: 6, passives: 6 },
    2: { weapons: 4, passives: 4 },
    3: { weapons: 3, passives: 3 },
    4: { weapons: 2, passives: 2 },
  };

  const STAT_LABELS = {
    max_health: 'Max Health', recovery: 'Recovery',   armor: 'Armor',
    move_speed: 'Move Speed', might: 'Might',          speed: 'Proj. Speed',
    duration:   'Duration',   area: 'Area',             cooldown: 'Cooldown',
    amount:     'Amount',     revival: 'Revival',       magnet: 'Magnet',
    luck:       'Luck',       growth: 'Growth',         greed: 'Greed',
    curse:      'Curse',
  };

  // Stats expressed as percentage multipliers (0.4 → +40%)
  const PCT_STATS      = new Set(['move_speed','might','speed','duration','area','cooldown','luck','growth','greed','curse']);
  const INVERTED_STATS = new Set(['cooldown']); // negative is good

  const EMPTY_ICONS = {
    char:    'assets/icons/characters/empty.png',
    weapon:  'assets/icons/weapons/empty.png',
    passive: 'assets/icons/passives/empty.png',
    arcana:  'assets/icons/arcana/empty_arcana.png',
    stage:   'assets/icons/stages/empty.png',
  };
  const EMPTY_ICON = EMPTY_ICONS.passive;

  // Icons for special stage-item pickups that aren't weapons/passives in the data.
  const STAGE_ITEM_ICONS = {
    'Arcana Treasure Chest': 'assets/icons/weapons/arcana_treasure_chest.png',
  };

  // Stages come from D.stages (built from stages.csv); populated on load.
  let STAGES = [];

  // ═══════════════════════════════════════════════════════
  //  STATE
  // ═══════════════════════════════════════════════════════

  let D = null; // VS_DATA

  const state = {
    page: 'landing',
    playerCount: 1,
    players: [],
    arcana: [null, null, null], // global — shared across all players
    stage: null,                // global — shared across all players
    infoPanel: null,
    overlay: null,   // { type, playerIdx, slotIdx, slotType, fromEmpty, prevItem }
    ovl: {
      selected: null,
      variantIdx: {}, // baseName → idx (character variants)
      arcanaTab: 'arcana',
      autoAdd: null,  // null = use computed default; true/false = user override
      search: '',
    },
    puActive: false,
    powerUps: {}, // stat name → current level (initialized from D.stats on load)
    seal: {
      active: false,
      selected: new Set(),
      minRarity: 50,     // default: recommend weapons rarity >= 50
      sealPassives: false,
    },
  };

  function makePlayer() {
    // extraPassives: passive instances that don't occupy a core slot (e.g. Weapon
    // Power-Up), rendered in the hidden/extra bar; duplicates allowed for this type.
    return { character: null, weapons: [], passives: [], charLevel: 1, extraPassives: [] };
  }

  function initPlayers(newCount, prevPlayers = []) {
    const players = [];
    for (let i = 0; i < newCount; i++) {
      players.push(prevPlayers[i] ? prevPlayers[i] : makePlayer());
    }
    // Trim weapon/passive slots to new count (slots already on player object)
    return players;
  }

  // ═══════════════════════════════════════════════════════
  //  DATA HELPERS
  // ═══════════════════════════════════════════════════════

  function weaponByName(name) { return D.weapons.find(w => w.name === name) || null; }
  function passiveByName(name) { return D.passives.find(p => p.name === name) || null; }
  function arcanaByName(name) { return D.arcana.find(a => a.name === name) || null; }

  // A character's starting arcana is "extra": it's locked to the character and does
  // NOT count toward the 3-arcana pool. Extra arcana are derived from the players'
  // characters at render time (no pool mutation) and shown as locked slots to the
  // right of the 3 arcana. De-duplicated because the arcana pool is shared globally.
  function extraArcanaNames() {
    return [...new Set(state.players.map(p => p.character?.starting_arcana).filter(Boolean))];
  }

  // A character's `starting_weapons` list mixes actual weapons and passives (e.g.
  // Unblinded Imelda starts with Magic Wand + Empty Tome). Partition them so weapon
  // starters lock into weapon slots and passive starters lock into passive slots.
  const isPassiveName = n => D.passives.some(p => p.name === n);
  function starterWeaponNames(char) { // non-hidden weapon-type starters
    if (!char) return [];
    const hidden = new Set(char.hidden_items ?? []);
    return char.starting_weapons.filter(wn => !hidden.has(wn) && !isPassiveName(wn));
  }
  function starterPassiveNames(char) { // non-hidden passive-type starters
    if (!char) return [];
    const hidden = new Set(char.hidden_items ?? []);
    return char.starting_weapons.filter(wn => !hidden.has(wn) && isPassiveName(wn));
  }

  // ── Evo path renderer ────────────────────────────────────────────────────

  function evoPathsFor(name) {
    return (D.evoPaths || []).filter(ep => ep.related_to.includes(name) || ep.evo_path === name);
  }

  function evoIcon(name) {
    if (!name) return EMPTY_ICON;
    // Glimmer (X) steps (Emerald Diorama) have no in-game icon — reuse Emerald Rapture's.
    if (/^Glimmer\s*\(/i.test(name)) {
      const er = D.weapons.find(x => x.name === 'Emerald Rapture');
      return er ? (er.icon || EMPTY_ICON) : EMPTY_ICON;
    }
    const w = D.weapons.find(x => x.name === name); if (w) return w.icon || EMPTY_ICON;
    const p = D.passives.find(x => x.name === name); if (p) return p.icon || EMPTY_ICON;
    const a = D.arcana.find(x => x.name === name);   if (a) return a.icon || EMPTY_ICON;
    const c = D.characters.find(x => x.name === name); if (c) return c.icon || EMPTY_ICON;
    return EMPTY_ICON;
  }

  function eNode(name, { cur = false, max = false, hidden = false, sub = null, glimmer = false } = {}) {
    if (!name) return '';
    const icon = evoIcon(name);
    let cls = 'evo-node'; if (cur) cls += ' current'; if (hidden) cls += ' evo-hidden';
    // Glimmer-tech steps reuse Emerald Rapture's icon as a placeholder — strip its baked-in
    // frame so it reads as a tech node, not the actual weapon, and let its attack-name wrap.
    if (glimmer) cls += ' evo-glimmer';
    const img = `<img src="${esc(icon)}" alt="${esc(name)}" onerror="this.src='${esc(EMPTY_ICON)}'">`;
    const nd = `<div class="${cls}" title="${esc(name)}" data-evo-item="${esc(name)}">${img}</div>`;
    const extras = [];
    if (max) extras.push(`<div class="evo-max">MAX</div>`);
    if (sub) extras.push(`<div class="evo-sub${glimmer ? ' evo-sub-wrap' : ''}">${esc(sub)}</div>`);
    if (!extras.length) return nd;
    return `<div class="evo-nw">${nd}${extras.join('')}</div>`;
  }

  // Combination connector — intentionally empty: adjacency implies combination, so we drop
  // the '+' everywhere. Kept as a token so call sites read as "these nodes combine". The
  // flex row/cell gap provides the visual spacing between the now-adjacent icons.
  const EP = ``;
  const EA = `<span class="evo-op">→</span>`;
  // Level-up connector (EzEvo): the weapon auto-evolves as it LEVELS — no passive, no
  // union. Piped to read distinctly from '+' (add a passive) and '→' (evolve/union into).
  const EL = `<span class="evo-op evo-op-lvl" title="Auto-evolves as the weapon levels up">|</span>`;

  // Small Gemini connector node — replaces ← [gem] + between counterpart and base.
  // pos: 'top' = align-self:flex-start, 'bot' = flex-end, 'center' = center
  function gemNode(name, pos = 'center') {
    const icon = evoIcon(name);
    const as = pos === 'top' ? 'flex-start' : pos === 'bot' ? 'flex-end' : 'center';
    return `<div class="evo-gem" style="align-self:${as}" title="${esc(name)}" data-evo-item="${esc(name)}"><img src="${esc(icon)}" alt="${esc(name)}" onerror="this.src='${esc(EMPTY_ICON)}'"></div>`;
  }

  function eRow(...parts) { return `<div class="evo-row">${parts.join('')}</div>`; }

  function mergeBar(leftRows, rightHTML) {
    const rows = leftRows.map(r => `<div class="evo-row">${r}</div>`).join('');
    return `<div class="evo-merge"><div class="evo-merge-rows">${rows}</div><div class="evo-merge-bar"></div><div class="evo-merge-out">${rightHTML}</div></div>`;
  }

  // Grid layout: base-evo left | bar | mid(top) + union-partner(bot) | final(centered)
  function u2f(leftHTML, midHTML, partHTML, finalHTML) {
    return `<div class="evo-u2f"><div class="u2l">${leftHTML}</div><div class="u2b"></div><div class="u2t">${midHTML}</div><div class="u2m">${partHTML}</div><div class="u2f">${finalHTML}</div></div>`;
  }

  // Passive requirements of wObj that this player can't currently satisfy.
  // Shared by the info-panel Evolve and Union readiness checks — a union can also
  // carry a passive requirement (Phieraggi needs Tirajisú), not just partner weapons.
  function missingPassiveReqs(wObj, player) {
    const allPassives = new Set([
      ...state.players.flatMap(p => p.passives.filter(Boolean).map(p => p.name)),
      ...state.players.flatMap(p => p.extraPassives || []),
    ]);
    const passiveReqs = (wObj.requirements || []).filter(r => D.passives.some(p => p.name === r));
    return passiveReqs.filter(r => {
      if (isExtraPassive(r)) {
        // Weapon Power-Up binds 1:1 (needs an UNBOUND instance or room to add).
        if (r === WEAPON_POWER_UP) return !(wpuCount(player) > evolvedOGCount(player) || wpuCount(player) < wpuCap(player));
        // Consumable (Mini) is consumed on evolve, so it must be in hand now.
        if (isConsumableExtra(r)) return !(extraCount(player, r) >= 1);
        // Shared (Outer Saboteur): present or addable.
        return !(extraCount(player, r) >= 1 || extraCap(player, r) > 0);
      }
      return !allPassives.has(r);
    });
  }

  function buildEvoChainHTML(w) {
    const paths = evoPathsFor(w.name);
    if (!paths.length) return '';
    const sections = paths.map(ep => {
      const html = renderEvoPath(ep, w.name);
      return html ? `<div data-evo-path="${esc(ep.evo_path)}">${html}</div>` : '';
    }).filter(Boolean);
    if (!sections.length) return '';
    return `<div class="detail-section"><h3>Evolution</h3><div class="evo-flow">${sections.join('')}</div></div>`;
  }

  // Returns evo chain HTML for all paths involving a passive, optionally filtered to a player's equipped weapons.
  function buildPassiveEvoHTML(passiveName, playerIdx = null) {
    const relatedWeapons = D.weapons.filter(w => (w.requirements || []).includes(passiveName));
    const equippedNames = playerIdx != null
      ? new Set(state.players[playerIdx].weapons.filter(Boolean).map(w => w.name))
      : null;

    const seen = new Set();
    const groups = [];
    for (const w of relatedWeapons) {
      for (const ep of evoPathsFor(w.name)) {
        if (seen.has(ep.evo_path)) continue;
        if (equippedNames && !ep.related_to.some(rn => equippedNames.has(rn))) continue;
        seen.add(ep.evo_path);
        const rendered = renderEvoPath(ep, w.name);
        if (rendered) groups.push(`<div class="evo-path-group" data-evo-path="${esc(ep.evo_path)}"><div style="font-size:.65rem;color:var(--gold-dim);text-transform:uppercase;letter-spacing:.06em;margin-bottom:.35rem">${esc(ep.evo_path)}</div>${rendered}</div>`);
      }
    }
    if (!groups.length) return '';
    return `<div class="detail-section"><h3>Used In</h3><div class="evo-flow" style="gap:.6rem">${groups.join('')}</div></div>`;
  }

  function renderEvoPath(ep, cur) {
    const n = (name, opts = {}) => eNode(name, { ...opts, cur: name === cur });
    const { b1_1, b1_2, b1_3, b1_4, b1_r, b2_1, b2_2, b2_r, b3_1, b3_2, b3_r, pattern: pat } = ep;

    if (pat === 'Final') return '';

    if (pat === 'Evo>Final')
      return eRow(n(b1_1), EP, n(b1_2), EA, n(b1_r));

    if (pat === 'Evo(Max)>Final')
      return eRow(n(b1_1), EP, n(b1_2, { max: true }), EA, n(b1_r));

    if (pat === 'Evo(Max)>HiddenFinal')
      return eRow(n(b1_1), EP, n(b1_2, { max: true }), EA, n(b1_r, { hidden: true, sub: 'Hidden' }));

    if (pat === 'TwoReqEvo>Final')
      return eRow(n(b1_1), EP, n(b1_2), EP, n(b1_3), EA, n(b1_r));

    if (pat === 'TwoReqEvo(Max)>Final')
      return eRow(n(b1_1), EP, n(b1_2, { max: true }), EP, n(b1_3, { max: true }), EA, n(b1_r));

    if (pat === 'Evo>Union>Final') {
      // left: [b1_1]+[b1_2] | mid: [b1_r] | bot: [b2_2] (aligned with mid) | final: +→[b2_r]
      return u2f(n(b1_1) + EP + n(b1_2), n(b1_r), n(b2_2), EP + EA + n(b2_r));
    }

    if (pat === 'TripleUnion>Final') {
      return `<div class="evo-multi-union"><div class="evo-multi-inputs">${[b1_1,b1_2,b1_3].map(nm => `<div class="evo-row">${n(nm)}</div>`).join('')}</div><div class="evo-merge-bar"></div><div class="evo-merge-out">${EA}${n(b1_r)}</div></div>`;
    }

    if (pat === 'QuadUnion>HiddenFinal') {
      return `<div class="evo-multi-union"><div class="evo-multi-inputs">${[b1_1,b1_2,b1_3,b1_4].map(nm => `<div class="evo-row">${n(nm)}</div>`).join('')}</div><div class="evo-merge-bar"></div><div class="evo-merge-out">${EA}${n(b1_r, { hidden: true, sub: 'Hidden' })}</div></div>`;
    }

    if (pat === 'EzEvo>EzEvo>Final')
      // Both hops are auto level-ups (piped). Final form is in b2_r (b3_1 is unused/null).
      return eRow(n(b1_1), EL, n(b1_r), EL, n(b2_r));

    if (pat === 'EzEvo>EzEvo>Union>Final') {
      // left: [b1_1]|[b1_r] (auto level-up, piped) | mid: [b2_r] | bot: [b3_2] | final: +→[b3_r]
      return u2f(n(b1_1) + EL + n(b1_r), n(b2_r), n(b3_2), EP + EA + n(b3_r));
    }

    if (pat === 'EzEvo>AlucardGiftFinal') {
      // Alucart Sworb |(level-up) Alucard Swords →(gift) Alucard Shield. The gift also
      // needs any FIVE max-level evolutions — shown as a 3-over-2 example block to the
      // right of the Shield. (Data lineage is correct; the final node uses b2_r, the
      // Shield — the old render mistakenly re-showed b2_1/Alucard Swords here.)
      const examples = ['Bloody Tear','Holy Wand','Thousand Edge','Death Spiral','Heaven Sword'];
      const ex = examples.map(nm => n(nm, { hidden: true }));
      // Two vertical columns to the right of the Shield: a 3-icon column (its middle icon
      // lines up with the evo row) then a 2-icon column vertically centered against the 3.
      const block = `<div class="alucard-evos" title="Plus any 5 max-level evolutions">
        <div class="alucard-evos-col">${ex.slice(0, 3).join('')}</div>
        <div class="alucard-evos-col">${ex.slice(3).join('')}</div>
      </div>`;
      return `<div class="evo-row" style="gap:6px">${n(b1_1)}${EL}${n(b1_r)}${EA}${n(b2_r, { hidden: true, sub: 'Hidden' })}${block}</div>`;
    }

    if (pat === 'Counterpart:Final')
      return eRow(n(b1_r), gemNode(b1_2), n(b1_1));

    if (pat === 'Counterpart:Evo(Max)>Final')
      return eRow(n(b1_r), gemNode(b1_2), n(b1_1), EP, n(b2_2, { max: true }), EA, n(b2_r));

    if (pat === 'Counterpart:Evo>Union>Final') {
      // base shown once; gemNode replaces ←[gem]+ between counterpart and base
      return u2f(
        n(b1_r) + gemNode(b1_2) + n(b1_1) + EP + n(b2_2),
        n(b2_r),
        n(b3_2),
        EP + EA + n(b3_r)
      );
    }

    if (pat === 'Counterpart:TwoReqEvo>Final')
      return eRow(n(b1_r), gemNode(b1_2), n(b1_1), EP, n(b2_2), EA, n(b2_r));

    if (pat === 'Dual(Counterpart):Union>Final') {
      // Gems centered within each swim lane.
      return mergeBar(
        [n(b1_r) + gemNode(b1_2, 'center') + n(b1_1) + EA, n(b2_r) + gemNode(b2_2, 'center') + n(b2_1) + EA],
        n(b3_r)
      );
    }

    if (pat === 'Dual(Counterpart):UnionEvo>Final') {
      // Like Dual(Counterpart):Union but the union ALSO needs a passive (Phieraggi
      // needs Tirajisú). Passive isn't in the evo-path fields, so read it off the
      // union inputs' requirements and show it feeding into the final.
      const unionInputs = D.weapons.filter(b => b.trans_result === ep.evo_path && b.method === 'Union');
      const passiveReq = unionInputs
        .flatMap(u => (u.requirements || []).filter(r => D.passives.some(p => p.name === r)))[0];
      const finalHTML = passiveReq ? n(passiveReq) + EP + n(b3_r) : n(b3_r);
      return mergeBar(
        [n(b1_r) + gemNode(b1_2, 'center') + n(b1_1) + EA, n(b2_r) + gemNode(b2_2, 'center') + n(b2_1) + EA],
        finalHTML
      );
    }

    if (pat === 'Dual(Evo(Max))>HiddenFinal') {
      return mergeBar(
        [n(b1_1) + EP + n(b1_2, { max: true }) + EA + n(b1_r) + EA, n(b2_1) + EP + n(b2_2, { max: true }) + EA + n(b2_r) + EA],
        n(b3_r, { hidden: true, sub: 'Hidden' })
      );
    }

    if (pat === 'ChaosEvolution>Final') {
      // b1_2=character, b1_3=base weapon, b1_r=final. The chaos item (b1_1) is deliberately
      // NOT shown/checked — it's a permanent out-of-game unlock, not an in-run component
      // (its requirement is stripped from the base weapon in data too). Evo condition
      // (modeled later in Manage Collection): equipped by this character AND level ≥ 80.
      // Show the character's full _sprite.png rather than the small portrait icon.
      const chr = D.characters.find(c => c.name === b1_2);
      const spriteSrc = (chr && (chr.sprite_static || chr.icon)) || evoIcon(b1_2);
      const charNode = `<div class="evo-nw"><div class="evo-node evo-char-sprite" title="${esc(b1_2)}" data-evo-item="${esc(b1_2)}"><img src="${esc(spriteSrc)}" alt="${esc(b1_2)}" onerror="this.src='${esc(EMPTY_ICON)}'"></div><div class="evo-sub">Lv.80</div></div>`;
      return eRow(n(b1_3), EA, charNode, EA, n(b1_r));
    }

    // Glimmer (X) is a glimmer-attack step (no real icon → Emerald Rapture via evoIcon);
    // label it with just the attack name so the reused icon stays distinguishable.
    const glim = raw => { const m = /^Glimmer\s*\((.+)\)$/i.exec(raw || ''); return n(raw, { sub: m ? m[1] : 'Glimmer', glimmer: true }); };

    if (pat === 'GlimmerEzEvo>GlimmerEzEvo>Final')
      return eRow(n(b1_1), EP, glim(b1_2), EA, n(b1_r), EP, glim(b2_2), EA, n(b2_r));

    if (pat === 'GlimmerEvo>Final')
      return b1_3
        ? eRow(n(b1_1), EP, glim(b1_2), EP, n(b1_3), EA, n(b1_r))
        : eRow(n(b1_1), EP, glim(b1_2), EA, n(b1_r));

    const COLL_PATS = ['Magic Whip>Final','Vampire-Killing Tool>Final','Magic Weapon>Final',
      "Belnades' Spell>Final",'Ambiguous Power>Final','Familiar>Final','Emerald Diorama>Final'];
    if (COLL_PATS.includes(pat)) {
      if (cur !== ep.evo_path) return '';
      // new format: b1_1 holds the pipe-delimited ingredient list
      // old format (Familiar Forge, Intuition not yet updated): fall back to related_to
      const inputs = (b1_1 && b1_1.includes('|'))
        ? b1_1.split('|').map(s => s.trim()).filter(Boolean)
        : ep.related_to.filter(nm => nm !== ep.evo_path);
      const MAX_ROW = 8;
      let rows = '';
      for (let i = 0; i < inputs.length; i += MAX_ROW)
        rows += `<div class="evo-coll-inputs">${inputs.slice(i, i + MAX_ROW).map(nm => n(nm)).join('')}</div>`;
      // Base item → a pool of many: this weapon behaves like a candybox drawing from a
      // limited pool, so lead with the item and point INTO the pool below it.
      return `<div class="evo-coll-wrap"><div class="evo-row" style="margin-bottom:2px">${n(ep.evo_path)}${EA}</div>${rows}</div>`;
    }

    if (pat === 'Gift(Treasure)>Final')
      return eRow(n(b1_1), EA, n(b1_2), EA, n(b1_r));

    if (pat === 'FivePassive>Final') {
      // Spirit Rings + 5 stat passives → Rings of Calamity. The passives aren't in the
      // evo-path data, so name them explicitly (Max Health, Might, Area, Speed, Duration).
      // Layout: [Spirit Rings]  (5-passive ring)  |  [Rings of Calamity].
      const passives = ['Hollow Heart', 'Spinach', 'Candelabrador', 'Bracer', 'Spellbinder'];
      const angles = [270, 342, 54, 126, 198];
      const r = 45, cx = 68, cy = 68;
      const items = angles.map((deg, i) => {
        const rd = deg * Math.PI / 180;
        return `<div class="ep-item" style="left:${cx + r * Math.cos(rd)}px;top:${cy + r * Math.sin(rd)}px">${n(passives[i])}</div>`;
      }).join('');
      const ring = `<div class="evo-pentagram">${items}</div>`;
      return `<div class="evo-row" style="gap:6px">${n(b1_1)}${ring}${EL}${n(b1_r)}</div>`;
    }

    if (pat === 'Tuna>Final') {
      // Penshin Fatcha (base) sits to the LEFT of the hexagon of 6 tuna forms; Miracle of
      // Multiplication (final) sits to the RIGHT. The ring holds only the 6 forms.
      const forms = [b1_2, b1_3, b2_1, b2_2, b3_1, b3_2];
      const r = 52, cx = 80, cy = 75;
      const hexItems = forms.map((nm, i) => {
        const rd = (i * 60 - 90) * Math.PI / 180;
        return `<div class="eh-item" style="left:${cx + r * Math.cos(rd)}px;top:${cy + r * Math.sin(rd)}px">${n(nm)}</div>`;
      }).join('');
      const hex = `<div class="evo-hexagram">${hexItems}
        <div class="eh-label" style="left:${cx}px;top:${cy}px;transform:translate(-50%,-50%)">6 Evolutions</div>
      </div>`;
      return `<div class="evo-row" style="gap:6px">${n(b1_1)}${EA}${hex}${EA}${n(b3_r)}</div>`;
    }

    return '';
  }

  function getEvolutionPassiveStatus(selW, playerIdx) {
    const player = state.players[playerIdx];
    const counts = SLOT_COUNTS[state.playerCount];
    const pending = []; // {name, slot} — needs to be added to this player
    const missing = []; // names — needed but no slot available
    const virtuallyTaken = new Set();
    // Passive equipped by ANY player satisfies the evo condition (cross-player sharing).
    const allEquippedPassives = new Set(
      state.players.flatMap(p => p.passives.filter(Boolean).map(p => p.name))
    );
    for (const req of (selW.requirements || [])) {
      if (!D.passives.some(p => p.name === req)) continue; // weapon req, skip
      if (isExtraPassive(req)) {
        // Extra-bar passive (no core slot): adding this weapon raises the cap, so an
        // instance is always addable — pending, never "no room".
        pending.push({ name: req, slot: -1 });
        continue;
      }
      if (allEquippedPassives.has(req)) continue; // satisfied by any player
      // Passive is missing entirely — find an empty slot on this player to add it.
      let emptySlot = -1;
      for (let i = 0; i < counts.passives; i++) {
        if (!player.passives[i] && !virtuallyTaken.has(i)) { emptySlot = i; break; }
      }
      if (emptySlot >= 0) { virtuallyTaken.add(emptySlot); pending.push({ name: req, slot: emptySlot }); }
      else missing.push(req);
    }
    return { pending, missing };
  }

  // Group characters by base_name, preserving CSV order of first appearance
  function charGroups() {
    const order = [];
    const map = {};
    for (const c of D.characters) {
      const key = c.base_name || c.name;
      if (!map[key]) { map[key] = []; order.push(key); }
      map[key].push(c);
    }
    return order.map(k => map[k]);
  }

  // Group arcana: pair Arcana + Darkana sharing the same base_num
  function arcanaGroups() {
    const order = [];
    const map = {};
    for (const a of D.arcana) {
      const key = a.base_num || a.number;
      if (!map[key]) { map[key] = []; order.push(key); }
      map[key].push(a);
    }
    // Sort groups by numeric base_num, Arcana before Darkana within each group
    return order.sort((a, b) => parseInt(a) - parseInt(b)).map(k => {
      const g = map[k];
      g.sort((a, b) => (a.type === 'Arcana' ? -1 : 1) - (b.type === 'Arcana' ? -1 : 1));
      return g;
    });
  }

  // ═══════════════════════════════════════════════════════
  //  EVOLUTION
  // ═══════════════════════════════════════════════════════

  function computeEffectiveWeapon(weapon, player) {
    if (!weapon || !weapon.trans_result) return weapon;
    const passiveNames = new Set(player.passives.filter(Boolean).map(p => p.name));
    const weaponNames  = new Set(player.weapons.filter(Boolean).map(w => w.name));
    const all = new Set([...passiveNames, ...weaponNames]);
    const met = weapon.requirements.every(r => all.has(r));
    if (!met) return weapon;
    const evolved = weaponByName(weapon.trans_result);
    if (!evolved) return weapon;
    return computeEffectiveWeapon(evolved, player); // chain-evolve
  }

  function weaponLineage(name) {
    const forms = new Set();
    let w = weaponByName(name);
    while (w) {
      forms.add(w.name);
      w = w.trans_result ? weaponByName(w.trans_result) : null;
    }
    return forms;
  }

  function getHiddenCounterparts(playerIdx) {
    const player = state.players[playerIdx];
    const equippedNames = new Set(player.weapons.filter(Boolean).map(w => w.name));
    const hasGemini = state.arcana.some(a => a && a.name === 'Gemini (I)');
    if (!hasGemini) return [];
    const seen = new Set();
    const hidden = [];

    function checkBase(baseName, counterpartName) {
      if (!baseName || !counterpartName || seen.has(counterpartName)) return;
      const lineage = weaponLineage(baseName);
      if ([...lineage].some(n => equippedNames.has(n))) {
        seen.add(counterpartName);
        hidden.push(counterpartName);
      }
    }

    for (const ep of (D.evoPaths || [])) {
      if (!ep.pattern.includes('Counterpart')) continue;
      checkBase(ep.b1_1, ep.b1_r);
      // Dual(Counterpart) patterns carry a SECOND independent base→counterpart pair in
      // b2 (Vandalier: Ebony Wings→Zhar Ptytsia; Phieraggi: Eight→Twice Upon a Time).
      // Match the whole family, not just the exact Union> string — UnionEvo> was excluded,
      // so Eight's counterpart never surfaced. (Non-dual Counterpart patterns reuse b2 for
      // the evolved final, not a counterpart, so they stay b1-only.)
      if (ep.pattern.startsWith('Dual(Counterpart)')) checkBase(ep.b2_1, ep.b2_r);
    }
    return hidden;
  }

  // Auto-devolve any weapon whose full evo chain has an unmet passive requirement.
  // Works for standard evolutions (Bloody Tear needs Hollow Heart) AND unions
  // (Fuwalafuwaloo needs Hollow Heart via its Bloody Tear branch). A broken weapon is
  // replaced by its immediate bases: the earlier in-game branch reclaims the slot in
  // place; union partners spill into empty slots, or are dropped with a toast when the
  // loadout is full. Iterates until stable so cascades resolve fully — e.g. dropping
  // Hollow Heart turns Fuwalafuwaloo → Bloody Tear + Vento Sacro → Whip + Vento Sacro.
  function autoDevolveBrokenEvos() {
    // Banish-layout index of a weapon's ultimate base — used to order union branches
    // so the earlier weapon (e.g. Whip) reclaims the slot ahead of a later one (Vento Sacro).
    const banishRootIdx = name => {
      let cur = name;
      while (true) { const b = D.weapons.find(x => x.trans_result === cur); if (!b) break; cur = b.name; }
      const idx = D.banishLayout.indexOf(cur);
      return idx < 0 ? 9999 : idx;
    };
    let changed = true;
    while (changed) {
      changed = false;
      const counts = SLOT_COUNTS[state.playerCount];
      // Include extra-bar passives (e.g. Weapon Power-Up) so evolved OG weapons aren't
      // seen as "missing" their requirement — syncExtraPassives owns the precise 1:1 binding.
      const allPassiveNames = new Set([
        ...state.players.flatMap(p => p.passives.filter(Boolean).map(p => p.name)),
        ...state.players.flatMap(p => p.extraPassives || []),
      ]);
      for (const player of state.players) {
        for (let i = 0; i < player.weapons.length; i++) {
          const w = player.weapons[i];
          if (!w) continue;
          // Immediate bases producing w (Evolution: 1; Union: 2+), earlier branch first.
          const bases = D.weapons.filter(b => b.trans_result === w.name)
            .slice().sort((a, b) => banishRootIdx(a.name) - banishRootIdx(b.name));
          if (!bases.length) continue; // base / standalone weapon — nothing to devolve
          // Broken if any passive required anywhere in w's full chain is missing.
          const neededPassives = collectChainPassives(collectWeaponChain(w.name));
          if ([...neededPassives].every(p => allPassiveNames.has(p))) continue;
          // Primary base reclaims this slot; remaining union partners fill empty slots.
          player.weapons[i] = bases[0];
          for (let k = 1; k < bases.length; k++) {
            if (player.weapons.some(x => x && x.name === bases[k].name)) continue;
            let empty = -1;
            for (let j = 0; j < counts.weapons; j++) { if (!player.weapons[j]) { empty = j; break; } }
            if (empty >= 0) player.weapons[empty] = bases[k];
            else showToast(`No room to restore ${bases[k].name}`, 'warn');
          }
          changed = true;
        }
      }
    }
  }

  // ═══════════════════════════════════════════════════════
  //  RENDER HELPERS
  // ═══════════════════════════════════════════════════════

  function esc(s) {
    return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
  }

  // One stage-item icon: a passive, weapon, or special-pickup override; text if unmapped.
  function stageItemIconHTML(it) {
    const obj  = passiveByName(it) || weaponByName(it);
    const icon = obj ? (obj.icon || EMPTY_ICON) : STAGE_ITEM_ICONS[it];
    return `<div class="req-icon" title="${esc(it)}">
      ${icon ? `<img src="${esc(icon)}" onerror="this.parentElement.classList.add('broken');this.src='${esc(EMPTY_ICON)}'">` : `<span style="font-size:.55rem;color:var(--text-muted)">${esc(it.slice(0,6))}</span>`}
    </div>`;
  }

  // Stage items + arcana-gated groups. `heading` renders each section label so callers can
  // match their panel style (overlay uses <h3>, planner sidebar uses .detail-section-label).
  function stageItemsHTML(stage, heading) {
    if (!stage) return '';
    const groups = [];
    if (stage.items?.length) groups.push(['Stage Items', stage.items]);
    (stage.conditional ?? []).forEach(g => groups.push([`With ${g.arcana}`, g.items]));
    if (!groups.length) return '<div class="detail-desc" style="margin-top:.5rem">No stage items.</div>';
    return groups.map(([label, items]) =>
      `<div class="detail-section">${heading(label)}<div class="req-icons stage-items">${items.map(stageItemIconHTML).join('')}</div></div>`
    ).join('');
  }

  function slotHTML(item, opts = {}) {
    const { type = 'weapon', playerIdx = 0, slotIdx = 0,
            hidden = false, removable = true, locked = false, infoName = null } = opts;
    const isChar  = type === 'char';
    const emptyIcon = EMPTY_ICONS[type] || EMPTY_ICONS.weapon;
    const icon = item ? (item.icon || emptyIcon) : emptyIcon;
    const classes = [
      'slot',
      isChar ? 'slot-char' : '',
      type === 'arcana' ? 'slot-arcana' : '',
      type === 'stage'  ? 'slot-stage'  : '',
      hidden    ? 'hidden-weapon' : '',
      locked    ? 'slot-locked'   : '',
    ].filter(Boolean).join(' ');

    const removeBtn = (!hidden && removable && item && !locked)
      ? `<button class="slot-remove" data-action="remove-slot" data-player="${playerIdx}" data-slot="${slotIdx}" data-type="${type}" title="Remove">×</button>`
      : '';

    const imgTag = `<img src="${esc(icon)}" alt="${item ? esc(item.name) : ''}" onerror="this.src='${emptyIcon}'">`;
    const slotAction = hidden ? (item ? 'view-hidden' : '') : item ? 'view-slot' : (locked ? '' : 'open-slot');

    const lockIcon = locked ? `<img class="slot-lock" src="assets/icons/ui/locked.png" alt="">` : '';
    const hiddenAttr = (hidden && item) ? `data-hidden-name="${esc(item.name)}"` : '';
    const infoAttr = infoName ? `data-info-name="${esc(infoName)}"` : '';
    return `<div class="${classes}"
      ${slotAction ? `data-action="${slotAction}"` : ''} data-player="${playerIdx}" data-slot="${slotIdx}" data-type="${type}" ${hiddenAttr} ${infoAttr}
      title="${item ? esc(item.name) + (locked ? ' (starter)' : hidden ? ' (hidden)' : '') : 'Empty'}">
      ${imgTag}
      ${removeBtn}
      ${lockIcon}
    </div>`;
  }

  // Conditional "Hidden/Extra" row for hidden weapons or passives. Renders
  // nothing when there are no items, so the row only appears when populated.
  function hiddenSlotRow(names, type, playerIdx) {
    if (!names.length) return '';
    const byName = type === 'passive' ? passiveByName : weaponByName;
    const slots = names.map(nm => slotHTML(byName(nm), {
      type, playerIdx, slotIdx: -1, hidden: true
    })).join('');
    return `<div class="slot-row slot-row-hidden">${slots}</div>`;
  }

  function statVal(key, val) {
    if (val === 0) return null;
    const pct = PCT_STATS.has(key);
    const num = pct ? Math.round(val * 100) : val;
    const sign = num > 0 ? '+' : '';
    const suffix = pct ? '%' : '';
    const isGood = INVERTED_STATS.has(key) ? num < 0 : num > 0;
    const cls = isGood ? 'pos' : 'neg';
    return `<span class="stat-val ${cls}">${sign}${num}${suffix}</span>`;
  }

  function statsHTML(char, player, level) {
    const showPassive = !!player;
    let rows = '';
    for (const [key, label] of Object.entries(STAT_LABELS)) {
      const { dispBase, dispChar, dispPU, dispPassive, total, isPct, isCapped } = calcStatTotal(key, char?.stats, player, char, level);
      const suffix = isPct ? '%' : '';
      const charIsZero = dispChar === 0;
      const charSign = dispChar > 0 ? '+' : '';
      const isGood = INVERTED_STATS.has(key) ? dispChar < 0 : dispChar > 0;
      const charCls = charIsZero ? '' : (isGood ? 'pos' : 'neg');
      const charDisplay = charIsZero
        ? '<span class="stat-char stat-val">—</span>'
        : `<span class="stat-char stat-val ${charCls}">${charSign}${dispChar}${suffix}</span>`;
      const puDisplay = dispPU
        ? `<span class="stat-pu">${dispPU}</span>`
        : '<span class="stat-pu" style="color:var(--text-muted)">—</span>';
      const passiveDisplay = showPassive
        ? (dispPassive
            ? `<span class="stat-passive">${dispPassive}</span>`
            : '<span class="stat-passive" style="color:var(--text-muted)">—</span>')
        : '';
      const changed = dispChar !== 0;
      const rowCls = ['stat-row', changed ? 'changed' : '', isCapped ? 'capped' : ''].filter(Boolean).join(' ');
      rows += `<div class="${rowCls}">
        <span class="stat-key">${label}</span>
        <span class="stat-base">${dispBase}</span>
        ${charDisplay}
        ${puDisplay}
        ${passiveDisplay}
        <span class="stat-total">${total}${suffix}</span>
      </div>`;
    }
    const header = showPassive
      ? `<div class="stat-header"><span>Stat</span><span>Base</span><span>Char</span><span>PU</span><span>Pass</span><span>Total</span></div>`
      : `<div class="stat-header"><span>Stat</span><span>Base</span><span>Char</span><span>PU</span><span>Total</span></div>`;
    return `<div class="stat-grid${showPassive ? ' with-pass' : ''}">${header}${rows}</div>`;
  }
