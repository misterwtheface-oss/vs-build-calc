            <img src="${esc(cur.icon||EMPTY_ICONS.char)}" alt="${esc(cur.name)}" onerror="this.src='${EMPTY_ICONS.char}'">
            ${group.length > 1 ? `<div class="variant-count">${vi+1}/${group.length}</div>` : ''}
          </div>
          ${nav}
        </div>`;
      }).join('');
      return `<div class="char-grid collection-char-grid">${cells}</div>`;
    }

    if (tab === 'arcana') {
      const cells = arcanaGroups().map(group => {
        const arcana  = group.find(a => a.type === 'Arcana') || group[0];
        const owned = !u.arcana.has(arcana.name);
        const searchVal = esc(group.map(a => a.name).join('|'));
        return `<div class="item-card${owned ? '' : ' uncollected'}"
          data-action="collection-toggle" data-kind="arcana" data-name="${esc(arcana.name)}"
          data-search="${searchVal}" title="${esc(arcana.name)}${owned ? '' : ' — not in your collection'}">
          <img src="${esc(arcana.icon||EMPTY_ICON)}" alt="${esc(arcana.name)}" onerror="this.parentElement.classList.add('broken');this.src='${esc(EMPTY_ICON)}'">
        </div>`;
      }).join('');
      // Reuse the arcana selector's grid (8-up, arcana-card aspect ratio, object-fit:fill).
      return `<div class="arcana-grid">${cells}</div>`;
    }

    // wp — banish layout of base weapons + passives. Only atoms (bases/passives) are
    // toggleable; evolved/union forms render read-only, dimmed when their chain isn't owned.
    const passiveNames = new Set(D.passives.map(p => p.name));
    const weaponMap  = Object.fromEntries(D.weapons.map(w => [w.name, w]));
    const passiveMap = Object.fromEntries(D.passives.map(p => [p.name, p]));
    const cells = D.banishLayout.map(name => {
      if (!name) return `<div class="seal-cell empty"></div>`;
      const isPassive = passiveNames.has(name);
      const item = weaponMap[name] || passiveMap[name];
      const icon = item ? item.icon : (isPassive ? EMPTY_ICONS.passive : EMPTY_ICONS.weapon);
      const fallback = isPassive ? EMPTY_ICONS.passive : EMPTY_ICONS.weapon;
      const isBase = isPassive || (item && item.category === 'Base');
      const kind = isPassive ? 'passives' : 'weapons';
      const owned = isBase
        ? !u[kind].has(name)
        : weaponOwnedChain(name); // derived form: accessible iff its chain is owned
      const derived = !isBase;
      const cls = ['seal-cell', derived ? 'collection-derived' : '', owned ? '' : 'uncollected'].filter(Boolean).join(' ');
      const actionAttr = derived ? '' : `data-action="collection-toggle" data-kind="${kind}" data-name="${esc(name)}"`;
      const tip = esc(name) + (derived ? ' (auto — derives from its parts)' : (owned ? '' : ' — not in your collection'));
      return `<div class="${cls}" ${actionAttr} title="${tip}">
        <img class="seal-icon" src="${esc(icon)}" alt="${esc(name)}" onerror="this.src='${fallback}'">
      </div>`;
    }).join('');
    return `<div class="seal-grid">${cells}</div>`;
  }

  // ── Builds overlay ─────────────────────────────────────────────────────────
  // Two sections: Featured (window.VS_BUILDS, read-only) and My Builds (localStorage,
  // editable). Rows Load a build into the planner; the toolbar Saves the current planner
  // as a new user build or Imports one from pasted JSON. See captureBuild/applyBuild.
  // The build's top traits, as compact colored banners — replaces free-text tags. Recomputed
  // from the live dataset; falls back to the names cached on the build (build.traits) when the
  // current data can't resolve them.
  function buildTraitBannersHTML(build) {
    let traits = buildTopTraits(build, 3);
    if (!traits.length && Array.isArray(build.traits))
      traits = build.traits.map(affinityByName).filter(Boolean).slice(0, 3);
    if (!traits.length) return '';
    return `<div class="build-tags">${traits.map(a => {
      const color = a.color || '#6a4010';
      return `<span class="build-trait-banner" style="--aff-color:${esc(color)};--aff-text:${affinityTextColor(color)}"
        title="${esc(a.name)}">${esc(a.name)}</span>`;
    }).join('')}</div>`;
  }

  // `idx` is the index into the SOURCE list (state.builds.user or window.VS_BUILDS) — not the
  // (possibly filtered) display order — so Load/Delete/etc. target the right build.
  function buildRowHTML(build, source, idx) {
    const charName = build.players?.[0]?.character;
    const char = charName ? charByName(charName) : null;
    const icon = char ? charSpriteIcon(char) : EMPTY_ICONS.char; // character _sprite.png
    const banners = buildTraitBannersHTML(build);
    const meta = [
      build.playerCount > 1 ? `${build.playerCount}P` : 'Solo',
      build.author ? `by ${esc(build.author)}` : '',
    ].filter(Boolean).join(' · ');
    const notes = build.notes || build.description || '';
    const userActions = source === 'user'
      ? `<button class="btn btn-sm" data-action="rename-build" data-idx="${idx}">Rename</button>
         <button class="btn btn-sm" data-action="export-build" data-source="user" data-idx="${idx}">Export</button>
         <button class="btn btn-sm btn-danger" data-action="delete-build" data-idx="${idx}">Delete</button>`
      : `<button class="btn btn-sm" data-action="export-build" data-source="featured" data-idx="${idx}">Export</button>`;
    return `<div class="build-row">
      <div class="build-row-icon build-row-sprite"><img src="${esc(icon)}" alt="" onerror="this.src='${EMPTY_ICONS.char}'"></div>
      <div class="build-row-main">
        <div class="build-row-name">${esc(build.name || 'Untitled')}</div>
        ${meta ? `<div class="build-row-meta">${meta}</div>` : ''}
        ${notes ? `<div class="build-row-desc">${esc(notes)}</div>` : ''}
        ${banners}
      </div>
      <div class="build-row-actions">
        <button class="btn btn-sm" data-action="load-build" data-source="${source}" data-idx="${idx}">Load ▸</button>
        ${userActions}
      </div>
    </div>`;
  }

  // `entries` is [{build, idx}] where idx is the index into the source list.
  function buildsSectionHTML(title, entries, source, emptyMsg) {
    const rows = entries.length
      ? entries.map(e => buildRowHTML(e.build, source, e.idx)).join('')
      : `<div class="builds-empty">${emptyMsg}</div>`;
    return `<div class="builds-section">
      <h3 class="builds-section-title">${esc(title)} <span class="builds-count">${entries.length}</span></h3>
      ${rows}
    </div>`;
  }

  // A build "belongs to" a character if any of its players run that character.
  function buildHasChar(build, charName) {
    return (build.players || []).some(p => p.character === charName);
  }

  // `charScope` (a character name) filters the overlay to that character's builds and labels
  // the save button accordingly; null shows every build. Defaults to the current scope so the
  // internal re-renders (after save/delete/rename/import) preserve it.
  function renderBuildsOverlay(charScope = state.builds.charScope) {
    state.builds.charScope = charScope || null;
    const featured = window.VS_BUILDS || [];
    const user = state.builds.user;
    // Keep source indices while filtering to the scoped character.
    const entries = (list) => list
      .map((build, idx) => ({ build, idx }))
      .filter(e => !charScope || buildHasChar(e.build, charScope));
    const scoped = !!charScope;
    const root = document.getElementById('overlay-root');
    root.innerHTML = `
      <div class="overlay-panel builds-panel">
        <div class="overlay-header">
          <h2>${scoped ? `Builds — ${esc(charScope)}` : 'Builds'}</h2>
          <button class="btn btn-icon overlay-close" data-action="builds-close">✕</button>
        </div>
        <div class="seal-controls">
          <button class="btn btn-sm" data-action="save-build">＋ Save current build</button>
          <button class="btn btn-sm" data-action="import-build">⬆ Import…</button>
          ${scoped ? `<button class="btn btn-sm" data-action="open-builds">All builds ▸</button>` : ''}
        </div>
        <div class="builds-hint">${scoped
          ? `Showing builds that run ${esc(charScope)}. Save captures the current planner. Load fills the planner; the Seal Advisor is left untouched.`
          : `Load fills the planner (characters, weapons, passives, arcana, stage). The Seal Advisor is left untouched.`}</div>
        <div class="builds-scroll">
          ${buildsSectionHTML('Featured', entries(featured), 'featured', scoped ? `No featured builds for ${esc(charScope)}.` : 'No featured builds bundled yet.')}
          ${buildsSectionHTML('My Builds', entries(user), 'user', scoped ? `No saved builds for ${esc(charScope)} yet. Build a loadout, then “Save current build”.` : 'None saved yet. Build a loadout, then “Save current build”.')}
        </div>
      </div>`;
    root.classList.remove('hidden');
    state.builds.active = true;
  }

  function closeBuildsOverlay() {
    document.getElementById('overlay-root').classList.add('hidden');
    state.builds.active = false;
    state.builds.charScope = null;
  }

  // Copy text to clipboard with a file://-safe fallback (prompt shows selectable JSON).
  function copyToClipboard(text, okMsg) {
    const fallback = () => window.prompt('Copy this build JSON:', text);
    if (navigator.clipboard && navigator.clipboard.writeText) {
      navigator.clipboard.writeText(text).then(() => showToast(okMsg, 'ok'), fallback);
    } else {
      fallback();
    }
  }

  // ═══════════════════════════════════════════════════════
  //  EVENT HANDLERS
  // ═══════════════════════════════════════════════════════

  function handleOverlayClick(e) {
    // Left-click an evo-path node (e.g. weapon selector's evo chain) → open its detail page.
    const evoEl = e.target.closest('[data-evo-item]');
    if (evoEl) { openRef(resolveRef(evoEl.dataset.evoItem), state.overlay?.playerIdx ?? 0); return; }
    const btn = e.target.closest('[data-action]');
    if (!btn) {
      if (e.target === document.getElementById('overlay-root')) {
        if (state.puActive) closePowerUpOverlay();
        else if (state.seal.active) closeSealOverlay();
        else if (state.collection.active) closeCollectionOverlay();
        else if (state.builds.active) closeBuildsOverlay();
        else closeOverlay(false);
      }
      return;
    }
    e.stopPropagation();
    const action = btn.dataset.action;

    // Detail overlay access from a selector's right info panel — stacks the detail overlay
    // ABOVE this selector. Covers the info-"i"/affinity banners AND the arcana affects icons
    // (nav-*). Add-to-build target = the selector's player.
    if (action === 'open-object-page' || action === 'open-affinity-page'
        || action === 'nav-object' || action === 'nav-affinity') {
      openDetailFromEl(btn, state.overlay?.playerIdx ?? 0);
      return;
    }

    // ── Power-up overlay actions ──
    if (action === 'pu-close') { closePowerUpOverlay(); return; }
    if (action === 'pu-disable-all') {
      D.stats.forEach(s => { state.powerUps[s.name] = 0; });
      renderPowerUpOverlay(); return;
    }
    if (action === 'pu-max-all') {
      D.stats.forEach(s => { state.powerUps[s.name] = s.max_level; });
      renderPowerUpOverlay(); return;
    }
    if (action === 'pu-level') {
      const statName = btn.dataset.stat;
      const delta    = parseInt(btn.dataset.delta);
      const stat     = D.stats.find(s => s.name === statName);
      if (!stat) return;
      const cur  = state.powerUps[statName] ?? stat.max_level;
      const next = Math.max(0, Math.min(stat.max_level, cur + delta));
      state.powerUps[statName] = next;
      // patch DOM in-place instead of full re-render
      const id = 'pu-lv-' + statName.replace(/\W+/g, '_');
      const lbl = document.getElementById(id);
      if (lbl) lbl.textContent = `${next}/${stat.max_level}`;
      const row  = btn.closest('.pu-row');
      const btns = row?.querySelectorAll('[data-action="pu-level"]');
      if (btns) {
        btns[0].disabled = next <= 0;
        btns[1].disabled = next >= stat.max_level;
      }
      return;
    }

    // ── Collection overlay actions ──
    if (action === 'collection-close') { closeCollectionOverlay(); return; }
    if (action === 'collection-tab') {
      state.collection.tab = btn.dataset.tab;
      renderCollectionOverlay(); return;
    }
    if (action === 'collection-toggle') {
      const kind = btn.dataset.kind, name = btn.dataset.name;
      const set = state.collection.unowned[kind];
      if (set.has(name)) set.delete(name); else set.add(name);
      saveCollection();
      refreshCollectionGrid(); return;
    }
    if (action === 'collection-mark-all') {
      const owned = btn.dataset.owned === '1';
      const tab = state.collection.tab;
      const apply = (kind, names) => {
        const set = state.collection.unowned[kind];
        if (owned) names.forEach(n => set.delete(n));
        else       names.forEach(n => set.add(n));
      };
      if (tab === 'characters') apply('characters', D.characters.map(c => c.name));
      else if (tab === 'arcana') apply('arcana', D.arcana.filter(a => a.type === 'Arcana').map(a => a.name));
      else { // wp — only atoms (base weapons + passives)
        apply('weapons',  D.weapons.filter(w => w.category === 'Base').map(w => w.name));
        apply('passives', D.passives.map(p => p.name));
      }
      saveCollection();
      refreshCollectionGrid(); return;
    }

    // ── Builds overlay actions ──
    if (action === 'builds-close') { closeBuildsOverlay(); return; }
    if (action === 'load-build') {
      const idx = parseInt(btn.dataset.idx);
      const list = btn.dataset.source === 'user' ? state.builds.user : (window.VS_BUILDS || []);
      const build = list[idx];
      if (!build) { showToast('Build not found', 'warn'); return; }
      // Surface legality problems (featured builds are pre-validated at bundle time; this is a
      // safety net). Load proceeds — applyBuild self-heals — but the user is told what's off.
      const { errors } = validateBuildLegality(build);
      closeBuildsOverlay();
      applyBuild(build);
      if (errors.length) showToast(`Loaded with ${errors.length} rule issue(s): ${errors[0]}`, 'warn');
      return;
    }
    if (action === 'save-build') {
      const scopeChar = state.builds.charScope;
      const defaultName = scopeChar ? `${scopeChar} build` : 'My Build';
      const name = window.prompt('Name this build:', defaultName);
      if (name == null) return; // cancelled
      // Light "why did I pick this" note — freeform, shown under the build name.
      const notes = window.prompt('Why this build? (optional notes on your picks)', '') || '';
      const build = captureBuild({ name: name.trim() || defaultName, notes: notes.trim(), author: '' });
      state.builds.user.push(build);
      saveBuilds();
      renderBuildsOverlay();
      showToast(`Saved "${build.name}"`, 'ok');
      return;
    }
    if (action === 'rename-build') {
      const idx = parseInt(btn.dataset.idx);
      const build = state.builds.user[idx];
      if (!build) return;
      const name = window.prompt('Rename build:', build.name || '');
      if (name == null) return;
      build.name = name.trim() || build.name;
      saveBuilds();
      renderBuildsOverlay();
      return;
    }
    if (action === 'delete-build') {
      const idx = parseInt(btn.dataset.idx);
      const build = state.builds.user[idx];
      if (!build) return;
      if (!window.confirm(`Delete "${build.name}"? This can't be undone.`)) return;
      state.builds.user.splice(idx, 1);
      saveBuilds();
      renderBuildsOverlay();
      return;
    }
    if (action === 'export-build') {
      const idx = parseInt(btn.dataset.idx);
      const list = btn.dataset.source === 'user' ? state.builds.user : (window.VS_BUILDS || []);
      const build = list[idx];
      if (!build) return;
      copyToClipboard(JSON.stringify(build, null, 2), `Copied "${build.name}" JSON to clipboard`);
      return;
    }
    if (action === 'import-build') {
      const raw = window.prompt('Paste build JSON:');
      if (raw == null || !raw.trim()) return;
      let obj;
      try { obj = JSON.parse(raw); }
      catch (e) { showToast('Invalid JSON', 'warn'); return; }
      if (!obj || obj.schema !== BUILD_SCHEMA || !Array.isArray(obj.players)) {
        showToast('Not a valid build', 'warn'); return;
      }
      // Enforce the same legality rules as the planner — reject an illegal import outright so an
      // erroneous build (missing requirements, wrong-stage Academy Badge, dupes, …) can't get in.
      const { errors, warnings } = validateBuildLegality(obj);
      if (errors.length) {
        window.alert('Cannot import — this build breaks game rules:\n\n• ' + errors.join('\n• '));
        return;
      }
      if (warnings.length) showToast(`Imported with ${warnings.length} warning(s): ${warnings[0]}`, 'warn');
      state.builds.user.push(obj);
      saveBuilds();
      renderBuildsOverlay();
      if (!warnings.length) showToast(`Imported "${obj.name || 'build'}"`, 'ok');
      return;
    }

    // ── Seal overlay actions ──
    if (action === 'seal-close') { closeSealOverlay(); return; }
    if (action === 'seal-toggle') {
      const name = btn.dataset.name;
      if (state.seal.selected.has(name)) state.seal.selected.delete(name);
      else state.seal.selected.add(name);
      btn.classList.toggle('sealed', state.seal.selected.has(name));
      return;
    }
    if (action === 'seal-recommend') {
      const { blockedByArcana } = applySealRecommend();
      renderSealOverlay();
      if (blockedByArcana) showToast(`Passives left unsealed — ${blockedByArcana} grants passives outside the pool`, 'warn');
      return;
    }
    if (action === 'seal-clear') {
      state.seal.selected.clear();
      renderSealOverlay();
      return;
    }

    if (action === 'ovl-close') { closeOverlay(false); return; }
    if (action === 'ovl-confirm') { closeOverlay(true); return; }
    if (action === 'ovl-search-clear') {
      const input = e.target.closest('.ovl-search-wrap')?.querySelector('.ovl-search');
      if (input) { input.value = ''; state.ovl.search = ''; applyOverlaySearch(input); input.focus(); }
      return;
    }
    if (action === 'level-clear') {
      state.players[parseInt(btn.dataset.player ?? '0')].charLevel = 1;
      refreshOverlay(); return;
    }

    if (action === 'ovl-select-char') {
      const name = btn.dataset.char;
      state.ovl.selected = D.characters.find(c => c.name === name) || null;
      refreshOverlay(); return;
    }
    if (action === 'cycle-char-variant') {
      const base = btn.dataset.base;
      const groups = charGroups();
      const grp = groups.find(g => g[0].base_name === base) || [];
      const cur = state.ovl.variantIdx[base] ?? 0;
      const dir = parseInt(btn.dataset.dir) || 1;
      state.ovl.variantIdx[base] = (cur + dir + grp.length) % grp.length;
      // The collection overlay reuses the variant stacks but isn't a standard selector,
      // so refresh its grid rather than refreshOverlay (which needs state.overlay).
      if (state.collection.active) refreshCollectionGrid(); else refreshOverlay();
      return;
    }

    if (action === 'ovl-select-item') {
      const name = btn.dataset.item;
      const itemType = btn.dataset.itemType;
      if (itemType === 'passive') state.ovl.selected = D.passives.find(p => p.name === name) || null;
      else                        state.ovl.selected = D.weapons.find(w => w.name === name) || null;
      state.ovl.autoAdd = null; // reset to computed default for new selection
      refreshOverlay(); return;
    }
    if (action === 'toggle-auto-add') {
      const ovCtx = state.overlay;
      const { pending, missing } = getEvolutionPassiveStatus(
        D.weapons.find(w => w.name === state.ovl.selected?.name) || {},
        ovCtx.playerIdx
      );
      const current = state.ovl.autoAdd ?? (pending.length > 0);
      state.ovl.autoAdd = !current;
      refreshOverlay(); return;
    }

    if (action === 'ovl-select-arcana') {
      const name = btn.dataset.arcana;
      state.ovl.selected = D.arcana.find(a => a.name === name) || null;
      refreshOverlay(); return;
    }
    if (action === 'arcana-tab-toggle') {
      state.ovl.arcanaTab = state.ovl.arcanaTab === 'arcana' ? 'darkana' : 'arcana';
      state.ovl.selected = null;
      refreshOverlay(); return;
    }

    if (action === 'ovl-select-stage') {
      const name = btn.dataset.stage;
      state.ovl.selected = STAGES.find(s => s.name === name) || null;
      refreshOverlay(); return;
    }
  }

  // Touch/no-hover devices show the corner remove × permanently (no hover to reveal it on demand),
  // which makes accidental removal easy. `armedRemoveEl` tracks a × awaiting its confirm tap.
  const NO_HOVER = window.matchMedia('(hover: none)');
  let armedRemoveEl = null, armRemoveTimer = null;
  function disarmRemove() {
    if (armRemoveTimer) { clearTimeout(armRemoveTimer); armRemoveTimer = null; }
    if (armedRemoveEl) { armedRemoveEl.classList.remove('armed'); armedRemoveEl = null; }
  }

  function handleAppClick(e) {
    // Left-click an evo-path node (info panel) → open that object's detail page. (Right-click
    // still quick-adds via handleAppContextMenu — untouched.) Nodes carry data-evo-item, not
    // data-action, so this must run before the data-action lookup.
    const evoEl = e.target.closest('[data-evo-item]');
    if (evoEl) { openRef(resolveRef(evoEl.dataset.evoItem), state.infoPanel?.playerIdx ?? 0); return; }
    const btn = e.target.closest('[data-action]');
    if (!btn) { if (NO_HOVER.matches) disarmRemove(); return; }

    // Two-tap confirm for the tiny corner remove (×) on touch/no-hover devices, where it can't be
    // hover-gated and so is easy to fat-finger. First tap arms it (turns red); a second tap on the
    // SAME × removes; any other tap disarms. Desktop (has hover) is unaffected.
    if (NO_HOVER.matches) {
      const remBtn = btn.classList.contains('slot-remove') ? btn : null;
      if (remBtn && armedRemoveEl !== remBtn) {
        e.preventDefault(); e.stopPropagation();
        disarmRemove();
        armedRemoveEl = remBtn; remBtn.classList.add('armed');
        armRemoveTimer = setTimeout(disarmRemove, 3000);
        return;
      }
      disarmRemove(); // 2nd tap on the armed × falls through to remove; other taps just clear it
    }
    const action = btn.dataset.action;
    const playerIdx = parseInt(btn.dataset.player ?? '0');
    const slotIdx   = parseInt(btn.dataset.slot   ?? '0');
    const slotType  = btn.dataset.type;

    if (action === 'set-player-count') {
      const n = parseInt(btn.dataset.count);
      state.playerCount = n;
      state.players = initPlayers(n, state.players);
      state.page = 'planning';
      render();
      return;
    }
    if (action === 'open-power-ups') {
      renderPowerUpOverlay();
      return;
    }
    if (action === 'open-seal') {
      renderSealOverlay();
      return;
    }
    if (action === 'open-collection') {
      renderCollectionOverlay();
      return;
    }
    if (action === 'open-builds') {
      renderBuildsOverlay(null); // global view — clear any character scope
      return;
    }
    if (action === 'open-player-builds') {
      const char = state.players[playerIdx]?.character;
      renderBuildsOverlay(char ? char.name : null);
      return;
    }
    if (action === 'open-appendix') {
      openDetailPage({ kind: 'appendix' }, 0);
      return;
    }
    if (action === 'open-player-page') {
      openDetailPage({ kind: 'player', playerIdx }, playerIdx);
      return;
    }
    if (action === 'stage-add') {
      // Add a stage item straight from the stage info panel — routes through evoQuickAdd, so
      // it inherits every guard rail (already-equipped, consumed pool, one-per-build, stage
      // gating) and lands in a free transient slot like any other stage pickup.
      evoQuickAdd(btn.dataset.stageItem, playerIdx);
      return;
    }
    if (action === 'change-player-count') {
      state.page = 'landing';
      render();
      return;
    }
    if (action === 'clear-player') {
      state.players[playerIdx] = makePlayer();
      if (state.infoPanel?.playerIdx === playerIdx) state.infoPanel = null;
      render();
      return;
    }
    if (action === 'level-clear') {
      state.players[playerIdx].charLevel = 1;
      render();
      return;
    }
    if (action === 'remove-slot') {
      e.stopPropagation();
      const p = state.players[playerIdx];
      // Gift slots (Turbo/Arma): removing destroys the extra slot and frees the gift for
      // reuse — never leaves an empty slot behind.
      if (btn.dataset.gift === 'weapon')  { p.giftWeapon = null; state.infoPanel = null; render(); return; }
      if (btn.dataset.gift === 'passive') { p.giftPassive = null; state.infoPanel = null; render(); return; }
      if (slotType === 'char')    { p.character = null; autoDevolveBrokenEvos(); }
      else if (slotType === 'weapon')  {
        const removed = p.weapons[slotIdx];
        // Free-pick STARTER slot (e.g. Soma Cruz's Candybox): once a weapon was picked from
        // its pool the slot unlocked, but deleting that weapon must RESTORE the original
        // free-pick starter (re-locks), not leave the slot empty.
        const starters = starterWeaponNames(p.character);
        const starterName = slotIdx < starters.length ? starters[slotIdx] : null;
        if (starterName && isFreePick(starterName)) {
          p.weapons[slotIdx] = weaponByName(starterName);
        } else {
          p.weapons[slotIdx] = null;
          // Removing an absorb-union restores its hidden weapons to real slots rather than
          // silently dropping them (mirrors devolve).
          if (removed && isAbsorbUnion(removed.name)) releaseAbsorbed(p, removed.name);
        }
      }
      else if (slotType === 'passive') { p.passives[slotIdx] = null; autoDevolveBrokenEvos(); }
      else if (slotType === 'arcana')  state.arcana[slotIdx] = null;
      else if (slotType === 'stage')   { state.stage = null; state.players.forEach(syncStageSlots); autoDevolveBrokenEvos(); }
      state.infoPanel = null;
      render();
      return;
    }
    if (action === 'remove-familiar') {
      e.stopPropagation();
      const p = state.players[playerIdx];
      const fi = parseInt(btn.dataset.famIdx);
      if (p.familiars && fi >= 0) p.familiars.splice(fi, 1);
      // syncFamiliarStarter (per-render) restores the Familiar Forge starter when none remain.
      state.infoPanel = null;
      render();
      return;
    }
    if (action === 'view-slot') {
      const refName = btn.dataset.infoName || null;
      state.infoPanel = { type: slotType, playerIdx, slotIdx, refName, gift: btn.dataset.gift || null };
      render();
      return;
    }
    if (action === 'open-freepick') {
      const rawTarget = btn.dataset.target;
      const target = (rawTarget === 'giftWeapon' || rawTarget === 'giftPassive') ? rawTarget : parseInt(rawTarget);
      openFreePickOverlay(playerIdx, slotIdx, btn.dataset.source, target);
      return;
    }
    if (action === 'view-hidden') {
      state.infoPanel = { type: 'weapon', playerIdx, slotIdx: -1, hiddenName: btn.dataset.hiddenName };
      render();
      return;
    }
    if (action === 'view-absorbed') {
      state.infoPanel = { type: 'weapon', playerIdx, slotIdx: -1,
        absorbedResult: btn.dataset.absorbedResult, absorbedIdx: +btn.dataset.absorbedIdx };
      render();
      return;
    }
    if (action === 'view-extra-passive') {
      state.infoPanel = { type: 'passive', playerIdx, slotIdx: -1, refName: btn.dataset.extraName };
      render();
      return;
    }
    // Detail overlay access from the planner info panel — the add-to-build target is that
    // panel's player. (Handled here for #app; selector panels route via handleOverlayClick.)
    if (action === 'open-object-page' || action === 'open-affinity-page') {
      openDetailFromEl(btn, state.infoPanel?.playerIdx ?? 0);
      return;
    }
    if (action === 'remove-extra-passive') {
      e.stopPropagation();
      const p = state.players[playerIdx];
      const i = p.extraPassives.indexOf(btn.dataset.extraName); // remove ONE instance
      if (i >= 0) p.extraPassives.splice(i, 1);
      // Removing a shared requirement (Outer Saboteur / Mini) can break other evolutions;
      // syncExtraPassives handles Weapon Power-Up's 1:1 devolve, autoDevolve the rest.
      autoDevolveBrokenEvos();
      syncExtraPassives(p);
      state.infoPanel = null;
      render();
      return;
    }
    if (action === 'perform-evolve') {
      const resultW = weaponByName(btn.dataset.result);
      if (resultW) {
        const p = state.players[playerIdx];
        p.weapons[slotIdx] = resultW;
        // Back the evolved weapon with any extra-bar passive it requires (capped).
        for (const pname of collectChainPassives(collectWeaponChain(resultW.name))) {
          if (isExtraPassive(pname) && extraCount(p, pname) < extraCap(p, pname)) p.extraPassives.push(pname);
        }
        syncExtraPassives(p);
        state.infoPanel = { type: 'weapon', playerIdx, slotIdx };
      }
      render();
      return;
    }
    if (action === 'perform-union') {
      const inputSlots = (btn.dataset.inputSlots || '').split(',').map(Number);
      const resultW = weaponByName(btn.dataset.result);
      const player = state.players[playerIdx];
      const counts = SLOT_COUNTS[state.playerCount];
      if (resultW && inputSlots.length) {
        if (isAbsorbUnion(resultW.name)) {
          // Absorb-unions HIDE their inputs (they move to the Hidden row) rather than
          // consuming them. placeAbsorbUnion computes the exact hidden set (Clock Tower's
          // 4 bases; Alucard Shield's 5 OTHER non-base weapons, excluding Alucard Swords).
          placeAbsorbUnion(player, resultW, inputSlots[0], counts);
        } else {
          inputSlots.forEach((si, i) => { player.weapons[si] = i === 0 ? resultW : null; });
        }
        state.infoPanel = { type: 'weapon', playerIdx, slotIdx: inputSlots[0] };
      }
      render();
      return;
    }
    if (action === 'perform-devolve') {
      const player = state.players[playerIdx];
      // Converted Turbo gift weapon: devolving destroys the gift slot and frees the Turbo —
      // it does NOT devolve to a base form.
      if (btn.dataset.gift === 'weapon') { player.giftWeapon = null; state.infoPanel = null; render(); return; }
      const current = player.weapons[slotIdx];
      if (current && isAbsorbUnion(current.name)) {
        // Absorb-union devolve: restore the hidden set to real slots. If the data-base
        // isn't itself part of the absorbed set, it devolves into the slot (Alucard
        // Shield → Alucard Swords); Clock Tower's bases ARE its absorbed inputs, so the
        // slot is left empty for releaseAbsorbed to refill with one of them.
        const absorbedNames = player.absorbed?.[current.name] || [];
        const bases = D.weapons.filter(b => b.trans_result === current.name);
        player.weapons[slotIdx] = (bases.length && !absorbedNames.includes(bases[0].name)) ? bases[0] : null;
        releaseAbsorbed(player, current.name);
        state.infoPanel = { type: 'weapon', playerIdx, slotIdx };
        render();
        return;
      }
      if (current) {
        const counts = SLOT_COUNTS[state.playerCount];
        // All weapons that produced the current weapon (one for evo, two+ for union)
        const bases = D.weapons.filter(b => b.trans_result === current.name);
        if (bases.length) {
          // Primary base reclaims the current slot
          player.weapons[slotIdx] = bases[0];
          // Remaining union partners are restored to the first available empty slot,
          // skipping any that are already present (guards against duplicate slots).
          for (let i = 1; i < bases.length; i++) {
            if (player.weapons.some(w => w && w.name === bases[i].name)) continue;
            let emptySlot = -1;
            for (let j = 0; j < counts.weapons; j++) {
              if (!player.weapons[j]) { emptySlot = j; break; }
            }
            if (emptySlot >= 0) player.weapons[emptySlot] = bases[i];
          }
          state.infoPanel = { type: 'weapon', playerIdx, slotIdx };
        }
      }
      render();
      return;
    }
    if (action === 'perform-absorbed-advance') {
      const result = btn.dataset.absorbedResult;
      const idx = +btn.dataset.absorbedIdx;
      const player = state.players[playerIdx];
      advanceAbsorbed(player, result, idx);
      state.infoPanel = { type: 'weapon', playerIdx, slotIdx: -1, absorbedResult: result, absorbedIdx: idx };
      render();
      return;
    }
    if (action === 'perform-absorbed-devolve') {
      const result = btn.dataset.absorbedResult;
      const idx = +btn.dataset.absorbedIdx;
      const player = state.players[playerIdx];
      const arr = player.absorbed?.[result];
      if (arr && arr[idx]) {
        const cur = weaponByName(arr[idx]);
        const bases = D.weapons.filter(b => b.trans_result === cur.name);
        if (bases.length) {
          arr[idx] = bases[0].name; // devolve to primary base (union partners not restored)
          // May have broken Alucard Shield's 5-evolved condition — swap or devolve the Shield.
          reconcileAbsorbShield(player);
        }
        // The absorbed slot may have moved/vanished after reconcile — drop the panel focus.
        state.infoPanel = null;
      }
      render();
      return;
    }
    if (action === 'open-slot') {
      openSlotOverlay(slotType, playerIdx, slotIdx);
      return;
    }
  }

  function openSlotOverlay(slotType, playerIdx, slotIdx) {
    if (slotType === 'char')    { openCharacterOverlay(playerIdx); return; }
    if (slotType === 'weapon')  { openWeaponOverlay(playerIdx, slotIdx); return; }
    if (slotType === 'passive') { openPassiveOverlay(playerIdx, slotIdx); return; }
    if (slotType === 'arcana')  { openArcanaOverlay(slotIdx); return; }
    if (slotType === 'stage')   { openStageOverlay(); return; }
  }

  function showToast(msg, kind = 'ok') {
    document.querySelectorAll('.evo-toast').forEach(t => t.remove());
    const el = document.createElement('div');
    el.className = `evo-toast ${kind}`;
    el.textContent = msg;
    document.body.appendChild(el);
    setTimeout(() => el.remove(), 2100);
  }

  // Collect all missing base weapons + passives needed to make weaponName achievable.
  // Handles unions recursively (their requirements are themselves evo weapons).
  // Collect all weapon names in the full chain reaching targetName by following
  // trans_result backward (bases that evolve/union into the target, recursively).
  // We deliberately do NOT recurse into w.requirements weapon entries — those are
  // union partners already reachable via trans_result, and recursing into them
  // from the partner's side incorrectly inflates unrelated branches (e.g. Vento
  // Sacro's partner Bloody Tear would pull Whip into Vento Sacro's chain).
  function collectWeaponChain(targetName, visited = new Set()) {
    if (visited.has(targetName)) return visited;
    visited.add(targetName);
    D.weapons.filter(b => b.trans_result === targetName)
      .forEach(b => collectWeaponChain(b.name, visited));
    return visited;
  }

  // Walk forward from targetName via trans_result to collect all future forms.
  // Used to block forward-evo weapons in the selector when a base is already equipped.
  function collectDescendants(targetName, visited = new Set()) {
    if (visited.has(targetName)) return visited;
    visited.add(targetName);
    const w = D.weapons.find(x => x.name === targetName);
    if (!w || !w.trans_result) return visited;
    collectDescendants(w.trans_result, visited);
    return visited;
  }

  // Like collectDescendants, but STOPS at a Union step. Union results require an
  // external partner from another slot, so they must stay selectable from that
  // partner's slot — only the purely-linear (Evolution) forms are locked to a
  // starter's own slot and should be blocked elsewhere.
  function collectLinearDescendants(targetName, visited = new Set()) {
    if (visited.has(targetName)) return visited;
    visited.add(targetName);
    const w = D.weapons.find(x => x.name === targetName);
    if (!w || !w.trans_result || w.method === 'Union') return visited;
    collectLinearDescendants(w.trans_result, visited);
    return visited;
  }

  // Return all passive names required by any weapon in the given chain set.
  function collectChainPassives(chain) {
    const passives = new Set();
    chain.forEach(wname => {
      const w = D.weapons.find(x => x.name === wname);
      if (!w) return;
      (w.requirements || []).forEach(req => {
        if (D.passives.find(p => p.name === req)) passives.add(req);
      });
    });
    return passives;
  }

  // Return the Set of weapon names consumed across ALL players (drop pool is shared).
  // excludePlayerIdx + excludeSlotIdx: omit one slot from the computation — used when
  // the weapon overlay is open so the slot being replaced doesn't block its own weapon.
  //
  // Starter-evolved exception: if a character starts with an evolved weapon (e.g. Minnah
  // starts with Bloody Tear), the upstream bases (Whip) were never pulled from the drop
  // pool. If that starter evo was itself later consumed into a union, the starter-evolved
  // weapon can also be re-produced from scratch.
  function getConsumedWeapons(excludePlayerIdx = -1, excludeSlotIdx = -1) {
    const consumed          = new Set();
    const starterEvolvedBases = new Set(); // upstream bases exempt from consumed
    const starterEvolvedSelf  = new Set(); // the starter evo weapon itself (re-producible)
    const allEquipped         = new Set(); // all weapon names in any slot, any player

    state.players.forEach((player, pidx) => {
      const char = player.character;
      const hiddenSet         = new Set(char?.hidden_items ?? []);
      const nonHiddenStarters = new Set((char?.starting_weapons ?? []).filter(sw => !hiddenSet.has(sw)));

      // Accumulate starter-evolved exceptions for this player's character.
      nonHiddenStarters.forEach(sw => {
        if (D.weapons.some(b => b.trans_result === sw)) {
          collectWeaponChain(sw).forEach(name => { if (name !== sw) starterEvolvedBases.add(name); });
          starterEvolvedSelf.add(sw);
        }
      });

      // Add every equipped weapon's full chain to consumed.
      player.weapons.forEach((w, sidx) => {
        if (!w) return;
        if (pidx === excludePlayerIdx && sidx === excludeSlotIdx) return;
        collectWeaponChain(w.name).forEach(name => consumed.add(name));
        allEquipped.add(w.name);
      });

      // Absorbed (hidden) weapons are equipped-but-hidden — they and their full backward
      // chains are out of the shared pool just like real slots (Clock Tower's clockwork
      // bases, Alucard Shield's 5 consumed evolutions and everything they were built from).
      Object.values(player.absorbed || {}).flat().forEach(nm => {
        collectWeaponChain(nm).forEach(name => consumed.add(name));
        allEquipped.add(nm);
      });
    });

    // Un-consume upstream bases of starter-evolved weapons (they were never picked up).
    starterEvolvedBases.forEach(name => {
      if (!allEquipped.has(name)) consumed.delete(name);
    });

    // Un-consume the starter-evolved weapon itself if no player currently has it equipped
    // (it was consumed into a union, so it can be re-produced from its freed prerequisites).
    starterEvolvedSelf.forEach(sw => {
      if (!allEquipped.has(sw)) consumed.delete(sw);
    });

    return consumed;
  }

  function evoQuickAdd(name, playerIdx) {
    const player = state.players[playerIdx];
    const counts = SLOT_COUNTS[state.playerCount];

    // ── Arcana ──
    const arcanaObj = D.arcana.find(a => a.name === name);
    if (arcanaObj) {
      if (collectionEnabled() && !arcanaAccessibleByAny(name)) { showToast(`${name} is not in your collection`, 'err'); return; }
      if (state.arcana.some(a => a?.name === name) || extraArcanaNames().includes(name)) { showToast(`${name} already in build`, 'warn'); return; }
      const slot = state.arcana.findIndex(a => !a);
      if (slot < 0) { showToast('No arcana slots available', 'err'); return; }
      state.arcana[slot] = arcanaObj;
      showToast(`Added ${name}`); render(); return;
    }

    // ── Passive ──
    const passiveObj = D.passives.find(p => p.name === name);
    if (passiveObj) {
      if (collectionEnabled() && !passiveAccessible(name)) { showToast(`${name} is not in your collection`, 'err'); return; }
      if (isExtraPassive(name)) {
        // Extra-bar passive (no core slot), capped by its enabling weapons.
        if (extraCap(player, name) === 0) { showToast(`${name} needs a matching weapon`, 'warn'); return; }
        if (extraCount(player, name) >= extraCap(player, name)) { showToast(`${name} already at max`, 'warn'); return; }
        player.extraPassives.push(name);
        syncExtraPassives(player);
        showToast(`Added ${name}`); render(); return;
      }
      if (player.passives.some(p => p?.name === name)) { showToast(`${name} already equipped`, 'warn'); return; }
      // Stage-exclusive / stage-supplied passive → free transient slot (gate + one-per-build).
      if (STAGE_EXCLUSIVE_PASSIVES.has(name) || itemProvidedFree(name, player)) {
        if (STAGE_EXCLUSIVE_PASSIVES.has(name) && !stageItemGateOpen(player, name)) { showToast(`${name} isn't available here`, 'warn'); return; }
        if (anyPlayerOwnsPassive(name)) { showToast(`${name} already in build`, 'warn'); return; }
        placeTransientItem(player, 'passive', passiveObj);
        showToast(`Added ${name}`); render(); return;
      }
      let slot = -1;
      for (let i = 0; i < counts.passives; i++) { if (!player.passives[i]) { slot = i; break; } }
      if (slot < 0) { showToast(`No room for ${name}`, 'err'); return; }
      player.passives[slot] = passiveObj;
      showToast(`Added ${name}`); render(); return;
    }

    // ── Weapon ──
    // Right-click = "I want this weapon in my final build."
    // Find the chain of all weapons needed to produce it (bases + union partners),
    // then reuse any equipped chain weapon's slot for the target. Only add passives
    // as extra slots — transient weapons in the chain are never added separately.
    const weaponObj = D.weapons.find(w => w.name === name);
    if (!weaponObj) { showToast(`${name} not found`, 'err'); return; }
    if (collectionEnabled() && !weaponAccessible(name)) { showToast(`${name} is not in your collection`, 'err'); return; }

    // Chaos-morph finals are character-gated — can't quick-add (or right-click into) them
    // unless the player is the mapped character.
    const cInfo = chaosBlocked(name, player);
    if (cInfo) { showToast(`${name} needs ${cInfo.character}`, 'warn'); return; }

    // Stage-gated evolutions (Infinite Corridor, Crimson Shroud) need their stage-exclusive
    // ring/metaglio to be obtainable on the selected stage.
    const sInfo = stageBlockedWeapon(name, player);
    if (sInfo) { showToast(`${name} needs ${sInfo.missing.join(' + ')} — not on this stage`, 'warn'); return; }

    const equippedW = new Set(player.weapons.filter(Boolean).map(w => w.name));
    // Cross-player evo: a passive equipped by any player satisfies the condition.
    const equippedP = new Set(
      state.players.flatMap(p => p.passives.filter(Boolean).map(p => p.name))
    );

    if (equippedW.has(name)) { showToast(`${name} already in build`, 'warn'); return; }

    // Free stage-pickup weapon → appended transient slot (fully evolvable in place); auto-add
    // its required passives (each routed: stage item → transient, else core).
    if (itemProvidedFree(name, player) && !isFreePick(name)) {
      if (anyPlayerOwnsWeapon(name)) { showToast(`${name} already in build`, 'warn'); return; }
      placeTransientItem(player, 'weapon', weaponObj);
      for (const pname of collectChainPassives(collectWeaponChain(name))) {
        if (isExtraPassive(pname)) { if (extraCount(player, pname) < extraCap(player, pname)) player.extraPassives.push(pname); continue; }
        addRequiredPassive(player, pname);
      }
      syncExtraPassives(player);
      showToast(`Added ${name}`); render(); return;
    }

    // Check if this weapon is consumed in any player's evo chain (drop pool is shared).
    const consumed = getConsumedWeapons();
    if (consumed.has(name)) {
      let consumedBy = null;
      for (const p of state.players) {
        consumedBy = p.weapons.find(w => w && collectWeaponChain(w.name).has(name));
        if (consumedBy) break;
      }
      showToast(consumedBy ? `${name} consumed by ${consumedBy.name}` : `${name} already consumed`, 'err');
      return;
    }

    const chain = collectWeaponChain(name);
    const requiredPassives = collectChainPassives(chain);
    // Extra-bar passives are never slot passives — backed via the extra bar after placement.
    const missingPassives  = [...requiredPassives].filter(p => !isExtraPassive(p) && !equippedP.has(p));

    // Find anchor: first equipped weapon slot belonging to this chain
    let anchorSlot = -1;
    for (let i = 0; i < counts.weapons; i++) {
      const w = player.weapons[i];
      if (w && chain.has(w.name)) { anchorSlot = i; break; }
    }

    const added = [], failed = [];

    // Add missing passives (routed: a stage-supplied passive — e.g. Silver/Gold Ring for
    // Infinite Corridor — takes a free transient slot; others take a core slot).
    for (const pname of missingPassives) {
      if (addRequiredPassive(player, pname)) added.push(pname);
      else failed.push(pname);
    }

    // Place target weapon — replace anchor slot, or claim an empty slot
    if (anchorSlot >= 0) {
      player.weapons[anchorSlot] = weaponObj;
      added.unshift(name);
    } else {
      const char = player.character;
      const hiddenSet = new Set(char?.hidden_items ?? []);
      const starterCount = char
        ? Math.min(char.starting_weapons.filter(wn => !hiddenSet.has(wn)).length, counts.weapons)
        : 0;
      let slot = -1;
      for (let i = starterCount; i < counts.weapons; i++) { if (!player.weapons[i]) { slot = i; break; } }
      if (slot < 0) for (let i = 0; i < counts.weapons; i++) { if (!player.weapons[i]) { slot = i; break; } }
      if (slot >= 0) {
        player.weapons[slot] = weaponObj;
        added.unshift(name);
      } else {
        failed.unshift(name);
      }
    }

    // Consume other chain weapons already in player's slots (e.g. union partners
    // placed before the final form was committed via right-click).
    if (added.length && added[0] === name) {
      for (let i = 0; i < counts.weapons; i++) {
        const w = player.weapons[i];
        if (w && w.name !== name && chain.has(w.name)) {
          player.weapons[i] = null;
        }
      }
      // Back the weapon with any extra-bar passive it requires (extra bar, capped).
      for (const pname of requiredPassives) {
        if (isExtraPassive(pname) && extraCount(player, pname) < extraCap(player, pname)) {
          player.extraPassives.push(pname);
          added.push(pname);
        }
      }
    }
    syncExtraPassives(player);

    if (!added.length) {
      const label = failed.length === 1 ? failed[0] : failed.slice(0, 2).join(', ') + (failed.length > 2 ? '…' : '');
      showToast(`No room for ${label}`, 'err');
    } else {
      const [wAdded, ...pAdded] = added;
      let msg = `Added ${wAdded}`;
      if (pAdded.length === 1) msg += ` + ${pAdded[0]}`;
      else if (pAdded.length > 1) msg += ` + ${pAdded.length} passives`;
      if (failed.length) msg += ` — no room for ${failed.join(', ')}`;
      showToast(msg, failed.length ? 'warn' : 'ok');
    }
    render();
  }

  function handleAppContextMenu(e) {
    // Right-click on an evo path node → quick-add
    const evoEl = e.target.closest('[data-evo-item]');
    if (evoEl) {
      e.preventDefault();
      const panel = state.infoPanel;
      const playerIdx = panel?.playerIdx ?? 0;
      // When the panel is an editable absorbed (hidden) weapon, its evo path acts ON the
      // hidden weapon, not the shared pool: prior stages were consumed (blocked), later
      // stages advance the hidden weapon in place — never add a new weapon to a real slot.
      if (panel && panel.absorbedResult != null && panel.absorbedIdx != null) {
        handleAbsorbedEvoRightClick(panel, evoEl.dataset.evoItem);
        return;
      }
      evoQuickAdd(evoEl.dataset.evoItem, playerIdx);
      return;
    }
    // Right-click on a slot → open its overlay. Locked starter slots open the
    // locked-evo selector (openWeaponOverlay detects the locked-evo mode).
    const slot = e.target.closest('[data-action="view-slot"],[data-action="open-slot"]');
    if (!slot) return;
    e.preventDefault();
    const playerIdx = parseInt(slot.dataset.player ?? '0');
    const slotIdx   = parseInt(slot.dataset.slot   ?? '0');
    const slotType  = slot.dataset.type;
    // Derived/locked reference slots (e.g. extra starting arcana) use slotIdx -1 and
    // aren't backed by a pool entry — they're view-only, so don't open a change overlay.
    if (slotIdx < 0) return;
    const player = state.players[playerIdx];
    // Gift slots (Turbo/Arma): open the pool selector while still a free-pick chooser;
    // once converted to a real weapon/passive there's nothing to re-pick.
    const gift = slot.dataset.gift;
    if (gift) {
      const item = gift === 'passive' ? player.giftPassive : player.giftWeapon;
      if (item && isFreePick(item.name))
        openFreePickOverlay(playerIdx, slotIdx, item.name, gift === 'passive' ? 'giftPassive' : 'giftWeapon');
      return;
    }
    // Candybox-like weapon in a normal slot → pool selector (full grid, only pool undimmed).
    if (slotType === 'weapon') {
      const w = player.weapons[slotIdx];
      if (w && isFreePick(w.name)) { openFreePickOverlay(playerIdx, slotIdx, w.name, slotIdx); return; }
    }
    openSlotOverlay(slotType, playerIdx, slotIdx);
  }

  // ─── Keyboard ────────────────────────────────────────

  document.addEventListener('keydown', e => {
    if (e.key !== 'Escape') return;
    // The detail overlay is the topmost layer — close it first when open.
    if (state.detail.idx >= 0) { closeDetailOverlay(); return; }
    if (state.puActive) { closePowerUpOverlay(); return; }
    if (state.seal.active) { closeSealOverlay(); return; }
    if (state.collection.active) { closeCollectionOverlay(); return; }
    if (state.builds.active) { closeBuildsOverlay(); return; }
    if (!state.overlay) return;
    const { fromEmpty } = state.overlay;
    const hasSelection = !!state.ovl.selected;
    if (fromEmpty && hasSelection) closeOverlay(true);
    else closeOverlay(false);
  });

  // ═══════════════════════════════════════════════════════
  //  INIT
  // ═══════════════════════════════════════════════════════

  document.addEventListener('DOMContentLoaded', () => {
    if (!window.VS_DATA) {
      document.getElementById('app').innerHTML =
        '<div style="padding:2rem;text-align:center;color:#c01020;font-family:serif">' +
        '<h2>Data not found</h2><p>Run <code>node tools/build-data.mjs</code> first.</p></div>';
      return;
    }
    D = window.VS_DATA;
    STAGES = D.stages || [];
    D.stats.forEach(s => { state.powerUps[s.name] = s.max_level; });
    loadCollection();
    loadBuilds();
    render();
    // Bind once to persistent elements — survives innerHTML replacements
    document.getElementById('app').addEventListener('click', handleAppClick);
    document.getElementById('app').addEventListener('contextmenu', handleAppContextMenu);
    document.getElementById('app').addEventListener('change', e => {
      if (!e.target.classList.contains('level-input')) return;
      const playerIdx = parseInt(e.target.dataset.player ?? '0');
      const val = Math.max(1, Math.min(999, parseInt(e.target.value) || 1));
      const player = state.players[playerIdx];
      const prev = player.charLevel || 1;
      player.charLevel = val;
      if (prev < ACADEMY_LEVEL && val >= ACADEMY_LEVEL) autoGrantAcademyBadge(player);
      render();
    });
    const ovlRoot = document.getElementById('overlay-root');
    ovlRoot.addEventListener('click', handleOverlayClick);
    document.getElementById('detail-overlay-root').addEventListener('click', handleDetailClick);
    document.getElementById('detail-overlay-root').addEventListener('input', e => {
      if (e.target.classList.contains('appendix-search')) applyAppendixSearch(e.target);
      else if (e.target.classList.contains('aff-add-search')) {
        const q = e.target.value.trim().toLowerCase();
        const list = e.target.parentElement.querySelector('.aff-add-list');
        if (list) list.querySelectorAll('.aff-add-opt').forEach(o => { o.style.display = (!q || o.dataset.q.includes(q)) ? '' : 'none'; });
      }
    });
    ovlRoot.addEventListener('input', e => {
      if (e.target.id === 'seal-rarity-slider') {
        const rarities = e.target.dataset.rarities.split(',').map(Number);
        const val = rarities[parseInt(e.target.value)] ?? 0;
        state.seal.minRarity = val;
        const disp = document.getElementById('seal-rarity-val');
        if (disp) disp.textContent = val;
        return;
      }
      if (e.target.classList.contains('ovl-search')) {
        state.ovl.search = e.target.value;
        applyOverlaySearch(e.target);
      }
    });
    ovlRoot.addEventListener('change', e => {
      if (e.target.classList.contains('level-input')) {
        const playerIdx = parseInt(e.target.dataset.player ?? '0');
        const val = Math.max(1, Math.min(999, parseInt(e.target.value) || 1));
        const player = state.players[playerIdx];
        const prev = player.charLevel || 1;
        player.charLevel = val;
        if (prev < ACADEMY_LEVEL && val >= ACADEMY_LEVEL) autoGrantAcademyBadge(player);
        refreshOverlay();
        return;
      }
      if (e.target.id === 'collection-enable-chk') {
        state.collection.enabled = e.target.checked;
        saveCollection();
        renderCollectionOverlay();
        return;
      }
      if (e.target.id !== 'seal-passives-chk') return;
      state.seal.sealPassives = e.target.checked;
      renderSealOverlay();
    });
  });
  </script>
</body>
</html>
