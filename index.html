      .detail-left .detail-icon.char-sprite { height: 168px; }
      .detail-left .detail-name { font-size: 1.3rem; }
      .detail-main { overflow: visible; padding: 1rem 1.1rem; }
      .detail-info-grid { grid-template-columns: 1fr; }
      .xref-wrap { overflow-x: auto; -webkit-overflow-scrolling: touch; }

      /* Combo-trait picker popover fits the viewport */
      .aff-add-pop { width: min(88vw, 300px); }

      /* Keep the full 8-icon width on mobile (matches web) for the seal grid + collection W&P tab.
         The desktop rule's width:fit-content made `auto-fill` collapse to a single column; use fixed
         8 columns with fluid (1fr) tracks + fluid cells so all 8 always fit the phone width. */
      .seal-grid { grid-template-columns: repeat(8, 1fr); width: auto; margin: 0; }
      .seal-cell { width: 100%; height: auto; aspect-ratio: 1; }
      .seal-controls { gap: .45rem; }

      /* Builds rows: keep actions from squishing the name */
      .build-row { flex-wrap: wrap; }
      .build-row-actions { max-width: 100%; width: 100%; justify-content: flex-start; }
    }

    /* Very small phones: shave a bit more so 6 slots still wrap cleanly. */
    @media (max-width: 380px) {
      :root { --slot-size: 42px; }
      .planning-header-actions .btn { font-size: .72rem; padding: .28rem .4rem; }
      .detail-left .detail-icon { width: 108px; height: 108px; }
    }
  </style>
</head>
<body>
  <div id="app"></div>
  <div id="overlay-root" class="hidden"></div>
  <div id="detail-overlay-root" class="hidden"></div>

  <script src="data/data.js"></script>
  <script src="builds/builds.js"></script>
  <script src="builds/validate.js"></script>
  <script>
  // Featured builds bundle (builds/builds.js) is optional — default to empty if absent
  // (e.g. before the first `node tools/build-builds.mjs` run). See builds/SCHEMA.md.
  window.VS_BUILDS = window.VS_BUILDS || [];
  // ═══════════════════════════════════════════════════════
  //  CONSTANTS
  // ═══════════════════════════════════════════════════════

  const SLOT_COUNTS = {
    1: { weapons: 6, passives: 6 },
    2: { weapons: 4, passives: 4 },
    3: { weapons: 3, passives: 3 },
    4: { weapons: 2, passives: 2 },
  };

  const STAT_LABELS = {
    max_health: 'Max Health', recovery: 'Recovery',   armor: 'Armor',
    move_speed: 'Move Speed', might: 'Might',          speed: 'Proj. Speed',
    duration:   'Duration',   area: 'Area',             cooldown: 'Cooldown',
    amount:     'Amount',     revival: 'Revival',       magnet: 'Magnet',
    luck:       'Luck',       growth: 'Growth',         greed: 'Greed',
    curse:      'Curse',
  };

  // Stats expressed as percentage multipliers (0.4 → +40%)
  const PCT_STATS      = new Set(['move_speed','might','speed','duration','area','cooldown','luck','growth','greed','curse']);
  const INVERTED_STATS = new Set(['cooldown']); // negative is good

  const EMPTY_ICONS = {
    char:    'assets/icons/characters/empty.png',
    weapon:  'assets/icons/weapons/empty.png',
    passive: 'assets/icons/passives/empty.png',
    arcana:  'assets/icons/arcana/empty_arcana.png',
    stage:   'assets/icons/stages/empty.png',
  };
  const EMPTY_ICON = EMPTY_ICONS.passive;

  // Icons for special stage-item pickups that aren't weapons/passives in the data.
  const STAGE_ITEM_ICONS = {
    'Arcana Treasure Chest': 'assets/icons/weapons/arcana_treasure_chest.png',
  };

  // Stages come from D.stages (built from stages.csv); populated on load.
  let STAGES = [];

  // ═══════════════════════════════════════════════════════
  //  STATE
  // ═══════════════════════════════════════════════════════

  let D = null; // VS_DATA

  const state = {
    page: 'landing',
    playerCount: 1,
    players: [],
    arcana: [null, null, null], // global — shared across all players
    stage: null,                // global — shared across all players
    infoPanel: null,
    overlay: null,   // { type, playerIdx, slotIdx, slotType, fromEmpty, prevItem }
    ovl: {
      selected: null,
      variantIdx: {}, // baseName → idx (character variants)
      arcanaTab: 'arcana',
      autoAdd: null,  // null = use computed default; true/false = user override
      search: '',
    },
    puActive: false,
    powerUps: {}, // stat name → current level (initialized from D.stats on load)
    seal: {
      active: false,
      selected: new Set(),
      minRarity: 50,     // default: recommend weapons rarity >= 50
      sealPassives: false,
    },
    // Manage Collection: which items the user OWNS. Default assumes everything is owned
    // (current behavior) and gates nothing until `enabled` is turned on. We persist the
    // EXCEPTIONS (unowned) since the default is owned → tiny payload. When enabled, unowned
    // items are dimmed (never filtered) everywhere and cannot be committed to a tile.
    collection: {
      active: false,
      enabled: false,
      tab: 'wp',   // 'wp' | 'characters' | 'arcana'
      unowned: { weapons: new Set(), passives: new Set(), characters: new Set(), arcana: new Set() },
    },
    // Detailed Info Overlay: a STACKING layer (renders over the selector overlay) with its own
    // back/forward history. Each page = { kind:'object'|'affinity', type, name }. `player` is the
    // add-to-build target (the active info panel's player when opened from a panel, else 0).
    detail: { stack: [], idx: -1, player: 0, appendixQuery: '', appendixTraits: [] },
    // Build loadouts overlay. `user` = localStorage-backed builds (vsbc.builds); featured
    // builds live in window.VS_BUILDS. See captureBuild/applyBuild and builds/SCHEMA.md.
    builds: { active: false, user: [], charScope: null },
  };

  // ── Collection persistence (localStorage; first persisted state in the app) ──
  const COLLECTION_STORAGE_KEY = 'vsbc.collection';
  function saveCollection() {
    try {
      const u = state.collection.unowned;
      localStorage.setItem(COLLECTION_STORAGE_KEY, JSON.stringify({
        enabled: state.collection.enabled,
        unowned: {
          weapons:    [...u.weapons],
          passives:   [...u.passives],
          characters: [...u.characters],
          arcana:     [...u.arcana],
        },
      }));
    } catch (e) { /* file:// or private mode — persistence just no-ops */ }
  }
  function loadCollection() {
    try {
      const raw = localStorage.getItem(COLLECTION_STORAGE_KEY);
      if (!raw) return;
      const data = JSON.parse(raw);
      state.collection.enabled = !!data.enabled;
      const u = data.unowned || {};
      state.collection.unowned = {
        weapons:    new Set(Array.isArray(u.weapons)    ? u.weapons    : []),
        passives:   new Set(Array.isArray(u.passives)   ? u.passives   : []),
        characters: new Set(Array.isArray(u.characters) ? u.characters : []),
        arcana:     new Set(Array.isArray(u.arcana)     ? u.arcana     : []),
      };
    } catch (e) { /* malformed — ignore, keep defaults */ }
  }

  // ── Build loadouts (capture / apply / persist) ─────────────────────────────
  // A "build" is a name-keyed snapshot of the PLANNER (characters, weapons, passives,
  // arcana, stage, gifts, familiars, absorb-unions). It intentionally does NOT touch the
  // Seal Advisor, Power-Ups, or Collection. Featured builds ship in builds/builds.js
  // (window.VS_BUILDS); user builds persist to localStorage. See builds/SCHEMA.md.
  const BUILD_SCHEMA = 1;
  const BUILDS_STORAGE_KEY = 'vsbc.builds';

  // Snapshot current state → a schema object. Objects are mapped to their `.name`.
  function captureBuild(meta = {}) {
    const build = {
      schema: BUILD_SCHEMA,
      id: meta.id || ('build-' + Date.now().toString(36)),
      name: meta.name || 'Untitled Build',
      author: meta.author || '',
      description: meta.description || '',
      notes: meta.notes || '',
      tags: Array.isArray(meta.tags) ? meta.tags : [],
      dataVersion: meta.dataVersion || '',
      playerCount: state.playerCount,
      stage: state.stage ? state.stage.name : null,
      arcana: state.arcana.map(a => a ? a.name : null),
      players: state.players.map(p => ({
        character: p.character ? p.character.name : null,
        charLevel: p.charLevel || 1,
        weapons: (p.weapons || []).filter(Boolean).map(w => w.name),
        passives: (p.passives || []).filter(Boolean).map(pa => pa.name),
        extraPassives: [...(p.extraPassives || [])],
        giftWeapon: p.giftWeapon ? p.giftWeapon.name : null,
        giftPassive: p.giftPassive ? p.giftPassive.name : null,
        familiars: [...(p.familiars || [])],
        absorbed: Object.fromEntries(Object.entries(p.absorbed || {}).map(([k, v]) => [k, [...v]])),
      })),
    };
    // Cache the derived top traits so saved/exported builds carry their trait banners even
    // where affinity data isn't available (e.g. skill/repo tooling). Rendered fresh when the
    // current dataset can recompute them; this is just the portable fallback.
    build.traits = buildTopTraits(build, 3).map(a => a.name);
    return build;
  }

  // The build's headline traits: every equipped object (character + weapons + passives + arcana)
  // votes for its traits; the traits shared by the most objects win. This is the same tally the
  // player Trait Table (detailPlayerPageHTML) sorts its columns by, distilled to the top few.
  // Returns up to `limit` affinity objects, most-shared first.
  function buildTopTraits(build, limit = 3) {
    const objs = [];
    const push = (name, type) => { if (name) objs.push({ type, name }); };
    (build.players || []).forEach(p => {
      push(p.character, 'character');
      (p.weapons  || []).forEach(n => push(n, 'weapon'));
      (p.passives || []).forEach(n => push(n, 'passive'));
    });
    (build.arcana || []).forEach(n => push(n, 'arcana'));
    const count = new Map();
    objs.forEach(o => objectAffinities(o.type, o.name).forEach(a => count.set(a.name, (count.get(a.name) || 0) + 1)));
    return [...count.keys()].map(affinityByName).filter(Boolean)
      .sort((a, b) => (count.get(b.name) - count.get(a.name)) || a.name.localeCompare(b.name))
      .slice(0, limit);
  }

  // Rehydrate a schema object into `state` and re-render. Unresolvable names are collected
  // and surfaced in a toast rather than silently dropped; the rest of the build still loads.
  function applyBuild(build) {
    if (!build || build.schema !== BUILD_SCHEMA) {
      showToast('Unsupported build format', 'warn');
      return;
    }
    const missing = [];
    const resolve = (name, fn) => {
      if (name == null) return null;
      const obj = fn(name);
      if (!obj) { missing.push(name); return null; }
      return obj;
    };

    const count = Math.max(1, Math.min(4, build.playerCount || 1));
    state.playerCount = count;
    state.players = initPlayers(count); // fresh players — no carry-over

    (build.players || []).slice(0, count).forEach((bp, i) => {
      const p = state.players[i];
      p.character = resolve(bp.character, charByName);
      p.charLevel = Math.max(1, Math.min(999, bp.charLevel || 1));
      p.weapons  = (bp.weapons  || []).map(n => resolve(n, weaponByName)).filter(Boolean);
      p.passives = (bp.passives || []).map(n => resolve(n, passiveByName)).filter(Boolean);
      // extraPassives / familiars are stored as NAME strings — validate but keep the string.
      p.extraPassives = (bp.extraPassives || []).filter(n => resolve(n, passiveByName));
      p.familiars     = (bp.familiars     || []).filter(n => resolve(n, weaponByName));
      p.giftWeapon  = resolve(bp.giftWeapon,  weaponByName);
      p.giftPassive = resolve(bp.giftPassive, passiveByName);
      // absorbed: { resultName: [hiddenNames] } — validate each, keep names as-is.
      p.absorbed = {};
      for (const [result, hidden] of Object.entries(bp.absorbed || {})) {
        if (!resolve(result, weaponByName)) continue;
        p.absorbed[result] = (hidden || []).filter(n => resolve(n, weaponByName));
      }
    });

    // Globals: arcana (3 positional slots) + stage.
    const arc = build.arcana || [];
    state.arcana = [0, 1, 2].map(i => resolve(arc[i], arcanaByName));
    state.stage = resolve(build.stage, stageByName);

    // Self-heal to a legal state (defence-in-depth alongside validateBuildLegality): prune
    // orphaned absorb entries, drop stage items the loaded stage doesn't supply, reconcile
    // extra-bar passives, then cascade-devolve any evolution whose requirements aren't met
    // (also handles chaos finals on the wrong character). For a VALID build these are no-ops.
    state.players.forEach(syncAbsorbed);
    state.players.forEach(syncStageSlots);
    state.players.forEach(syncExtraPassives);
    autoDevolveBrokenEvos();
    state.infoPanel = null;
    state.page = 'planning';
    render();

    if (missing.length) {
      const uniq = [...new Set(missing)];
      showToast(`Loaded "${build.name}" — skipped ${uniq.length} unknown item(s): ${uniq.slice(0, 3).join(', ')}${uniq.length > 3 ? '…' : ''}`, 'warn');
    } else {
      showToast(`Loaded "${build.name}"`, 'ok');
    }
  }

  // User builds — localStorage array of schema objects (mirrors collection persistence).
  function saveBuilds() {
    try { localStorage.setItem(BUILDS_STORAGE_KEY, JSON.stringify(state.builds.user)); }
    catch (e) { /* file:// or private mode — persistence just no-ops */ }
  }
  function loadBuilds() {
    try {
      const raw = localStorage.getItem(BUILDS_STORAGE_KEY);
      if (!raw) return;
      const arr = JSON.parse(raw);
      if (Array.isArray(arr)) state.builds.user = arr.filter(b => b && b.schema === BUILD_SCHEMA);
    } catch (e) { /* malformed — ignore, keep defaults */ }
  }

  // Run the shared legality validator (builds/validate.js) against the current game data.
  // Returns { errors, warnings } (empty arrays if the validator failed to load).
  function validateBuildLegality(build) {
    try {
      if (typeof window.VS_VALIDATE_BUILD === 'function') return window.VS_VALIDATE_BUILD(build, D);
    } catch (e) { /* validator error — treat as no findings */ }
    return { errors: [], warnings: [] };
  }

  function makePlayer() {
    // extraPassives: passive instances that don't occupy a core slot (e.g. Weapon
    // Power-Up), rendered in the hidden/extra bar; duplicates allowed for this type.
    // absorbed: map of an equipped union-result weapon name → the weapon names it
    // "hid" when it formed (Clock Tower hides its 4 clockwork bases; Alucard Shield
    // hides the 5 evolutions Alucard Swords consumed). These render in the Hidden row
    // while the result is equipped and are restored to normal slots on devolve/removal.
    // giftWeapon / giftPassive: the extra "gift" slot from Super Candybox II Turbo (weapon)
    // and Arma Dio (passive) — a free-pick chooser initially, the chosen item after picking.
    // Appended to the main weapons/passives row (no new row); one of EACH per whole build.
    // familiars: familiar weapons picked via Familiar Forge — they live in the hidden/extra
    // row, never a normal weapon slot (a Familiar Forge STARTER slot clears once one is picked,
    // and is restored by syncFamiliarStarter when no familiars remain).
    return { character: null, weapons: [], passives: [], charLevel: 1, extraPassives: [], absorbed: {}, giftWeapon: null, giftPassive: null, familiars: [] };
  }

  function initPlayers(newCount, prevPlayers = []) {
    const players = [];
    for (let i = 0; i < newCount; i++) {
      players.push(prevPlayers[i] ? prevPlayers[i] : makePlayer());
    }
    // Trim weapon/passive slots to new count (slots already on player object)
    return players;
  }

  // ═══════════════════════════════════════════════════════
  //  DATA HELPERS
  // ═══════════════════════════════════════════════════════

  function weaponByName(name) { return D.weapons.find(w => w.name === name) || null; }
  function passiveByName(name) { return D.passives.find(p => p.name === name) || null; }
  function arcanaByName(name) { return D.arcana.find(a => a.name === name) || null; }
  function charByName(name) { return D.characters.find(c => c.name === name) || null; }
  function stageByName(name) { return (STAGES || []).find(s => s.name === name) || null; }

  // ── Affinities ────────────────────────────────────────────────────────────
  // "Affinity" = an internal tag-association between build objects (never surfaced by that
  // name in the UI). `D.affinities` gives affinity → related objects per category; the UI
  // uses only DIRECT (1-hop) links. Multi-hop daisy-chaining is a theorycraft-skill concern.
  function affinityByName(name) { return (D.affinities || []).find(a => a.name === name) || null; }

  // Reverse index: object (type+name) → affinity objects that list it. Built once, lazily.
  // `type` is the object kind key on affinity.related: 'weapons' | 'passives' | 'characters' | 'arcana'.
  let _affinityIndex = null;
  function affinityIndex() {
    if (_affinityIndex) return _affinityIndex;
    const idx = { weapons: new Map(), passives: new Map(), characters: new Map(), arcana: new Map() };
    for (const aff of (D.affinities || [])) {
      for (const cat of ['weapons', 'passives', 'characters', 'arcana']) {
        for (const objName of (aff.related?.[cat] || [])) {
          if (!idx[cat].has(objName)) idx[cat].set(objName, []);
          idx[cat].get(objName).push(aff);
        }
      }
    }
    _affinityIndex = idx;
    return idx;
  }
  // Panel/detail `type` ('weapon'|'passive'|'character'|'char'|'arcana') → related-category key.
  const AFFINITY_CAT = { weapon: 'weapons', passive: 'passives', character: 'characters', char: 'characters', arcana: 'arcana' };
  function objectAffinities(type, name) {
    const cat = AFFINITY_CAT[type];
    if (!cat || !name) return [];
    return affinityIndex()[cat].get(name) || [];
  }
  // A parent affinity's children (rows whose base_affinity points at it), for its detail page.
  function childAffinities(parentName) {
    return (D.affinities || []).filter(a => a.base_affinity === parentName && a.name !== parentName);
  }
  // Per-object interaction blurbs for a trait (from affinities.csv `info`). Each entry is
  // `{objects:[name…], blurb}`; a single blurb may cover several co-listed objects.
  function affinityInfoEntries(affinityName) {
    return affinityByName(affinityName)?.info_entries || [];
  }
  // The entries of `affinityName` that mention `objName` — for that object's own detail page.
  function affinityObjEntries(affinityName, objName) {
    return affinityInfoEntries(affinityName).filter(e => e.objects.includes(objName));
  }
  // Render one info entry: the italic blurb, optionally preceded by a row of the objects'
  // navigable icons. Icons help on an affinity page (which object?), but are redundant on an
  // object's own page (its icon would repeat once per interaction) — pass withIcons:false there.
  function infoEntryHTML(entry, withIcons = true) {
    const refs = withIcons ? resolveRefs(entry.objects) : [];
    return `<div class="detail-info-entry">${refs.length ? refIconsGridHTML(refs) : ''}
      <div class="detail-desc detail-info-blurb">${mdBold(entry.blurb)}</div></div>`;
  }

  // Names in a given group of an object's grouped-affinity schema (e.g. 'priority'). Returns
  // an empty set until that object's `affinity` column adopts the {Priority:[…]|[…]} format.
  function affinityGroupNames(obj, key) {
    const groups = obj?.affinity_groups;
    if (!Array.isArray(groups)) return new Set();
    const g = groups.find(x => x.key === key);
    return new Set(g ? g.items : []);
  }

  // Character variant equivalence (for collapsing the affinity-page character list). A base
  // (base_name) is "collapsible" when its ≥2 variants share ONE sprite AND an identical,
  // non-empty affinity set — i.e. weapon-loadout variants that are otherwise the same
  // character (the Belmonts, etc.). Because their affinity sets are identical, all a base's
  // variants co-occur in every affinity, so per-list dedup is always consistent. Genuinely
  // distinct variants (different sprite and/or affinities — Reborn, morphs, Unblinded) are
  // NOT collapsible and still render individually. Cached once.
  let _charVariants = null;
  function charVariantInfo() {
    if (_charVariants) return _charVariants;
    const byName = new Map(D.characters.map(c => [c.name, c]));
    const byBase = new Map();
    for (const c of D.characters) {
      if (!byBase.has(c.base_name)) byBase.set(c.base_name, []);
      byBase.get(c.base_name).push(c);
    }
    const charAff = affinityIndex().characters; // name → [affinity objects]
    const affKey = name => (charAff.get(name) || []).map(a => a.name).sort().join('|');
    const collapsible = new Set();
    const repOf = new Map(); // base_name → representative character name (base row if any, else first)
    for (const [base, group] of byBase) {
      if (group.length < 2) continue;
      const sprites = new Set(group.map(c => c.sprite_static || c.sprite_gif || c.icon));
      const key0 = affKey(group[0].name);
      if (sprites.size === 1 && key0 !== '' && group.every(c => affKey(c.name) === key0)) {
        collapsible.add(base);
        repOf.set(base, (group.find(c => c.name === base) || group[0]).name);
      }
    }
    _charVariants = { collapsible, repOf, byName };
    return _charVariants;
  }
  function charSpriteIcon(c) { return c.sprite_static || c.sprite_gif || c.icon; }
  // Weapon full-art sprite (weapons.csv `sprite_path`), falling back to the square icon.
  function weaponSprite(w) { return (w && (w.sprite || w.icon)) || ''; }

  // "Affinity" is backend-only vocabulary; the banner section shows a neutral heading. Change
  // this one constant to relabel the section everywhere.
  const AFFINITY_SECTION_LABEL = 'Traits';

  // Pick readable text over a banner background by its relative luminance.
  function affinityTextColor(hex) {
    const m = /^#?([0-9a-f]{6})$/i.exec(hex || '');
    if (!m) return '#fff';
    const n = parseInt(m[1], 16);
    const r = (n >> 16) & 255, g = (n >> 8) & 255, b = n & 255;
    const lum = (0.299 * r + 0.587 * g + 0.114 * b) / 255;
    return lum > 0.6 ? '#1a1206' : '#fdf6e3';
  }

  // One affinity banner: [icon] [name-as-colored-banner], whole row clickable via `action`
  // (info panel → 'open-affinity-page'; detail overlay → 'nav-affinity').
  function affinityBanner(aff, action, extraCls = '') {
    const color = aff.color || '#6a4010';
    return `<div class="affinity-row ${extraCls}" data-action="${esc(action)}" data-affinity="${esc(aff.name)}"
        style="--aff-color:${esc(color)};--aff-text:${affinityTextColor(color)}" title="${esc(aff.name)}">
      <span class="affinity-row-icon"><img src="${esc(aff.icon || EMPTY_ICON)}" alt="" onerror="this.style.visibility='hidden'"></span>
      <span class="affinity-row-banner">${esc(aff.name)}</span>
    </div>`;
  }

  // Split an object's trait banners into display groups:
  //   primary  — elevated subset of the derived traits (gold container, on top). From the
  //              object's `affinity` column `Primary:` group (chars/arcana).
  //   rest     — the remaining derived traits (ghost container, middle).
  //   conflict — traits BAD for this object (red container, bottom). Sourced from a SEPARATE
  //              `conflict` column (NOT the affinity column) so conflicts never feed
  //              affinities.csv / show as associations on a trait's page. Shown even when not
  //              in the derived set; removed from `rest` to avoid duplication.
  function objectAffinityGroups(type, name) {
    const obj = detailObjByType(type === 'char' ? 'character' : type, name);
    const groups = obj?.affinity_groups || [];
    const primarySet  = obj ? affinityGroupNames(obj, 'primary') : new Set();
    const conflictSet = new Set(obj?.conflict || []);
    // Arcana-conditional groups: a group whose key resolves to an arcana — its traits are valid
    // only WHEN that arcana is equipped. Sourced from the group (not the derived set) and
    // colored by the arcana's identity color; excluded from `rest` to avoid dupes.
    const arcanaGroups = groups
      .filter(g => g.key && g.key !== 'primary' && arcanaByName(g.key))
      .map(g => ({ arcana: arcanaByName(g.key), traits: g.items.map(affinityByName).filter(Boolean) }))
      .filter(g => g.traits.length);
    const arcanaTraitNames = new Set(arcanaGroups.flatMap(g => g.traits.map(a => a.name)));
    const derived = objectAffinities(type, name);
    return {
      primary:  derived.filter(a => primarySet.has(a.name)),
      rest:     derived.filter(a => !primarySet.has(a.name) && !conflictSet.has(a.name) && !arcanaTraitNames.has(a.name)),
      conflict: [...conflictSet].map(affinityByName).filter(Boolean),
      arcanaGroups,
    };
  }

  // A single arcana-conditional trait container: colored by the arcana, with a navigable
  // arcana header (icon + name), then its trait banners. `renderBanner` renders each trait.
  function arcanaBoxHTML(g, objAction, renderBanner) {
    const color = g.arcana.color || '#6a4010';
    return `<div class="primary-traits arcana-traits" style="--arc-color:${esc(color)}">
      <div class="arcana-traits-head" data-action="${esc(objAction)}" data-detail-type="arcana" data-detail-name="${esc(g.arcana.name)}" title="${esc(g.arcana.name)} — traits only with this Arcana">
        <img src="${esc(g.arcana.icon || '')}" onerror="this.style.visibility='hidden'"><span>${esc(g.arcana.name)}</span>
      </div>
      ${g.traits.map(renderBanner).join('')}
    </div>`;
  }

  // The affinity-banner section for an object's info panel (empty string when it has none).
  // Order: primary (gold box) → default (ghost) → conflict (red box).
  function affinitySectionHTML(type, name, action) {
    const { primary, rest, conflict, arcanaGroups } = objectAffinityGroups(type, name);
    if (!primary.length && !rest.length && !conflict.length && !arcanaGroups.length) return '';
    const banners = arr => arr.map(a => affinityBanner(a, action)).join('');
    const objAction = action === 'nav-affinity' ? 'nav-object' : 'open-object-page';
    const arcanaBoxes = arcanaGroups.map(g => arcanaBoxHTML(g, objAction, a => affinityBanner(a, action))).join('');
    // Order: primary (gold) > arcana-conditional (colored) > default/unlisted (ghost) > conflict
    // (red). The ghost box uses .primary-traits geometry (transparent) so widths match.
    return `<div class="detail-section affinity-section">
      <span class="detail-section-label">${AFFINITY_SECTION_LABEL}</span>
      ${primary.length ? `<div class="primary-traits">${banners(primary)}</div>` : ''}
      ${arcanaBoxes}
      ${rest.length ? `<div class="primary-traits trait-ghost">${banners(rest)}</div>` : ''}
      ${conflict.length ? `<div class="primary-traits conflict-traits">${banners(conflict)}</div>` : ''}
    </div>`;
  }

  // The info-"i" button placed in an info panel's top-right → opens that object's detail page.
  function infoDetailButtonHTML(type, name) {
    return `<button class="info-detail-btn" data-action="open-object-page"
      data-detail-type="${esc(type)}" data-detail-name="${esc(name)}" title="More info">i</button>`;
  }

  // ── Collection accessibility ──────────────────────────────────────────────
  // Only BASE weapons, passives, characters and arcana are unlock atoms. Evolved/union
  // forms aren't separately owned — they derive from whether their whole ingredient tree
  // (bases + required passives) is owned. All checks are a no-op while tracking is off.
  function collectionEnabled() { return state.collection.enabled; }
  function isOwned(kind, name) { return !state.collection.unowned[kind].has(name); }
  function passiveAccessible(name) { return !collectionEnabled() || isOwned('passives', name); }
  function charAccessible(name)    { return !collectionEnabled() || isOwned('characters', name); }
  function arcanaAccessible(name)  { return !collectionEnabled() || isOwned('arcana', name); }
  // Arcana + its Darkana variant share one unlock, keyed on the Arcana name. Resolve any
  // variant name to that key before checking (a Darkana is accessible iff its Arcana is).
  function arcanaAccessibleByAny(name) {
    const a = arcanaByName(name);
    if (!a) return true;
    const key = D.arcana.find(x => x.base_num === a.base_num && x.type === 'Arcana') || a;
    return arcanaAccessible(key.name);
  }
  // A weapon is accessible iff every BASE in its full backward chain (incl. union
  // partners — they share the final as their trans_result) is owned AND every passive
  // any chain member requires is owned. Reuses collectWeaponChain + collectChainPassives.
  function weaponAccessible(name) {
    return !collectionEnabled() || weaponOwnedChain(name);
  }
  // Raw chain-ownership check, independent of the enabled flag — used by the collection
  // overlay to show derived (evolved/union) cells' accessibility while editing.
  function weaponOwnedChain(name) {
    const chain = collectWeaponChain(name); // Set: target + all backward predecessors
    // Every BASE weapon needed to reach `name` must be owned.
    for (const wn of chain) {
      const w = weaponByName(wn);
      if (w && w.category === 'Base' && !isOwned('weapons', wn)) return false;
    }
    // A chain member's `requirements` are what it needs to evolve FORWARD. Only count them
    // when that forward step is itself in the chain (i.e. a step toward `name`); a base's
    // own forward-evo requirement (e.g. Whip → Hollow Heart) must NOT gate owning the base.
    for (const wn of chain) {
      const w = weaponByName(wn);
      if (!w || !w.trans_result || !chain.has(w.trans_result)) continue;
      for (const req of (w.requirements || [])) {
        if (passiveByName(req) && !isOwned('passives', req)) return false;
      }
    }
    return true;
  }

  // A character's starting arcana is "extra": it's locked to the character and does
  // NOT count toward the 3-arcana pool. Extra arcana are derived from the players'
  // characters at render time (no pool mutation) and shown as locked slots to the
  // right of the 3 arcana. De-duplicated because the arcana pool is shared globally.
  function extraArcanaNames() {
    return [...new Set(state.players.map(p => p.character?.starting_arcana).filter(Boolean))];
  }

  // A character's `starting_weapons` list mixes actual weapons and passives (e.g.
  // Unblinded Imelda starts with Magic Wand + Empty Tome). Partition them so weapon
  // starters lock into weapon slots and passive starters lock into passive slots.
  const isPassiveName = n => D.passives.some(p => p.name === n);
  function starterWeaponNames(char) { // non-hidden weapon-type starters
    if (!char) return [];
    const hidden = new Set(char.hidden_items ?? []);
    return char.starting_weapons.filter(wn => !hidden.has(wn) && !isPassiveName(wn));
  }
  function starterPassiveNames(char) { // non-hidden passive-type starters
    if (!char) return [];
    const hidden = new Set(char.hidden_items ?? []);
    return char.starting_weapons.filter(wn => !hidden.has(wn) && isPassiveName(wn));
  }

  // ── Absorb-unions ────────────────────────────────────────────────────────
  // Union results that HIDE their inputs instead of consuming them: the inputs move to
  // the Hidden row and the result takes a single slot. Clock Tower hides its 4 clockwork
  // bases; Alucard Shield hides the 5 evolutions Alucard Swords consumed to form it.
  const ABSORB_UNIONS = new Set(['Clock Tower', 'Alucard Shield']);
  const isAbsorbUnion = name => ABSORB_UNIONS.has(name);
  const ALUCARD_ABSORB_COUNT = 5; // Alucard Swords consumes any 5 other non-base weapons

  // The 4 clockwork weapons that union into Clock Tower (data-derived, fixed order).
  function clockworkInputs() {
    return D.weapons.filter(w => w.trans_result === 'Clock Tower' && w.method === 'Union').map(w => w.name);
  }

  // Chaos-morph evolutions are CHARACTER-GATED: a base weapon (b1_3) only evolves into its
  // final (b1_r) while equipped by the mapped character (b1_2) — e.g. Bone → Anima of Mortaccio
  // only as Mortaccio. Derived (cached) from the ChaosEvolution>Final evo paths.
  let _chaosEvoCache = null;
  function chaosEvos() {
    if (!_chaosEvoCache) {
      const byFinal = {}, byBase = {};
      (D.evoPaths || []).filter(ep => ep.pattern === 'ChaosEvolution>Final').forEach(ep => {
        const info = { character: ep.b1_2, base: ep.b1_3, final: ep.b1_r };
        byFinal[ep.b1_r] = info; byBase[ep.b1_3] = info;
      });
      _chaosEvoCache = { byFinal, byBase };
    }
    return _chaosEvoCache;
  }
  // If finalName is a chaos final the player's character can't currently make, return its
  // info (for a toast / gating); otherwise null.
  function chaosBlocked(finalName, player) {
    const info = chaosEvos().byFinal[finalName];
    return info && player?.character?.name !== info.character ? info : null;
  }

  // Restore a result's absorbed weapons into empty weapon slots (dropping any that don't
  // fit, with a toast) and clear the entry. Does not touch the result slot itself.
  function releaseAbsorbed(player, resultName) {
    const names = player.absorbed?.[resultName];
    if (player.absorbed) delete player.absorbed[resultName];
    if (!names || !names.length) return;
    const counts = SLOT_COUNTS[state.playerCount];
    for (const nm of names) {
      if (player.weapons.some(w => w && w.name === nm)) continue; // already present
      let empty = -1;
      for (let j = 0; j < counts.weapons; j++) { if (!player.weapons[j]) { empty = j; break; } }
      if (empty >= 0) player.weapons[empty] = weaponByName(nm);
      else showToast(`No room to restore ${nm}`, 'warn');
    }
  }

  // Drop absorbed entries whose result weapon is no longer equipped (replaced/removed
  // outside the devolve path). Idempotent — safe to run every render.
  function syncAbsorbed(player) {
    if (!player.absorbed) { player.absorbed = {}; return; }
    const equipped = new Set(player.weapons.filter(Boolean).map(w => w.name));
    for (const resultName of Object.keys(player.absorbed)) {
      if (!equipped.has(resultName)) delete player.absorbed[resultName];
    }
  }

  // A Familiar Forge STARTER slot (Young Maria) holds the Forge until a familiar is picked,
  // then clears (the familiar moves to the hidden/extra row). Restored once no familiar
  // remains. Idempotent → safe as a per-render sweep. Only starter Forge slots are managed.
  function syncFamiliarStarter(player) {
    if (!player.familiars) player.familiars = [];
    const starters = starterWeaponNames(player.character);
    starters.forEach((name, i) => {
      if (name !== 'Familiar Forge') return;
      if (player.familiars.length > 0) {
        if (player.weapons[i]?.name === 'Familiar Forge') player.weapons[i] = null;
      } else if (!player.weapons[i]) {
        player.weapons[i] = weaponByName('Familiar Forge');
      }
    });
  }

  // The weapons an absorb-union hides when it forms. Clock Tower = its 4 fixed clockwork
  // bases; Alucard Shield = up to 5 OTHER equipped non-base (evolved) weapons.
  function absorbHiddenSet(player, resultName, excludeSlot, counts) {
    if (resultName === 'Clock Tower') return clockworkInputs();
    if (resultName === 'Alucard Shield') {
      const names = [];
      for (let i = 0; i < counts.weapons; i++) {
        if (i === excludeSlot) continue;
        const w = player.weapons[i];
        if (w && w.category !== 'Base' && w.name !== 'Alucard Swords' && w.name !== resultName) names.push(w.name);
        if (names.length >= ALUCARD_ABSORB_COUNT) break;
      }
      return names;
    }
    return [];
  }

  // Place an absorb-union result directly (selector path): the result takes slotIdx, its
  // hidden set is pulled out of the real slots and remembered, so it renders in the Hidden
  // row. Used when a user picks Clock Tower / Alucard Shield straight from the selector.
  function placeAbsorbUnion(player, wDef, slotIdx, counts) {
    const hiddenNames = absorbHiddenSet(player, wDef.name, slotIdx, counts);
    for (let i = 0; i < counts.weapons; i++) {
      if (i === slotIdx) continue;
      const w = player.weapons[i];
      if (w && hiddenNames.includes(w.name)) player.weapons[i] = null;
    }
    player.weapons[slotIdx] = wDef;
    player.absorbed[wDef.name] = hiddenNames;
  }

  const isEvolvedWeapon = nm => { const w = weaponByName(nm); return !!w && w.category !== 'Base'; };

  // Weapons/passives an absorbed weapon still needs to advance one stage (empty = ready).
  function absorbedAdvanceMissing(cur, player) {
    if (cur.method === 'Union') {
      const missingWeapons = D.weapons
        .filter(b => b.trans_result === cur.trans_result && b.method === 'Union' && b.name !== cur.name)
        .filter(u => player.weapons.findIndex(w => w && w.name === u.name) < 0)
        .map(u => u.name);
      return [...missingWeapons, ...missingPassiveReqs(cur, player)];
    }
    return missingPassiveReqs(cur, player);
  }

  // Bring an absorbed weapon's missing advance ingredients into REAL slots so it can evolve
  // within the hidden row: union partners → empty weapon slots (skipping any consumed
  // elsewhere), required passives → empty passive/extra slots. Used when the user right-clicks
  // a later stage ("it knows the partner can be added and unioned").
  function acquireForAbsorbed(player, cur) {
    const counts = SLOT_COUNTS[state.playerCount];
    if (cur.method === 'Union') {
      const consumed = getConsumedWeapons();
      D.weapons
        .filter(b => b.trans_result === cur.trans_result && b.method === 'Union' && b.name !== cur.name)
        .forEach(u => {
          if (player.weapons.some(w => w && w.name === u.name)) return;
          if (consumed.has(u.name)) { showToast(`${u.name} is unavailable`, 'warn'); return; }
          let empty = -1;
          for (let j = 0; j < counts.weapons; j++) { if (!player.weapons[j]) { empty = j; break; } }
          if (empty >= 0) player.weapons[empty] = weaponByName(u.name);
          else showToast(`No slot for ${u.name}`, 'warn');
        });
    }
    for (const pn of missingPassiveReqs(cur, player)) {
      if (isExtraPassive(pn)) { if (extraCount(player, pn) < extraCap(player, pn)) player.extraPassives.push(pn); continue; }
      if (player.passives.some(p => p && p.name === pn)) continue;
      let empty = -1;
      for (let j = 0; j < counts.passives; j++) { if (!player.passives[j]) { empty = j; break; } }
      if (empty >= 0) player.passives[empty] = passiveByName(pn);
      else showToast(`No passive slot for ${pn}`, 'warn');
    }
  }

  // Advance an absorbed (hidden) weapon one evo stage IN PLACE (updates the absorbed array),
  // mirroring the stage arrow: evolve/gift keeps passives; union consumes its partner from a
  // normal slot. With autoAcquire, missing partners/passives are first pulled into real slots
  // (right-click-a-later-stage flow); otherwise a missing requirement just toasts.
  function advanceAbsorbed(player, result, idx, { autoAcquire = false } = {}) {
    const arr = player.absorbed?.[result];
    if (!arr || !arr[idx]) return;
    const cur = weaponByName(arr[idx]);
    const nextW = cur?.trans_result ? weaponByName(cur.trans_result) : null;
    if (!nextW) return;
    let missing = absorbedAdvanceMissing(cur, player);
    if (missing.length && autoAcquire) { acquireForAbsorbed(player, cur); missing = absorbedAdvanceMissing(cur, player); }
    if (missing.length) { showToast(`Missing: ${missing.map(esc).join(', ')}`, 'warn'); return; }
    if (cur.method === 'Union') {
      D.weapons
        .filter(b => b.trans_result === cur.trans_result && b.method === 'Union' && b.name !== cur.name)
        .forEach(u => { const si = player.weapons.findIndex(w => w && w.name === u.name); if (si >= 0) player.weapons[si] = null; });
    }
    arr[idx] = nextW.name;
  }

  // Right-click a node in an absorbed weapon's evo path:
  //  - a PRIOR (backward-chain) stage was consumed forming the container union → blocked.
  //  - a LATER (forward) stage advances the hidden weapon one step in place (like the arrow),
  //    consuming any required partner already sitting in a real slot.
  //  - an OPPOSITE-BRANCH node (a union partner / requirement that's neither ancestor nor
  //    descendant of the hidden weapon, e.g. Vento Sacro for a hidden Bloody Tear) is added to
  //    a REAL slot via the normal quick-add, so it's available to union the hidden weapon up.
  function handleAbsorbedEvoRightClick(panel, clickedName) {
    const { playerIdx, absorbedResult, absorbedIdx } = panel;
    const player = state.players[playerIdx];
    const arr = player.absorbed?.[absorbedResult];
    const curName = arr?.[absorbedIdx];
    if (!curName || clickedName === curName) return;
    if (collectWeaponChain(curName).has(clickedName)) {
      showToast(`${clickedName} was consumed forming ${absorbedResult}`, 'warn');
      return;
    }
    if (collectDescendants(curName).has(clickedName)) {
      // Later stage — advance the hidden weapon, pulling any missing partner/passive into a
      // real slot as needed (it knows the partner can be added and unioned).
      advanceAbsorbed(player, absorbedResult, absorbedIdx, { autoAcquire: true });
      state.infoPanel = { type: 'weapon', playerIdx, slotIdx: -1, absorbedResult, absorbedIdx };
      render();
      return;
    }
    // Opposite-branch partner / requirement — add it to a real slot (quick-add handles its
    // own chain, consumed and duplicate checks).
    evoQuickAdd(clickedName, playerIdx);
  }

  // Keep Alucard Shield valid after a hidden weapon devolves. If an absorbed entry is now a
  // Base (no longer evolved), first try to SWAP it with a still-evolved weapon sitting in a
  // normal slot (Shield stays unioned); if none is available the condition is broken, so the
  // Shield devolves back to Alucard Swords and all absorbed weapons are released.
  function reconcileAbsorbShield(player) {
    const RESULT = 'Alucard Shield';
    const names = player.absorbed?.[RESULT];
    if (!names || !names.length) return;
    const shieldSlot = player.weapons.findIndex(w => w && w.name === RESULT);
    if (shieldSlot < 0) return; // syncAbsorbed prunes the orphaned entry
    const counts = SLOT_COUNTS[state.playerCount];
    for (let k = 0; k < names.length; k++) {
      if (isEvolvedWeapon(names[k])) continue;
      // names[k] devolved to a Base — look for an evolved weapon in a normal slot to swap in.
      let swapIdx = -1;
      for (let i = 0; i < counts.weapons; i++) {
        if (i === shieldSlot) continue;
        const w = player.weapons[i];
        if (w && w.category !== 'Base' && w.name !== 'Alucard Swords' && !isAbsorbUnion(w.name)) { swapIdx = i; break; }
      }
      if (swapIdx >= 0) {
        const evolvedName = player.weapons[swapIdx].name;
        player.weapons[swapIdx] = weaponByName(names[k]); // the base takes the normal slot
        names[k] = evolvedName;                            // the evolved weapon joins the hidden set
      } else {
        // No swap candidate — condition broken. Devolve the Shield and restore everything.
        player.weapons[shieldSlot] = weaponByName('Alucard Swords');
        releaseAbsorbed(player, RESULT);
        showToast('Alucard Shield needs 5 evolved weapons — devolved', 'warn');
        return;
      }
    }
  }

  // ── Evo path renderer ────────────────────────────────────────────────────

  function evoPathsFor(name) {
    return (D.evoPaths || []).filter(ep => ep.related_to.includes(name) || ep.evo_path === name);
  }

  // ── Free-pick items (Candybox-like) ──────────────────────────────────────
  // Items that DON'T evolve — their evo path is decoration only. Instead they let you
  // CHOOSE one weapon/passive from a limited pool (rendered as the full grid with only the
  // pool undimmed). Two families:
  //  • Pool-driven: pool = weapons sharing an `ode_category` (Coat of Arms →
  //    "Vampire-Killing Tool", Morning Star → "Magic Whip", …). Such an item's OWN evo
  //    path has pattern "<ode_category>>Final". Clock Tower's "Clockwork Weapon" pool is
  //    excluded — it's an absorb-union handled elsewhere.
  //  • Category-driven (ode = N/A): Candybox → any Base weapon; Super Candybox II Turbo →
  //    advanced (evolved) weapons; Arma Dio → a passive.
  // Arma Dio and Super Candybox II Turbo are GIFT items — not any character's starter; they
  // get their own extra slot (player.giftWeapon / giftPassive), one of EACH per build.
  const TURBO = 'Super Candybox II Turbo', ARMA = 'Arma Dio', CANDYBOX = 'Candybox';

  // ode_category → Set(member weapon names). Excludes the Clockwork Weapon absorb-union pool.
  // Lazy + memoized: D isn't populated until after load, so we can't build these eagerly.
  let _odePools = null;
  function odePools() {
    if (_odePools) return _odePools;
    _odePools = new Map();
    for (const w of D.weapons) {
      const k = w.ode_category;
      if (!k || k === 'Clockwork Weapon') continue;
      if (!_odePools.has(k)) _odePools.set(k, new Set());
      _odePools.get(k).add(w.name);
    }
    return _odePools;
  }

  // The ode pool a weapon OWNS via its own evo path pattern "<key>>Final", or null.
  function ownedPoolKey(name) {
    const pools = odePools();
    for (const ep of evoPathsFor(name)) {
      if (ep.evo_path !== name) continue;
      const pat = ep.pattern || '';
      if (!pat.endsWith('>Final')) continue;
      const key = pat.slice(0, -'>Final'.length);
      if (pools.has(key)) return key;
    }
    return null;
  }

  let _freePickNames = null;
  function freePickNames() {
    if (_freePickNames) return _freePickNames;
    _freePickNames = new Set([CANDYBOX, TURBO, ARMA]);
    for (const w of D.weapons) if (ownedPoolKey(w.name)) _freePickNames.add(w.name);
    return _freePickNames;
  }
  const isFreePick = name => freePickNames().has(name);

  // Arma Dio's passive pool excludes rings/metaglios/Academy Badge, extra-bar mechanic
  // passives (Weapon Power-Up, Outer Saboteur, every Mini…), and Familiars (Familiar Forge).
  const ARMA_EXCLUDE_NAMES = new Set([
    'Silver Ring', 'Gold Ring', 'Metaglio Left', 'Metaglio Right', 'Academy Badge',
  ]);
  function armaPassivePool() {
    const familiarPool = odePools().get('Familiar') || new Set();
    return new Set(D.passives.map(p => p.name).filter(nm =>
      !ARMA_EXCLUDE_NAMES.has(nm) && !isExtraPassive(nm) && !familiarPool.has(nm)));
  }

  // { kind:'weapon'|'passive', pool:Set<string>, source } for a free-pick item, else null.
  function freePickInfo(name) {
    if (!isFreePick(name)) return null;
    if (name === ARMA) return { kind: 'passive', pool: armaPassivePool(), source: name };
    if (name === CANDYBOX) {
      const pool = new Set(D.weapons
        .filter(w => w.category === 'Base' && !isFreePick(w.name)).map(w => w.name));
      return { kind: 'weapon', pool, source: name };
    }
    if (name === TURBO) {
      // "advanced weapons" — evolved forms. Tunable: Evolution/Union/Counterpart categories.
      const ADV = new Set(['Evolution', 'Union', 'Counterpart']);
      const pool = new Set(D.weapons
        .filter(w => ADV.has(w.category) && !isFreePick(w.name)).map(w => w.name));
      return { kind: 'weapon', pool, source: name };
    }
    const key = ownedPoolKey(name);
    // Exclude any chooser from its own pool (e.g. Intuition is itself an Emerald Diorama member).
    return key ? { kind: 'weapon', pool: new Set([...odePools().get(key)].filter(n => !isFreePick(n))), source: name } : null;
  }

  // Gift consumption is derived from player state (one Turbo + one Arma per build, global).
  const turboConsumed = () => state.players.some(p => p.giftWeapon);
  const armaConsumed  = () => state.players.some(p => p.giftPassive);

  function evoIcon(name) {
    if (!name) return EMPTY_ICON;
    // Glimmer (X) steps (Emerald Diorama) have no in-game icon — reuse Emerald Rapture's.
    if (/^Glimmer\s*\(/i.test(name)) {
      const er = D.weapons.find(x => x.name === 'Emerald Rapture');
      return er ? (er.icon || EMPTY_ICON) : EMPTY_ICON;
    }
    const w = D.weapons.find(x => x.name === name); if (w) return w.icon || EMPTY_ICON;
    const p = D.passives.find(x => x.name === name); if (p) return p.icon || EMPTY_ICON;
    const a = D.arcana.find(x => x.name === name);   if (a) return a.icon || EMPTY_ICON;
    const c = D.characters.find(x => x.name === name); if (c) return c.icon || EMPTY_ICON;
    return EMPTY_ICON;
  }

  function eNode(name, { cur = false, max = false, hidden = false, sub = null, glimmer = false } = {}) {
    if (!name) return '';
    const icon = evoIcon(name);
    let cls = 'evo-node'; if (cur) cls += ' current'; if (hidden) cls += ' evo-hidden';
    // Glimmer-tech steps reuse Emerald Rapture's icon as a placeholder — strip its baked-in
    // frame so it reads as a tech node, not the actual weapon, and let its attack-name wrap.
    if (glimmer) cls += ' evo-glimmer';
    const img = `<img src="${esc(icon)}" alt="${esc(name)}" onerror="this.src='${esc(EMPTY_ICON)}'">`;
    const nd = `<div class="${cls}" title="${esc(name)}" data-evo-item="${esc(name)}">${img}</div>`;
    const extras = [];
    if (max) extras.push(`<div class="evo-max">MAX</div>`);
    if (sub) extras.push(`<div class="evo-sub${glimmer ? ' evo-sub-wrap' : ''}">${esc(sub)}</div>`);
    if (!extras.length) return nd;
    return `<div class="evo-nw">${nd}${extras.join('')}</div>`;
  }

  // Combination connector — intentionally empty: adjacency implies combination, so we drop
  // the '+' everywhere. Kept as a token so call sites read as "these nodes combine". The
  // flex row/cell gap provides the visual spacing between the now-adjacent icons.
  const EP = ``;
  const EA = `<span class="evo-op">→</span>`;
  // Level-up connector (EzEvo): the weapon auto-evolves as it LEVELS — no passive, no
  // union. Piped to read distinctly from '+' (add a passive) and '→' (evolve/union into).
  const EL = `<span class="evo-op evo-op-lvl" title="Auto-evolves as the weapon levels up">|</span>`;

  // Small Gemini connector node — replaces ← [gem] + between counterpart and base.
  // pos: 'top' = align-self:flex-start, 'bot' = flex-end, 'center' = center
  function gemNode(name, pos = 'center') {
    const icon = evoIcon(name);
    const as = pos === 'top' ? 'flex-start' : pos === 'bot' ? 'flex-end' : 'center';
    return `<div class="evo-gem" style="align-self:${as}" title="${esc(name)}" data-evo-item="${esc(name)}"><img src="${esc(icon)}" alt="${esc(name)}" onerror="this.src='${esc(EMPTY_ICON)}'"></div>`;
  }

  function eRow(...parts) { return `<div class="evo-row">${parts.join('')}</div>`; }

  function mergeBar(leftRows, rightHTML) {
    const rows = leftRows.map(r => `<div class="evo-row">${r}</div>`).join('');
    return `<div class="evo-merge"><div class="evo-merge-rows">${rows}</div><div class="evo-merge-bar"></div><div class="evo-merge-out">${rightHTML}</div></div>`;
  }

  // Grid layout: base-evo left | bar | mid(top) + union-partner(bot) | final(centered)
  function u2f(leftHTML, midHTML, partHTML, finalHTML) {
    return `<div class="evo-u2f"><div class="u2l">${leftHTML}</div><div class="u2b"></div><div class="u2t">${midHTML}</div><div class="u2m">${partHTML}</div><div class="u2f">${finalHTML}</div></div>`;
  }

  // Passive requirements of wObj that this player can't currently satisfy.
  // Shared by the info-panel Evolve and Union readiness checks — a union can also
  // carry a passive requirement (Phieraggi needs Tirajisú), not just partner weapons.
  function missingPassiveReqs(wObj, player) {
    const allPassives = new Set([
      ...state.players.flatMap(p => p.passives.filter(Boolean).map(p => p.name)),
      ...state.players.flatMap(p => p.extraPassives || []),
    ]);
    const passiveReqs = (wObj.requirements || []).filter(r => D.passives.some(p => p.name === r));
    return passiveReqs.filter(r => {
      if (isExtraPassive(r)) {
        // Weapon Power-Up binds 1:1 (needs an UNBOUND instance or room to add).
        if (r === WEAPON_POWER_UP) return !(wpuCount(player) > evolvedOGCount(player) || wpuCount(player) < wpuCap(player));
        // Consumable (Mini) is consumed on evolve, so it must be in hand now.
        if (isConsumableExtra(r)) return !(extraCount(player, r) >= 1);
        // Shared (Outer Saboteur): present or addable.
        return !(extraCount(player, r) >= 1 || extraCap(player, r) > 0);
      }
      return !allPassives.has(r);
    });
  }

  function buildEvoChainHTML(w) {
    const paths = evoPathsFor(w.name);
    if (!paths.length) return '';
    const sections = paths.map(ep => {
      const html = renderEvoPath(ep, w.name);
      return html ? `<div data-evo-path="${esc(ep.evo_path)}">${html}</div>` : '';
    }).filter(Boolean);
    if (!sections.length) return '';
    return `<div class="detail-section"><h3>Evolution</h3><div class="evo-flow">${sections.join('')}</div></div>`;
  }

  // Returns evo chain HTML for all paths involving a passive, optionally filtered to a player's equipped weapons.
  function buildPassiveEvoHTML(passiveName, playerIdx = null) {
    const relatedWeapons = D.weapons.filter(w => (w.requirements || []).includes(passiveName));
    const equippedNames = playerIdx != null
      ? new Set(state.players[playerIdx].weapons.filter(Boolean).map(w => w.name))
      : null;

    const seen = new Set();
    const groups = [];
    for (const w of relatedWeapons) {
      for (const ep of evoPathsFor(w.name)) {
        if (seen.has(ep.evo_path)) continue;
        if (equippedNames && !ep.related_to.some(rn => equippedNames.has(rn))) continue;
        seen.add(ep.evo_path);
        const rendered = renderEvoPath(ep, w.name);
        if (rendered) groups.push(`<div class="evo-path-group" data-evo-path="${esc(ep.evo_path)}"><div style="font-size:.65rem;color:var(--gold-dim);text-transform:uppercase;letter-spacing:.06em;margin-bottom:.35rem">${esc(ep.evo_path)}</div>${rendered}</div>`);
      }
    }
    if (!groups.length) return '';
    return `<div class="detail-section"><h3>Used In</h3><div class="evo-flow" style="gap:.6rem">${groups.join('')}</div></div>`;
  }

  function renderEvoPath(ep, cur) {
    const n = (name, opts = {}) => eNode(name, { ...opts, cur: name === cur });
    const { b1_1, b1_2, b1_3, b1_4, b1_r, b2_1, b2_2, b2_r, b3_1, b3_2, b3_r, pattern: pat } = ep;

    if (pat === 'Final') return '';

    if (pat === 'Evo>Final')
      return eRow(n(b1_1), EP, n(b1_2), EA, n(b1_r));

    if (pat === 'Evo(Max)>Final')
      return eRow(n(b1_1), EP, n(b1_2, { max: true }), EA, n(b1_r));

    if (pat === 'Evo(Max)>HiddenFinal')
      return eRow(n(b1_1), EP, n(b1_2, { max: true }), EA, n(b1_r, { hidden: true, sub: 'Hidden' }));

    if (pat === 'TwoReqEvo>Final')
      return eRow(n(b1_1), EP, n(b1_2), EP, n(b1_3), EA, n(b1_r));

    if (pat === 'TwoReqEvo(Max)>Final')
      return eRow(n(b1_1), EP, n(b1_2, { max: true }), EP, n(b1_3, { max: true }), EA, n(b1_r));

    if (pat === 'Evo>Union>Final') {
      // left: [b1_1]+[b1_2] | mid: [b1_r] | bot: [b2_2] (aligned with mid) | final: +→[b2_r]
      return u2f(n(b1_1) + EP + n(b1_2), n(b1_r), n(b2_2), EP + EA + n(b2_r));
    }

    if (pat === 'TripleUnion>Final') {
      return `<div class="evo-multi-union"><div class="evo-multi-inputs">${[b1_1,b1_2,b1_3].map(nm => `<div class="evo-row">${n(nm)}</div>`).join('')}</div><div class="evo-merge-bar"></div><div class="evo-merge-out">${EA}${n(b1_r)}</div></div>`;
    }

    if (pat === 'QuadUnion>HiddenFinal') {
      // Inputs shown twice: once pre-union (left, as the 4 components) and once post-union
      // (right of the result, marked hidden) — the union hides its 4 bases and itself takes
      // a single slot. The result node is NOT tagged 'Hidden'; the bases to its right are.
      const inputs = [b1_1, b1_2, b1_3, b1_4];
      const preCol = `<div class="evo-multi-inputs">${inputs.map(nm => `<div class="evo-row">${n(nm)}</div>`).join('')}</div>`;
      const hiddenCol = `<div class="evo-absorb-col"><div class="evo-absorb-label">Hidden</div><div class="evo-multi-inputs">${inputs.map(nm => `<div class="evo-row">${n(nm, { hidden: true })}</div>`).join('')}</div></div>`;
      return `<div class="evo-multi-union">${preCol}<div class="evo-merge-bar"></div><div class="evo-merge-out">${EA}${n(b1_r)}${hiddenCol}</div></div>`;
    }

    if (pat === 'EzEvo>EzEvo>Final')
      // Both hops are auto level-ups (piped). Final form is in b2_r (b3_1 is unused/null).
      return eRow(n(b1_1), EL, n(b1_r), EL, n(b2_r));

    if (pat === 'EzEvo>EzEvo>Union>Final') {
      // left: [b1_1]|[b1_r] (auto level-up, piped) | mid: [b2_r] | bot: [b3_2] | final: +→[b3_r]
      return u2f(n(b1_1) + EL + n(b1_r), n(b2_r), n(b3_2), EP + EA + n(b3_r));
    }

    if (pat === 'EzEvo>AlucardGiftFinal') {
      // Alucart Sworb |(level-up) Alucard Swords →(gift) Alucard Shield. The gift also
      // needs any FIVE max-level evolutions — shown as a 3-over-2 example block to the
      // right of the Shield. (Data lineage is correct; the final node uses b2_r, the
      // Shield — the old render mistakenly re-showed b2_1/Alucard Swords here.)
      const examples = ['Bloody Tear','Holy Wand','Thousand Edge','Death Spiral','Heaven Sword'];
      const ex = examples.map(nm => n(nm, { hidden: true }));
      // Two vertical columns to the right of the Shield: a 3-icon column (its middle icon
      // lines up with the evo row) then a 2-icon column vertically centered against the 3.
      const block = `<div class="alucard-evos" title="Plus any 5 max-level evolutions">
        <div class="alucard-evos-col">${ex.slice(0, 3).join('')}</div>
        <div class="alucard-evos-col">${ex.slice(3).join('')}</div>
      </div>`;
      return `<div class="evo-row" style="gap:6px">${n(b1_1)}${EL}${n(b1_r)}${EA}${n(b2_r, { hidden: true, sub: 'Hidden' })}${block}</div>`;
    }

    if (pat === 'Counterpart:Final')
      return eRow(n(b1_r), gemNode(b1_2), n(b1_1));

    if (pat === 'Counterpart:Evo(Max)>Final')
      return eRow(n(b1_r), gemNode(b1_2), n(b1_1), EP, n(b2_2, { max: true }), EA, n(b2_r));

    if (pat === 'Counterpart:Evo>Union>Final') {
      // base shown once; gemNode replaces ←[gem]+ between counterpart and base
      return u2f(
        n(b1_r) + gemNode(b1_2) + n(b1_1) + EP + n(b2_2),
        n(b2_r),
        n(b3_2),
        EP + EA + n(b3_r)
      );
    }

    if (pat === 'Counterpart:TwoReqEvo>Final')
      return eRow(n(b1_r), gemNode(b1_2), n(b1_1), EP, n(b2_2), EA, n(b2_r));

    if (pat === 'Dual(Counterpart):Union>Final') {
      // Gems centered within each swim lane.
      return mergeBar(
        [n(b1_r) + gemNode(b1_2, 'center') + n(b1_1) + EA, n(b2_r) + gemNode(b2_2, 'center') + n(b2_1) + EA],
        n(b3_r)
      );
    }

    if (pat === 'Dual(Counterpart):UnionEvo>Final') {
      // Like Dual(Counterpart):Union but the union ALSO needs a passive (Phieraggi
      // needs Tirajisú). Passive isn't in the evo-path fields, so read it off the
      // union inputs' requirements and show it feeding into the final.
      const unionInputs = D.weapons.filter(b => b.trans_result === ep.evo_path && b.method === 'Union');
      const passiveReq = unionInputs
        .flatMap(u => (u.requirements || []).filter(r => D.passives.some(p => p.name === r)))[0];
      const finalHTML = passiveReq ? n(passiveReq) + EP + n(b3_r) : n(b3_r);
      return mergeBar(
        [n(b1_r) + gemNode(b1_2, 'center') + n(b1_1) + EA, n(b2_r) + gemNode(b2_2, 'center') + n(b2_1) + EA],
        finalHTML
      );
    }

    if (pat === 'Dual(Evo(Max))>HiddenFinal') {
      return mergeBar(
        [n(b1_1) + EP + n(b1_2, { max: true }) + EA + n(b1_r) + EA, n(b2_1) + EP + n(b2_2, { max: true }) + EA + n(b2_r) + EA],
        n(b3_r, { hidden: true, sub: 'Hidden' })
      );
    }

    if (pat === 'ChaosEvolution>Final') {
      // b1_2=character, b1_3=base weapon, b1_r=final. The chaos item (b1_1) is deliberately
      // NOT shown/checked — it's a permanent out-of-game unlock, not an in-run component
      // (its requirement is stripped from the base weapon in data too). Evo condition
      // (modeled later in Manage Collection): equipped by this character AND level ≥ 80.
      // Show the character's full _sprite.png rather than the small portrait icon.
      const chr = D.characters.find(c => c.name === b1_2);
      const spriteSrc = (chr && (chr.sprite_static || chr.icon)) || evoIcon(b1_2);
      const charNode = `<div class="evo-nw"><div class="evo-node evo-char-sprite" title="${esc(b1_2)}" data-evo-item="${esc(b1_2)}"><img src="${esc(spriteSrc)}" alt="${esc(b1_2)}" onerror="this.src='${esc(EMPTY_ICON)}'"></div><div class="evo-sub">Lv.80</div></div>`;
      return eRow(n(b1_3), EA, charNode, EA, n(b1_r));
    }

    // Glimmer (X) is a glimmer-attack step (no real icon → Emerald Rapture via evoIcon);
    // label it with just the attack name so the reused icon stays distinguishable.
    const glim = raw => { const m = /^Glimmer\s*\((.+)\)$/i.exec(raw || ''); return n(raw, { sub: m ? m[1] : 'Glimmer', glimmer: true }); };

    if (pat === 'GlimmerEzEvo>GlimmerEzEvo>Final')
      return eRow(n(b1_1), EP, glim(b1_2), EA, n(b1_r), EP, glim(b2_2), EA, n(b2_r));

    if (pat === 'GlimmerEvo>Final')
      return b1_3
        ? eRow(n(b1_1), EP, glim(b1_2), EP, n(b1_3), EA, n(b1_r))
        : eRow(n(b1_1), EP, glim(b1_2), EA, n(b1_r));

    const COLL_PATS = ['Magic Whip>Final','Vampire-Killing Tool>Final','Magic Weapon>Final',
      "Belnades' Spell>Final",'Ambiguous Power>Final','Familiar>Final','Emerald Diorama>Final'];
    if (COLL_PATS.includes(pat)) {
      if (cur !== ep.evo_path) return '';
      // new format: b1_1 holds the pipe-delimited ingredient list
      // old format (Familiar Forge, Intuition not yet updated): fall back to related_to
      const inputs = (b1_1 && b1_1.includes('|'))
        ? b1_1.split('|').map(s => s.trim()).filter(Boolean)
        : ep.related_to.filter(nm => nm !== ep.evo_path);
      const MAX_ROW = 8;
      let rows = '';
      for (let i = 0; i < inputs.length; i += MAX_ROW)
        rows += `<div class="evo-coll-inputs">${inputs.slice(i, i + MAX_ROW).map(nm => n(nm)).join('')}</div>`;
      // Base item → a pool of many: this weapon behaves like a candybox drawing from a
      // limited pool, so lead with the item and point INTO the pool below it.
      return `<div class="evo-coll-wrap"><div class="evo-row" style="margin-bottom:2px">${n(ep.evo_path)}${EA}</div>${rows}</div>`;
    }

    if (pat === 'Gift(Treasure)>Final')
      return eRow(n(b1_1), EA, n(b1_2), EA, n(b1_r));

    if (pat === 'FivePassive>Final') {
      // Spirit Rings + 5 stat passives → Rings of Calamity. The passives aren't in the
      // evo-path data, so name them explicitly (Max Health, Might, Area, Speed, Duration).
      // Layout: [Spirit Rings]  (5-passive ring)  |  [Rings of Calamity].
      const passives = ['Hollow Heart', 'Spinach', 'Candelabrador', 'Bracer', 'Spellbinder'];
      const angles = [270, 342, 54, 126, 198];
      const r = 45, cx = 68, cy = 68;
      const items = angles.map((deg, i) => {
        const rd = deg * Math.PI / 180;
        return `<div class="ep-item" style="left:${cx + r * Math.cos(rd)}px;top:${cy + r * Math.sin(rd)}px">${n(passives[i])}</div>`;
      }).join('');
      const ring = `<div class="evo-pentagram">${items}</div>`;
      return `<div class="evo-row" style="gap:6px">${n(b1_1)}${ring}${EL}${n(b1_r)}</div>`;
    }

    if (pat === 'Tuna>Final') {
      // Penshin Fatcha (base) sits to the LEFT of the hexagon of 6 tuna forms; Miracle of
      // Multiplication (final) sits to the RIGHT. The ring holds only the 6 forms.
      const forms = [b1_2, b1_3, b2_1, b2_2, b3_1, b3_2];
      const r = 52, cx = 80, cy = 75;
      const hexItems = forms.map((nm, i) => {
        const rd = (i * 60 - 90) * Math.PI / 180;
        return `<div class="eh-item" style="left:${cx + r * Math.cos(rd)}px;top:${cy + r * Math.sin(rd)}px">${n(nm)}</div>`;
      }).join('');
      const hex = `<div class="evo-hexagram">${hexItems}
        <div class="eh-label" style="left:${cx}px;top:${cy}px;transform:translate(-50%,-50%)">6 Evolutions</div>
      </div>`;
      return `<div class="evo-row" style="gap:6px">${n(b1_1)}${EA}${hex}${EA}${n(b3_r)}</div>`;
    }

    return '';
  }

  function getEvolutionPassiveStatus(selW, playerIdx) {
    const player = state.players[playerIdx];
    const counts = SLOT_COUNTS[state.playerCount];
    const pending = []; // {name, slot} — needs to be added to this player
    const missing = []; // names — needed but no slot available
    const virtuallyTaken = new Set();
    // Passive equipped by ANY player satisfies the evo condition (cross-player sharing).
    const allEquippedPassives = new Set(
      state.players.flatMap(p => p.passives.filter(Boolean).map(p => p.name))
    );
    for (const req of (selW.requirements || [])) {
      if (!D.passives.some(p => p.name === req)) continue; // weapon req, skip
      if (isExtraPassive(req)) {
        // Extra-bar passive (no core slot): adding this weapon raises the cap, so an
        // instance is always addable — pending, never "no room".
        pending.push({ name: req, slot: -1 });
        continue;
      }
      if (allEquippedPassives.has(req)) continue; // satisfied by any player
      // Passive is missing entirely — find an empty slot on this player to add it.
      let emptySlot = -1;
      for (let i = 0; i < counts.passives; i++) {
        if (!player.passives[i] && !virtuallyTaken.has(i)) { emptySlot = i; break; }
      }
      if (emptySlot >= 0) { virtuallyTaken.add(emptySlot); pending.push({ name: req, slot: emptySlot }); }
      else missing.push(req);
    }
    return { pending, missing };
  }

  // Group characters by base_name, preserving CSV order of first appearance
  function charGroups() {
    const order = [];
    const map = {};
    for (const c of D.characters) {
      const key = c.base_name || c.name;
      if (!map[key]) { map[key] = []; order.push(key); }
      map[key].push(c);
    }
    return order.map(k => map[k]);
  }

  // Group arcana: pair Arcana + Darkana sharing the same base_num
  function arcanaGroups() {
    const order = [];
    const map = {};
    for (const a of D.arcana) {
      const key = a.base_num || a.number;
      if (!map[key]) { map[key] = []; order.push(key); }
      map[key].push(a);
    }
    // Sort groups by numeric base_num, Arcana before Darkana within each group
    return order.sort((a, b) => parseInt(a) - parseInt(b)).map(k => {
      const g = map[k];
      g.sort((a, b) => (a.type === 'Arcana' ? -1 : 1) - (b.type === 'Arcana' ? -1 : 1));
      return g;
    });
  }

  // ═══════════════════════════════════════════════════════
  //  EVOLUTION
  // ═══════════════════════════════════════════════════════

  function computeEffectiveWeapon(weapon, player) {
    if (!weapon || !weapon.trans_result) return weapon;
    const passiveNames = new Set(player.passives.filter(Boolean).map(p => p.name));
    const weaponNames  = new Set(player.weapons.filter(Boolean).map(w => w.name));
    const all = new Set([...passiveNames, ...weaponNames]);
    const met = weapon.requirements.every(r => all.has(r));
    if (!met) return weapon;
    const evolved = weaponByName(weapon.trans_result);
    if (!evolved) return weapon;
    return computeEffectiveWeapon(evolved, player); // chain-evolve
  }

  function weaponLineage(name) {
    const forms = new Set();
    let w = weaponByName(name);
    while (w) {
      forms.add(w.name);
      w = w.trans_result ? weaponByName(w.trans_result) : null;
    }
    return forms;
  }

  function getHiddenCounterparts(playerIdx) {
    const player = state.players[playerIdx];
    const equippedNames = new Set(player.weapons.filter(Boolean).map(w => w.name));
    const hasGemini = state.arcana.some(a => a && a.name === 'Gemini (I)');
    if (!hasGemini) return [];
    const seen = new Set();
    const hidden = [];

    function checkBase(baseName, counterpartName) {
      if (!baseName || !counterpartName || seen.has(counterpartName)) return;
      const lineage = weaponLineage(baseName);
      if ([...lineage].some(n => equippedNames.has(n))) {
        seen.add(counterpartName);
        hidden.push(counterpartName);
      }
    }

    for (const ep of (D.evoPaths || [])) {
      if (!ep.pattern.includes('Counterpart')) continue;
      checkBase(ep.b1_1, ep.b1_r);
      // Dual(Counterpart) patterns carry a SECOND independent base→counterpart pair in
      // b2 (Vandalier: Ebony Wings→Zhar Ptytsia; Phieraggi: Eight→Twice Upon a Time).
      // Match the whole family, not just the exact Union> string — UnionEvo> was excluded,
      // so Eight's counterpart never surfaced. (Non-dual Counterpart patterns reuse b2 for
      // the evolved final, not a counterpart, so they stay b1-only.)
      if (ep.pattern.startsWith('Dual(Counterpart)')) checkBase(ep.b2_1, ep.b2_r);
    }
    return hidden;
  }

  // Auto-devolve any weapon whose full evo chain has an unmet passive requirement.
  // Works for standard evolutions (Bloody Tear needs Hollow Heart) AND unions
  // (Fuwalafuwaloo needs Hollow Heart via its Bloody Tear branch). A broken weapon is
  // replaced by its immediate bases: the earlier in-game branch reclaims the slot in
  // place; union partners spill into empty slots, or are dropped with a toast when the
  // loadout is full. Iterates until stable so cascades resolve fully — e.g. dropping
  // Hollow Heart turns Fuwalafuwaloo → Bloody Tear + Vento Sacro → Whip + Vento Sacro.
  function autoDevolveBrokenEvos() {
    // Banish-layout index of a weapon's ultimate base — used to order union branches
    // so the earlier weapon (e.g. Whip) reclaims the slot ahead of a later one (Vento Sacro).
    const banishRootIdx = name => {
      let cur = name;
      while (true) { const b = D.weapons.find(x => x.trans_result === cur); if (!b) break; cur = b.name; }
      const idx = D.banishLayout.indexOf(cur);
      return idx < 0 ? 9999 : idx;
    };
    let changed = true;
    while (changed) {
      changed = false;
      const counts = SLOT_COUNTS[state.playerCount];
      // Include extra-bar passives (e.g. Weapon Power-Up) so evolved OG weapons aren't
      // seen as "missing" their requirement — syncExtraPassives owns the precise 1:1 binding.
      const allPassiveNames = new Set([
        ...state.players.flatMap(p => p.passives.filter(Boolean).map(p => p.name)),
        ...state.players.flatMap(p => p.extraPassives || []),
      ]);
      for (const player of state.players) {
        for (let i = 0; i < player.weapons.length; i++) {
          const w = player.weapons[i];
          if (!w) continue;
          // Immediate bases producing w (Evolution: 1; Union: 2+), earlier branch first.
          const bases = D.weapons.filter(b => b.trans_result === w.name)
            .slice().sort((a, b) => banishRootIdx(a.name) - banishRootIdx(b.name));
          if (!bases.length) continue; // base / standalone weapon — nothing to devolve
          // Broken if any passive required anywhere in w's full chain is missing, OR w is a
          // chaos-morph final whose mapped character isn't the one equipped (e.g. Anima of
          // Mortaccio while no longer Mortaccio → devolves back to Bone).
          const neededPassives = collectChainPassives(collectWeaponChain(w.name));
          const passivesOk = [...neededPassives].every(p => allPassiveNames.has(p));
          const chaosOk = !chaosBlocked(w.name, player);
          if (passivesOk && chaosOk) continue;
          // Primary base reclaims this slot; remaining union partners fill empty slots.
          player.weapons[i] = bases[0];
          for (let k = 1; k < bases.length; k++) {
            if (player.weapons.some(x => x && x.name === bases[k].name)) continue;
            let empty = -1;
            for (let j = 0; j < counts.weapons; j++) { if (!player.weapons[j]) { empty = j; break; } }
            if (empty >= 0) player.weapons[empty] = bases[k];
            else showToast(`No room to restore ${bases[k].name}`, 'warn');
          }
          changed = true;
        }
      }
    }
  }

  // ═══════════════════════════════════════════════════════
  //  RENDER HELPERS
  // ═══════════════════════════════════════════════════════

  function esc(s) {
    return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
  }

  // Whether a stage item can be added to a player right now (mirrors evoQuickAdd's guard rails
  // so the panel proactively dims what can't be picked up). `ctx` carries the target player and
  // a precomputed consumed-pool set; `groupArcana` gates arcana-conditional stage groups.
  function stageItemAddState(name, ctx, groupArcana) {
    const player = state.players[ctx.playerIdx];
    const w = weaponByName(name), p = passiveByName(name);
    if (!w && !p) return { kind: 'pickup' };                       // special pickup, not a build item
    if (isFreePick(name)) return { addable: false, reason: 'add from a weapon slot' }; // Arma Dio/Turbo gift chooser
    if (isExtraPassive(name)) return { addable: false, reason: 'weapon-bound (add via its weapon)' };
    if (groupArcana && !state.arcana.some(a => a?.name === groupArcana)) return { addable: false, reason: `needs ${groupArcana}` };
    if (collectionEnabled() && ((p && !passiveAccessible(name)) || (w && !weaponAccessible(name)))) return { addable: false, reason: 'not in your collection' };
    if (p) {
      if (player.passives.some(x => x && x.name === name)) return { addable: false, reason: 'already in build' };
      if (STAGE_EXCLUSIVE_PASSIVES.has(name) && anyPlayerOwnsPassive(name)) return { addable: false, reason: 'already in build' };
      return { addable: true };
    }
    if (player.weapons.some(x => x && x.name === name)) return { addable: false, reason: 'already in build' };
    if (ctx.consumed.has(name)) return { addable: false, reason: 'consumed by an evolution' };
    const cb = chaosBlocked(name, player); if (cb) return { addable: false, reason: `needs ${cb.character}` };
    if (stageBlockedWeapon(name, player)) return { addable: false, reason: 'evo needs items not on this stage' };
    return { addable: true };
  }

  // One stage-item icon: a passive, weapon, or special-pickup override; text if unmapped. When
  // `ctx` is set (planner sidebar), build-item icons become click-to-add (or dimmed + reason).
  function stageItemIconHTML(it, ctx = null, groupArcana = null) {
    const obj  = passiveByName(it) || weaponByName(it);
    const icon = obj ? (obj.icon || EMPTY_ICON) : STAGE_ITEM_ICONS[it];
    const inner = icon
      ? `<img src="${esc(icon)}" onerror="this.parentElement.classList.add('broken');this.src='${esc(EMPTY_ICON)}'">`
      : `<span style="font-size:.55rem;color:var(--text-muted)">${esc(it.slice(0,6))}</span>`;
    if (!ctx) {
      // Stage SELECTOR (no player context): make items that resolve to an object open their
      // detail page (routed via handleOverlayClick → detail overlay). Special floor-pickups
      // that aren't real weapons/passives (e.g. Arcana Treasure Chest) stay static.
      const ref = resolveRef(it);
      if (!ref) return `<div class="req-icon" title="${esc(it)}">${inner}</div>`;
      const navAttrs = ref.kind === 'affinity'
        ? `data-action="nav-affinity" data-affinity="${esc(it)}"`
        : `data-action="nav-object" data-detail-type="${ref.type}" data-detail-name="${esc(it)}"`;
      return `<div class="req-icon stage-nav" ${navAttrs} title="${esc(it)} — view details">${inner}</div>`;
    }
    const st = stageItemAddState(it, ctx, groupArcana);
    if (st.kind === 'pickup') return `<div class="req-icon stage-pickup" title="${esc(it)} — floor pickup">${inner}</div>`;
    if (st.addable) {
      return `<div class="req-icon stage-add" data-action="stage-add" data-stage-item="${esc(it)}" data-player="${ctx.playerIdx}" title="${esc(it)} — click to add">${inner}<span class="stage-add-plus">+</span></div>`;
    }
    return `<div class="req-icon stage-add-off" title="${esc(it)} — ${esc(st.reason)}">${inner}</div>`;
  }

  // Stage items + arcana-gated groups. `heading` renders each section label so callers can
  // match their panel style (overlay uses <h3>, planner sidebar uses .detail-section-label).
  // Pass `playerIdx` (planner sidebar) to make build-item icons click-to-add.
  function stageItemsHTML(stage, heading, playerIdx = null) {
    if (!stage) return '';
    const groups = [];
    if (stage.items?.length) groups.push({ label: 'Stage Items', items: stage.items, arcana: null });
    (stage.conditional ?? []).forEach(g => groups.push({ label: `With ${g.arcana}`, items: g.items, arcana: g.arcana }));
    if (!groups.length) return '<div class="detail-desc" style="margin-top:.5rem">No stage items.</div>';
    const ctx = playerIdx == null ? null : { playerIdx, consumed: getConsumedWeapons() };
    return groups.map(g =>
      `<div class="detail-section">${heading(g.label)}<div class="req-icons stage-items">${g.items.map(it => stageItemIconHTML(it, ctx, g.arcana)).join('')}</div></div>`
    ).join('');
  }

  function slotHTML(item, opts = {}) {
    const { type = 'weapon', playerIdx = 0, slotIdx = 0,
            hidden = false, removable = true, locked = false, infoName = null, gift = null, transient = false } = opts;
    const isChar  = type === 'char';
    const emptyIcon = EMPTY_ICONS[type] || EMPTY_ICONS.weapon;
    const icon = item ? (item.icon || emptyIcon) : emptyIcon;
    const classes = [
      'slot',
      isChar ? 'slot-char' : '',
      type === 'arcana' ? 'slot-arcana' : '',
      type === 'stage'  ? 'slot-stage'  : '',
      hidden    ? 'hidden-weapon' : '',
      locked    ? 'slot-locked'   : '',
      // Transient stage-pickup slots share the dashed-gold gift look but use NORMAL slot
      // behavior (plain remove-slot / view-slot by index), so no data-gift is emitted.
      (gift || transient) ? 'slot-gift' : '',
    ].filter(Boolean).join(' ');

    const removeBtn = (!hidden && removable && item && !locked)
      ? `<button class="slot-remove" data-action="remove-slot" data-player="${playerIdx}" data-slot="${slotIdx}" data-type="${type}"${gift ? ` data-gift="${gift}"` : ''} title="Remove">×</button>`
      : '';

    const imgTag = `<img src="${esc(icon)}" alt="${item ? esc(item.name) : ''}" onerror="this.src='${emptyIcon}'">`;
    const slotAction = hidden ? (item ? 'view-hidden' : '') : item ? 'view-slot' : (locked ? '' : 'open-slot');

    const lockIcon = locked ? `<img class="slot-lock" src="assets/icons/ui/locked.png" alt="">` : '';
    const hiddenAttr = (hidden && item) ? `data-hidden-name="${esc(item.name)}"` : '';
    const infoAttr = infoName ? `data-info-name="${esc(infoName)}"` : '';
    const giftAttr = gift ? `data-gift="${gift}"` : '';
    const giftTitle = gift ? ` (${gift === 'passive' ? 'Arma Dio' : 'Candybox Turbo'} gift)` : '';
    return `<div class="${classes}"
      ${slotAction ? `data-action="${slotAction}"` : ''} data-player="${playerIdx}" data-slot="${slotIdx}" data-type="${type}" ${hiddenAttr} ${infoAttr} ${giftAttr}
      title="${item ? esc(item.name) + (locked ? ' (starter)' : hidden ? ' (hidden)' : gift ? giftTitle : '') : 'Empty'}">
      ${imgTag}
      ${removeBtn}
      ${lockIcon}
    </div>`;
  }

  // Conditional "Hidden/Extra" row for hidden weapons or passives. Renders
  // nothing when there are no items, so the row only appears when populated.
  function hiddenSlotRow(names, type, playerIdx) {
    if (!names.length) return '';
    const byName = type === 'passive' ? passiveByName : weaponByName;
    const slots = names.map(nm => slotHTML(byName(nm), {
